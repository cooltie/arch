<script>
const ALL = [{"kind": "question", "src": "images/p263_b2.png", "front": "<img src='images/p263_b2.png' class='cardimg'><p class='q'>(English not filled yet)</p><details><summary>original text (IT)</summary><p class='th-it'>3| Ragionamento logico\n\n| quesiti di ragionamento logico intendono valutare le capacità deduttive e di ragionamento del candi-\ndato e possono apparire in forma più o meno complessa, richiedendo al candidato di verificare la validità\ndi un sillogismo, di saper individuare correttamente le relazioni logiche, di comprendere il reale significa-\nto di un&#x27;affermazione, di capire quando una condizione è sufficiente o necessaria per arrivare a una con-\nclusione ecc. Tutte queste sono facoltà utilizzate da ognuno nella vita di tutti i giorni, indipendentemente\ndal proprio campo di studi o dal proprio tipo di attività. Si tratta di capacità in parte innate, ma che pos-\nsono essere esercitate e sviluppate tramite lo studio e l&#x27;esperienza.\n\nPer prepararsi a test di questo genere non è dunque richiesta alcuna conoscenza di logica formale né di\nnozioni specifiche, ma è importante familiarizzare con la struttura degli esercizi e allenarsi a una loro ra-\npida risoluzione.\n\n3.1 | Regole generali\n\nNon sempre gli esercizi di ragionamento logico sono riconducibili a tipologie predefinite e per questo\nmotivo è importante seguire alcune regole generali che, indipendentemente dalla formulazione del que-\nsito, possono sempre risultare utili.\n\n3.1.1] Schematizzare le informazioni\n\nUna prima regola da seguire sempre è quella di schematizzare le informazioni dell&#x27;esercizio oppure\nprovare a disegnare la situazione proposta dallo stesso. Scrivere o disegnare permette infatti di consi-\nderare tutti gli elementi presenti nel testo, di avere chiare le reiazioni che li legano e spesso agevola nel\nricavare per deduzione le informazioni mancanti. Si vedano i seguenti esempi.\n\nEsempi</p></details>", "back": "", "conf": "low", "page": 263, "section": "3.1 Regole generali", "num": 3, "_i": 0}, {"kind": "question", "src": "images/p263_b3.png", "front": "<img src='images/p263_b3.png' class='cardimg'><p class='q'>(English not filled yet)</p><details><summary>original text (IT)</summary><p class='th-it'>1 In tre diverse occasioni, Clementina fa le seguenti affermazioni riguardanti i suoi tre amici\nQuirino, Rocco e Silvio:\ne  Silvioè più intelligente di Rocco, che è più ricco di Quirino.\n+e Silvio è piùricco di Rocco, che è più intelligente di Quirino.\ne Quirinoè più stupido di Silvio.\nIn base alle affermazioni di Clementina, ne deduciamo che:\nQuirino è il meno intelligente dei tre\n-. Rocco è il più intelligente dei tre\nSilvio è il più intelligente dei tre, ma non il più ricco\nSilvio è il più ricco dei tre, ma non il più intelligente\n. Roccoè più intelligente ma meno ricco di Silvio\n\nSi utilizzi il simbolo “+” per indicare la maggiore intelligenza e il simbolo “&gt;” per indicare la maggiore ric-\nchezza. È, quindi, possibile riassumere le informazioni del testo nel modo seguente:\n\nS4&gt;R R&gt;Q; S&gt;R R&gt;Q; S&gt;Q.\n\nSe, quindi, Silvio risulta il più ricco e il più intelligente dei tre, Quirino risulta il meno intelligente (alterna-\ntiva. soluzione del quesito).</p></details>", "back": "", "conf": "low", "page": 263, "section": "3.1 Regole generali", "num": 1, "_i": 1}, {"kind": "question", "src": "images/p264_b2.png", "front": "<img src='images/p264_b2.png' class='cardimg'><p class='q'>(English not filled yet)</p><details><summary>original text (IT)</summary><p class='th-it'>2 Se è vero che:\n* tuttele persone generose sono serene;\ne Lisa è generosa;\n*  Saraè serena;\nsi può dedurre che:\n.. le persone non generose non sono serene\nSara non è generosa\nLisa è serena\nle persone serene sono generose\nSara è generosa\n\nUsando gli insiemi si possono rappresentare le relazioni proposte nel seguente modo:\n\nGenerosi\naL #5\n\ndove Lisa è certamente all&#x27;interno dei generosi, mentre Sara, che è serena, potrebbe essere anche gene-\nrosa o meno (dall&#x27;esercizio questo dato non si può ricavare con certezza). Dal grafico si vede immediata-\nmente che è certamente vero che Lisa è serena, infatti lei è generosa e tutti i generosi sono sereni (. so-\nluzione del quesito).</p></details>", "back": "", "conf": "low", "page": 264, "section": "3.1 Regole generali", "num": 2, "_i": 2}, {"kind": "question", "src": "images/p264_b3.png", "front": "<img src='images/p264_b3.png' class='cardimg'><p class='q'>(English not filled yet)</p><details><summary>original text (IT)</summary><p class='th-it'>3 Per raggiungere casa sua in macchina dall&#x27;ufficio, Diana si dirige a ovest per 3 km su Corso\nItalia, poi per 2 km in direzione nord su Via Vecchia, infine per 1 km in direzione est su Via\nMarulli, dove si trova la sua abitazione. Dal suo appartamento all&#x27;ottavo piano Diana rie-\nsce a vedere il suo ufficio. In che direzione si trova l&#x27;ufficio di Diana rispetto al suo apparta-\nmento?\n\n; Sud\n\nNord\n\nNord-ovest\n\nSud-ovest\n\nSud-est\n\nIl percorso compiuto da Diana per recarsi dall&#x27;ufficio all&#x27;abitazione è rappresentato nella figura seguente:\n\n1km\nCasa\nN\nN direzione sud-est\n2km N\nLI\n3 km\n\nUfficio\n\nAppare dunque evidente che da casa l&#x27;ufficio di Diana si trova in direzione sud-est (verso il basso e verso\ndestra).\n\nLa risposta corretta è pertanto la</p></details>", "back": "", "conf": "low", "page": 264, "section": "3.1 Regole generali", "num": 3, "_i": 3}, {"kind": "question", "src": "images/p265_b2.png", "front": "<img src='images/p265_b2.png' class='cardimg'><p class='q'>(English not filled yet)</p><details><summary>original text (IT)</summary><p class='th-it'>4 Abbiamo tre contenitori pieni di frutta, chiusi da coperchi. Un coperchio reca la scritta\n“MELE”, un altro la scritta “FRAGOLE” e il terzo la scritta “MELE E FRAGOLE”. Nessuno dei\ncoperchi reca la scritta corrispondente al vero contenuto. Quanti frutti è sufficiente\nestrarre per poter mettere il coperchio giusto su ogni contenitore?\n\nCinque\nUno\nDue\nTre\nQuattro\n\nL&#x27;informazione rilevante che si deve tenere a mente è che nessuna scritta corrisponde al vero contenuto.\nCi si trova, cioè, nella seguente situazione:\n\nSCRITTA SUL COPERCHIO FRAGOLE MELE FRAGOLE E MELE\n\nMele Fragole Fragole\nFragole e Mele Fragole e Mele . Mele\n\nCONTENUTO POSSIBILE</p></details>", "back": "", "conf": "low", "page": 265, "section": "3.1 Regole generali", "num": 4, "_i": 4}, {"kind": "theory", "src": null, "front": "<div class='kindlabel'>THEORY</div><p class='th-en'>(English not filled yet)</p><details><summary>original (IT)</summary><p class='th-it'>Conviene pescare un frutto dal terzo contenitore (quello con la scritta MELE E FRAGOLE sul coperchio).\nSe si pesca una fragola, significa che il contenuto non può essere né MELE né FRAGOLE E MELE (dato che\nper assunto iniziale l&#x27;etichetta deve essere sbagliata). Su questo contenitore metteremo perciò il coper-\nchio FRAGOLE. Per esclusione, potremo mettere il coperchio MELE sul primo e MELE E FRAGOLE sul se-\ncondo. Se invece dal terzo contenitore si pesca una MELA, metteremo il coperchio MELE su quel conteni-\ntore, FRAGOLE E MELE sul primo e FRAGOLE sul secondo. Pescando un solo frutto, quindi, si riescono a\nsistemare tutti i coperchi sui relativi contenitori. La -. è la soluzione del quesito.\n\nAnalisi delle alternative\n\nNegli esercizi di logica è sempre fondamentale considerare le alternative proposte. La soluzione al que-\nsito può infatti essere trovata risolvendo il problema oppure facendo un procedimento inverso e cioè,\npartendo dalle alternative, si verifica quale soddisfa le condizioni del quesito.\n\nEsempi</p></details>", "back": "", "conf": "low", "page": 265, "section": "3.1 Regole generali", "num": null, "_i": 5}, {"kind": "question", "src": "images/p265_b4.png", "front": "<img src='images/p265_b4.png' class='cardimg'><p class='q'>(English not filled yet)</p><details><summary>original text (IT)</summary><p class='th-it'>1 Il 31 di marzo due persone si fermano davanti al numero 36 di via del Corso. Il più giovane\ndei due chiede informazioni al più anziano circa l’età delle sue tre figlie. Quest&#x27;ultimo\nrisponde, alzando gli occhi, che tra la più grande e la più piccola esiste una differenza di\netà pari a 1/6 del valore del numero civico sotto cui sono e la somma delle età delle tre\nfiglie è proprio uguale al numero del giorno in cui si trovano.\n\nQuali sono le età delle tre figlie della persona più anziana?\n18, 10, 3\n16, 10, 6\n14,8,9\n18, 14,12\n10, 4, 16\n\nPer risolvere quest&#x27;esercizio conviene partire dall&#x27;analisi delle alternative. La somma dell&#x27;età delle tre fi-\nglie deve essere pari a 31 (giorno in cui i due si trovano a parlare), mentre la differenza tra l&#x27;età della più\ngrande e quella della più piccola, deve essere pari a 6 (1/6 di 36).\n\nAnalizzando le alternative, l&#x27;unica che rispetta queste condizioni è la + (soluzione del quesito), infatti\n14+8+9=31e14-8=6.</p></details>", "back": "", "conf": "low", "page": 265, "section": "3.1 Regole generali", "num": 1, "_i": 6}, {"kind": "question", "src": "images/p266_b2.png", "front": "<img src='images/p266_b2.png' class='cardimg'><p class='q'>(English not filled yet)</p><details><summary>original text (IT)</summary><p class='th-it'>2 A una festa partecipano 8 studenti, i quali complessivamente possiedono 17 cellulari.\nDeterminare quale delle seguenti affermazioni è sicuramente vera.\nC&#x27;è un unico ragazzo che possiede almeno 3 cellulari\nAlmeno un ragazzo possiede esattamente 3 cellulari\nC&#x27;è un unico ragazzo che possiede esattamente 3 cellulari\nAlmeno un ragazzo possiede almeno 3 cellulari\nNessun ragazzo possiede più di 3 cellulari\n\nPer risolvere l&#x27;esercizio, bisogna individuare l&#x27;unica alternativa che sia non solo possibile ma sempre verificata\nin ogni condizione, cioè sicuramente vera come richiesto dal testo. Partendo da A, si nota che la situazione de-\nscritta è compatibile con i dati di partenza ma non si verifica sempre; niente vieta, per esempio, che fino a 5\nragazzi possiedano 3 cellulari o 4 ne possiedano 4 e così via (situazione che invalida anche . ). Se si considera\nB, si nota che la situazione descritta è possibile ma può anche non verificarsi: nulla vieta il caso limite di un sin-\ngolo ragazzo che possieda tutti e 17 i cellulari (situazione che invalida anche. - ). Resta da valutare la situazione\ndescritta da.‘ .: ipotizzando l&#x27;altro caso limite, cioè che tutti gli 8 studenti possiedano 2 cellulari, resta sempre\nvero che almeno uno studente ne ha almeno 3. La risposta esatta è pertanto la\n\n3.1.3 | Scelta di dati a piacere\n\nA volte gli esercizi forniscono alcune informazioni e richiedono di individuare una regola generale. Può\nessere molto utile provare a “inventare” i dati mancanti e ipotizzare un caso concreto per vedere cosa ac-\ncade nello specifico e quindi trovare di riflesso la regola più generale.\n\nEsempio</p></details>", "back": "", "conf": "low", "page": 266, "section": "3.1 Regole generali", "num": 2, "_i": 7}, {"kind": "question", "src": "images/p266_b3.png", "front": "<img src='images/p266_b3.png' class='cardimg'><p class='q'>(English not filled yet)</p><details><summary>original text (IT)</summary><p class='th-it'>1 Aumentando del. 20% il valore dell ‘altezza di un rettangolo e diminuendo del 10% il valore\ndella base, come varia il valore dell’area del nuovo rettangolo?\n\nAumenta del 20%\n\nAumenta del 2%\n\nAumenta del 10%\n\nAumenta dell&#x27;8%\n\nDiminuisce del 5%\n\nPer risolvere il quesito si può attribuire a scelta un valore all&#x27;altezza e uno alla base del rettangolo. Si sup-\nponga, per esempio, che la figura abbia un&#x27;altezza pari a 5 e una base pari a 10. L&#x27;area di tale rettangolo\nè quindi pari a 50. Se l&#x27;altezza aumenta del 20%, cioè di 1/5 di 5, assumerà un nuovo valore pari a 6, men-\ntre se la base diminuisce del 10%, cioè 1/10 di 10, assumerà un nuovo valore pari a 9. Il nuovo rettangolo\nha quindi un&#x27;area pari 54. Rispetto al rettangolo di partenza si è registrato un incremento pari a 4 che sui\n50 iniziali è pari a 4/50 cioè 8/100, quindi all&#x27;8% (.. soluzione del quesito).\n\nInformazioni che è utile ricordare\n\nPer alcuni esercizi di logica è importante avere delle conoscenze minime e capacità di conversione riguar-\ndanti grandezze come il tempo, la distanza, la velocità ecc. Senza alcuna pretesa di esaustività, si ricordi-\nno, per esempio, le seguenti informazioni.\n\n*  1ora=60minuti= 3.600 secondi;\n*  1giorno = 24 ore = 1.440 minuti;\n+ Tanno= 365 giorni e 6 ore, cioè 52 settimane + 1 giorno + 6 ore (anni bisestili da 366 giorni ogni 4 anni).\n\nè 1km=1.000m;\n°- 1m=100cm;\n°- 1cm=10mm.</p></details>", "back": "", "conf": "low", "page": 266, "section": "3.1 Regole generali", "num": 1, "_i": 8}, {"kind": "theory", "src": null, "front": "<div class='kindlabel'>THEORY</div><p class='th-en'>(English not filled yet)</p><details><summary>original (IT)</summary><p class='th-it'>VELOCITA\n\n*  60km/h=1kmogni minuto;\n\n*  30km/h=1kmogni2 minuti;\n\n* si ricordi inoltre che 30 km/h vuol dire 30 chilometri fratto un&#x27;ora, cioè i chilometri che si fanno in\nun&#x27;ora. Se si vuole sapere a quanti metri al minuto corrispondono 30 km/h è sufficiente trasformare i\nkm in metri (quindi moltiplicando 30 per 1.000) e le ore in minuti (quindi moltiplicando 1 per 60).\nCosì 30 km/h = 30.000/60 = 500 metri al minuto.</p></details>", "back": "", "conf": "low", "page": 267, "section": "72.000 metri. Andando a 72 km/h, si fanno 72.000 metri", "num": null, "_i": 9}, {"kind": "question", "src": "images/p267_b2.png", "front": "<img src='images/p267_b2.png' class='cardimg'><p class='q'>(English not filled yet)</p><details><summary>original text (IT)</summary><p class='th-it'>1 Correndo alla velocità di 72 km/h, quanti metri si percorrono in 95 secondi?\n1.800\n1.600\n1.700\n1.500\n1.900\n\nPer convertire i chilometri in metri basta moltiplicare il valore per 1.000: 72 chilometri sono, quindi,\n72.000 metri. Andando a 72 km/h, si fanno 72.000 metri in un&#x27;ora. Quest&#x27;ultima è composta da 60 minuti,\nognuno dei quali è fatto da 60 secondi, per cui da 3.600 secondi in totale.\n\nAndando a 72 km/h si fanno quindi 72.000/3.6000 = 20 metri ogni secondo. In 95 secondi si percorrono,\ndunque, 1.900 metri (. soluzione del quesito).\n\n3.2 | Problemi di deduzione\n\nsono esercizi che presentano al candidato una situazione, un problema, chiedendo la soluzione dello\nstesso. Solitamente, più che attraverso l&#x27;utilizzo di schemi o di tabelle, questi esercizi, qualora prevedano\nin ragionamento complesso, possono essere risolti attraverso l’analisi delle alternative.\n\n1| Condizione sufficiente e condizione necessaria\n\nSs\n\nJna condizione indica un fatto alla cui esistenza è subordinato il verificarsi di una certa conseguenza.\nJna condizione può essere:\nsufficiente, la sua esistenza garantisce sempre il verificarsi di una determinata conseguenza;\n\nnecessaria, la sua esistenza è indispensabile, imprescindibile affinché una determinata conseguenza\nsi possa verificare.\n\nPer riconoscere se si tratta di una condizione necessaria o di una condizione sufficiente è utile ricordare che:\n“se” introduce una condizione sufficiente;\n“solo se” introduce una condizione necessaria.\n\n: possibile risolvere velocemente un esercizio con la condizione sufficiente applicando la seguen-\ne regola: quando si ha una frase del tipo\n\nse A allora B,\n‘unica cosa che è possibile dedurre con certezza è che:\nse non Ballora non A.\n\nn altri termini: se A è sufficiente perché si verifichi B, allora il non verificarsi di B implica che anche A non\ni verifica, perché se A fosse vera lo sarebbe anche B.\n\ni consideri la frase «se gioco a carte mi diverto».\n\\pplicando la regola appena vista si può dire che se A (se gioco a carte) allora B (mi diverto).\n\n‘unica cosa che si può affermare con certezza è che se non B (se non mi sono divertito) allora non A (non\nno giocato a carte).</p></details>", "back": "", "conf": "low", "page": 267, "section": "72.000 metri. Andando a 72 km/h, si fanno 72.000 metri", "num": 1, "_i": 10}, {"kind": "theory", "src": null, "front": "<div class='kindlabel'>THEORY</div><p class='th-en'>(English not filled yet)</p><details><summary>original (IT)</summary><p class='th-it'>È invece possibile risolvere velocemente un esercizio con la condizione necessaria applicando la\nseguente regola: quando si ha una frase del tipo\n\nsolo se A allora B,\nsi può dedurre che:\nse non A allora non B,\noppure\nse Ballora A.\n\nIn altri termini: essendo A necessaria per B, è evidente che se A non si verifica allora non può verificarsi nep-\npure B. Analogamente, se B si verifica significa che anche A deve essere verificata (essendo necessaria).\n\nSi consideri la frase «solo se mi alleno divento un bravo atleta».\n\nApplicando la regola appena vista si può dire che solo se A (solo se mi alleno) allora B (divento un bravo\natleta).\n\nSi può, quindi, affermare con certezza è che se non A (se non mi alleno) allora non B (non divento un bravo\natleta), ma anche che se B (se sono diventato un bravo atleta) allora A (mi sono allenato).\n\nEsiste poi una terza condizione che è quella sia sufficiente sia necessaria introdotta dall&#x27;espressione\n“se e solo se” ed è quindi del tipo:\n\nse e solo se A allora B,\n\nIn questo caso si potrà dedurre sia quanto ricavato dalla condizione sufficiente, sia quanto ricavato da\nquella necessaria e cioè:\n\nse non A allora non B,\nse non Ballora non A,\nse B allora A.\n\nRicapitolando:\n\nCondizione sufficiente:\n\nse A allora B\n\nÈ possibile dedurre con certezza che:\n\n1) se non Ballora non A.\n\nCondizione necessaria:\n\nsolo se A allora B.\n\nÈ possibile dedurre con certezza che:\n\n1) se nonAallora non B,\n\n2) se Ballora A.\n\nCondizione necessaria e sufficiente:\n\nse e solo se A allora B.\n\nLe cose che è possibile dedurre con certezza sono che:\n\n1) se non A allora non B,\n\n2) se Ballora A,\n\n3) se non Ballora non A.</p></details>", "back": "", "conf": "low", "page": 268, "section": "72.000 metri. Andando a 72 km/h, si fanno 72.000 metri", "num": null, "_i": 11}, {"kind": "theory", "src": null, "front": "<div class='kindlabel'>THEORY</div><p class='th-en'>(English not filled yet)</p><details><summary>original (IT)</summary><p class='th-it'>1 “Se Giorgio andrà il prossimo sabato pomeriggio con gli amici alla lezione di cucina, Alice\nandrà con le amiche allo stadio per la partita di rugby”.\nSe il precedente enunciato è vero, quale/i della/e seguenti affermazione/i è/sono logica-\nmente corretta/e?\nA Alicenonha assistito alla partita di rugby quindi Giorgio non ha frequentato la lezione\ndi cucina\nB Giorgio ha frequentato la lezione di cucina quindi Alice ha assistito alla partita di\nrugby\nC Alice ha assistito alla partita di rugby quindi Giorgio ha frequentato la lezione di\ncucina\nD Giorgio non ha frequentato la lezione di cucina quindi Alice non ha assistito alla par-\ntita di rugby\nDeB\nNessuna\nA ec\nAeB\nCeD\n\nL&#x27;esercizio prevede una condizione sufficiente: se accade A (Giorgio va con gli amici alla lezione di cucina)\nallora accade certamente B (Alice va con le amiche allo stadio per la partita di rugby). La condizione A è\nquindi sufficiente per avere la conseguenza B, cioè quando accade A si è certi che accade anche B. Essen-\ndo A sufficiente (ma non necessaria) per avere B, si può anche dedurre che se non c&#x27;è stato B, non può\nneanche esserci stato A (se non B allora non A)), infatti se ci fosse stato A allora si sarebbe certamente ve-\nrificato anche B.\n\nPoiché la condizione A è sufficiente, ma non necessaria, non si deve verificare per forza A per avere la con-\nseguenza B: non si può dedurre che se non c&#x27;è stato A (Giorgio non ha frequentato la ente condizione necessaria, l&#x27;automobile potrebbe non funzionare per altri\nmotivi; la b) in quanto l&#x27;automobile potrebbe non funzionare per motivi diversi dall&#x27;assenza di benzina.\n\nÈ possibile osservare che l&#x27;affermazione alla base di questo esercizio è del tipo: soltanto se è vera X, allora\nè vera Y (cioè: soltanto se l&#x27;automobile ha benzina, allora può funzionare). Ne segue anche che è valida:\nse è vera Y, allora è vera X (cioè: se l&#x27;automobile funziona, allora ha benzina). Non è invece valida in questo\ncaso: se non è vera Y, allora non è vera X (se l&#x27;automobile non funziona, allora non ha benzina), così come\nnon è valida: se è vera X, allora è vera Y (se ha benzina, allora funziona).\n\n3.2.2 | Sillogismi\n\nUna variante dei problemi di deduzione logica è costituita da esercizi che ricalcano la struttura formale\ndel sillogismo. Si tratta di esercizi in cui vengono presentate alcune premesse (generalmente tre) esplici-\ntanti relazioni tra soggetti diversi, dalle quali si possono trarre o non trarre determinate conclusioni.\nL&#x27;esercizio richiede di identificare, tra le alternative proposte, quella in cui compare un&#x27;affermazione de-\nducibile logicamente da quelle iniziali.\n\nEsempi</p></details>", "back": "", "conf": "low", "page": 270, "section": "3.2.2 Sillogismi", "num": null, "_i": 14}, {"kind": "question", "src": "images/p270_b2.png", "front": "<img src='images/p270_b2.png' class='cardimg'><p class='q'>(English not filled yet)</p><details><summary>original text (IT)</summary><p class='th-it'>1 Tutti gli avvocati sono prolissi; Giorgio ama la montagna; tutte le persone che amano la\nmontagna sono prolisse. Se le affermazioni sopra riportate sono vere, quale delle seguenti\nè necessariamente vera?\n\nGiorgio è un avvocato\nTutte le persone prolisse sono avvocati\n\nTutti gli avvocati amano la montagna\n\nGiorgio è prolisso\n\nGiorgio avrebbe voluto essere un avvocato\n\nLa risposta esatta è la {*.. Infatti s rmazione, ne se-\ngue che l&#x27;alternativa (* è errata.</p></details>", "back": "", "conf": "low", "page": 270, "section": "3.2.2 Sillogismi", "num": 1, "_i": 15}, {"kind": "question", "src": "images/p271_b2.png", "front": "<img src='images/p271_b2.png' class='cardimg'><p class='q'>(English not filled yet)</p><details><summary>original text (IT)</summary><p class='th-it'>2 Se è vero che:\n* tuttii filosofi sono saggi\n»  alcunifilosofi sono anche matematici\ne Aristotele fu un importante filosofo greco\nse ne deduce necessariamente che:\ni saggi greci furono filosofi\ntutte le persone sagge sono anche matematici\nalcuni matematici sono saggi\nAristotele fu anche un matematico\nesistono matematici che non sono saggi\n\nL&#x27;affermazione “alcuni filosofi sono anche matematici” significa che tra i matematici alcuni sono anche fi-\nlosofi. Poiché tutti i filosofi sono saggi se ne deduce che alcuni matematici (essendo filosofi) sono saggi\n(risposta corretta (©).\n\nSi osservi che l&#x27;affermazione “Aristotele fu un importante filosofo greco” è del tutto irrilevante per deter-\nminare la soluzione del quesito.\n\n3.2.3 | Affermazioni vere o false\n\nSi tratta di esercizi che propongono un&#x27;affermazione, accompagnata o meno da ulteriori informazioni, e\nche chiedono che cosa è vero se tale affermazione è falsa (0 viceversa) oppure di individuare la negazione\ndell&#x27;affermazione data.\n\nEsempi</p></details>", "back": "", "conf": "low", "page": 271, "section": "3.2.3 Affermazioni vere o false", "num": 2, "_i": 16}, {"kind": "question", "src": "images/p271_b3.png", "front": "<img src='images/p271_b3.png' class='cardimg'><p class='q'>(English not filled yet)</p><details><summary>original text (IT)</summary><p class='th-it'>tutti gli studenti vanno bene in italiano\n\ntutti gli studenti vanno bene in matematica\n\nalmeno uno studente va bene in italiano e matematica\n\n; almeno uno studente va bene in italiano e non va bene in matematica\n\nalmeno uno studente va bene in matematica e non va bene in italiano\n\nbene in matematica\n\nbene in italiano\n\nPer poter affermare che non tutti quelli che vanno\nbene in italiano vanno bene in matematica è neces-\nsario che ci sia almeno uno di coloro che vanno bene\nin italiano che non va bene in matematica come cor-\nrettamente proposto dall&#x27;alternativa {*). Si presti at-\ntenzione all&#x27;alternativa (+, errata in quanto è solo un\ncaso possibile, ma non necessariamente vero (i due\ninsiemi — coloro che vanno bene in italiano e coloro\nche vanno bene in matematica - possono anche\nnon aver alcun elemento in comune rispettando co-\nmunque l&#x27;enunciato del quesito).\n\nErrata risulta anche l&#x27;alternativa se infatti l’insie-\nme di chi va bene in matematica è incluso nell’insie-\nme più ampio di chi va bene in italiano, posso affer-\nmare che tutti coloro che vanno bene in matematica\nvanno anche bene in italiano, non contraddicendo\ncomunque l&#x27;enunciato per cui non tutti quelli che\nvanno bene in italiano vanno anche bene in mate-\nmatica, come mostrato graficamente.</p></details>", "back": "", "conf": "low", "page": 271, "section": "3.2.3 Affermazioni vere o false", "num": 1, "_i": 17}, {"kind": "question", "src": "images/p272_b2.png", "front": "<img src='images/p272_b2.png' class='cardimg'><p class='q'>(English not filled yet)</p><details><summary>original text (IT)</summary><p class='th-it'>2 C&#x27;è una casa con almeno due porte; si consideri l&#x27;affermazione:\nEsiste una chiave che apre tutte le porte di casa, ma non la porta della cantina.\nIndicare quale tra le seguenti frasi costituisce la negazione dell’affermazione riportata sopra.\n\nPer ogni chiave, o esiste una porta che non è quella della cantina e che non viene aperta da\nquella chiave, oppure quella chiave apre la porta della cantina\n\nEsiste una chiave che apre tutte le porte di casa, compresa quella della cantina\nEsiste una chiave che non apre nessuna porta, se non quella della cantina\nNessuna chiave apre tutte le porte\n\n. Per ogni chiave, esiste una porta che non è quella della cantina e che viene aperta da quella\nchiave\n\nSe nella casa citata dall&#x27;esercizio ci sono “almeno due porte”, vuol dire che ce ne sono certamente minimo\ndue, ma non è possibile sapere se ve ne siano tre o più di tre.\n\nPoiché il quesito chiede quale alternativa rappresenta la negazione dell&#x27;affermazione “esiste una chiave\nche apre tutte le porte di casa, ma non la porta della cantina”, dobbiamo ragionare sulle due porte la cui\nesistenza è certa. Dunque, la chiave citata non apre la porta della cantina, ma apre certamente l’altra.\nPer negare questa affermazione, basta negare indifferentemente una delle due parti di cui è composta,\ncome fa correttamente l&#x27;alternativa... , e non solamente una di esse, come invece accade nella... La\n(2ela\n\n#1\n\n‘ confermano (al posto di negare) che la chiave che apre la cantina non apre anche l&#x27;altra porta.</p></details>", "back": "", "conf": "low", "page": 272, "section": "3.2.4 Negazioni di una totalità", "num": 2, "_i": 18}, {"kind": "question", "src": "images/p272_b3.png", "front": "<img src='images/p272_b3.png' class='cardimg'><p class='q'>(English not filled yet)</p><details><summary>original text (IT)</summary><p class='th-it'>3 Dieci amici, per fare una scampagnata, hanno a disposizione tre auto da cinque posti.\nQuale delle seguenti affermazioni possiamo ritenere certamente vera?\n\nNessuna auto rimarrà vuota\n\n. Nessuna auto partirà piena\n\nSe un&#x27;auto rimarrà vuota, almeno un&#x27;auto sarà piena\n\nAlmeno un&#x27;auto partirà piena\n\nAlmeno un&#x27;auto rimarrà vuota\n\nPoiché l&#x27;unico vincolo presente nel testo dell&#x27;esercizio è quello relativo alla capienza massima di ogni auto\n(cinque persone), i dieci amici possono distribuirsi nelle tre auto nel modo che reputano più opportuno.\nTutte le alternative sono dunque possibili ma l’unica che è certamente vera è la‘, che è dunque la soluzio-\nne del quesito: se un&#x27;auto rimarrà vuota significa che i dieci amici si distribuiscono nelle altre due auto che\npertanto risulteranno entrambe piene; è quindi sicuramente vero che almeno un&#x27;auto sarà piena.\n\n3.2.4 | Negazioni di una totalità\n\nPerché risulti negata una totalità (o un&#x27;affermazione universale) del tipo «tutti gli x fanno/sono y», è suf-\nficiente che esista un solo caso in cui l&#x27;affermazione non è valida, cioè che ci sia almeno un elemento\nnell&#x27;insieme “tutti gli x” che non possieda la caratteristica y.\n\nEsempio</p></details>", "back": "", "conf": "low", "page": 272, "section": "3.2.4 Negazioni di una totalità", "num": 3, "_i": 19}, {"kind": "question", "src": "images/p272_b4.png", "front": "<img src='images/p272_b4.png' class='cardimg'><p class='q'>(English not filled yet)</p><details><summary>original text (IT)</summary><p class='th-it'>1 Se l&#x27;affermazione «Tutti gli atleti corrono velocemente» è falsa, allora necessariamente:\n.. almeno unatleta corre velocemente\n\nnessun atleta corre velocemente\n\ntutti gli atleti corrono a passo lento\n\nesiste almeno un atleta che non corre velocemente\n\ntutti i calciatori sono più veloci dei corridori\n\nPerché risulti falso affermare che tutti gli atleti corrono velocemente, non è necessario che sia vero l&#x27;esat-\nto opposto (cioè che nessun atleta sia veloce o tutti siano lenti come proposto dalle risposte ‘o ©). Per\nfalsificare l&#x27;affermazione data, è sufficiente che esista almeno un atleta che non corre velocemente. La ri-\nsposta corretta è la ©.</p></details>", "back": "", "conf": "low", "page": 272, "section": "3.2.4 Negazioni di una totalità", "num": 1, "_i": 20}, {"kind": "theory", "src": null, "front": "<div class='kindlabel'>THEORY</div><p class='th-en'>(English not filled yet)</p><details><summary>original (IT)</summary><p class='th-it'>Negazioni multiple\n\nGli esercizi sulle negazioni propongono frasi in cui un concetto è espresso mediante una successione di\nnegazioni che spesso si annullano tra loro. Compito del candidato è scoprire tra le alternative proposte\nquella che esprime il corretto significato della frase data.\n\nPer risolvere questi esercizi bisogna individuare le negazioni che si annullano tra loro.\n\nEsempio</p></details>", "back": "", "conf": "low", "page": 273, "section": "3.2.4 Negazioni di una totalità", "num": null, "_i": 21}, {"kind": "theory", "src": null, "front": "<div class='kindlabel'>THEORY</div><p class='th-en'>(English not filled yet)</p><details><summary>original (IT)</summary><p class='th-it'>1 «Recenti scoperte hanno respinto l&#x27;infondatezza della tesi secondo la quale non è vera\nl&#x27;impossibilità che lo stress sia alla base di alcune gravi malattie mentali».\nIl corretto significato della precedente affermazione è:\nlo stress fa diventare matti\nle malattie mentali sono causate dallo stress\nlo stress può essere la causa di alcune malattie mentali\nlo stress porta inevitabilmente alla malattia mentale\nnon è possibile che lo stress sia la causa di alcune gravi malattie mentali\n\nLa frase di partenza può essere “semplificata” sostituendo alle doppie negazioni una affermazione. Per\nesempio così: «Recenti scoperte hanno suffragato la tesi secondo cui è possibile che lo stress sia alla base\ndi alcune gravi malattie mentali». Di conseguenza la risposta corretta è la\n\nStrategie efficienti\n\nAlcuni esercizi richiedono di individuare qual è la strategia più efficiente per ottenere un risultato, ossia\nquella che permette di minimizzare il numero di tentativi per raggiungerlo. Di solito in questi esercizi è\nconveniente provare a schematizzare le informazioni richieste in modo da avere sempre chiaro cosa ogni\npasso effettuato può permettere effettivamente di dedurre o meno.\n\nEsempi</p></details>", "back": "", "conf": "low", "page": 273, "section": "3.2.4 Negazioni di una totalità", "num": null, "_i": 22}, {"kind": "question", "src": "images/p273_b3.png", "front": "<img src='images/p273_b3.png' class='cardimg'><p class='q'>(English not filled yet)</p><details><summary>original text (IT)</summary><p class='th-it'>1 C&#x27;è una scatola contenente gettoni da gioco. La metà di essi è quadrata e l’altra metà è rotonda.\n| gettoni per metà sono verdi e per metà sono blu. Si può dedurre necessariamente che:\nil numero di gettoni deve essere un multiplo di quattro\nil numero di gettoni rotondi verdi è uguale al numero di gettoni quadrati blu\n\ni quattro tipi di gettoni (quadrati blu, quadrati verdi, rotondi blu, rotondi verdi) sono in\nnumero uguale\n\nil numero dei gettoni quadrati blu è uguale al numero dei gettoni rotondi blu\nil numero dei gettoni quadrati blu è uguale al numero dei gettoni quadrati verdi\n\nPer semplificare il ragionamento si supponga che la scatola contenga 10 gettoni. In base al testo si può\nfacilmente affermare che 5 sono quadrati e 5 rotondi; quanto al colore, 5 sono verdi e 5 blu. Tra i 5 gettoni\nquadrati X saranno di colore verde e i rimanenti 5 - X di colore blu.\n\nSe si esaminano i 5 gettoni rotondi, quelli verdi devono essere 5 - X: infatti il numero totale di gettoni ver-\ndi è 5, di forma quadrata ve ne sono X e dunque ne rimangono 5 - X che devono dunque avere forma\nrotonda. Analogamente, i gettoni blu in totale sono 5; quelli di forma quadrata sono 5 - X e dunque i ri-\nmanenti (ossia 5 — 5 + X = X) sono quelli di forma rotonda.\n\nIn conclusione, si è trovato che:\n*_ gettoni quadrati verdi = X\n\n* gettoni quadrati blu=5 -— X\n«gettoni rotondi verdi = 5 — X\n*_ gettoni rotondi blu = X\n\nPertanto, qualunque sia il valore di X, il numero di gettoni rotondi verdi è uguale al numero di gettoni\nquadrati blu; la risposta corretta è quindi la</p></details>", "back": "", "conf": "low", "page": 273, "section": "3.2.4 Negazioni di una totalità", "num": 1, "_i": 23}, {"kind": "question", "src": "images/p274_b2.png", "front": "<img src='images/p274_b2.png' class='cardimg'><p class='q'>(English not filled yet)</p><details><summary>original text (IT)</summary><p class='th-it'>2 Ci sono N persone (con N &gt; 1) disposte in circolo, che sono o Menzogneri (dicono sempre il\nfalso) o Veritieri (dicono sempre il vero). Ciascuno accusa la persona alla sua destra di\nessere un Menzognero. Ciò è possibile SOLO SE:\n\nN è un numero pari\nN è un numero primo\n\nei N=3\nN è un numero dispari\nN=2\n\nAffinché ognuno possa accusare il vicino di essere Menzognero, senza cadere in contraddizione con ciò che è\nlui stesso (Veritiero o Menzognero), ci deve essere un&#x27;alternanza perfetta tra i due gruppi di persone,: accanto\na ogni Menzognero ci deve essere un Veritiero e viceversa. Se infatti capitano vicine due persone dello stesso\ngruppo, quella che accusa il vicino di destra di essere Menzognero cadrà sicuramente in contraddizione con ciò\nche è lei stessa (un Veritiero non può dire a un altro Veritiero di essere Menzognero e un Menzognero, dando\ndel Menzognero a uno del suo gruppo, dice la verità e non il falso come dovrebbe). Affinché ciò sia possibile è\nnecessario che N sia un numero pari (non per forza solo uguale a 2 come erroneamente riportato dall&#x27;alterna-\ntiva - ), come correttamente espresso dall&#x27;alternativa ‘., che è la soluzione del quesito.</p></details>", "back": "", "conf": "low", "page": 274, "section": "3.2.4 Negazioni di una totalità", "num": 2, "_i": 24}, {"kind": "question", "src": "images/p274_b3.png", "front": "<img src='images/p274_b3.png' class='cardimg'><p class='q'>(English not filled yet)</p><details><summary>original text (IT)</summary><p class='th-it'>3 Sono al buio; estraggo (senza reinserirle) alcune scarpe da una scarpiera disordinata conte-\nnente 5 paia diverse di scarpe. Qual è il minimo numero di scarpe che devo estrarre per\nessere sicuro di trovarne un paio utilizzabile, cioè una destra e una sinistra dello stesso paio?\n\n. 3 scarpe\n. 6 scarpe\n5 scarpe\n4 scarpe\n9 scarpe\n\nL&#x27;esercizio chiede di individuare il numero minimo di scarpe da dover estrarre per averne due che com-\npongono lo stesso paio. Se fossi fortunato riuscirei nell&#x27;intento anche con solo due estrazioni, prendendo\nsubito la destra e la sinistra dello stesso paio. Devo però considerare il caso in cui, anche se sono sfortu-\nnato, sono certo di averne due che compongono lo stesso paio. Il caso più sfortunato è che io peschi con\nle prime 5 estrazioni una scarpa che appartiene a ognuna delle 5 paia presenti, non riuscendo così, nean-\nche dopo 5 estrazioni, ad avere un paio completo. Alla sesta estrazione, però pescherò una scarpa che\nfarà da coppia a una qualunque delle 5 scarpe prima estratte. Con 6 estrazioni sono quindi sempre sicuro\ndi avere un paio completo. La .. è la soluzione cercata.</p></details>", "back": "", "conf": "low", "page": 274, "section": "3.2.4 Negazioni di una totalità", "num": 3, "_i": 25}, {"kind": "question", "src": "images/p274_b4.png", "front": "<img src='images/p274_b4.png' class='cardimg'><p class='q'>(English not filled yet)</p><details><summary>original text (IT)</summary><p class='th-it'>4\n\nIl beffardo mago Atlante ha rinchiuso i in un castello fatato Angelica, l’intelligente princi-\npessa cinese. Angelica è confinata in una stanza con cinque porte contrassegnate UNO,\nDUE, TRE, QUATTRO, CINQUE davanti a ciascuna delle quali sta un aiutante di Atlante, con\nil contrassegno della porta ricamato sul cappello.\n\nLei sa che quattro di essi mentono sempre e uno dice sempre la verità. Dietro alle porte dei\nmentitori c&#x27;è un disgustoso e vorace drago, ma dietro alla porta dell’aiutante che dice la\nverità c&#x27;è il corridoio che porta fuori dal castello. Angelica rivolge alcune domande agli\naiutanti del mago, ricevendo queste informazioni:\n\ne UNOdice che TRE, QUATTRO e CINQUE mentono.\n\ne TREdice che UNO o DUE dicono il vero.\n\ne QUATTRO dice che TRE dice il vero.\n\nDa quale porta deve uscire Angelica?\nUNO QUATTRO CINQUE TRE DUE</p></details>", "back": "", "conf": "low", "page": 274, "section": "3.2.4 Negazioni di una totalità", "num": 4, "_i": 26}, {"kind": "theory", "src": null, "front": "<div class='kindlabel'>THEORY</div><p class='th-en'>(English not filled yet)</p><details><summary>original (IT)</summary><p class='th-it'>‘unico modo per venire a capo di esercizi di questa natura, per nulla semplici, è procedere per ipotesi. Se\nquattro aiutanti di Atlante mentono sempre e solo uno dice sempre la verità, si parta dalla seguente pri-\nna possibilità, seguendo l&#x27;ordine delle risposte fornite ad Angelica.\n\nPrima ipotesi: quello che dice sempre il vero è UNO (tutti gli altri mentono). Dunque è vero che TRE,\nQUATTRO e CINQUE MENTONO, come lui afferma rispondendo ad Angelica. E visto che TRE è fra gli\naiutanti che mentono, quanto lui afferma rispondendo ad Angelica deve essere falso, e cioè deve\nessere falso che UNO o DUE dicono il vero. Ma nella ipotesi che stiamo analizzando UNO è l&#x27;unico a\ndire il vero. Ci troviamo così di fronte a una contraddizione insolubile, che ci costringe ad abbando-\nnare questa ipotesi.\n\nSeconda ipotesi: l&#x27;aiutante che dice sempre il vero è TRE (tutti gli altri mentono). Dunque è vero che\nUNO o DUE dicono il vero. Ma allora ci troveremmo di fronte a due persone che dicono il vero (TRE e\nUNO o DUE), il che è impossibile: si deve scartare anche questa ipotesi e passare alla terza.\n\nTerza ipotesi: è QUATTRO a dire sempre il vero (tutti gli altri mentono). Dunque è vero che TRE dice il\nvero. Anche in questo caso, come nel precedente, ci troviamo con due aiutanti che dicono il vero\n(QUATTRO e TRE), il che, in base a quanto affermato nel testo dell&#x27;esercizio, è impossibile.\n\n‘oncludendo: né UNO né TRE né QUATTRO possono essere rispettivamente gli unici a dire il vero, poiché,\ne così fosse, si cadrebbe di volta in volta in contraddizioni insolubili. Se ne ricava che solo DUE o CINQUE\nJossono dire il vero. Si sceglie CINQUE, perché, come si è dimostrato, TRE mente, quindi non può essere\nero che UNO o DUE dicano il vero, mentre il fatto che UNO menta lascia aperta l&#x27;ipotesi che CINQUE dica\na verità (soluzione  ).</p></details>", "back": "", "conf": "low", "page": 275, "section": "3.2.4 Negazioni di una totalità", "num": null, "_i": 27}, {"kind": "theory", "src": null, "front": "<div class='kindlabel'>THEORY</div><p class='th-en'>(English not filled yet)</p><details><summary>original (IT)</summary><p class='th-it'>Si considerino le seguenti affermazioni:\n\ne Rongfeldtnonsitrova più a nord di Sgybo.\n\ne Sgybositrova più a sud di Rongfeldt.\n\n* Sgybositrova a nord almeno quanto Rongfeldt.\n\nCosa si evince da queste tre affermazioni?\nNessuna delle tre è logicamente equivalente\nLa prima è logicamente equivalente alla seconda, ma non alla terza\nLa prima è logicamente equivalente alla terza, ma non alla seconda\nLa seconda è logicamente equivalente alla terza, ma non alla prima\n\nTutte e tre sono logicamente equivalenti\n\npossibile tradurre le tre affermazioni indicando il nord con il simbolo &gt; (maggiore) e il sud con il simbolo\n(minore). Se R (Rongfeldt) non si trova più a nord di S (Sgybo) allora vuol dire che S sarà più a nord o\nimeno a latitudine pari rispetto a R. L&#x27;affermazione 1 può quindi essere scritta come S &gt; R. La seconda\nffermazione può essere scritta come S &lt; Re infine la terza come S &gt; R. La prima e la terza sono dunque\nquivalenti. La risposta esatta è pertanto la</p></details>", "back": "", "conf": "low", "page": 275, "section": "3.2.4 Negazioni di una totalità", "num": null, "_i": 28}, {"kind": "question", "src": "images/p275_b3.png", "front": "<img src='images/p275_b3.png' class='cardimg'><p class='q'>(English not filled yet)</p><details><summary>original text (IT)</summary><p class='th-it'>Ad una gara podistica partecipano 100 persone. Fra di esse almeno una è donna. Se\nprendo a caso due persone, tra di esse vi sarà sempre almeno un uomo. Quanti sono gli\nuomini?\n\nPer risol sua conclusione può essere vera, ma non ne-\n\ncessariamente deve esserlo. Come nel caso delle ipotesi implicite, questo tipo di domanda chiede in sostan-\n\nza di individuare informazioni addizionali che confortano (o rendono più debole) la conclusione.\n\nÈ utile ricordare che:\n\n* la risposta corretta rafforza (o indebolisce) l&#x27;argomentazione con nuove informazioni; le alternative\nche ripropongono quanto già espresso nel testo sono dunque errate;\n\n* le nuove informazioni da ricercare sostengono (o rendono più debole) la conclusione del ragiona-\nmento; trovare quindi la conclusione e verificare ogni alternativa per vedere quale rafforza (indeboli-\nsce) la conclusione.\n\nSe, infine, il quesito, richiede di individuare l&#x27;alternativa che presenta la stessa struttura del ragionamento\nutilizzato nel testo dell&#x27;esercizio conviene semplificare/schematizzare i termini e le loro relazioni. Se per\nesempio si afferma “In caso di pioggia, domani Marco uscirà con l&#x27;ombrello” si sta utilizzando una forma\ndel tipo “se A allora B”.\n\nLe domande di questa natura possono presentarsi in una delle seguenti forme:\n\n* Quale delle seguenti affermazioni segue la stessa struttura logica del suddetto ragionamento?\n\n* Quale delle seguenti affermazioni contiene la stessa struttura logica del caso appena illustrato?\n\nEsempi\n\n1 «È opportuno scegliere con cura la quantità e la tipologia di nutrienti in maniera appro-\npriata in ogni fase della vita. Si consiglia per i bambini una dieta varia, ricca, da una parte\ncon un alto contenuto di frutta e ortaggi e dall&#x27;altra con un basso contenuto di alimenti\ncome salumi, cioccolata e patatine fritte. Nell’alimentazione dei più piccoli è infatti fonda-\nmentale l&#x27;assunzione di vitamine (soprattutto la C, la D e il complesso B) e sali minerali\n(soprattutto calcio, ferro e iodio, quest’ultimo anche mediante l’uso di sale iodato).\nL&#x27;assunzione di tali sostanze associata a un esercizio fisico di almeno un&#x27;ora al giorno aiuta\nl&#x27;organismo dei più piccoli a crescere in modo equilibrato e a prevenire malattie croniche».\n\nQuale delle seguenti affermazioni è alla base dell’argomentazione precedente?\nFrutta e ortaggi sono gli unici alimenti che contengono sali minerali e vitamine\n\n|. Frutta e ortaggi da soli sono sempre sufficienti a prevenire malattie croniche\n.*. Negli adolescenti non è necessario seguire una dieta ricca di frutta e ortaggi\nFrutta e ortaggi contengono più sali minerali e vitamine di salumi, cioccolata e patatine fritte\n\nx. Tra i gruppi vitaminici è soprattutto il complesso B a essere contenuto negli ortaggi</p></details>", "back": "", "conf": "low", "page": 282, "section": "3.4 Individuazione dell'ipotesi implicita, dell’affe", "num": null, "_i": 38}, {"kind": "theory", "src": null, "front": "<div class='kindlabel'>THEORY</div><p class='th-en'>(English not filled yet)</p><details><summary>original (IT)</summary><p class='th-it'>Il brano afferma che è consigliabile per i bambini una dieta con un alto contenuto di frutta e ortaggi e basso\ndi salumi, cioccolata e patatine fritte e questo perché è importante l&#x27;assunzione di vitamine e sali minerali.\n\nAffinché questo ragionamento sia coerente è necessario che la frutta e la verdura contengano una mag-\ngior quantità di tali sostanze rispetto a salumi, cioccolata e patatine fritte. La. è la soluzione del quesito.\n\nSi ricorda che un&#x27;affermazione che è alla base di un&#x27;argomentazione è una condizione che deve risultare\nvera, che si deve quindi verificare affinché il ragionamento proposto sia logicamente valido.</p></details>", "back": "", "conf": "low", "page": 283, "section": "3.4 Individuazione dell'ipotesi implicita, dell’affe", "num": null, "_i": 39}, {"kind": "theory", "src": null, "front": "<div class='kindlabel'>THEORY</div><p class='th-en'>(English not filled yet)</p><details><summary>original (IT)</summary><p class='th-it'>2 «I sistemi di allarme antifurto nelle abitazioni vengono installati presumibilmente perché\nil costo dell&#x27;allarme è inferiore ai benefici che ci si aspetta di trarne. Il costo di un furto con\nscasso, se e quando avviene, è potenzialmente molto più elevato del costo di installazione\ndi un allarme antifurto. Una scatola chiaramente visibile fissata al muro esterno di un’abi-\ntazione dotata di sistema di allarme antifurto scoraggia possibili scassinatori. Il fatto che\nun&#x27;abitazione fornita di allarme antifurto sia meno a rischio, rende le abitazioni dei vicini\npotenzialmente più vulnerabili ai furti. Quindi, nonostante il poco significativo impatto\nsui livelli di criminalità generali, l&#x27;installazione di costosi dispositivi di sicurezza riduce i\ncrimini ai danni di quanti hanno installato tali dispositivi, ma aumentano i crimini com-\nmessi ai danni di chi non li ha installati».\n\nSe considerata vera, quale delle seguenti affermazioni rende meno forte l’argomenta-\nzione precedente?\n\nSolamente il 60% delle abitazioni che hanno installato allarmi antifurto lo attiva quotidiana-\nmente\n\nGli scassinatori sanno che il 25% di tutte le scatole visibili di allarmi antifurto sono contraffatte,\nma non possono distinguere quali siano quelle autentiche e quali siano quelle contraffatte\n\nCosì come la percentuale di case con allarmi antifurto è aumentata dal 40% al 90%, la percen-\ntuale di furti con scasso è scesa del 60% e la percentuale degli scippi è aumentata del 100%\n\nGli scassinatori interpretano la presenza di un allarme antifurto come un segnale che ci sono\noggetti di grande valore in casa, mentre l&#x27;assenza di un allarme antifurto viene interpretata\ncome segnale che in casa non ci sono oggetti di grande valore\n\nCon riferimento ad abitazioni simili, una più alta percentuale di case senza allarmi antifurto\nviene scassinata rispetto alle case che hanno installato allarmi antifurto\n\nSi analizzi il testo dell&#x27;esercizio:\n\n1. si installa l&#x27;allarme perché il costo è inferiore ai benefici: la presenza dell‘allarme scoraggia possibili\nscassinatori = premessa\n\n2. le abitazioni vicine a quelle con l&#x27;allarme diventano potenzialmente più vulnerabili ai furti &gt; pre-\nmessa\n\n3. l&#x27;allarme riduce il livello di furti per chi lo installa ma lo aumenta per chi non lo installa + conclu-\nsione\n\nBisogna verificare quale alternativa indebolisce la conclusione del ragionamento. La soluzione è fornita\ndall&#x27;alternativa  : affermare che la presenza dell&#x27;allarme viene considerata come segnale di un ricco bot-\ntino e, parallelamente, la mancanza di allarme come indicatore dell&#x27;assenza di oggetti di valore, porta a\nconcludere che gli scassinatori dovrebbero prediligere le case con allarme, esattamente il contrario di\nquanto affermato dalla conclusione. Ciò significa che l&#x27;affermazione, se considerata vera, rende più de-\nbole la conclusione ed è dunque la risposta esatta.</p></details>", "back": "", "conf": "low", "page": 283, "section": "3.4 Individuazione dell'ipotesi implicita, dell’affe", "num": null, "_i": 40}, {"kind": "theory", "src": null, "front": "<div class='kindlabel'>THEORY</div><p class='th-en'>(English not filled yet)</p><details><summary>original (IT)</summary><p class='th-it'>3 «Alle elementari, quando i bambini in un&#x27;aula sono seduti ai loro banchi disposti per file\nsingole, la maestra riesce facilmente a guardarli tutti negli occhi mentre spiega alla lava-\ngna. Cosa che, invece, non è sempre possibile se i bambini sono seduti attorno a tavoli\nrotondi in gruppi separati. Inoltre, i bambini seduti ai loro banchi disposti per file singole,\nquando alzano lo sguardo, invece di distrarsi guardando il bambino di fronte vedono la\nmaestra. Quindi, essere seduti ai propri banchi disposti per file singole aiuta i bambini a\nrimanere concentrati meglio sul proprio lavoro e questa dovrebbe dunque essere la dispo-\nsizione standard dei banchi in ogni aula elementare».\n\nSe considerata vera, quale delle seguenti affermazioni rende più forte l&#x27;argomentazione\nprecedente?\n\n. Sei banchi sono disposti in file singole, i bambini riescono a vedere meglio la lavagna\nEssere seduti in gruppi di 4-7 bambini rende più facile la discussione in classe\nI banchi disposti in fila non occupano più spazio dei tavoli rotondi\n\nAlcuni bambini si distraggono facilmente sia che siano seduti in banchi disposti per file sin-\ngole sia che siano seduti in gruppi\n\n| fautori dei metodi tradizionalisti reputano la disposizione in banchi in file singole come la\nmigliore per insegnare\n\nSi analizzi l&#x27;argomentazione di partenza:\n1. seibambini sono in fila, la maestra può guardarli negli occhi e loro restano concentrati — premessa\n\n2. sei bambini sono in cerchio, la maestra non li guarda negli occhi e loro si distraggono e chiacchie-\nrano più facilmente + premessa\n\n3. la disposizione standard a scuola dovrebbe essere per fila + conclusione.\n\nL&#x27;esercizio chiede di individuare l&#x27;affermazione che rafforza l&#x27;argomentazione data, ossia quella che rende\npiù forte la conclusione (la disposizione per file è la migliore); appare evidente che la risposta corretta è\nla ..: se disposti in singole file i bambini vedono meglio la lavagna e quindi si concentrato maggiormen-\nte; è dunque ancora più logico concludere che questa disposizione sia quella da adottare.\n\nL&#x27;alternativa - afferma che la disposizione a file è ritenuta dai pedagogisti tradizionalisti la migliore per\ninsegnare, ossia ripete quanto sostenuto dalla conclusione dell&#x27;argomentazione senza tuttavia addurre\nmotivazioni aggiuntive come invece avviene nell&#x27;alternativa ., dove ci si riferisce anche alla possibilità\ndi vedere meglio la lavagna.</p></details>", "back": "", "conf": "low", "page": 284, "section": "3.4 Individuazione dell'ipotesi implicita, dell’affe", "num": null, "_i": 41}, {"kind": "theory", "src": null, "front": "<div class='kindlabel'>THEORY</div><p class='th-en'>(English not filled yet)</p><details><summary>original (IT)</summary><p class='th-it'>4\n\n«Quando sto per prendere r influenza, prima ho sempre mal di testa. Oggi i mi i sento la feb-\nbre, ma non ho mal di testa, quindi non sto per prendere l&#x27;influenza».\n\nQuale delle seguenti affermazioni segue la stessa struttura logica del suddetto ragiona-\nmento?\n\nSe Tamara fosse già andata al cinema, Claudia sarebbe andata con lei. Tamara non è ancora\nuscita, quindi possiamo essere certi che nemmeno Claudia è ancora partita\n\nSe vincessi alla lotteria non darei nulla alla mia famiglia perché i miei familiari hanno detto\nche se vincessero non mi darebbero niente\n\nSe avessi chiuso a chiave la porta uscendo di casa, avrei le chiavi con me. Purtroppo non ho\nle chiavi con me, quindi non posso aver chiuso a chiave la porta quando sono uscito\n\nSe Mario otterrà degli ottimi voti a scuola, vuole iscriversi alla facoltà di medicina. Lo scorso\nanno non ha ottenuto dei buoni voti, quindi è improbabile che studierà medicina\n\nSe di sera il cielo è rosso, l&#x27;indomani sarà una bella giornata. Stasera il cielo è rosso quindi ci si\npuò aspettare una bella giornata per domani</p></details>", "back": "", "conf": "low", "page": 284, "section": "3.4 Individuazione dell'ipotesi implicita, dell’affe", "num": null, "_i": 42}, {"kind": "theory", "src": null, "front": "<div class='kindlabel'>THEORY</div><p class='th-en'>(English not filled yet)</p><details><summary>original (IT)</summary><p class='th-it'>La struttura logica del testo è la seguente:\n\nSe INFL allora MT. No MT quindi non INFL\n\nPer individuare l&#x27;alternativa corretta occorre trovare quella che inizia con una struttura del tipo “se A” e\n\ntermina con una struttura del tipo “quindi non A&quot; Tutte le risposte iniziano con “se A” è quindi sufficiente\nindividuare quella che termina con “quindi non A”. L&#x27;unica che rispetta tale regola è la {*&amp; (risposta esatta):\n“se avessi chiuso a chiave... quindi non posso aver chiuso a chiave”.\n\nSuggerimenti\n\nLeggendo le relazioni, è importante non fare ulteriori infondate supposizioni. Se, per esempio, è\nstabilita una relazione di peso e di altezza tra i componenti di una squadra, non bisogna supporre\nche chi è più pesante debba, per questo, essere più alto. Analogamente, non bisogna basarsi sulle\nproprie conoscenze per rispondere alle domande, ma attenersi unicamente al testo dell&#x27;esercizio.\n\nÈ fondamentale tracciare uno schema che riproduca graficamente le informazioni fornite dalle\nrelazioni date e che consenta di dedurre le relazioni mancanti. Il tipo di schema dipende natural-\nmente dal tipo di relazioni presentate. Il ricorso alla schematizzazione è tuttavia il metodo più effi-\ncace per la risoluzione di questi esercizi.Ciò consente, infatti, di rispondere a tutte le domande senza\ndover tornare a esaminare il testo dell&#x27;esercizio che descrive le relazioni.\n\nÈ spesso conveniente limitarsi a trascrivere unicamente le iniziali e non interamente i nomi di\npersone, animali, luoghi ecc., risparmiando così del tempo utile per la risoluzione. Non a caso molto\nspesso gli esercizi riportano nomi con iniziali differenti.\n\nGli enunciati che definiscono le relazioni non devono essere necessariamente analizzati\nnell&#x27;ordine presentato. A volte può essere utile saltare da uno all’altro, a seconda delle informazioni\nrichieste dal quesito.\n\nOccorre prestare molta attenzione alla fase di lettura degli enunciati che definiscono le relazioni.\nLa maggior parte del tempo, infatti, deve essere dedicata a un&#x27;analisi delle relazioni presentate, fina-\nlizzata a tracciare lo schema. Per questo motivo, il tempo mediamente concesso per rispondere alle\ndomande risulta appena sufficiente.\n\nOccorre prestare attenzione alle espressioni che descrivono o limitano le relazioni, come sol-\ntanto, esattamente, mai, sempre, deve essere, almeno e così via.</p></details>", "back": "", "conf": "low", "page": 285, "section": "3.4 Individuazione dell'ipotesi implicita, dell’affe", "num": null, "_i": 43}];

const KIND={
  question:{label:'Question',color:'#98a2d4'},
  passage:{label:'Passage',color:'#de8a76'},
  theory:{label:'Theory',color:'#e9be3b'}
};
const TKEY='theme_'+location.pathname.replace(/\W/g,'_');
let theme=localStorage.getItem(TKEY)||'cool';

const SK='done_'+location.pathname.replace(/\W/g,'_');
let passed=new Set(JSON.parse(localStorage.getItem(SK)||'[]'));
function savePassed(){localStorage.setItem(SK,JSON.stringify([...passed]));}
function togglePassed(i,e){
  e.stopPropagation();
  if(passed.has(i))passed.delete(i);else passed.add(i);
  savePassed();
  if(filter==='all'||filter==='passed'){
    pool=poolFor(filter);
    if(!pool.length)idx=0;else if(idx>=pool.length)idx=pool.length-1;
  }
  render();
}

let pool=ALL.slice(),idx=0,filter='all';
const card=document.getElementById('card');

function poolFor(f){
  return ALL.filter(c=>
    f==='all'?!passed.has(c._i):
    f==='passed'?passed.has(c._i):
    f==='review'?c.conf==='low':
    c.kind===f);
}
function counts(){
  return {
    all:ALL.filter(c=>!passed.has(c._i)).length,
    question:ALL.filter(c=>c.kind==='question').length,
    passage:ALL.filter(c=>c.kind==='passage').length,
    theory:ALL.filter(c=>c.kind==='theory').length,
    review:ALL.filter(c=>c.conf==='low').length,
    passed:passed.size
  };
}
function refreshCounts(){
  const n=counts();
  document.querySelectorAll('[data-count]').forEach(s=>{
    s.textContent=n[s.getAttribute('data-count')]||0;});
}
function view(){pool=poolFor(filter);if(idx>=pool.length)idx=0;render();}
function render(){
  refreshCounts();
  const c=pool[idx];
  if(!c){card.className='card empty';card.innerHTML='No cards here';
    document.getElementById('count').textContent='0 / 0';return;}
  const k=KIND[c.kind]||{label:c.kind,color:'#93a0ad'};
  const ord=String(c._i+1).padStart(2,'0');
  const meta=(c.section||'')+' · p'+c.page+(c.num?(' · Q'+c.num):'');
  const isDone=passed.has(c._i);
  const passBtn=`<button class="pass-btn${isDone?' done':''}" onclick="togglePassed(${c._i},event)">${isDone?'\u2713 done':'mark done'}</button>`;
  card.className='card';
  card.innerHTML=
    `<div class="cardhead">`+
      `<span class="ord">\u2116 ${ord}</span>`+
      `<span class="kind" style="color:${k.color}">${k.label}</span>`+
      `<span class="meta">${meta}</span>`+
    `</div>`+
    `<div class="cardbody">${c.front}</div>`+
    `<div class="cardfoot">${passBtn}</div>`;
  document.getElementById('count').textContent=(idx+1)+' / '+pool.length;
  window.scrollTo(0,0);
  const ci=card.querySelector('.cardimg');
  if(ci)ci.addEventListener('click',e=>{e.stopPropagation();openZoom(ci.src);});
}
function next(){if(!pool.length)return;idx=(idx+1)%pool.length;render();}
function prev(){if(!pool.length)return;idx=(idx-1+pool.length)%pool.length;render();}
function shuffle(){for(let i=ALL.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[ALL[i],ALL[j]]=[ALL[j],ALL[i]];}idx=0;view();}
function setFilter(f,btn){filter=f;idx=0;
  document.querySelectorAll('.controls button').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');view();}
function setTheme(t,btn){document.body.dataset.theme=t;localStorage.setItem(TKEY,t);
  document.querySelectorAll('.themes button').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');}
function openZoom(src){const z=document.getElementById('zoom');document.getElementById('zoomimg').src=src;z.classList.add('show');}
function closeZoom(){document.getElementById('zoom').classList.remove('show');}

let sx=0,sy=0;
card.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;},{passive:true});
card.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
  if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.5){e.preventDefault();dx<0?next():prev();}},{passive:false});
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')next();if(e.key==='ArrowLeft')prev();
  if(e.key==='Escape')closeZoom();});

document.body.dataset.theme=theme;
document.querySelectorAll('.themes button').forEach(b=>b.classList.toggle('on',b.getAttribute('data-theme')===theme));
view();
</script></body></html>
