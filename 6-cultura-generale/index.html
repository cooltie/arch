esto degli intellettua\nantifascisti e nel dopoguerra ministro e senatore.\n\nItalo Svevo (Ettore Schmitz, 1861-1928). Risentì della lezione di Freud, dei romanzieri francesi di Balzac\nMaupassant e Flaubert e fu amico di James Joyce. Scrisse i romanzi Una vita, Senilità, La coscienza di Zenc\nnei quali espone il malessere e le nevrosi della borghesia di fine secolo, anticipando molti caratteri del mo\nderno romanzo psicologico.</p></details>", "back": "", "conf": "low", "page": 324, "section": "6.2.5 || Seicento", "num": null, "_i": 29}, {"kind": "theory", "src": "images/p325_b1.png", "front": "<div class='kindlabel'>THEORY</div><img src='images/p325_b1.png' class='cardimg'><p class='th-en'>(English not filled yet)</p><details><summary>original (IT)</summary><p class='th-it'>O Luigi Pirandello (1867-1936). Raggiunse la fama con il teatro, tanto da costituire e dirigere una\n\nÈ compagnia. Aderì al fascismo e ne ebbe in cambio la nomina ad Accademico d&#x27;Italia. Ricevette nel\n1934 il premio Nobel per la letteratura. Scrisse romanzi (I/ fu Mattia Pascal, Uno nessuno e centomi-\nla, L’esclusa) e 246 novelle (le più famose Acqua amara, La vita nuda, Lumìe di Sicilia), ma è soprat-\ntutto grazie al teatro che Pirandello raggiunse fama mondiale. Bisogna ricordare i suoi capolavori\nSei personaggi in cerca d&#x27;autore e Enrico IV.| temi ricorrenti sono: il dominio del caso, l&#x27;impossibilità\ndi comunicare con i propri simili e di sottrarsi alle convenzioni sociali, l&#x27;impossibilità di arrivare a\nuna verità oggettiva. Tutti elementi che costringono l&#x27;uomo a indossare una maschera e a recitare\nuna parte. Nel 1934 ricevette il premio Nobel.\n\nL&#x27;Ermetismo e la grande lirica novecentesca\n\nCorrente poetica del primo Novecento, l&#x27;Ermetismo pone al centro la parola nella sua singolarità e purez-\nza. Il potere evocativo della lingua poetica prevale su quello comunicativo: si ricerca il termine preciso,\nisolato, che permette analogie e metafore in luogo di percorsi più razionali o logici. La poesia esprime so-\nlo l’interiorità, in una dimensione che lega in modo inscindibile l’arte e la vita, come recitava il titolo del\nsaggio di Carlo Bo Letteratura come vita. Alla lezione poetica dell&#x27;Ermetismo si rifecero non solo gli erme-\ntici puri — oltre ai maggiori, ricordiamo Sandro Penna (1906-1977), Alfonso Gatto (1909-1976), Mario\nLuzi (1914-2005), Leonardo Sinisgalli (1908-1981) ecc. - ma molti grandi lirici che presero le mosse dal\nconcetto di parola come essenza evocativa, per esempio Montale.\n\nGiuseppe Ungaretti (1888-1970). È considerato il padre dell&#x27;Ermetismo. Nella prima fase (raccolte /l por-\nto sepolto e Allegria di naufragi, 1916 e 1919) della sua produzione la parola è isolata, scelta per sonorità\ne intensità evocativa, la metrica è frantumata in pochissimi e brevissimi versi, anche di un solo vocabolo;\nnella seconda fase (raccolta Sentimento del tempo, 1933), la misura si amplia e le parole formano strutture\ncomplesse, con lessico letterario e contenuti “alti” (iltempo, la morte, il senso del divino); la terza fase (rac-\ncolte Il Dolore, 1947; La terra promessa, 1950; Il taccuino del vecchio, 1960), ha invece carattere meditativo\n(esperienza del dolore, fede rinnovata). Il titolo dell&#x27;opera omnia, Vita di un uomo, fu scelto dallo stesso\nUngaretti a conferma della coincidenza tra vita e poesia.\n\nO Salvatore Quasimodo (1901-1968).Il suo tema preferito è quello dell&#x27;amore e della rievocazione\n\ndì della terra natia, la Sicilia, espresso principalmente nelle opere Acque e terre, Oboe sommerso, Erato\ne Apollion, La terra impareggiabile e Dare e avere. | suoi versi «Ognuno sta solo sul cuor della terra /\ntrafitto da un raggio di sole / ed è subito sera» sono diventati emblema dell&#x27;Ermetismo. Ebbe an-\nche una parentesi come poeta civilmente impegnato, quando, sconvolto dagli orrori della secon-\nda guerra mondiale, si fece portavoce del bisogno di ricostruzione e di pace (nelle opere Giorno\ndopo giorno, La vita non è sogno, Il falso e vero verde). Fu insignito del premio Nobel (1959).\n\nAltri importanti poeti del primo Novecento italiano sono invece:\n\nUmberto Saba (1883-1957). La sua è una lirica semplice e chiara nel lessico, quotidiana nei temi e malin-\nconica nel tono. Le sue poesie, composte nell&#x27;arco di più di mezzo secolo, sono raccolte nel Canzoniere\n(le liriche più famose Città vecchia, Ulisse, Goal, A mia moglie, Trieste).\n\nO Eugenio Montale (1896-1981). Premio Nobel per la Letteratura nel 1975, fu attivo per gran parte\n\nN del secolo come una delle figure più significative della cultura italiana. Firmò il manifesto crociano\ndegli antifascisti, collaborò con importanti riviste letterarie, tra cui «Solaria». La sua poesia esprime\nuna lucida disperazione esistenziale (il male di vivere) cui nessuna fede (trascendente o immanen-\nte) o poesia può porre rimedio. Ciò che il poeta può esprimere è solo in negativo: «Ciò che non sia-\nmo, ciò che non vogliamo». Ogni oggetto poetico (si pensi agli scabri paesaggi liguri) è interpretato\nda Montale come simbolo della condizione umana. Perfino il tema della memoria si risolve nella\nconferma della solitudine umana. Una sostanziale unità di temi si riscontra in tutte le sue raccolte:\nOssi di seppia, Le occasioni, La bufera e altro, Satura, Diario del 71-72.</p></details>", "back": "", "conf": "low", "page": 325, "section": "6.2.5 || Seicento", "num": null, "_i": 30}, {"kind": "theory", "src": "images/p326_b1.png", "front": "<div class='kindlabel'>THEORY</div><img src='images/p326_b1.png' class='cardimg'><p class='th-en'>(English not filled yet)</p><details><summary>original (IT)</summary><p class='th-it'>Il Neorealismo\n\nSviluppatosi a partire dagli anni Trenta fino al dopoguerra, il Neorealismo in letteratura privilegia il con-\ntenuto rispetto allo stile, puntando sulla rappresentazione della realtà e sui grandi problemi politici e so-\nciali: la miseria, la guerra, la Resistenza, la rivolta contadina e operaia, la ricostruzione ecc. In Italia la poe-\ntica neorealista (fedeltà alla cronaca, interesse per la vita delle classi più povere, mimesi del parlato) si\nimpose nel secondo dopoguerra.\n\nElio Vittorini (1908-1966). Dopo il primo romanzo Il garofano rosso (1935), avvicinandosi al comunismo,\ntrattò temi di marcato impegno sociale (l&#x27;antifascismo, la lotta alla miseria, la repressione poliziesca): Con-\nversazione in Sicilia (1941), Uomini e no (1945), Il Sempione strizza l&#x27;occhio al Frejus (1947). Attento alle let-\nterature straniere, tradusse e pubblicò nel 1941 Americana, un&#x27;antologia di narratori statunitensi.\n\nCesare Pavese (1908-1950). Scrittore e traduttore. Dopo tre anni di confino per antifascismo, pubblicò la\nraccolta poetica Lavorare stanca (1936). Nei primi romanzi (Il carcere e Paesi tuoi, 1939 e1941) trattò iltema\nper lui tipico della solitudine interiore. Le sue opere maggiori sono: Feria d&#x27;agosto, 1946; Il compagno,\n1947; Dialoghi con Leucò, 1947; Prima che il gallo canti, 1948; La bella estate, 1949; La luna e i falò, 1950. Po-\nstumi il diario // mestiere di vivere (1952) e le poesie Verrà la morte e avrà i tuoi occhi (1951).\n\nVasco Pratolini (1913-1991). Suo tema privilegiato fu la vita del proletariato cittadino, nei romanzi //\nquartiere (1944), Cronache di poveri amanti (1947), Un eroe del nostro tempo (1949) e nelle pagine, più liri-\nche, di Cronaca familiare (1947). Metello (1955) narra le vicende di un muratore durante le prime lotte sin-\ndacali del Novecento; questo è il primo romanzo di una trilogia composta anche da Lo scialo (1960) e Al-\nlegoria e derisione (1966).\n\nIgnazio Silone (1900-1978). Tra i fondatori del Partito comunista, se ne allontanò nel 1931.1 suoi romanzi\nesprimono ideali di giustizia sociale (Fontamara, 1933; Pane e vino, 1936; Il seme sotto la neve, 1941) e di\nun cristianesimo pauperista (Una manciata di more, 1952; Il segreto di Luca, 1956; La volpe e le camelie,\n1960; L&#x27;avventura di un povero cristiano,1968, sulla storia di Celestino V, papa del «gran rifiuto»).\n\nBeppe Fenoglio (1922-1963). Scrittore e traduttore dall&#x27;inglese. Partecipò alla Resistenza e la raccontò\nnei suoi scritti, in tono non commemorativo o ideologico, ma realistico e demistificatorio. Romanzi prin-\ncipali sono: / ventitré giorni della città di Alba, Primavera di bellezza, Il partigiano Johnny, Una questione pri-\nvata, La paga del sabato. Il romanzo La malora narra invece della dura vita di una famiglia contadina delle\nLanghe.\n\nCarlo Levi (1902-1975). Scrittore e antifascista. Dall&#x27;esperienza del confino in Lucania maturò il suo ro-\nmanzo più noto, Cristo si è fermato a Eboli (1945), cui seguirono tra gli altri Le parole sono pietre (1955), Il\nfuturo ha un cuore antico (1956). Temi presenti in tutti gli scritti sono la critica alla borghesia conformista\ne il mito della cultura contadina.\n\nCarlo Cassola (1917-1987). È un narratore realista e asciutto; nella sua opera affronta i temi della\nResistenza e indaga al contempo la psicologia dei personaggi. Tra i suoi romanzi: La ragazza di Bube, Il\ntaglio del bosco, Monte Mario, Troppo tardi, Storia di Ada, Fausto e Anna, Esiliati, Rosa Gagliardi.\n\nProsa del secondo Novecento\n\nGiuseppe Tomasi di Lampedusa (1896-1957). È famoso per un unico romanzo, uscito postumo nel\n1958, trasposto sul grande schermo dal regista Luchino Visconti. // Gattopardo (1958) narra le vicende di\nuna famiglia nobile siciliana negli anni della conquista garibaldina e dell&#x27;Unità d&#x27;Italia.\n\nPier Paolo Pasolini (1922-1975). Scrittore, poeta, regista fu uno dei più geniali intellettuali del secondo\nNovecento. Di origini friulane, compose i versi raccolti in La meglio gioventù (1954). Dopo la guerra si tra-\nsferì a Roma, dove lavorò come sceneggiatore cinematografico e collaborò ad alcune riviste.\n\nCoinvolto dalla realtà del sottoproletariato romano ne narrò le vicende nei suoi romanzi più famosi: Ra-\ngazzi di vita (1955) e Una vita violenta (1959), composti con una mescolanza di italiano e dialetto. | suoi\npersonaggi ignoranti, miserabili, ma genuini e integri, vengono contrapposti al potere corruttivo della\nsocietà borghese («È solo nella povertà che si manifesta, sia pur illusoriamente, la bontà umana»). Nella\nraccolta poetica Le ceneri di Gramsci (1957) esprime il dissidio tra l&#x27;adesione razionale al marxismo e la ra-\ndicata spiritualità contadina.</p></details>", "back": "", "conf": "low", "page": 326, "section": "6.2.5 || Seicento", "num": null, "_i": 31}, {"kind": "theory", "src": "images/p327_b1.png", "front": "<div class='kindlabel'>THEORY</div><img src='images/p327_b1.png' class='cardimg'><p class='th-en'>(English not filled yet)</p><details><summary>original (IT)</summary><p class='th-it'>Primo Levi (1919-1987). Chimico e scrittore. Sopravvissuto allo sterminio nazista ad Auschwitz, ne scrisse\nin Se questo è un uomo (1947), La tregua (1963, sul viaggio di ritorno in patria) e/ sommersi e i salvati (1986,\nuna riflessione sulle dinamiche della vita nei campi). Altri suoi libri, limpidi ed essenziali, furono: // sistema\nperiodico, La chiave a stella, Se non ora, quando? Il suicidio fu da lui esplicitamente legato alla shoah e alla\ndifficoltà crescente di tramandarne la memoria.\n\nLeonardo Sciascia (1921-1989). Gran parte della sua opera è legata alla Sicilia. Ai primi libri-inchiesta -\nLe parrocchie di Regalpetra (1956), Gli zii di Sicilia (1958) - seguì il romanzo Il giorno della civetta (1961), in\ncui si fusero l&#x27;intreccio narrativo quasi poliziesco e la riflessione storico-sociale. Mafia, inerzia, malgover-\nno, connivenze della classe politica sono centrali in tutti i romanzi di Sciascia: A ciascuno il suo (1966), Il\ncontesto (1971), Todo modo (1974), Una storia semplice (1989). Numerosi anche i testi di saggistica lette-\nraria e politica, tra cui La scomparsa di Majorana (1975), L&#x27;affaire Moro (1978).\n\nAlberto Moravia (1907-1990). Nel primo romanzo, Gli indifferenti (1929), la critica alla cultura borghese\nlo rese sospetto al regime fascista. Dopo altri scritti di scarso successo, si affermò con alcuni racconti e il\nromanzo breve Agostino (1945). Gli scritti del dopoguerra furono influenzati da marxismo, teorie psicana-\nlitiche e da una parziale adesione al neorealismo (La romana, 1947; La ciociara, 1957 ecc.).\n\nL&#x27;analisi impietosa della decadenza borghese proseguì in La disubbidienza (1948), L&#x27;amore coniugale e altri\nracconti (1949), Il conformista (1951), Il disprezzo (1954). Nel 1960, con La noia, raccontò il malessere esi-\nstenziale. L&#x27;indagine di Moravia non è mai sociale ma sempre psicologica e il suo strumento espressivo è\nil monologo interiore, che svela le tensioni tra il singolo e la società.\n\nDino Buzzati (1906-1972). Scrittore, giornalista, pittore e illustratore delle sue stesse opere: Bàrnabo delle\nmontagne (1933); Il Segreto del Bosco vecchio (1935); Il deserto dei Tartari (1940); Paura alla Scala (1949); Un\namore (1963); | miracoli di Val Morel (1971). Suoi tratti tipici sono i paesaggi fantastici, le atmosfere meta-\nfisiche in cui si muovono personaggi solitari.\n\nCarlo Emilio Gadda (1893-1973). Scrittore, ingegnere coniugò cultura umanistica e tecnologica e realiz-\nzò un personalissimo pastiche tra lingua colta, dialetti, tecnicismi. Suoi capolavori sono i romanzi Quer pa-\nsticciaccio brutto de via Merulana (1957), La cognizione del dolore (1963) e L’Adalgisa (1944), satira della pic-\ncola borghesia milanese.\n\nGiorgio Bassani (1916-2000). Scrittore di origini ebraiche, visse fino al 1943 a Ferrara, prima di trasferirsi a\nRoma dove trascorse il resto della sua vita. Le conseguenze della discriminazione razziale sulla vita della\ncittà, il dolore dell&#x27;esclusione sono il suo tema primario (non solo in chiave autobiografica): La passeggiata\nprima di cena (1953); Cinque storie ferraresi (1956); Gli occhiali d&#x27;oro (1958); Il giardino dei Finzi-Contini (1962).\nLa prosa di Bassani è quasi una prosa d&#x27;arte, attenta all&#x27;analisi psicologica e dei sentimenti, quasi più che\nagli eventi narrati.\n\nItalo Calvino (1923-1985). Scrittore, partigiano, esordì nel 1947 con uno dei migliori romanzi di argo-\nmento resistenziale: // sentiero dei nidi di ragno.\n\nTra le sue opere migliori si impone la trilogia i nostri antenati: Il visconte dimezzato (1952), Il barone ram-\npante (1957) e Il cavaliere inesistente (1959), in cui reinterpretò il romanzo filosofico settecentesco. Imper-\nniati su problemi della società contemporanea sono: La speculazione edilizia (1957); La nuvola di smog\n(1958); Marcovaldo (1963).\n\nAltre sue opere sono: La giornata di uno scrutatore (1963); Ti con zero (1968); Le città invisibili (1972); Il ca-\nstello dei destini incrociati (1973); Se una notte d&#x27;inverno un viaggiatore (1979); Palomar (1983).\n\nMario Rigoni Stern (1921-2008). Narratore. Affermatosi nel 1953 con Il sergente della neve, una delle più\nefficaci e drammatiche rappresentazioni della ritirata di Russia (cui l&#x27;autore partecipò personalmente co-\nme alpino), pose al centro della propria opera sia le memorie di guerra (Quota Albania, 1971, Ritorno sul\nDon, 1973), sia la descrizione della sua terra (l&#x27;altopiano e i monti di Asiago), come in Storia di Tònle (1978),\nIl bosco degli urogalli (1962), Arboreto selvatico (1991).\n\nAndrea Camilleri (1925-2019). Regista e funzionario per la Rai, regista teatrale e insegnante all&#x27;Accade-\nmia d&#x27;Arte Drammatica, come scrittore conosce il successo negli anni Novanta con la serie poliziesca del\ncommissario Montalbano, iniziata con La forma dell’acqua (1994). Pubblica più di 100 libri, soprattutto ro-\nmanzi polizieschi, storici e d&#x27;impegno civile e viene tradotto in tutto il mondo.</p></details>", "back": "", "conf": "low", "page": 327, "section": "6.2.5 || Seicento", "num": null, "_i": 32}, {"kind": "theory", "src": "images/p328_b1.png", "front": "<div class='kindlabel'>THEORY</div><img src='images/p328_b1.png' class='cardimg'><p class='th-en'>(English not filled yet)</p><details><summary>original (IT)</summary><p class='th-it'>Antonio Tabucchi (1943-2012). Docente universitario di letteratura portoghese, scopritore e traduttore\ndi Fernando Pessoa, esordisce con il romanzo Piazza d&#x27;Italia (1975), una scorribanda in tre tempi (più epi-\nlogo e appendice) tra Risorgimento e Repubblica, raccontati attraverso le gesta di una famiglia toscana\ndi anarchici, pubblica poi diverse raccolte di racconti, tra cui // gioco del rovescio (1981) e ottiene il succes-\nso internazionale con Notturno indiano (1984). Tra le sue opere successive sono da ricordare i racconti di\nI volatili del Beato Angelico (1987), i romanzi d&#x27;ambientazione portoghese Requiem (1991, scritto in porto-\nghese e poi tradotto in italiano), Sostiene Pereira (1994), considerato il suo capolavoro, e La testa perduta\ndi Damasceno Monteiro (1997), il romanzo in forma epistolare Si sta facendo sempre più tardi (2001).\n\nUmberto Eco (1932-2016). Filosofo, critico, semiologo e scrittore, è stato fra i più vivaci protagonisti della\nneoavanguardia italiana degli anni Sessanta, tra gli animatori del Gruppo 63. Come studioso si è occupa-\nto di tutte le forme della comunicazione di massa. Della sua produzione saggistica ricordiamo: Sviluppo\ndell&#x27;estetica medioevale (1959), Opera aperta (1962), Le forme del contenuto (1971); Trattato di semiotica ge-\nnerale (1975), Diario minimo (1963) e Secondo diario minimo (1992). La sua notorietà è legata anche ai ro-\nmanzi: /l nome della rosa (1980), Il pendolo di Foucault (1988), L&#x27;isola del giorno prima (1994), Baudolino\n(2000), La misteriosa fiamma della regina Loana (2004).\n\nLegati alla lezione del Gruppo 63 sono anche alcune tra le più significative voci poetiche degli ultimi de-\ncenni del Novecento: Antonio Porta (Leo Paolazzi, 1935-1989), Edoardo Sanguineti (1930-2010), Elio\nPagliarani (1927-2012) e soprattutto Andrea Zanzotto (1921-2011).\n\nNarrativa Contemporanea\n\n| maggiori successi editoriali dell&#x27;ultimo periodo, le cui vendite hanno superato il milione di copie, sono\nstati Gomorra (2006) di Roberto Saviano, La solitudine dei numeri primi (2008) di Paolo Giordano e Fai bei\nsogni (2012) di Massimo Gramellini. Proponiamo una breve panoramica dedicata alla letteratura contem-\nporanea italiana ricordando che, nel corso dell&#x27;ultimo ventennio, si sono affermate presso il grande pub-\nblico e sono state anche tradotte all&#x27;estero le opere narrative di:\n\n* Niccolò Ammaniti, /o non ho paura (2001), Anna (2015);\n+ Alessandro Baricco, Oceano mare (1991) e Questa storia (2005);\n* Aldo Busi, Seminario sulla gioventù (1984) e Suicidi dovuti (1996);\n* Andrea De Carlo, Due di due (1989) e Nel momento (1999);\n* Vincenzo Consolo, // sorriso dell&#x27;ignoto marinaio (1976) e Nottetempo, casa per casa (1992);\n* ElenaFerrante, L&#x27;amore molesto (1995) e L&#x27;amica geniale (4 vol. 2011-14);\ne Nicola Lagioia, Riportando tutto a casa (2009) e La ferocia (2015);\n* Carlo Lucarelli, A/most Blue (1997) e L&#x27;ottava vibrazione (2008);\n* Claudio Magris, Danubio (1986) e Alla cieca (2005);\nDacia Maraini, La lunga vita di Marianna Ucria (1990) e Voci (1994);\ne Michele Mari, Tutto il ferro della torre Eiffel (2002) e Rosso Floyd (2010);\n* Melania Mazzucco, Lei così amata (2000) e Vita (2003);\n* Margaret Mazzantini, Non ti muovere (2002) e Nessuno si salva da solo (2011);\n* Maurizio Maggiani, // coraggio del pettirosso (1995) e Il viaggiatore notturno (2005);\n* Giuseppe Pontiggia, Vite di uomini non illustri (1993) e Nati due volte (2000);\ne Roberto Saviano, Gomorra (2006) e Zero Zero Zero (2013);\n* Susanna Tamaro, Va dove ti porta il cuore (1994) e Anima mundi (1997);\n* Sebastiano Vassalli, La chimera (1990) e Amore lontano (2005);\n* Sandro Veronesi, La forza del passato (2001) e Caos calmo (2005);\n«Wu Ming, 54 (2002) e Manituana (2007).</p></details>", "back": "", "conf": "low", "page": 328, "section": "6.2.5 || Seicento", "num": null, "_i": 33}, {"kind": "question", "src": "images/p329_b2.png", "front": "<img src='images/p329_b2.png' class='cardimg'><p class='q'>(English not filled yet)</p><details><summary>original (IT)</summary><p class='th-it'>1 Quale dei seguenti romanzieri fu anche un matematico?\nMichail A. Bulgakov\nGeorge Eliot\n. Lewis Carroll\nGustave Flaubert\nGeorge B. Shaw\n_o scrittore inglese Lewis Carroll (1832-98), pseudonimo di Charles Dodgson, autore del classico per l’in-\n\n‘anzia Le avventure di Alice nel Paese delle Meraviglie (1865) e prete anglicano, fu un appassionato di foto-\ngrafia e un Matematico universitario che insegnò a Oxford. La risposta esatta è la (9).</p></details>", "back": "", "conf": "low", "page": 329, "section": "6.2.5 || Seicento", "num": 1, "_i": 34}, {"kind": "question", "src": "images/p329_b3.png", "front": "<img src='images/p329_b3.png' class='cardimg'><p class='q'>(English not filled yet)</p><details><summary>original (IT)</summary><p class='th-it'>) Quale delle seguenti opere non è stata scritta da William Shakespeare?\nLa bisbetica domata\n. Sogno di una notte di mezza estate\nLa tempesta\nLe allegre comari di Windsor\nIl ventaglio di Lady Windermere\n\n| testo teatrale non di Shakespeare è // ventaglio di Lady Windermer (1892), commedia in quattro atti di\n)scar Wilde (1854-1900). La risposta esatta è la (3.</p></details>", "back": "", "conf": "low", "page": 329, "section": "6.2.5 || Seicento", "num": 2, "_i": 35}, {"kind": "question", "src": "images/p329_b4.png", "front": "<img src='images/p329_b4.png' class='cardimg'><p class='q'>(English not filled yet)</p><details><summary>original (IT)</summary><p class='th-it'>3 Chi è l’autore della raccolta lirica Oboe sommerso?\nSalvatore Quasimodo\nAlfonso Gatto\nFrancesco Jovine\nEugenio Montale\n&#x27; Dante Alighieri\  degli animali\nun materiale artificiale\n\nLa bachelite è una resina termoindurente che fu sintetizzata per la prima volta nel 1907 dal chimico d\norigine belga Leo Baekeland da cui prende il nome. Si tratta quindi di un materiale artificiale (rispost:\nesatta -*), anzi della prima materia plastica prodotta industrialmente su larga scala a partire dagli ann\nVenti. La bachelite era usata, per esempio, per gli interruttori elettrici e i telefoni.\n\nSuggerimenti\n\n* Il migliore suggerimento per questo genere di domande è quello di leggere attentamente i princi\npali quotidiani nei mesi che precedono la prova di ammissione.\n\n* Anche nel caso delle domande di attualità, è utile ricordare che si tratta di domande a scelta multi\npla: ciò consente di procedere per eliminazione. Nel caso in cui non si conosca la risposta esatta, é\nutile eliminare le alternative palesemente errate in modo da ridurre il numero di risposte tra cui si é\nincerti e aumentare così la probabilità di individuare la risposta corretta scegliendo casualmente.\n\n6.4| Educazione civica\n\n| quesiti di educazione civica intendono verificare la conoscenza delle norme fondamentali che regola\nno la vita civile di ogni cittadino. Si tratta in primo luogo delle norme della Costituzione italiana, ché\nassumono un&#x27;importanza fondamentale nell&#x27;ambito delle fonti del diritto. A esse si affianca una serie d\naltre norme, contenute nei codici (civile, penale, processuale civile, processuale penale) e in altre leggi re\ncenti o particolarmente rilevanti (relative per esempio a sistemi elettorali, antitrust, privatizzazioni ecc.)\nGli argomenti più frequentemente oggetto di domande sono le cariche, gli organi istituzionali (Presiden\nte del Consiglio, Presidente della Repubblica, Corte Costituzionale ecc.), i trattati, gli organismi interna\nzionali, i diritti e doveri dei cittadini ecc.\n\nLe tipologie di domande più comuni sono le seguenti:\n\n* Lalegge/referendum... è relativa a ...\n\n* L&#x27;articolo ... della Costituzione prevede che ...\n\n* Quale organo/istituzione ha il compito di ... ?\n\n* L&#x27;ente... dipende da...\n\nEsempi</p></details>", "back": "", "conf": "low", "page": 334, "section": "6.4 Educazione civica", "num": 13, "_i": 55}, {"kind": "question", "src": "images/p334_b3.png", "front": "<img src='images/p334_b3.png' class='cardimg'><p class='q'>(English not filled yet)</p><details><summary>original (IT)</summary><p class='th-it'>1 Il titolo V della Costituzione italiana è stato oggetto di riforma costituzionale nel 2001. Su\nquale ambito verte?\n\nè Le garanzie poste per preservare la Costituzione\nL&#x27;ordinamento giurisdizionale\n| rapporti tra Governo italiano e Unione europea\nL&#x27;ordinamento degli Enti locali\n\n.-. I diritti e doveri dei cittadini in materia di rapporti etico-sociali\n\nIl titolo V della Costituzione italiana si trova nella parte seconda (Ordinamento della Repubblica), si inti-\ntola Le Regioni, le Province, i Comuni e comprende gli articoli 114-133. È stato riformato dalla legge co-\nstituzionale n. 3 del 2001, che ha introdotto il principio della “devolution” riformando l&#x27;ordinamento degl\nEnti locali, come correttamente indicato dall&#x27;alternativa</p></details>", "back": "", "conf": "low", "page": 334, "section": "6.4 Educazione civica", "num": 1, "_i": 56}, {"kind": "question", "src": "images/p335_b2.png", "front": "<img src='images/p335_b2.png' class='cardimg'><p class='q'>(English not filled yet)</p><details><summary>original (IT)</summary><p class='th-it'>2 Chi esercita le funzioni del Presidente della Repubblica, nel caso in cui egli non possa tran-\nsitoriamente adempierle?\nIl Presidente della Camera\nIl Presidente del Senato\nIl Presidente della Corte Costituzionale\nIl Vicepresidente della Repubblica\nIl Presidente del Consiglio dei Ministri\n\nPer espressa disposizione della Costituzione, tale compito spetta al Presidente del Senato (risposta f5}).\nDa notare che non esiste la carica di Vicepresidente della Repubblica e che sarebbe impossibile affidare\nla supplenza al Presidente del Consiglio: questi infatti detiene una carica politica, mentre la carica di Pre-\nsidente della Repubblica deve essere super partes.</p></details>", "back": "", "conf": "low", "page": 335, "section": "6.4.1 Il diritto italiano", "num": 2, "_i": 57}, {"kind": "question", "src": "images/p335_b3.png", "front": "<img src='images/p335_b3.png' class='cardimg'><p class='q'>(English not filled yet)</p><details><summary>original (IT)</summary><p class='th-it'>3 Gli Stati Uniti d&#x27;America sono una repubblica:\npresidenziale\nparlamentare\n(© popolare\noligarchica\nregionale\n\nGli Stati Uniti d&#x27;America sono una repubblica federale di tipo presidenziale, ossia una repubblica in cui il\nCapo dello Stato è anche Capo del Governo (risposta ‘|. ).</p></details>", "back": "", "conf": "low", "page": 335, "section": "6.4.1 Il diritto italiano", "num": 3, "_i": 58}, {"kind": "question", "src": "images/p335_b4.png", "front": "<img src='images/p335_b4.png' class='cardimg'><p class='q'>(English not filled yet)</p><details><summary>original (IT)</summary><p class='th-it'>4 Dove nacque il movimento di emancipazione femminile delle suffragette, sorto come\nmovimento nazionale volto a ottenere il diritto di voto per le donne?\nCanada\nRegno Unito\nFrancia\nStati Uniti\nGermania\n\nLe suffragette nacquero e si diffusero nel Regno Unito a partire dal 1869. Nel 1903 Emmeline Parkhurst\ndiede nuovo vigore al movimento, il cui risultato politico più notevole fu ottenuto nel 1919 con l&#x27;elezione\nal Parlamento britannico di Nancy Astor tra i conservatori. La risposta corretta è la (33.\n\nNei paragrafi seguenti vengono presentati alcuni argomenti che costituiscono un&#x27;utile base di studio per\n\naffrontare le domande dei test di ammissione inerenti gli argomenti di educazione civica.\n\n6.4.1 | Il diritto italiano\n\nVi sono due fondamentali categorie di diritto (inteso come ordinamento giuridico): il diritto privato e il di-\n\nritto pubblico.\n\nDiritto privato: comprende tutte le leggi che regolano i rapporti tra i soggetti privati (e anche tra privati\n\ned enti pubblici, quando questi ultimi agiscono in veste di privati). Il diritto privato conosce al suo interno\n\nle distinzioni di seguito riportate.\n\n* Diritto civile: leggi relative ai diritti della persona (nella vita privata), ai diritti di successione, ai diritti\nreali, alle obbligazioni.\n\n* Diritto commerciale: comprende alcune norme specifiche per l&#x27;attività delle imprese commerciali\n(la cui disciplina è comunque dettata per la maggior parte dal diritto civile).\n\n* Diritto dellavoro: norme che disciplinano il rapporto di lavoro subordinato e la legislazione sociale.\n\n* Diritto agrario: norme relative ai rapporti attinenti all&#x27;agricoltura.\n\n* Diritto industriale: norme sui brevetti, modelli, disegni industriali, prodotti e segni distintivi\ndell&#x27;azienda.</p></details>", "back": "", "conf": "low", "page": 335, "section": "6.4.1 Il diritto italiano", "num": 4, "_i": 59}, {"kind": "theory", "src": "images/p336_b1.png", "front": "<div class='kindlabel'>THEORY</div><img src='images/p336_b1.png' class='cardimg'><p class='th-en'>(English not filled yet)</p><details><summary>original (IT)</summary><p class='th-it'>Diritto pubblico: comprende le leggi che regolano l&#x27;organizzazione dello Stato e i rapporti tra lo Stato e\ngli enti pubblici, gli enti pubblici e i privati, e gli enti pubblici tra di loro.\nIl diritto pubblico si articola nelle seguenti distinzioni.\n\n* Diritto costituzionale: norme fondamentali dell&#x27;ordinamento giuridico, relative alle fonti del diritto,\nalla struttura e agli organi dello Stato.\n\n* Diritto amministrativo: norme che regolano l&#x27;attività degli organi della pubblica amministrazione\ne concernenti i rapporti tra questi organi e i privati.\n\n+ Diritto penale: norme che individuano e reprimono i fatti illeciti, comminando sanzioni penali.\n\n* Diritto finanziario: norme che regolano l&#x27;attività finanziaria dello Stato e degli altri enti pubblici.\n\n* Diritto tributario: norme che disciplinano i rapporti tra il fisco e i contribuenti.\n\n* Diritto processuale: norme che disciplinano i processi (penali e civili).\n\n* Diritto ecclesiastico: norme che disciplinano i rapporti dello Stato con le Chiese e le confessioni\nreligiose.\n\n+ Diritto della navigazione: norme che disciplinano la navigazione marittima e aerea.\n\n* Diritto pubblico internazionale: norme che regolano i rapporti tra Stati e tra gli Stati e le organiz-\nzazioni internazionali (è un diritto sovra-statale).\n\n6.4.2 | La struttura dello Stato italiano\n\nL&#x27;Italia è una Repubblica parlamentare costituzionale democratica. Se si accetta la tradizionale (e per la\nverità ormai antiquata) teoria della separazione dei poteri, si può dire che per lo Stato italiano vale in linea\ndi massima la seguente distinzione.\n\nPotere Organo a cui compete\n\nLegislativo Parlamento (Camera e Senato)\nEsecutivo Governo\nGiudiziario Magistratura\n\nIn Italia esiste anche un potere &quot;di controllo&quot;, che spetta al Presidente della Repubblica e alla Corte Costi-\ntuzionale.\n\nDi seguito, si propone una rassegna sintetica dei principali organi dello Stato.\n\nCapo dello Stato. È il presidente della Repubblica e rappresenta l&#x27;unità nazionale. È eletto dal Parlamen-\nto in seduta comune. Dura in carica sette anni.\n\nConsiglio dei Ministri. È un organo formato dal Presidente del Consiglio e dai Ministri.\n\nConsiglio Superiore della Magistratura. È un organo di autotutela dell’indipendenza della Magistratu-\nra. A esso spetta di deliberare assunzioni, trasferimenti e in genere tutti i provvedimenti, anche discipli-\nnari, nei confronti dei magistrati. Ne è Presidente il Capo dello Stato.\n\nCorpo elettorale. È l&#x27;insieme dei cittadini che hanno il diritto di voto. A essi spetta di eleggere i propri\nrappresentanti a livello nazionale e locale e di approvare o respingere i referendum. Si parla di elettorato\nattivo per indicare il possesso dei requisiti che conferiscono il diritto di voto, e di elettorato passivo per in-\ndicare il possesso dei requisiti che conferiscono la capacità di essere eletti.\n\nCorte Costituzionale. È l&#x27;organo che giudica la conformità delle leggi ordinarie alla Costituzione.\n\nCorte dei Conti. È l&#x27;organo che esercita in via preventiva il controllo di legittimità sugli atti del Governo\ne in via successiva il controllo sulla gestione del bilancio dello Stato e di altri enti pubblici.\n\nGiudici di pace, Tribunali, Corti d&#x27;Appello, Corte di Cassazione. Sono gli organi che esercitano il pote-\nre giudiziario, ripartito a seconda della competenza di ciascuno. Importante è la distinzione: 1) tra giuri-\nsdizione civile (giudica sul diritto privato), penale (giudica sul diritto penale) e amministrativa (vedi alla vo-\nce TAR); 2) tra giurisdizione di merito (giudica la sostanza delle questioni) e di /Jegittimità (giudica la\nregolarità dei processi ed è una prerogativa esclusiva della Corte di Cassazione).</p></details>", "back": "", "conf": "low", "page": 336, "section": "6.4.2 La struttura dello Stato italiano", "num": null, "_i": 60}, {"kind": "theory", "src": "images/p337_b1.png", "front": "<div class='kindlabel'>THEORY</div><img src='images/p337_b1.png' class='cardimg'><p class='th-en'>(English not filled yet)</p><details><summary>original (IT)</summary><p class='th-it'>Governo (Presidente del Consiglio, Consiglio dei Ministri, Ministri). Esercita il potere esecutivo. È espres-\nsione della maggioranza parlamentare, di cui gode la fiducia.\n\nMinistri. Sono organi che dirigono le varie branche della Pubblica Amministrazione e partecipano\nall&#x27;esercizio dei poteri del Governo. | Ministri possono essere con portafoglio (a capo di un Dicastero) o\nsenza portafoglio. Il numero dei primi può essere variato solo con legge, mentre per i secondi è sufficiente\nla nomina del Capo dello Stato, su proposta del Presidente del Consiglio.\n\nParlamento (Camera e Senato). Il Parlamento detiene essenzialmente il potere legislativo, che esercita\ntramite l&#x27;emanazione di leggi ordinarie. Esso si compone di due camere: la Camera dei Deputati (630\nmembri) e il Senato della Repubblica (315 membri più i senatori a vita).\n\nPresidente del Consiglio. Dirige la politica generale del Governo.\n\nTAR. Acronimo che indica i Tribunali Amministrativi Regionali, i quali giudicano i conflitti insorti tra la\nPubblica Amministrazione e i privati che si ritengono lesi nei loro interessi da un atto della Pubblica Am-\nministrazione. | TAR giudicano le controversie in primo grado, mentre in appello giudica il Consiglio di\nStato; non è previsto in questi casi un giudizio di legittimità.\n\n6.4.3 | L&#x27;Unione Europea\n\nUnione Europea (UE) è il nome assunto l&#x27;1/11/1993 dalla Comunità Economica Europea (CEE). Quest&#x27;ulti-\nma fu istituita nel 1957 con il Trattato di Roma, il quale completava alcuni trattati stipulati precedente-\nmente, per ragioni economiche, da un piccolo gruppo di nazioni europee.\n\nLa genesi dell&#x27;Unione Europea si può dunque riassumere così:\n\n1951: istituzione della CECA, Comunità Europea del Carbone e dell&#x27;Acciaio.\n\n1957: istituzione della CEEA (Comunità Europea dell&#x27;Energia Atomica, detta anche Euratom) e\ndella CEE (Comunità Economica Europea, diretta a favorire la libera circolazione di merci\ne persone).\n\n1993: istituzione della UE, la quale, secondo il trattato di Maastricht, “è fondata” sulle Comunità\neuropee.\n\n2004: allargamento della Ue con l&#x27;ingresso di 10 nuovi Stati, in gran parte legati al blocco sovie-\ntico.\n\n2016 con un referendum popolare il Regno Unito decide di uscire dalla UE.\n\nL&#x27;UE si occupa di tutti i settori economico-sociali degli Stati membri. Attualmente raggruppa 27 Stati: Au-\nstria, Belgio, Bulgaria, Cipro, Croazia, Danimarca, Estonia, Finlandia, Francia, Germania, Grecia, Irlanda, Ita-\nlia, Lettonia, Lituania, Lussemburgo, Malta, Paesi Bassi, Polonia, Portogallo, Repubblica Ceca, Romania,\nSlovacchia, Slovenia, Spagna, Svezia e Ungheria. Gli organi principali della UE sono:\n\n»- la Commissione europea, con funzioni consultive e in minor misura decisionali;\n- il Consiglio europeo, con funzioni deliberative;\n\n- il Parlamento europeo, con funzioni deliberative e di controllo;\n\n» la CortediGiustizia, che giudica sul trattato istitutivo della Comunità;\n\n+ la Cortedeiconti, che effettua il controllo generale sulle entrate e sulle spese.\n\n6.4.4 | L&#x27;ONU (Organizzazione delle Nazioni Unite)\n\nÈ stata fondata nel 1945, con lo scopo di mantenere la pace e la sicurezza degli Stati e promuovere la co-\noperazione internazionale economica, sociale, culturale, umanitaria. Nel 2019 raggruppa 193 Stati. | suoi\norgani principali sono:\n\n- l’Assemblea generale;\n\n- il Consiglio di sicurezza;\n\n. ilSegretariato;\n\n» il Consiglio economico e sociale;\n\n» la Corte internazionale di giustizia.</p></details>", "back": "", "conf": "low", "page": 337, "section": "6.4.3 L'Unione Europea", "num": null, "_i": 61}, {"kind": "theory", "src": "images/p338_b1.png", "front": "<div class='kindlabel'>THEORY</div><img src='images/p338_b1.png' class='cardimg'><p class='th-en'>(English not filled yet)</p><details><summary>original (IT)</summary><p class='th-it'>| suoi organi sussidiari sono:\n\n.\n\nl&#x27;UNCTAD: Conferenza sul commercio e lo sviluppo;\nl’UNPD: Programma per lo sviluppo;\n\nVUNICEF: Fondo per l&#x27;infanzia;\n\nl’UNHCR: Alto Commissariato per i rifugiati;\n\nIl&#x27;UNITAR: Istituto per l&#x27;insegnamento e la ricerca.\n\nVi sono poi numerose organizzazione internazionali collegate all&#x27;ONU, tra cui:\n\nFAO: Organizzazione per l&#x27;Alimentazione e l&#x27;Agricoltura (Roma).\n\nIAEA: Agenzia Internazionale per l&#x27;Energia Atomica (Vienna).\n\nIBRD: Banca Internazionale per
