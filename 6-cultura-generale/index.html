ammissione.\n\nEsempi</p></details>", "back": "", "conf": "low", "page": 342, "section": "6.6 Conoscenze socioeconomiche", "num": null, "_i": 75}, {"kind": "question", "src": "images/p342_b2.png", "front": "<img src='images/p342_b2.png' class='cardimg'><p class='q'>(English not filled yet)</p><details><summary>original (IT)</summary><p class='th-it'>1 Quale indicatore misura in modo più adeguato il grado di indebitamento di uno Stato e la\nsua gravità?\nDebito pubblico/saldo di bilancia commerciale\n: Debito pubblico/PIL\nDisavanzo pubblico/PIL\nDisavanzo pubblico/tasso di sconto\n\n. Debito pubblico/saldo di bilancia dei pagamenti\n\nLa risposta esatta è la\n\nInfatti il rapporto in questione rappresenta teoricamente il numero di anni (o frazione di anno, se minore\ndi 1) che uno Stato impiegherebbe a ripagare i propri debiti se l&#x27;intera ricchezza nazionale prodotta in un\nanno venisse dedicata al rimborso del debito.\n\nRapportare il debito a uno dei saldi della bilancia dei pagamenti (alternative .. ed.) non ha senso in\nquanto due Paesi con uguale debito potrebbero avere diversi saldi, ma non per questo essere meno “ca-\npaci” di rimborsare il debito.\n\nAnalogamente, le alternative © e. sono errate in quanto il disavanzo pubblico non fornisce alcuna in-\ndicazione circa l&#x27;indebitamento complessivo di uno Stato, ma solo di quanto quest&#x27;ultimo cresce in un\nanno.</p></details>", "back": "", "conf": "low", "page": 342, "section": "6.6 Conoscenze socioeconomiche", "num": 1, "_i": 76}, {"kind": "question", "src": "images/p343_b2.png", "front": "<img src='images/p343_b2.png' class='cardimg'><p class='q'>(English not filled yet)</p><details><summary>original (IT)</summary><p class='th-it'>2 ne cosa è una “società a responsabilità limitata” (S.r.l.)?\n\n* Una società i cui soci sono responsabili esclusivamente nei confronti degli altri soci e non dei\nterzi\nUna società i cui soci non sono responsabili penalmente per gli eventuali reati commessi in\nnome della società\nUna società i cui soci sono responsabili soltanto limitatamente al capitale inizialmente versato\n\n) Una società i cui soci sono responsabili soltanto limitatamente alle obbligazioni nei confronti\ndei lavoratori dipendenti\nNessuna delle precedenti\n\nLa risposta esatta è la .*. Infatti, una S.r.l. è una società di capitali e, in quanto tale, è una società i cui i soci\nsono responsabili soltanto limitatamente alla quota di capitale sociale detenuta.\n\nLe principali forme di società di capitali previste dal diritto italiano sono la società per azioni (S.p.A.), la\nsocietà a responsabilità limitata (S.r.l.) e la società in accomandita per azioni (S.a.p.a.).</p></details>", "back": "", "conf": "low", "page": 343, "section": "6.6 Conoscenze socioeconomiche", "num": 2, "_i": 77}, {"kind": "question", "src": "images/p343_b3.png", "front": "<img src='images/p343_b3.png' class='cardimg'><p class='q'>(English not filled yet)</p><details><summary>original (IT)</summary><p class='th-it'>3 Come si può misurare il grado di terziarizzazione di un sistema economico?\nCon il rapporto fra numero di lavoratori autonomi e numero di lavoratori dipendenti (che\nlavorano per conto di terzi)\n; Con il rapporto fra produzione industriale e produzione agricola\n. Con il rapporto fra numero di occupati nel settore dei servizi e totale degli occupati\n} Con il tasso di crescita del PIL\nCon il rapporto fra numero di disoccupati e numero di occupati nel settore industriale\n\nIl grado di terziarizzazione indica il peso del settore dei servizi nell&#x27;ambito di un sistema economico.\nEsso può dunque essere correttamente misurato rapportando il numero di occupati in tale settore sul to-\ntale degli occupati (risposta (* ). Tutte le rimanenti alternative sono palesemente errate.</p></details>", "back": "", "conf": "low", "page": 343, "section": "6.6 Conoscenze socioeconomiche", "num": 3, "_i": 78}, {"kind": "question", "src": "images/p343_b4.png", "front": "<img src='images/p343_b4.png' class='cardimg'><p class='q'>(English not filled yet)</p><details><summary>original (IT)</summary><p class='th-it'>4 Che cosa si intende con l’espressione “economia sommersa”?\nLe attività produttive svolte sotto il livello del mare\n\nLe attività produttive svolte dagli artigiani\n\nIl fenomeno dell&#x27;evasione fiscale\n\nIl lavoro nero\n\nNessuna delle precedenti\n\nLa risposta esatta è la ‘#1. Infatti, con l&#x27;espressione “economia sommersa” si intende il complesso di attività\nproduttive che sfugge deliberatamente alla rilevazione statistica.\n\nPer esempio, il lavoro nero, ossia il lavoro retribuito prestato da pensionati, casalinghe e studenti, e i se-\ncondi (o doppi) lavori non dichiarati.</p></details>", "back": "", "conf": "low", "page": 343, "section": "6.6 Conoscenze socioeconomiche", "num": 4, "_i": 79}, {"kind": "question", "src": "images/p343_b5.png", "front": "<img src='images/p343_b5.png' class='cardimg'><p class='q'>(English not filled yet)</p><details><summary>original (IT)</summary><p class='th-it'>5 Cosa si intende con l’espressione “biglietto verde”?\nOgni tipo di banconota cartacea\nè È uno strumento finanziario per la regolamentazione dei prezzi nell’ambito della Politica\nAgraria Comunitaria\n© Una cambiale\nUna banconota da 1 dollaro USA\nè La carta di credito American Express\n\nLa risposta esatta è la ‘:.. Il “biglietto verde” per antonomasia è la banconota da 1 dollaro statunitense,\ncosì importante e “familiare” nell&#x27;economia mondiale: l&#x27;espressione deriva dal colore della carta moneta.\nL&#x27;alternativa --, invece, è invece la descrizione di uno strumento della PAC (Politica Agraria Comunitaria)\nchiamato “moneta verde”.</p></details>", "back": "", "conf": "low", "page": 343, "section": "6.6 Conoscenze socioeconomiche", "num": 5, "_i": 80}, {"kind": "theory", "src": "images/p344_b1.png", "front": "<div class='kindlabel'>THEORY</div><img src='images/p344_b1.png' class='cardimg'><p class='th-en'>(English not filled yet)</p><details><summary>original (IT)</summary><p class='th-it'>1 [Glossario dei termini giuridici e socioeconomici\n\nsente glossario vuole essere un&#x27;utile base di riferimento per i quesiti relativi alle conoscenze giuridi\nsocioeconomiche previsti nella prova di ammissione. Tale elenco, pur non avendo la pretesa di es\n‘completo ed esaustivo, include i termini più frequenti di cui è richiesta la conoscenza nelle prove d\n\none adottate dalle università.\n\n: Imposta di fabbricazione.\n\nportamento: ripartizione in più periodi amministrati-\n(anni) della spesa sostenuta per l&#x27;acquisto delle im-\nobilizzazioni allo scopo di frazionare i costi plurien-\nli sugli esercizi durante i quali verranno utilizzati.\n\nnistrazione locale: insieme degli enti che opera-\n&gt; in un ambito territoriale circoscritto e che com-\n‘ende gli Enti Territoriali (Regioni, Province e Co-\nuni), gli Enti Sanitari (unità sanitarie locali, istituti e\nniche universitarie) e gli altri enti locali (Camere di\n,ymmercio, università, enti portuali ed enti lirici).\n\nnistrazione pubblica: apparato distinto in tre sot-\nsettori: l&#x27;Amministrazione centrale (Ministeri, or-\nini costituzionali, Cassa depositi e prestiti, ANAS\n‘c.), &amp; Amministrazione locale (Regioni, Province,\naMuni, ecc.) ed Enti di previdenza (INPS, INAIL, IN-\nDAP ecc.).\n\nli libero scambio: nasce dall&#x27;accordo tra due o più\nlesi per eliminare le dogane e le altre barriere com-\nerciali interne. A differenza che in una comunità\ntegrata come @° l&#x27;UE, ogni Paese che fa parte di\nv&#x27;area di libero scambio è libero di adottare nei ri-\njardi dei Paesi non associati proprie misure. Sono\nJempi di aree di libero scambio il &amp; NAFTA e &amp;\nFTA.\n\nno: titolo di credito, all&#x27;ordine o al portatore, che\njò contenere un ordine alla banca di pagare una\nterminata somma a una determinata persona (as-\ngno bancario) ovvero una promessa di pagamen-\ndella banca stessa (assegno circolare).\n\ntà: insieme dei beni economici a disposizione del\nggetto aziendale in un dato momento.\n\ne: certificato che rappresenta una quota del &lt;&amp;” ca-\ntale sociale di una &lt;&amp;” S.p.A. (Società per azioni) o di\n1a S.a.p.a. (Società in accomandita per azioni); con-\nrisce al proprietario il diritto di voto all&#x27;assemblea\ngli azionisti.\n\n| Centrale: è l&#x27;istituzione bancaria che sta al centro\n| sistema finanziario di un Paese. | suoi compiti\nincipali riguardano il controllo del sistema banca-\n9, l&#x27;emissione della moneta legale, la gestione della\n&gt; politica monetaria e la gestione della politica va-\ntaria. In Italia la banca centrale è la Banca d&#x27;Italia.\n\nInternazionale per la Ricostruzione e lo Svilup-\np: nota anche con il nome di Banca Mondiale, fu costi-\nita nel luglio del 1944 dai 44 Paesi partecipanti alla\ninferenza di Bretton Woods delle Nazioni Unite. Sco-\n9 della Banca è promuovere l&#x27;investimento di capitale\nor la ricostruzione (finalità peculiare del primi anni del\nopoguerra) e lo sviluppo economico dei Paesi mem-\nÎì\n\njanca Europea per gli Investimenti): istituto di\nedito con sede in Lussemburgo, costituito nel\n957 per contribuire, mediante la concessione di\n\nprestiti e di garanzie, al finanziamento di progetti ri\nguardanti le regioni meno sviluppate della &lt; CEI\n(ora UE).\n\nBeni pubblici: insieme dei beni appartenenti alla pub\n\nblica amministrazione.\n\nBilancia dei pagamenti: è un insieme di conti che regi\n\nstrano gli scambi intercorsi fra residenti di un siste\n\nma economico e non residenti, in un dato periodo d\n\ntempo. Le tre sezioni in cui è suddivisa la bilancia de\n\npagamenti sono:\n\n* la sezione partite correnti, la quale registra le tran\nsazioni di merci e servizi e i trasferimenti unilaterali\n\n* la sezione &amp;movimentidi capitali, la quale registra\nflussi relativi a investimenti finanziari con i non resi\ndenti;\n\n* la sezione @° movimenti monetari, la quale regi\nstra tutti i movimenti internazionali di valute e ca\npitali effettuate dalle autorità monetarie (nel casc\nitaliano Banca d&#x27;Italia e Ufficio Italiano Cambi) alle\nscopo di compensare il risultato netto determina\nto dagli scambi registrati nelle due parti prece\ndenti.\n\nBilancio consolidato: bilancio relativo a un gruppo d\n\nimprese, ovvero bilancio redatto da una società che\ndetiene @° partecipazioni in altre società. Obiettivc\ndi tale bilancio è quello di rappresentare la situazio\nne economica di un gruppo di imprese quando le re\nlazioni tra le medesime sono tali che non sarebbe al\ntrimenti significativo esaminare separatamente\nbilanci delle singole società che compongono i\ngruppo in esame. Il bilancio di gruppo viene costru\nito mediante una procedura di consolidamento, che\ncomporta l&#x27;aggregazione in un unico &amp; stato patri:\nmoniale e in un solo @ conto economico di tutti gl\nstati patrimoniali e i conti economici delle società\nche sono oggetto di consolidamento.\n\nBilancio d&#x27;esercizio: documento consuntivo (compilato\n\na fine anno) composto dallo @ stato patrimoniale,\ndal @° conto economico e dalla nota integrativa. È\ninoltre corredato da una relazione sulla gestione e\nrappresenta la situazione patrimoniale e finanziaria\ndella società nonché il risultato economico riferito\nall&#x27;esercizio considerato.\n\nBilancio pluriennale a legislazione vigente: introdot-\n\nto nel 1978, si riferisce a un periodo tra i tre e i cinque\nanni (normalmente viene compilato relativamente a\nun triennio) e descrive l&#x27;evoluzione prevista della fi-\nnanza pubblica in assenza di interventi correttivi\n(normalmente effettuati mediante la @” /egge finan-\nziaria). Viene presentato ogni anno, aggiornandolo e\nintegrandolo anche alla luce del bilancio annuale.\n\nBilancio pluriennale programmatico: indica quella che\n\ndeve essere la dinamica degli aggregati di finanza\npubblica secondo gli obiettivi di politica economica\nenunciati del @ DPEF.</p></details>", "back": "", "conf": "low", "page": 344, "section": "6.6.1 Glossario dei termini giuridici e socioeconomici", "num": null, "_i": 81}, {"kind": "theory", "src": "images/p345_b1.png", "front": "<div class='kindlabel'>THEORY</div><img src='images/p345_b1.png' class='cardimg'><p class='th-en'>(English not filled yet)</p><details><summary>original (IT)</summary><p class='th-it'>Bilancio dello Stato: è il documento che registra tutte le\nentrate e tutte le spese dello Stato e degli enti pub-\nblici in un esercizio finanziario. Entrambe le parti\n(entrate e spese) sono a loro volta suddivise in titoli,\ncategorie, rubriche e capitoli.\n\nLe entrate nel bilancio dello Stato sono suddivise in\nquattro titoli: entrate tributarie (riscossione delle im-\nposte e delle tasse), entrate extratributarie (contribu-\nti obbligatori, multe, ammende, dazi doganali, pro-\nventi dei servizi pubblici ecc.), alienazione di beni e\nriscossione di crediti e accensione di prestiti (emissio-\nne di titoli del debito pubblico).\n\nLe spese sono invece suddivise in tre titoli: spese cor-\nrenti (spese per il personale, contributi, sussidi, pen-\nsioni di guerra e ammortamenti di beni patrimonia-\nli); spese in conto capitale (spese per investimenti e\nper l&#x27;acquisizione di partecipazioni); spese per rim-\nborso prestiti (prestiti pubblici come BoT, BTp, CeT\necc. e i mutui contratti con istituti di credito). Il bilan-\ncio dello Stato si suddivide in bilancio di cassa, nel\nquale sono riportate le entrate effettivamente ri-\nscosse e le spese effettivamente pagate, e bilancio di\ncompetenza, nel quale sono riportate le entrate che\nlo Stato ha diritto a riscuotere e le spese che si è im-\npegnato a erogare. Vi è un altro criterio di distinzio-\nne relativamente al bilancio dello Stato: il bilancio di\nprevisione è quello preventivo mentre il rendiconto è\nquello consuntivo.\n\nBoom: nel linguaggio giornalistico-economico, viene\nutilizzato questo termine inglese quando si vuole in-\ndicare una fase di forte espansione economica.\n\nBorsa Valori: mercato organizzato per la compravendita\ndi valori mobiliari (azioni, obbligazioni ecc.) o altro,\nal quale possono accedere solo operatori specializ-\nzati. Le operazioni avvengono secondo una proce-\ndura precisa e rigorosa e i prezzi vengono registrati\nin un apposito listino, avente carattere ufficiale.\n\nBoT (Buoni ordinari del Tesoro): titoli rappresentativi\ndel prestito che l&#x27;acquirente (cittadino, impresa,\nbanca ecc.) concede allo Stato, ossia all’emittente\ndei titoli (Ministero del Tesoro). Rispetto agli altri ti-\ntoli di Stato, i BoT sono a breve scadenza (3, 6, 12 me-\nsi) e non hanno cedole.\n\nBudget: bilancio di previsione di un&#x27;impresa o di un cer-\nto progetto di ” investimento. Si tratta di uno stru-\nmento di previsione e di programmazione dell&#x27;atti-\nvità di un&#x27;impresa.\n\nCapacità produttiva: quantità massima di prodotto che\npuò essere ottenuta, a livello di impianto, di singola\nimpresa, di settore industriale o di intero sistema\neconomico, utilizzando i fattori produttivi disponibi-\nli e dati i vincoli tecnici, economici e istituzionali con-\nnessi al loro impiego.\n\nCapitale: nel Medioevo si intendeva con “credito princi-\npale” o “capitale” (dal latino caput, capo e, quindi,\nprincipale) la somma che generava interessi, per di-\nstinguerlo dal “credito derivato” costituito dagli inte-\nressi stessi. Il termine viene utilizzato nell&#x27;accezione\nmoderna con significati sovente diversi fra di loro:\ngenerico potere d&#x27;acquisto, totalità delle risorse fi-\nnanziarie generanti un guadagno nel tempo (capita-\nle finanziario), capitale preso a prestito (capitale di\n\ndebito), capitale investito dagli azionisti (capitale\nproprio), totale delle attrezzature e degli impianti\n(capitale tecnico), insieme delle risorse utilizzate in\nun solo ciclo produttivo (capitale circolante) e di\nquelle destinate a essere utilizzate per più cicli pro-\nduttivi (capitale immobilizzato o fisso).\n\nCapitale sociale: entità numerica che esprime il valore\nin denaro dei conferimenti risultante dall&#x27;atto costi-\ntutivo. È un valore storico che rappresenta la parte di\n«&amp;” patrimonio netto non distribuibile fra i soci.\n\nCapital-gain: (guadagno in conto capitale) guadagno\nconnesso alla differenza fra prezzo di acquisto di un\nbene patrimoniale e prezzo di vendita dello stesso.\n\nCapitalismo: secondo l’interpretazione teorica preva-\nlente, è un sistema economico e sociale fondato sul-\nla proprietà privata dei mezzi di produzione e sul la-\nvoro salariato che viene scambiato sul mercato\ncome le altre merci.\n\nCartello: patto tra imprese per limitare la concorrenza\nmediante accordi su prezzi e mercati di competenza\nnell&#x27;ambito di un settore.\n\nCECA (Comunità Europea del Carbone e dell&#x27;Acciaio):\nistituita nel 1951 per promuovere l&#x27;integrazione eco-\nnomica dei Paesi europei nei settori del carbone e\ndell&#x27;acciaio; nel 1967 è stata ricompresa nella @&gt; CEE.\n\nCedola: tagliando staccabile da un titolo obbligazionario\nche rappresenta il diritto del proprietario a incassare\nuna somma corrispondente al reddito di tale titolo.\n\nCEE (Comunità Economica Europea): comunità che\nraggruppava 12 Paesi europei (Belgio, Francia, Ger-\nmania, Irlanda, Gran Bretagna, Paesi Bassi, Lussem-\nburgo, Danimarca, Grecia, Spagna, Portogallo, Italia).\nFu istituita con il Trattato di Roma entrato in vigore\nnel 1958. La CEE era prima di tutto un&#x27;unione doga-\nnale priva di tariffe e restrizioni commerciali interne\ntra i Paesi aderenti, caratterizzata da una politica\ncommerciale comune nei confronti dei Paesi esterni.\nProgressivamente, fra i Paesi della Comunità, sono\nstati rimossi tutti i vincoli alla libera circolazione di\npersone, merci, servizi e capitali. La CEE (il cui organo\nesecutivo permanente è la Commissione, mentre le\ndecisioni politiche spettano al Consiglio dei Ministri e\nuna supervisione generale è esercitata dall&#x27;Assem-\nblea Parlamentare Europea) ha sviluppato un&#x27;amplis-\nsima gamma di attività nel campo della politica agri-\ncola comune, della politica industriale,\ndell’armonizzazione delle legislazioni nazionali e\ndella politica monetaria (@? ECU, SME). Con l&#x27;appro-\nvazione e la successiva ratifica da parte dei Dodici\ndel Trattato di Maastricht (1991), si sono stabiliti i cri-\nteri per un ulteriore rafforzamento del processo di\nunificazione non solo nel campo economico-mone-\ntario, ma anche in quello politico-sociale. La CEE si è\ncosì trasformata, dal 1° gennaio 1994, in Unione Eu-\nropea (@” UE).\n\nCGIL (Confederazione Generale Italiana dei Lavora-\ntori): organizzazione sindacale costituita nel 1944\ndalla convergenza dalle maggiori componenti poli-\ntico-sindacali dell&#x27;epoca. Dal 1948, in seguito alla\nscissione che avrebbe portato alla costituzione di\n@ CISL e &amp; UIL, nella CGIL sono rimaste le compo-\nnenti comunista e socialista.</p></details>", "back": "", "conf": "low", "page": 345, "section": "6.6.1 Glossario dei termini giuridici e socioeconomici", "num": null, "_i": 82}, {"kind": "theory", "src": "images/p346_b1.png", "front": "<div class='kindlabel'>THEORY</div><img src='images/p346_b1.png' class='cardimg'><p class='th-en'>(English not filled yet)</p><details><summary>original (IT)</summary><p class='th-it'>CIPE (Comitato Interministeriale per la Programma-\nzione Economica): organo direttivo in ambito eco-\nnomico e finanziario di cui fanno parte il Presidente\ndel Consiglio e i Ministri economici.\n\nCircolante: tutte le banconote e le monete che circolano\ncome mezzi di pagamento.\n\nCISL (Confederazione Italiana Sindacati dei Lavora-\ntori): organizzazione sindacale fondata nel 1950,\ndalle componenti democratico-cristiane che aveva-\nno lasciato la &amp;? CGIL nel 1948.\n\nConfindustria (Confederazione Generale Italiana\ndell&#x27;Industria): organizzazione sindacale degli im-\nprenditori industriali. Tutela gli interessi dei suoi\nmembri nei confronti dei sindacati dei lavoratori e\ndel Governo.\n\nCongiuntura economica: insieme delle condizioni che\ncaratterizzano l&#x27;attività economica di un Paese o di\nun settore produttivo in un dato momento.\n\nCONSOB (Commissione Nazionale per le Società e la\nBorsa): organo di vigilanza sulle società per azioni\nquotate nelle &gt; borse valori, su queste ultime e sui\nsoggetti che vi operano (società quotate, agenti di\ncambio, società di intermediazione mobiliare).\n\nContabilità nazionale: è un sistema con cui si descrivo-\nno in termini quantitativi e in forma contabile le atti-\nvità economiche e finanziarie di un Paese.\n\nConto economico: prospetto di bilancio che pone a\nconfronto i costi e i ricavi di un periodo amministra-\ntivo per la determinazione del risultato economico\nd&#x27;esercizio.\n\nContributo: particolare tipo di ce” tributo, nel quale la\nprestazione pecuniaria costituisce il corrispettivo di\nun&#x27;attività amministrativa svolta da un ente pubbli-\nco a vantaggio dell&#x27;intera collettività, di cui beneficia\nperò in modo particolare il privato pagante in conse-\nguenza di cose possedute o di attività svolte che ge-\nnerino una spesa pubblica.\n\nDazio doganale: tributo imposto sui beni importati al\nloro transitare sulla linea doganale.\n\nDebito estero: debito che un Paese ha contratto con il\nresto del mondo.\n\nDebito pubblico: indica il totale dell&#x27;indebitamento che\nil settore pubblico ha accumulato nei confronti dei\nsoggetti interni e degli operatori esteri per coprire il\nproprio ? fabbisogno.\n\nDecentramento fiscale: termine con il quale si intende\nil passaggio da un sistema fiscale accentrato a uno in\ncui la gestione delle entrate tributarie e le decisioni\ndi imposizione fiscale ricadono maggiormente sugli\nenti locali. In Italia, dopo la riforma del 1974 che ave-\nva creato un sistema fortemente accentrato, si è as-\nsistito negli anni seguenti al passaggio a un sistema\nche prevede sempre meno la ripartizione dei fondi\nattraverso trasferimenti dal centro e sempre più la\npossibilità di autosostentamento degli enti locali.\n\nDeflazione: periodo di riduzione del livello assoluto del-\nla produzione e del «&amp;” reddito. Si differenzia dal ter-\nmine c&amp; recessione per l&#x27;accento posto sulle scelte di\n&amp; politica economica che hanno determinato il ral-\nlentamento nello sviluppo. Nonostante la comune\n\nradice etimologica, deflazione non è il contrario di\n&lt;&amp;? inflazione; infatti i due fenomeni possono coesi-\nstere nelle fasi di ce? stagflazione.\n\nDepressione: è la fase del ciclo economico, altrimenti\ndetta «e recessione, caratterizzata da uno sviluppo\nnegativo o inferiore al normale di una grandezza\neconomica, solitamente del «&gt; PIL. Nella pratica si è\nsoliti parlare di depressione o recessione quando il\ntasso di crescita del PIL è negativo per due trimestri\nconsecutivi.\n\nDeregulation: processo di eliminazione di norme legi-\nslative e di regolamenti precedentemente imposti ai\ndiversi settori economici.\n\nDisavanzo pubblico: si ha un disavanzo pubblico (0\ndeficit) quando la differenza fra entrate (correnti e in\nconto capitale) e uscite (correnti e in conto capitale)\ndella pubblica amministrazione nel corso di un eser-\ncizio (un anno) è negativa. Un disavanzo va finanzia-\nto e come tale può creare nuovo ce? debito pubblico.\n\nDisoccupazione: indica la situazione in cui si trovano le\n&amp; forze di lavoro prive di impiego. Può essere volon-\ntaria, quando le persone non lavorano ma potreb-\nbero trovare occupazione ai livelli di remunerazione\ncorrenti. Può essere involontaria, quando le persone\nsarebbero disposte a lavorare ai tassi di salario cor-\nrenti ma non riescono a trovare impiego. Il tasso di\ndisoccupazione è generalmente dato dal rapporto\nfra numero di disoccupati e numero di persone rien-\ntranti nelle forze di lavoro.\n\nDividendo: singola quota della parte dell&#x27;utile d&#x27;impre-\nsa disponibile per essere distribuita ai soci.\n\nDPEF (Documento di programmazione economico-fi-\nnanziaria): è un documento che determina gli\nobiettivi che devono informare le manovre di bilan-\ncio nel periodo contemplato dal bilancio\npluriennale; costituisce quindi il termine di riferi-\nmento per il bilancio dello Stato e deve essere pre-\nsentato entro il 15 maggio di ogni anno.\n\nDuopolio: situazione di mercato caratterizzata dalla pre-\nsenza di due soli produttori-venditori del medesimo\nbene o servizio.\n\nEconomia di mercato: sistema economico nel quale la\nproduzione di beni e servizi è affidata all&#x27;iniziativa\nprivata, con la libertà dei consumatori di esprimere\nle proprie domande sul mercato e dei produttori di\nsoddisfarle. Si contrappone in genere al termine eco-\nnomia di Stato o economia pianificata, dove la produ-\nzione è affidata a imprese controllate dallo Stato che\nagiscono secondo piani prestabiliti e dettati dagli\norgani centrali dell&#x27;amministrazione pubblica (così\nera per esempio nei Paesi socialisti dell&#x27;Est Europa).\n\nEconomia sommersa: complesso di attività di produzio-\nne e di utilizzazione del prodotto che sfugge delibe-\nratamente alla rilevazione statistica. Rientrano per\nesempio in questa categoria il cosiddetto lavoro ne-\nro, ossia i secondi (o doppi) lavori non dichiarati e il\nlavoro retribuito ma non registrato prestato da pen-\nsionati, casalinghe, studenti e stranieri non residenti.\n\nECU (European Currency Unit): unità monetaria (con-\nvenzionale) europea. L&#x27;ECU è costituito da un panie-\nre di monete dei Paesi della &lt;° UE, la cui quota fissa</p></details>", "back": "", "conf": "low", "page": 346, "section": "6.6.1 Glossario dei termini giuridici e socioeconomici", "num": null, "_i": 83}, {"kind": "theory", "src": "images/p347_b1.png", "front": "<div class='kindlabel'>THEORY</div><img src='images/p347_b1.png' class='cardimg'><p class='th-en'>(English not filled yet)</p><details><summary>original (IT)</summary><p class='th-it'>nel paniere stesso dipende dal peso, a livello euro-\npeo, del reddito nazionale e del commercio intraco-\nmunitario dei singoli Paesi. Con l&#x27;approvazione del\nTrattato di Maastricht, che stabilisce le tappe per il\nprocesso di unione economica e monetaria, l&#x27;ECU\naveva assunto una rilevanza ancora superiore. Infat-\nti, una delle tappe prevedeva l&#x27;adozione dell&#x27;ECU co-\nme c«&amp;° moneta unica da parte dei Paesi europei. Al\nvertice di Madrid del dicembre 1995 la scelta per\nquesto ruolo è invece caduta ce” sull&#x27;Euro.\n\nEFTA (European Free Trade Association): associazione\neuropea di libero scambio costituita nel 1960 con la\nconvenzione di Stoccolma quale risposta alla creazio-\nne della &lt;&gt; CEE. Dopo l&#x27;uscita di Gran Bretagna, Dani-\nmarca, Portogallo, Austria, Finlandia e Svezia (che\nhanno aderito alla Comunità Europea), i suoi membri\nsi sono ridotti a tre (Svizzera, Islanda e Norvegia).\n\nElusione fiscale: sistema adottato dai contribuenti per\npagare meno imposte operando una riduzione della\nbase imponibile con artifici non vietati dalla legge.\nL&#x27;elusione fiscale si distingue «” dall&#x27;evasione in\nquanto, pur avendo il medesimo scopo, non consi-\nste in violazioni di leggi e quindi non provoca la\ncomminazione di sanzioni.\n\nEntrate pubbliche: insieme di risorse che affluiscono al-\nlo Stato e agli altri enti pubblici per far fronte al pro-\nprio fabbisogno finanziario. La maggior parte delle\nentrate proviene dal ricorso al prestito pubblico, dal\nprelevamento delle imposte, dall&#x27;emissione di mo-\nneta. Le entrate pubbliche possono essere ordinarie\no straordinarie (in base alla loro ripetibilità nel tem-\npo), originarie o derivate (in relazione alla fonte dalla\nquale provengono), di diritto privato o di diritto\npubblico (sotto il profilo giuridico).\n\nErosione fiscale: riduzione della base imponibile a se-\nguito di esenzioni, agevolazioni e sottostime che\nnon dipendono dai comportamenti del contribuen-\nte ma che generano una riduzione del gettito fiscale.\n\nEuro: è la ‘# moneta unica europea. Il 31 dicembre 1998\nesso ha sostituito t* l&#x27;’ECU con un t* tasso di cambio\nuno a uno. Fino al 2001 l&#x27;Euro è stato una semplice\nunità di conto, mentre a partire dal primo gennaio\n2002 questa data si è realizzata la sua introduzione\nfisica. Le monete sostituite da subito dall&#x27;Euro sono\nquelle dei 12 Paesi che il 1° maggio 1998 hanno ri-\nspettato i criteri stabiliti a Maastricht. Il cambio tra li-\nra e Euro è stato di 1936,27 lire per 1 Euro.\n\nEvasione fiscale: atto posto in essere da un contribuente,\ntenuto al pagamento dei «tributi, che si sottrae par-\nzialmente o totalmente all&#x27;obbligo tributario attra-\nverso atti dolosi, quali ad esempio la mancata, parzia-\nle o scorretta dichiarazione della base imponibile.\n\nFabbisogno dello Stato: entità chiamata anche saldo\nnetto da finanziare; è uguale alla differenza fra entra-\nte finali (somma dei primi tre titoli delle entrate) e\nspese finali (somma dei primi due titoli delle spese)\ndello Stato. Tale saldo indica la misura in cui le ope-\nrazioni dello Stato determinano il ricorso al mercato\nmonetario e finanziario.\n\nFactoring: contratto mediante il quale un&#x27;azienda cede\na una società (factor) i propri crediti derivanti da\nvendite con pagamento differito, ottenendone in\ncambio un pagamento istantaneo ma inferiore\nall&#x27;ammontare del credito.\n\nFatturato: ammontare complessivo delle vendite realiz-\nzate dall&#x27;azienda nel corso di un anno. Rappresenta\nuna delle voci di cui si compone il valore della pro-\nduzione nel conto economico.\n\nFinanziamento: rappresenta l&#x27;insieme dei mezzi neces-\nsari per lo svolgimento dell&#x27;attività aziendale. Esso\npuò derivare da finanziamenti interni (apporti del\nproprietario, dei soci o @&amp; utili non distribuiti) oppu-\nre da finanziamenti esterni (capitale di prestito).\n\nFiscal drag (drenaggio fiscale): indica l&#x27;inasprimento\ndella pressione fiscale causato dall&#x27;inflazione, la qua-\nle fa aumentare i redditi spingendoli così verso fasce\nche, in presenza di una tassazione progressiva, han-\nno aliquote fiscali più elevate.\n\nFMI (Fondo Monetario Internazionale): organizzazio-\nne creata a Bretton Woods nel 1944, alla quale ade-\nriscono attualmente oltre 170 Paesi, avente lo scopo\ndi facilitare i regolamenti finanziari internazionali\nmediante la consulenza tecnica, la stabilizzazione\ndei @? tassi di cambio, la riduzione dei controlli sui\ncambi e la concessione di prestiti a Paesi in tempora-\nnea difficoltà di &gt; bilancia dei pagamenti.\n\nFondi comuni di investimento: intermediari finanziari\nche raccolgono risparmi presso gli investitori (fami-\nglie) e li investono in titoli azionari e obbligazionari.\n\nForze di lavoro: espressione che indica la somma delle\npersone occupate e di quelle in cerca di occupazione\ne che corrisponde al concetto di “popolazione attiva”.\n\nFranchising: contratto mediante il quale un&#x27;impresa\n(concedente o franchisor) concede a un&#x27;altra impresa\n(concessionaria o franchisee) la possibilità di vendere\ni propri prodotti o servizi utilizzando mezzi comuni\n(marchio, brevetti, assistenza tecnica ecc.).\n\nFree-rider: con questo termine (derivante dall&#x27;espres-\nsione inglese free ride che significa “corsa gratuita”) si\nfa riferimento ai soggetti che usufruiscono di beni\npubblici senza pagare il corrispettivo previsto dallo\nStato.\n\nFusione: istituto mediante il quale si ha una concentra-\nzione di aziende per accentramento. Esistono due ti-\npi di fusione:\n\n* fusione propriamente detta: tutte le società parte-\ncipanti alla fusione si sciolgono e i loro patrimoni\n(@ patrimonio netto) vengono apportati in una\nsocietà di nuova costituzione;\n\n* fusione per incorporazione: una società già esi-\nstente incorpora una o più altre società, le quali\ncessano di esistere.\n\nGATT (General Agreement on Tariffs and Trade): ac-\ncordo generale sulle tariffe doganali e sul commer-\ncio internazionale. Istituito nel 1945, stabiliva i prin-\ncipi generali relativi alla libertà e all&#x27;espansione degli\nscambi, sulla base della reciprocità di trattamento. Vi\naderivano oltre 100 Paesi. Periodicamente venivano\norganizzate riunioni del GATT, che potevano protrar-\nsi anche per anni (è il caso del recente Uruguay</p></details>", "back": "", "conf": "low", "page": 347, "section": "6.6.1 Glossario dei termini giuridici e socioeconomici", "num": null, "_i": 84}, {"kind": "theory", "src": "images/p348_b1.png", "front": "<div class='kindlabel'>THEORY</div><img src='images/p348_b1.png' class='cardimg'><p class='th-en'>(English not filled yet)</p><details><summary>original (IT)</summary><p class='th-it'>Round) volte a rendere sempre più estesa l&#x27;applica-\nzione dei principi di libero scambio. Da ultimo il\nGATT ha trovato collocazione in un foro permanen-\nte, denominato World Trade Organization (@&amp; WTO).\n\nHolding: società che controlla un gruppo di altre società\ntramite il possesso di @ partecipazioni azionarie.\n\nICE (Istituto per il Commercio con l&#x27;Estero): organismo\npubblico che si occupa principalmente di promuo-\nvere le esportazioni italiane.\n\nICI (Imposta Comunale sugli Immobili): entrata in vi-\ngore dal 1993 con aliquote fissate dai singoli Comu-\nni all&#x27;interno di un margine consentito di discrezio-\nnalità.\n\nImposta: particolare tipo di @? tributo, nel quale la presta-\nzione del privato (per esempio l&#x27;IRPEF) non costitui-\nsce il corrispettivo di un servizio pubblico particolare.\n\nA seconda del loro presupposto, le imposte si distin-\nguono in:\n\n* dirette, se colpiscono il reddito o il patrimonio;\n\n* indirette, se colpiscono fenomeni che sono solo\nindirettamente in relazione con una capacità con-\ntributiva (per esempio l&#x27;IVA).\n\nA seconda della modalità con cui viene determinata,\n\nl&#x27;imposta si distingue in:\n\n«fissa, se consiste in una somma determinata indi-\npendentemente dal valore dell&#x27;imponibile;\n\n* progressiva, se viene determinata applicando\nsull’imponibile un&#x27;aliquota crescente al crescere\ndello stesso;\n\n«proporzionale, se viene determinata applicando\nsull&#x27;imponibile un&#x27;aliquota fissa.\n\nLe imposte si distinguono ancora in:\n\n*_ personali, se tengono conto delle condizioni eco-\nnomiche e sociali del contribuente;\n\n* reali, se colpiscono il reddito o il patrimonio del\ncontribuente senza tenere conto delle sue condi-\nzioni economico-sociali.\n\nIndicizzazione: meccanismo con il quale una grandezza\neconomica viene commisurata alle variazioni di un\nparametro, normalmente costituito da un&#x27;altra gran-\ndezza economica. Un esempio è l&#x27;indicizzazione dei\nsalari al tasso di &amp;? inflazione.\n\nInflazione: aumento generalizzato del livello dei prezzi e\ncontemporanea riduzione del potere d&#x27;acquisto del-\nla moneta. Vi sono varie teorie relative alle cause che\nla determinano. L&#x27;inflazione da costi è dovuta princi-\npalmente ad aumenti dei costi di produzione, deri-\nvanti principalmente da aumenti salariali che deter-\nminano poi incrementi dei prezzi. L&#x27;inflazione da\ndomanda è invece dovuta a un&#x27;eccedenza della do-\nmanda globale dei beni e servizi sull&#x27;offerta com-\nplessiva. Infine esiste anche l&#x27;inflazione da eccesso di\nmoneta che si verifica quando l&#x27;offerta di moneta ec-\ncede la relativa domanda e quindi diminuisce il po-\ntere d&#x27;acquisto della moneta. Il tasso di inflazione si\nmisura generalmente ricorrendo a indici di prezzo,\nbasati su ipotetici panieri di beni. L&#x27;incremento per-\ncentuale annuo dell&#x27;indice dà il valore del tasso di in-\nflazione.\n\nINPS (Istituto Nazionale della Previdenza Sociale): è il\n\npiù importante ente previdenziale italiano, a cui fan-\nno capo le pensioni della maggioranza dei lavoratori\ndipendenti privati.\n\nInsider trading: espressione inglese che indica l&#x27;attività\n\nillecita di chi, in virtù di un&#x27;informazione non dispo-\nnibile al pubblico, compie speculazioni sui titoli. Si\nnoti che il reato di insider trading è perseguibile an-\nche senza che debba essere provato lo scopo di pro-\ncurare a sé o ad altri un vantaggio patrimoniale.\n\nInvestimento: operazione che provoca un flusso di en-\n\ntrate e uscite monetarie nel tempo, in modo tale che\ninizialmente prevalgano le uscite nette e in seguito\nle entrate nette. A seconda della sua natura si posso-\nno configurare diversi tipi di investimento: investi-\nmento di razionalizzazione (sostituzione, adegua-\nmento tecnico dei macchinari), investimento di\nespansione (linee di prodotti esistenti o nuovi), inve-\nstimento di @? ricerca e sviluppo ecc.\n\nIRAP (Imposta Regionale sulle Attività Produttive):\n\nl’IRAP ha sostituito, accorpandole, le seguenti impo-\nste: ILOR, ICIAP, contributo sanitario per datori di la-\nvoro e dipendenti, contributo per la TBC, tassa sulla\nsalute, tassa sulla partita IVA e imposta sul patrimo-\nnio delle imprese. La base imponibile sulla quale si\ncalcola l’IRAP è data dal valore della produzione al\nnetto degli acquisti di beni e servizi e degli ammor-\ntamenti. Come contribuenti vengono individuati i\nseguenti soggetti: imprese individuali e di persone,\nsocietà di capitali, professionisti, artisti, enti non\ncommerciali e Pubbliche Amministrazioni (queste\nultime godono tuttavia di un regime particolare).\nInizialmente l&#x27;aliquota era del 4,25% ma, a decorrere\ndal terzo anno dalla sua introduzione (1998), c&#x27;è la\npossibilità per le diverse Regioni di incrementarla al\nmassimo dell&#x27;1% e di diversificarla a seconda dell&#x27;at-\ntività produttiva.\n\nIRI (Istituto per la Ricostruzione Industriale): costitui-\n\nto nel 1933 per finanziare le imprese in difficoltà, ha\npoi gestito le partecipazioni statali. Dal 1992 è una\n@? società per azioni controllata dal Ministero del Te-\nsoro.\n\nIRPEF (Imposta sul Reddito delle Persone Fisiche):\n\nl’IRPEF è un&#x27;imposta personale e progressiva (cioè\ncon aliquota crescente al crescere della base imponi-\nbile) che colpisce i redditi in denaro o in natura pro-\ndotti da una persona fisica, residente o non residen-\nte in Italia, nel territorio dello Stato. La base\nimponibile dell’IRPEF è costituita da tutti i redditi di\ncui la persona abbia materiale disponibilità, dai quali\npossono essere effettuate detrazioni utili a persegui-\nre obiettivi di carattere sociale.\n\nIRPEG (Imposta sul Reddito delle Persone Giuridi-\n\nche): l&#x27;IRPEG è un&#x27;imposta personale e proporziona-\nle (cioè con aliquota fissa) che colpisce i redditi in de-\nnaro o in natura prodotti da una persona giuridica in\nItalia. La base imponibile dell&#x27;IRPEG è costituita da\ntuttii redditi percepiti dalla persona giuridica nel pe-\nriodo d&#x27;imposta.</p></details>", "back": "", "conf": "low", "page": 348, "section": "6.6.1 Glossario dei termini giuridici e socioeconomici", "num": null, "_i": 85}, {"kind": "theory", "src": "images/p349_b1.png", "front": "<div class='kindlabel'>THEORY</div><img src='images/p349_b1.png' class='cardimg'><p class='th-en'>(English not filled yet)</p><details><summary>original (IT)</summary><p class='th-it'>IVA (Imposta sul Valore Aggiunto): imposta indiretta\n\nche si applica alle cessioni di beni e alle prestazioni\ndi servizi effettuate in Italia nell&#x27;esercizio di imprese,\narti o professioni e sulle importazioni da chiunque\neffettuate. | principali obblighi IVA da adempiere so-\nno rappresentati dalla liquidazione mensile o trime-\nstrale della stessa e dalla dichiarazione annuale, rie-\npilogativa di tutte le operazioni compiute durante\nl&#x27;anno.\nL&#x27;aliquota sull&#x27;IVA è sempre fissa, ma di importo di-\nverso a seconda del bene che viene tassato: essa si\napplica sui corrispettivi dovuti a chi cede i beni o\npresta i servizi che costituiscono il presupposto\ndell&#x27;imposta.\n\nLeasing: contratto attraverso il quale un soggetto pren-\nde in locazione da un altro soggetto determinati be-\nni contro pagamento di un canone periodico e con\nla possibilità di riscattare il bene alla scadenza del\ncontratto.\n\nLegge finanziaria: legge di attuazione della manovra\neconomica, diretta a stabilire annualmente la politi-\nca di bilancio in funzione del governo dell&#x27;economia\ne in modo da annullare gli scostamenti che possono\nessere registrati nel @-bilancio pluriennale a legisla-\nzione vigente rispetto agli obiettivi del @bilancio\npluriennale programmatico. È stata introdotta nel\n1978 e determina, essenzialmente, il ricorso al mer-\ncato finanziario, le quote di competenza dell&#x27;eserci-\nzio di spese a carattere pluriennale, le manovre\nquantitative sui &amp;? tributi e sui capitoli di spesa.\n\nMacroeconomia: è quella parte della teoria economica\nche si occupa dello studio dei sistemi economici nel\nloro complesso. Si contrappone alla microecono-\nmia, la quale si occupa dello studio dei processi eco-\nnomici riguardanti unità singole come famiglie, im-\nprese, industrie e mercati.\n\nManagement: espressione inglese che indica l&#x27;insieme\ndi processi e decisioni che compongono la gestione\ndi un&#x27;organizzazione complessa quale un&#x27;impresa. Il\nmanagement indica anche l&#x27;insieme di coloro che\nhanno un ruolo di controllo strategico e di gestione\ndelle risorse umane all&#x27;interno di un&#x27;azienda.\n\nMarketing: insieme delle attività che in un&#x27;impresa sono\nrivolte allo studio e all&#x27;impostazione dei rapporti\ndell&#x27;impresa stessa con il mercato. Tale termine indi-\nca generalmente le funzioni di vendita, distribuzio-\nne, pubblicità e studio del mercato di un prodotto.\n\nMaterie prime: fattori della produzione da immettere\nnel processo produttivo, sottoposti a processo di tra-\nsformazione.\n\nMoneta: mezzo di scambio e pagamento per l&#x27;acquisto\ndi beni e servizi. La base monetaria è costituita dal\n&amp; circolante e dai depositi presso le banche.\n\nMonopolio: situazione di mercato in cui l&#x27;offerta di un\nprodotto è controllata interamente da un unico\nagente grazie a un&#x27;esclusiva normalmente determi-\nnata per legge.\n\nMonopsonio: situazione di mercato in cui, mentre l&#x27;of-\nferta è suddivisa tra più produttori, la domanda è\nconcentrata in un solo soggetto.\n\nMovimenti di capitali: sono una delle tre sezioni della\n@&amp; bilancia dei pagamenti e sono a loro volta distinti\nin tre categorie:\n\n* investimenti diretti, ossia gli investimenti destinati\na stabilire, fra investitore e impresa beneficiaria\ndell&#x27;investimento, legami economici duraturi e di-\nretti che permettano all&#x27;investitore di esercitare\nun&#x27;influenza reale sulla gestione dell&#x27;impresa;\n\n* _ investimenti di portafoglio, ossia gli investimenti fi-\nnanziari di breve periodo che hanno la caratteri-\nstica di dare all&#x27;investitore la possibilità di disim-\npegnare senza troppe difficoltà il capitale\ninvestito;\n\n» crediti commerciali, ossia i fimanziamenti connessi\nal regolamento posticipato di transazioni di natu-\nra commerciale.\n\nMovimenti monetari: sono una delle tre sezioni della bi-\nlancia dei pagamenti. Registrano tutti i movimenti\ninternazionali di valute e capitali effettuate dalle au-\ntorità monetarie (nel caso italiano, Banca d&#x27;Italia e\nUfficio Italiano Cambi) allo scopo di compensare il ri-\nsultato netto determinato dagli scambi registrati\nnelle due parti precedenti della bilancia dei paga-\nmenti (partite correnti e @? movimenti di capitali).\n\nMutuo: contratto con il quale il mutuante consegna al\nmutuatario una determinata quantità di denaro o di\naltre cose fungibili con l&#x27;obbligo del mutuatario stes-\nso di restituire a scadenza cose della stessa specie e\nqualità. In contabilità esso rappresenta un debito a\nmedio/lungo termine sul quale maturano interessi\npassivi.\n\nNAFTA (North American Free Trade Agreement): ac-\ncordo di libero scambio costituito nel 1993 fra i Paesi\ndel continente nordamericano: USA, Canada e Mes-\nsico.\n\nNazionalizzazione: termine usato sovente come sinoni-\nmo di “statalizzazione”, indica l&#x27;appropriazione da\nparte dello Stato di determinati beni o attività eco-\nnomiche appartenenti ai privati.\n\nOCSE (Organizzazione per la Cooperazione e lo Svi-\nluppo Economici): organismo internazionale con\nsede a Parigi, con lo scopo di agevolare la crescita\neconomica dei Paesi membri (attualmente 28), di\ncombattere la @” disoccupazione senza lasciare @&amp;\nl&#x27;inflazione fuori controllo, di eliminare le barriere al\ncommercio internazionale e di fornire cooperazione\ntecnica ed economica ai Paesi in via di sviluppo.\n\nOligopolio: situazione di mercato in cui solo poche im-\nprese offrono una merce o un servizio e interagisco-\nno con strategie di prezzo, quantità e pubblicità.\n\nOPA (Offerta Pubblica di Acquisto): meccanismo per\nacquistare i titoli di una società, allo scopo di acqui-\nsirne il controllo.\n\nOPEC (Organization of petroleum exporting coun-\ntries): principale organizzazione dei Paesi esporta-\ntori di petrolio. Si tratta prevalentemente di Paesi\ndell’area mediorientale quali Arabia Saudita, Iraq,\nIran e Kuwait, ma aderiscono anche Venezuela,\nEcuador e Indonesia. Durante gli anni ‘70, e in parti-\ncolare in due occasioni (1973 e 1979), l&#x27;organizzazio-\nne ha determinato un forte rialzo dei prezzi del pe-</p></details>", "back": "", "conf": "low", "page": 349, "section": "6.6.1 Glossario dei termini giuridici e socioeconomici", "num": null, "_i": 86}, {"kind": "theory", "src": "images/p350_b1.png", "front": "<div class='kindlabel'>THEORY</div><img src='images/p350_b1.png' class='cardimg'><p class='th-en'>(English not filled yet)</p><details><summary>original (IT)</summary><p class='th-it'>trolio nei mercati mondiali, contraendone l&#x27;offerta.\nLe conseguenze per i Paesi dipendenti dalle impor-\ntazioni per i propri fabbisogni energetici, quali l&#x27;Ita-\nlia, sono state @ inflazione, peggioramento della bi-\nlancia commerciale e conseguente crisi economica.\n\nPAC (Politica Agricola Comune): insieme di disposizio-\nni e meccanismi decisionali che regolano il mercato\ndei prodotti agricoli nella @ UE. | suoi cardini sono\nrappresentati da una tariffa comune dei Paesi mem-\nbri sui prodotti agricoli importati dai Paesi che non\nfanno parte della Comunità; da montanti compen-\nsativi pagati a chi esporta fuori della Comunità a\nprezzi inferiori a quelli vigenti in Europa da un siste-\nma di prezzi dei prodotti agricoli fissati ogni anno\namministrativamente.\n\nPartecipazione: quota del capitale sociale di una società\ndetenuta da un soggetto economico.\n\nPartita doppia (metodo della): insieme di regole di re-\ngistrazione dei conti. Seguendo questo metodo le\nquantità devono essere annotate contemporanea-\nmente due volte, in diversi conti, in opposte sezioni.\n\nPatrimonio netto: differenza tra il capitale investito e il\nvalore delle passività; esprime il valore di quella par-\nte della ricchezza che non deve essere destinata ai\nterzi, ma è di pertinenza dei soci dell&#x27;impresa (è in-\nfatti denominato anche “mezzi propri”).\n\nPerdita d&#x27;esercizio: conto di capitale che accoglie una\nposta ideale negativa del capitale netto che dovrà\nessere coperta.\n\nPiano Marshall: programma di aiuti economico-finan-\nziari all&#x27;Europa da parte degli Stati Uniti, applicato\ndal 1948 al 1952. Ha preso il nome da George Mar-\nshall, il segretario di Stato americano che lo lanciò.\n\nPIL (Prodotto Interno Lordo): è il valore di tutti i beni e\nservizi finali prodotti in un Paese (da soggetti resi-\ndenti e non) in un dato periodo di tempo, calcolato\nin base ai prezzi del periodo di produzione senza\nsottrarre gli ammortamenti. È una misura della ric-\nchezza prodotta in un anno da un Paese. Il tasso di\nvariazione percentuale annuo del PII. viene utilizza-\nto anche per misurare la crescita economica di un\nPaese. La contabilità nazionale, nel registrare le di-\nverse attività economiche ai fini del calcolo del PIL,\nconsidera, nei Paesi a economia di mercato, soltanto\nle attività produttive che hanno luogo in cambio di\nuna controprestazione. Dal calcolo del PIL sono\nquindi escluse le spese pubbliche per trasferimenti,\na cui non corrisponde alcuna attività da parte dei be-\nneficiari (Come i contributi alla produzione e le pen-\nsioni sociali). Per lo stesso motivo sono esclusi i pa-\ngamenti dei cittadini verso lo Stato per adempiere ai\nloro obblighi fiscali (imposte dirette e indirette).\nVengono invece comprese le spese per beni e servizi\ne, quindi, sono incluse nella contabilità nazionale le\nspese per consumi pubblici e quelle per investimen-\nti pubblici.\n\nPIN (Prodotto Interno Netto): si ottiene sottraendo al\n&amp; PIL gli ammortamenti sui beni capitali fissi. Questi\nultimi, infatti, si logorano quando sono utilizzati nel\nprocesso produttivo e la quota di reddito che spetta\nper i loro servizi può essere idealmente divisa in due\n\nparti: la prima copre il deperimento, la seconda è la\nvera remunerazione. In generale gli ammortamenti\nsono valutati in modo convenzionale applicando\ndeterminati coefficienti ai vari tipi di beni capitali\nesistenti.\n\nPlusvalenze/Minusvalenze: componenti straordinari di\n&amp; reddito d&#x27;esercizio che si originano dalla cessione\ndi immobilizzazioni, in relazione a una differenza po-\nsitiva/negativa tra il prezzo di vendita e il valore con-\ntabile dell&#x27;immobilizzazione ceduta.\n\nPNL (Prodotto Nazionale Lordo): corrisponde al valore\ndei servizi resi nel Paese o all&#x27;estero dai fattori pro-\nduttivi residenti nel Paese. È normale che lavoratori\no capitale di un certo Paese trovino impiego in un al-\ntro Paese. La differenza fra le remunerazioni ottenu-\nte all&#x27;estero dai fattori produttivi i cui titolari sono re-\nsidenti nel Paese e le remunerazioni ottenute nel\nPaese dai fattori produttivi i cui titolari sono residen-\nti all&#x27;estero costituisce i redditi netti dall&#x27;estero. Se si\nsommano questi redditi al @? PIL si ottiene il PNL. Es-\nsendo il PNL dato dalla somma del PIL e dei redditi\nnetti dall&#x27;estero, nel caso di un&#x27;economia chiusa i\ndue aggregati coincidono, in quanto i redditi netti\ndall&#x27;estero risultano nulli.\n\nPolitica di bilancio: parte della @? politica economica\nche si occupa delle relazioni fra strumenti del bilan-\ncio pubblico (aliquote fiscali, spesa pubblica ecc.) e\nsituazione del sistema economico.\n\nPolitica economica: insieme di tutti i provvedimenti\ndella pubblica autorità nel sistema economico. Si\ncompone principalmente della ? politica di bilan-\ncio, della ” politica monetaria e della &amp;? politica dei\nredditi.\n\nPolitica monetaria: parte della &gt; politica economica\nche si occupa della relazione tra gli strumenti a di-\nsposizione delle autorità monetarie (@ tassi di inte-\nresse, livello di base monetaria) e la situazione del si-\nstema economico.\n\nPolitica dei redditi: definisce un complesso di scelte di\n@° politica economica che ha l&#x27;obiettivo di influire\nsulla distribuzione dei redditi fra le diverse unità\neconomiche e di mantenere un rapporto equilibrato\nfra incremento della produttività e costo dei fattori.\n\nPrestiti obbligazionari: titoli che conferiscono ai loro\npossessori il diritto di vedere maturati interessi pre-\ndeterminati e il rimborso del capitale a scadenza\n(obbligazioni ordinarie). Per la società che li emette\nrappresentano uno strumento di finanziamento a\nlungo termine. Secondo quanto previsto dal Codice\nCivile, le società di capitali possono emettere obbli-\ngazioni per somme non eccedenti il capitale versato\ned esistente secondo l&#x27;ultimo bilancio approvato.\nOltre alle obbligazioni ordinarie, che possono essere\nemesse alla pari (al valore nominale) o sotto la pari\n(valore effettivo inferiore a quello nominale), esisto-\nno anche le obbligazioni convertibili, che, alla sca-\ndenza, permettono all&#x27;obbligazionista di scegliere\nse venire rimborsato del proprio credito o diventare\nazionista della società emittente delle obbligazioni.\nQuest&#x27;ultimo tipo di obbligazioni non può essere\nemesso per un prezzo inferiore al valore nominale.</p></details>", "back": "", "conf": "low", "page": 350, "section": "6.6.1 Glossario dei termini giuridici e socioeconomici", "num": null, "_i": 87}, {"kind": "theory", "src": "images/p351_b1.png", "front": "<div class='kindlabel'>THEORY</div><img src='images/p351_b1.png' class='cardimg'><p class='th-en'>(English not filled yet)</p><details><summary>original (IT)</summary><p class='th-it'>Previdenza integrativa: insieme di strumenti di rispar-\nmio pensionistico volontario mirato a garantire trat-\ntamenti pensionistici superiori rispetto a quelli offer-\nti dalla previdenza sociale.\n\nPrevidenza sociale: insieme dei provvedimenti adottati\nper fronteggiare bisogni futuri mediante l’assicura-\nzione e l&#x27;assistenza sociale.\n\nPrivatizzazione: alienazione ai privati di quote di patri-\nmonio o di imprese controllate dallo Stato. Si con-\ntrappone alla nazionalizzazione.\n\nLe finalità perseguite dalle privatizzazioni sono princi-\npalmente di tre tipi:\n\n» sottoporre al controllo di azionisti interessati al\nrendimento del proprio investimento (e imporre\ncosì una gestione economica più efficiente, coe-\nrente con la disciplina del mercato) le imprese\npubbliche, sovente abituate a sopravvivere grazie\nai contributi gratuiti dello Stato;\n\n* migliorare la concorrenza nel mercato, rimuoven-\ndo eventuali situazioni di privilegio rappresentate\ndai sussidi e dagli aiuti in genere alle imprese\npubbliche;\n\n*_ ridurre il &amp;° disavanzo pubblico, mediante l’incre-\nmento delle entrate in conto capitale connesse al-\nla cessione delle aziende pubbliche.\n\nProduttività: rapporto fra la quantità di output, ossia di\nbeni o servizi prodotti, e la quantità di input, ossia di\nfattori produttivi utilizzati. Maggiore è tale rapporto,\nmaggiore è la produttività. Per produttività margina-\nle si intende l&#x27;aumento di produzione determinato\ndall&#x27;incremento marginale di un fattore della produ-\nzione tenendo costanti gli altri fattori.\n\nProduzione industriale: indica il complesso della pro-\nduzione di beni del settore industriale, generalmen-\nte nel corso di un anno.\n\nProgressività: principio contenuto nell&#x27;articolo 53 della\nCostituzione, in base al quale i contribuenti pagano\ni tributi in misura crescente più che proporzional-\nmente al crescere del loro reddito. La progressività\ncomporta l&#x27;aumento dell&#x27;aliquota d&#x27;imposta con\nl&#x27;aumentare del reddito imponibile. Esistono quattro\ntipologie di progressività:\n\n* progressività continua: l&#x27;aliquota aumenta conti-\nnuamente all&#x27;aumentare della base imponibile, fi-\nno a un massimo oltre il quale l&#x27;aliquota rimane\ncostante;\n\n*_ progressività per detrazione: si applica un&#x27;aliquota\ncostante sui redditi imponibili ottenuti sottraen-\ndo dal reddito originario una somma fissa;\n\n*_ progressività per classi: i diversi redditi imponibili\nsono suddivisi in classi alle quali corrisponde\nun&#x27;aliquota crescente all&#x27;aumentare del reddito e\nche viene applicata all&#x27;intero ammontare. Presen-\nta l&#x27;inconveniente di colpire in maniera relativa-\nmente elevata i redditi che superano di poco il li-\nmite inferiore della classe;\n\n*_ progressività per scaglioni: scompone il reddito in\nmodo che ogni suo singolo scaglione sia sogget-\nto a un&#x27;aliquota diversa (crescente al crescere del\nreddito). Questo sistema viene adottato in Italia\nper il calcolo dell&#x27;IRPEF.\n\nProtezionismo: cs” politica economica volta a limitare la\nconcorrenza estera mediante dazi e contingenta-\nmenti su alcuni prodotti di importazione, il cui prez-\nzo viene così volutamente aumentato in modo da\nfavorire le imprese nazionali.\n\nPublic company: termine inglese che indica una società\nad azionariato diffuso, ossia una società le cui azioni\nsono possedute da un numero elevato di soggetti,\nnessuno dei quali controlla una quota rilevante della\nsocietà stessa.\n\nQuota di mercato: percentuale delle vendite di un&#x27;im-\npresa sul totale delle vendite del settore di mercato\nin cui l&#x27;azienda opera.\n\nQuotazione: valore di un titolo, di una valuta estera o di\nuna merce derivante dalle compravendite nella &amp;\nborsa valori.\n\nRagioneria generale dello Stato: organo dello Stato la\ncui funzione principale è quella di esercitare, duran-\nte la gestione del bilancio, un controllo sugli atti di\nentrata e di spesa al fine di assicurarne la conformità\nalla legge di bilancio e agli eventuali provvedimenti\nmodificativi della stessa. Più in particolare, a tale or-\ngano sono assegnate tre funzioni principali: compi-\nlare il bilancio di previsione dello Stato, tenere le\nscritture contabili delle operazioni finanziarie dello\nStato, esercitare il controllo di legittimità e di merito\nsu ogni singola operazione finanziaria posta in esse-\nre dall&#x27;Amministrazione dello Stato.\n\nRecessione: fase del ciclo economico caratterizzata da\nun aumento negativo o inferiore all&#x27;andamento po-\nsitivo del &amp;? PIL.\n\nReddito: rappresenta la differenza fra i ricavi e i costi di\nun&#x27;impresa in un intervallo di tempo definito. Quan-\ndo è riferito a un singolo individuo indica l&#x27;insieme di\ntutte le sue entrate. Può essere il frutto di investi-\nmenti (redditi da capitale), di stipendi (redditi da la-\nvoro dipendente), di immobili (redditi fondiari), di\npartecipazione agli utili di una società (redditi di im-\npresa), di una professione (redditi da lavoro autono-\nmo) ecc.\n\nReddito d&#x27;esercizio: complesso delle entrate (moneta-\nrie e in natura) conseguite da una persona (fisica o\ngiuridica) in un dato periodo di tempo.\n\nReddito imponibile: ammontare sul quale si calcolano\nle ce? imposte dirette.\n\nRendiconto Finanziario: prospetto che evidenzia le de-\nterminanti della variazione delle risorse finanziarie\nintervenuta in un dato periodo. Tali variazioni sono\nsuddivise in fonti e impieghi a seconda che compor-\ntino un incremento o un decremento delle risorse fi-\nnanziarie.\n\nRendiconto generale dello Stato: documento presen-\ntato dal Ministro del Tesoro al Parlamento entro il\nmese di giugno di ogni anno che rappresenta il bi-\nlancio consuntivo dello Stato. Il rendiconto generale\ndello Stato non è altro che il bilancio consuntivo del-\nlo Stato (ce? Bilancio dello Stato).\n\nRendita: secondo la teoria economica classica è quella\nquota di produzione agricola percepita dal proprie-\ntario terriero.</p></details>", "back": "", "conf": "low", "page": 351, "section": "6.6.1 Glossario dei termini giuridici e socioeconomici", "num": null, "_i": 88}, {"kind": "theory", "src": "images/p352_b1.png", "front": "<div class='kindlabel'>THEORY</div><img src='images/p352_b1.png' class='cardimg'><p class='th-en'>(English not filled yet)</p><details><summary>original (IT)</summary><p class='th-it'>Ricerca e sviluppo: attività di un&#x27;azienda per migliorare\nla produttività e la competitività sul mercato.\n\nRisparmio pubblico: valore dato dalla differenza fra il\ntotale delle entrate tributarie ed extratributarie e il\ntotale delle spese correnti: esso misura dunque, se\npositivo, la quota di risorse correnti destinabili al fi-\nnanziamento delle spese in conto capitale; se nega-\ntivo, la quota delle spese correnti da soddisfare ricor-\nrendo all&#x27;indebitamento.\n\nRitenuta (alla fonte): meccanismo di esazione delle im-\nposte sul reddito secondo il quale viene attribuito a\nun terzo soggetto (sostituto d&#x27;imposta), che sia de-\nbitore nei confronti del contribuente, l&#x27;obbligo di\ncorrispondere l&#x27;imposta per suo conto. Un esempio\nè rappresentato dalle imposte per i lavoratori dipen-\ndenti, ritenute alla fonte dal datore di lavoro nel mo-\nmento di pagare gli stipendi.\n\nScala mobile: strumento di salvaguardia del potere\nd&#x27;acquisto dei salari basato sull&#x27;aumento automati-\nco delle retribuzioni di un importo tale da compen-\nsare l&#x27;aumento dei prezzi. La scala mobile è stata uti-\nlizzata in Italia dal 1946 al 1992.\n\nScienza delle finanze: disciplina che studia i principi at-\ntraverso i quali lo Stato reperisce le risorse necessa-\nrie per lo svolgimento delle sue funzioni.\n\nSettore pubblico: insieme delle attività e delle istituzio-\nni che possono essere definite pubbliche, o dal pun-\nto di vista della natura delle funzioni svolte oppure\ndei soggetti o istituzioni ad esse preposte.\n\nSICAV (Società di investimento a capitale variabile):\nsocietà per azioni che hanno come oggetto esclusi-\nvo l&#x27;investimento collettivo del patrimonio raccolto\nmediante l&#x27;offerta al pubblico di proprie azioni.\n\nSIM (Società di Intermediazione Mobiliare): si tratta di\nintermediari finanziari che hanno sostituito gli agen-\nti di cambio nel mercato azionario italiano. Sono gli\nunici operatori abilitati a negoziare direttamente ti-\ntoli azionari in Borsa. Gli altri soggetti intenzionati a\ncomprare o vendere azioni di società quotate devo-\nno dunque rivolgersi a una SIM.\n\nSME (Sistema Monetario Europeo): è un sistema che di-\nsciplina i rapporti di cambio fra le valute dei Paesi del-\nla? UE (e prima &amp; della CEE) e i meccanismi di inter-\nvento delle relative banche centrali, con l&#x27;obiettivo di\nrafforzare la stabilità monetaria intracomunitaria. È\nstato creato nel 1979 insieme &amp; all&#x27;ECU che costitui-\nsce il suo riferimento. L&#x27;Italia è uscita dagli accordi di\ncambio dello SME in seguito alla crisi valutaria della fi-\nne del 1992 e vi è rientrata nel novembre 1996.\n\nS.n.c. (Società in nome collettivo): società di persone\nin cui i soci sono responsabili in solido e illimitata-\nmente per le obbligazioni sociali.\n\nSocietà di capitali: società che rispondono delle obbli-\ngazioni sociali unicamente con il proprio patrimonio\nsociale. | soci sono dunque responsabili soltanto li-\nmitatamente alla quota di capitale sociale detenuta.\nLe principali forme di società di capitali previste dal\ndiritto italiano sono la &amp; società perazioni (S.p.A.), la\n&amp; società a responsabilità limitata (S.r.l.) e la società\nin accomandita per azioni (S.a.p.a.).\n\nSocietà di persone: è una forma di organizzazione im-\nprenditoriale riconosciuta dalla legge. Si tratta di\nun&#x27;impresa gestita da più persone, dotata di autono-\nmia patrimoniale: la legge, cioè, riconosce la separa-\nzione fra il patrimonio della società e quello perso-\nnale dei soci ma, qualora il patrimonio sociale si\nrivelasse insufficiente a coprire le obbligazioni as-\nsunte dalla società, impone che siano i soci a rispon-\ndere solidalmente e illimitatamente con il proprio\npatrimonio. Le principali forme di società di persone\npreviste dal diritto italiano sono la società semplice\n(S.s.), la società in accomandita semplice (S.a.s.) ela&amp;\nsocietà in nome collettivo (S.n.c.).\n\nSottoccupazione: situazione di un soggetto che svoige\nun&#x27;attività lavorativa non adeguata al suo titolo di\nstudio o che, per mancanza di lavoro, presta la sua\nopera per un numero di ore inferiore a quello nor-\nmale. Per estensione, si parla di sottoccupazione\nquando un sistema economico utilizza un numero di\nore lavorative inferiore a quello che il sistema po-\ntrebbe assorbire.\n\nS.p.A. (Società per azioni): società che esplica un&#x27;attivi-\ntà commerciale, dove che la responsabilità persona-\nle dei soci è limitata alla quota di capitale conferita\nche è rappresentata da azioni.\n\nSpesa pubblica: insieme delle uscite monetarie neces-\nsarie al soddisfacimento dei bisogni della collettivi-\ntà; rappresentano il fabbisogno finanziario. Le uscite\npossono essere statali o locali (in relazione all&#x27;ente\nche effettua la spesa), obbligatorie o facoltative (in\nbase alle norme giuridiche che le disciplinano), pro-\nduttive o redistributive (in relazione ai loro effetti\neconomici), di governo o di esercizio (a seconda del-\nlo scopo), correnti o di investimento (in base alla loro\ndestinazione economica), ordinarie o straordinarie\n(in base alla loro ripetibilità nel tempo).\n\nS.r.l. (Società a responsabilità limitata): società in cui\nla responsabilità a carico dei soci è limitata ai soli\nconferimenti e in cui le quote di partecipazione dei\nsoci non possono essere rappresentate da azioni. Il\ncapitale minimo richiesto per la costituzione è di\n10.000 euro.\n\nStagflazione: fase caratterizzata dalla compresenza di\n&amp; stagnazione e di &amp; inflazione.\n\nStagnazione: fase in cui non varia il livello della produ-\nzione e del &amp; reddito nazionale. In relazione a perio-\ndi brevi, è sinonimo di @° deflazione o @rrecessione,\nse riferito a un periodo più lungo è più affine a un\nconcetto di “ristagno”.\n\nStato patrimoniale: prospetto del bilancio di una so-\ncietà. È un documento che “fotografa” la situazione\no, meglio, che indica il valore del patrimonio netto\naziendale in un determinato istante. È composto di\ndue sezioni contrapposte: attivo da un lato e passivo\ndall&#x27;altro.\n\nSvalutazione: diminuzione del valore di una moneta rela-\ntivamente a un&#x27;altra moneta o all&#x27;oro, equivalente a\nun aumento del cambio. Infatti, ad esempio, se il &amp;\ntasso di cambio euro/dollaro passa da 1,20 a 1,25, si-\ngnifica che l&#x27;euro si è svalutato (occorrono più euro\nper acquistare un dollaro).</p></details>", "back": "", "conf": "low", "page": 352, "section": "10.000 euro.", "num": null, "_i": 89}, {"kind": "theory", "src": "images/p353_b1.png", "front": "<div class='kindlabel'>THEORY</div><img src='images/p353_b1.png' class='cardimg'><p class='th-en'>(English not filled yet)</p><details><summary>original (IT)</summary><p class='th-it'>La svalutazione può essere il frutto di un atto ufficiale\n(fissazione di un nuovo prezzo ufficiale da parte delle\nbanche centrali) oppure può essere determinata dal\nsemplice andamento del mercato (nell&#x27;esempio esa-\nminato la svalutazione dell&#x27;euro sarebbe determinata\nda un incremento della domanda di dollari o da una\ndiminuzione della domanda di euro). Il contrario di\nsvalutazione è detto rivalutazione.\n\nTassa: particolare tipo di «&amp;” tributo, nel quale la presta-\nzione pecuniaria del privato costituisce il corrispetti-\nvo di un servizio effettuato da un ente pubblico a\nsuo vantaggio (per esempio, la tassa sui rifiuti).\n\nTasso di cambio: esprime la quantità di valuta di uno\nStato che può essere scambiata con un&#x27;unità valuta-\nria di un altro Stato. Per esempio, il tasso di cambio\neuro/dollaro americano indica quanti euro occorro-\nno per acquistare un dollaro. | tassi di cambio posso-\nno essere liberi di fluttuare in base alle condizioni di\ndomanda e offerta, o essere vincolati a mantenersi\nentro certi limiti, in base agli accordi internazionali\nsottoscritti.\n\nTasso di interesse: rapporto fra l&#x27;interesse incassato/pa-\ngato, generalmente su base annua, e il @ capitale\nprestato o chiesto a prestito. Esistono diversi tipi di\ntassi di interesse. | più noti e indicativi sono quelli pa-\ngati dalle banche per prendere a prestito fondi dalla\nBanca Centrale (TUS, tasso ufficiale di sconto) e quello\npagato dal Tesoro sui titoli di Stato emessi per finan-\nziare il proprio disavanzo (per esempio, tasso sui BoT).\n\nTasso naturale di disoccupazione: livello di disoccupa-\nzione ineliminabile perché proprio del sistema eco-\nnomico.\n\nTerziario: il terziario è il settore del sistema economico\nrappresentato dalle imprese che producono servizi.\nInclude dunque tutte quelle imprese che non pro-\nducono beni materiali (studi professionali, sistema\nsanitario, sistema scolastico, alberghi, consulenza,\nsettore finanziario ecc.). Si distingue dal settore pri-\nmario, che include il settore agricolo, e da quello se-\ncondario, che include le imprese industriali (mecca-\nniche, chimiche, farmaceutiche, edili ecc.).\n\nTerziarizzazione: processo socioeconomico che si con-\ncretizza nell&#x27;aumento relativo dei lavoratori impie-\ngati nel settore dei servizi rispetto al numero degli\naddetti dell&#x27;industria e dell&#x27;agricoltura.\n\nTesoreria centrale dello Stato: organo esecutivo della\ndirezione generale del Tesoro, incaricato della gestio-\nne di tutte le operazioni di incasso e di pagamento in\nesecuzione del bilancio di previsione dello Stato.\n\nTitoli di Stato: sono i titoli di credito emessi dallo Stato\nper finanziare il fabbisogno del settore pubblico. In\nItalia i più diffusi sono i &amp;° BoT (Buoni ordinari del Te-\nsoro), i BTp (Buoni del Tesoro poliennali) e i CcT (Cer-\ntificati di credito del Tesoro).\n\nTraslazione d&#x27;imposta: meccanismo economico legitti-\nmo attraverso il quale un contribuente colpito da\nun&#x27;imposta riesce a trasferire parzialmente o total-\nmente l&#x27;ammontare dovuto, su uno o più soggetti.\n\nTrattamento di fine rapporto (TFR): somme trattenute\nannualmente dall&#x27;azienda al lavoratore, il quale ma-\ntura così il diritto al percepimento della “liquidazio-\n\nne”. Le somme accantonate annualmente vanno a\nincrementare una voce del passivo dello stato patri-\nmoniale chiamata “trattamento di fine rapporto di\nlavoro subordinato”.\n\nTributo: concetto che comprende tutte le prestazioni\nche la legge impone ai privati a favore dello Stato o\ndi un altro ente pubblico. | tributi, a seconda del loro\n“presupposto”, si distinguono in &amp; imposte, &amp; tasse\ne &amp; contributi. A seconda dell&#x27;attività e degli adem-\npimenti necessari per il suo pagamento, il tributo si\ndefinisce:\n\n* senza imposizione, se al verificarsi del presuppo-\nsto il contribuente deve pagare la somma senza\ncompiere ulteriori attività;\n\n* con imposizione eventuale, se il pagamento della\nsomma deve essere preceduto dalla presentazio-\nne di una dichiarazione da parte del contribuente\n(è questo per esempio il caso dell&#x27;IRPEF);\n\n* con imposizione necessaria, se il pagamento è do-\nvuto solo a seguito dell&#x27;emanazione di un atto da\nparte dell&#x27;amministrazione pubblica creditrice\ndella somma.\n\nUE (Unione Europea): fase del processo di integrazione\neuropea che ha preso le mosse dalla costituzione di\nuna comunità economica (&lt;@” CEE) e, con l&#x27;imple-\nmentazione del Trattato di Maastricht del 1991, si\nprefigge l&#x27;obiettivo dell&#x27;unione economica e mone-\ntaria. Questa è caratterizzata dalla libera circolazione\ndi beni, servizi, persone e capitali, da un sistema di\ncambi fissi e da comuni politiche di bilancio e mone-\ntarie. È prevista anche l&#x27;introduzione di una moneta\nunica (&lt;@? l&#x27;Euro) e di un&#x27;unica @” Banca Centrale.\n\nUIL (Unione Italiana del Lavoro): organizzazione sinda-\ncale fondata nel 1950 dalle componenti socialdemo-\ncratica e repubblicana che avevano lasciato la &amp;\nCGIL nel 1948.\n\nUtile d&#x27;esercizio: conto di capitale, che accoglie una po-\nsta ideale positiva di capitale netto la quale può ri-\nmanere investita nell&#x27;azienda ovvero può essere di-\nstribuita fra i soci.\n\nWelfare State: Stato del benessere o Stato assistenziale,\nindica un’organizzazione sociale in base alla quale\nvengono assicurati a tutti i cittadini un reddito di-\nsponibile minimo e quei servizi considerati social-\nmente necessari (come l&#x27;abitazione, la tutela della\nsalute e l&#x27;istruzione) che, in una dinamica di mercato,\nnon sarebbero accessibili ai cittadini meno abbienti.\n\nWTO (World Trade Organization): organizzazione in-\nternazionale volta a favorire lo sviluppo del com-\nmercio mondiale. Istituita nel 1994, ha sostituito, in\nqualità di foro permanente, il precedente @ GATT. Il\nprimo Presidente della WTO è l&#x27;italiano Renato Rug-\ngiero, ex Ministro del Commercio Estero.\n\nZona franca: area geografica di un Paese che usufruisce\ndi un regime fiscale particolare. | prodotti venduti in\ntali aree non sono soggetti ad alcun dazio o tributo\ndoganale. In Italia sono zone franche Livigno e Cam-\npione d&#x27;Italia.</p></details>", "back": "", "conf": "low", "page": 353, "section": "10.000 euro.", "num": null, "_i": 90}, {"kind": "question", "src": "images/p354_b2.png", "front": "<img src='images/p354_b2.png' class='cardimg'><p class='q'>(English not filled yet)</p><details><summary>original (IT)</summary><p class='th-it'>1 Le privatizzazioni perseguono tutte le seguenti finalità tranne una. Quale?\n\n‘ Ridurre la disoccupazione\n\nMigliorare l&#x27;efficienza della gestione delle imprese\n\nRidurre il disavanzo pubblico e conseguentemente il debito pubblico\nè Rimuovere potenziali ostacoli alla libera concorrenza nel mercato\n\nDiminuire il peso dello Stato nell&#x27;economia\n\nLa risposta esatta è la |... Infatti, mentre tutte le altre alternative rappresentano effettive finalità e conse-\nguenze del processo di privatizzazione delle imprese pubbliche, gli effetti di tale processo sull&#x27;occupazio-\nne sono sovente negativi. Le imprese cedute ai privati vengono infatti generalmente sottoposte a pro-\ncessi di razionalizzazione basati sul taglio dei costi del personale, realizzato licenziando e incentivando il\nprepensionamento.</p></details>", "back": "", "conf": "low", "page": 354, "section": "10.000 euro.", "num": 1, "_i": 91}, {"kind": "question", "src": "images/p354_b3.png", "front": "<img src='images/p354_b3.png' class='cardimg'><p class='q'>(English not filled yet)</p><details><summary>original (IT)</summary><p class='th-it'>2 Una diminuzione del tasso d’inflazione indica:\nuna diminuzione del livello dei prezzi\n\nuna diminuzione del tasso di crescita dei prezzi\nuna diminuzione dei salari\nuna diminuzione dei costi delle imprese\n\nuna diminuzione della variabilità dei prezzi\n\nIl tasso di inflazione esprime il tasso di crescita dei prezzi in un anno. Una diminuzione indica dunque che\ni prezzi crescono a un tasso più ridotto (risposta . ). Vi può tuttavia ancora essere un tasso di crescita po-\nsitivo. Non è pertanto necessariamente vero che una riduzione dell&#x27;inflazione conduca a una riduzione\ndei prezzi, dei salari o dei costi.</p></details>", "back": "", "conf": "low", "page": 354, "section": "10.000 euro.", "num": 2, "_i": 92}, {"kind": "question", "src": "images/p354_b4.png", "front": "<img src='images/p354_b4.png' class='cardimg'><p class='q'>(English not filled yet)</p><details><summary>original (IT)</summary><p class='th-it'>3 Quale tra i seguenti soggetti soggiace al regime del fallimento?\n\nIl piccolo imprenditore\nLa fondazione\n\nL&#x27;associazione\n\nLa società di capitali\n\nIl partito politico\n\nLa risposta esatta è la .*.. Il fallimento infatti è un istituto predisposto appositamente per risolvere la crisi\ndi un&#x27;impresa di non piccole dimensioni e ciò fa escludere l&#x27;alternativa |... soggetti indicati da -,\\*, ed\nnon possono invece essere imprenditori.</p></details>", "back": "", "conf": "low", "page": 354, "section": "10.000 euro.", "num": 3, "_i": 93}, {"kind": "question", "src": "images/p354_b5.png", "front": "<img src='images/p354_b5.png' class='cardimg'><p class='q'>(English not filled yet)</p><details><summary>original (IT)</summary><p class='th-it'>4 Cosa si intende con il termine popolazione attiva?\n\nGli occupati\nL&#x27;insieme delle forze di lavoro\nè Le persone in cerca di occupazione\n\nGli individui maggiorenni\n. Nessuna delle precedenti\nLa risposta esatta è la | -.. Con il termine popolazione attiva si intendono sia le persone occupate (alterna-\n\ntiva (.. 1) sia quelle in cerca di occupazione (alternativa). Il rapporto tra le persone appartenenti alle for-\nze di lavoro e il totale della popolazione viene chiamato tasso di attività.</p>
