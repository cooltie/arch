<style>
:root{
  --bg:#15181c; --card:#1f242a; --panel:#191d22; --panel-h:#242a30;
  --ink:#eef2f6; --body:#e6ecf2; --muted:#93a0ad; --muted2:#9aa7b3;
  --line:#2e353d; --accent:#4f9ad6; --accent-h:#74b3e4; --chip-on:#2a3138;
  --chip:rgba(255,255,255,.09); --chip-h:rgba(255,255,255,.14);
  --label:"Space Grotesk",ui-monospace,monospace;
}
body[data-theme=light]{
  --bg:#eee2cc; --card:#f6efdd; --panel:#e4d7bb; --panel-h:#d9cba9;
  --ink:#33291e; --body:#33291e; --muted:#7f7668; --muted2:#a89c85;
  --line:#ddd0b4; --accent:#7f7668; --accent-h:#9c8f76; --chip-on:#ddd0b4;
  --chip:rgba(0,0,0,.06); --chip-h:rgba(0,0,0,.1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{overflow-x:hidden}
html,body{margin:0;background:var(--bg)}
body{color:var(--ink);font-family:'Hanken Grotesk',sans-serif;
  min-height:100dvh;display:flex;flex-direction:column;align-items:center;
  padding:0 16px env(safe-area-inset-bottom,16px)}
a{color:var(--accent);text-decoration-color:rgba(79,154,214,.5)}
a:hover{color:var(--accent-h)}

/* header */
header{width:100%;max-width:760px;display:flex;justify-content:space-between;
  align-items:center;gap:12px;flex-wrap:wrap;padding:18px 2px 14px}
h1{font-family:var(--label);font-size:17px;font-weight:600;letter-spacing:.01em;margin:0}
h1 .sub{color:var(--muted);font-weight:400}
.themes{display:flex;gap:4px;background:var(--panel);border-radius:10px;padding:3px}
.themes button{font-family:var(--label);font-size:11px;letter-spacing:.09em;text-transform:uppercase;
  border:none;border-radius:8px;padding:7px 14px;cursor:pointer;white-space:nowrap;
  background:transparent;color:var(--muted)}
.themes button.on{background:var(--chip-on);color:var(--ink)}

/* tabs */
.controls{position:sticky;top:0;z-index:10;width:100%;max-width:760px;display:flex;
  align-items:stretch;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px;
  overflow-x:auto;background:var(--bg);padding-top:8px;
  scrollbar-width:none;-ms-overflow-style:none}
.controls::-webkit-scrollbar{display:none;width:0;height:0}
.controls button{font-family:var(--label);font-size:12px;letter-spacing:.11em;text-transform:uppercase;
  background:none;border:none;cursor:pointer;padding:10px 12px 12px;white-space:nowrap;
  display:flex;align-items:baseline;gap:6px;color:var(--muted);box-shadow:none}
.controls button .c{font-size:10px;color:var(--muted);opacity:.7}
.controls button.on{color:var(--ink);box-shadow:inset 0 -2px 0 0 var(--accent)}
.controls button.on .c{color:var(--accent)}
.controls .spacer{flex:1;min-width:8px;box-shadow:none;pointer-events:none}
.controls button.shuf{color:var(--muted)}
.controls button.shuf:hover{color:var(--accent)}

/* card */
.cardwrap{width:100%;max-width:760px;display:flex}
.card{flex:1;min-height:58dvh;background:var(--card);border-radius:16px;
  padding:26px 30px 26px;
  display:flex;flex-direction:column;user-select:none;touch-action:pan-y;cursor:default}
.cardbody{user-select:text;-webkit-user-select:text}
.card.empty{align-items:center;justify-content:center;background:var(--panel);
  color:var(--muted);font-family:var(--label);font-size:13px;letter-spacing:.1em;text-transform:uppercase}

.cardhead{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.cardhead .ord{font-family:var(--label);font-size:13px;font-weight:600;letter-spacing:.05em;
  color:var(--body);background:var(--chip);border-radius:8px;padding:5px 10px}
.cardhead .kind{font-family:var(--label);font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.cardhead .meta{font-family:var(--label);font-size:11px;letter-spacing:.07em;color:var(--muted)}

.cardbody{color:var(--body);font-family:'Hanken Grotesk',sans-serif;font-weight:300;font-size:18.5px;line-height:1.68}
.cardbody p{margin:0 0 1.2em;text-wrap:pretty}
.cardbody p:last-child{margin-bottom:0}
.cardbody p.bul{margin:2.5em 0 0;padding-left:1.4em;text-indent:-1.4em}
.cardbody p.th-en.bul{margin-top:0}
.cardbody .kindlabel{display:none}
.cardbody .sec{display:none}
.cardbody .q{margin:0 0 1.2em}
.cardbody .th-en{margin:0 0 1.2em}
.cardbody .th-it{color:var(--muted2);font-size:.82em;line-height:1.65;white-space:pre-wrap}
.cardbody details{margin-top:1.3em}
.cardbody summary{cursor:pointer;color:var(--accent-h);font-family:var(--label);font-size:12px;
  letter-spacing:.13em;text-transform:uppercase}
.cardbody img.cardimg{max-width:100%;border-radius:8px;background:#fff;display:block;
  margin:0 0 20px;cursor:zoom-in}

.cardfoot{margin-top:auto;padding-top:26px;display:flex;justify-content:center}
.pass-btn{font-family:var(--label);font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  cursor:pointer;border:none;border-radius:99px;padding:10px 22px;
  color:var(--body);background:var(--chip)}
.pass-btn:hover{background:var(--chip-h)}
.pass-btn.done{color:#a9d0b6;background:rgba(120,190,150,.18)}

/* nav */
.nav{position:sticky;bottom:0;z-index:10;width:100%;max-width:760px;display:flex;
  align-items:center;gap:10px;padding:14px 0 18px;background:var(--bg)}
.nav button{flex:1;font-family:var(--label);font-size:12px;letter-spacing:.13em;text-transform:uppercase;
  background:var(--panel);color:var(--ink);border:none;border-radius:12px;padding:13px 16px;
  min-height:46px;cursor:pointer}
.nav button:hover{background:var(--panel-h)}
.nav button:active{transform:scale(.98)}
.count{font-family:var(--label);color:var(--muted);font-size:13px;min-width:72px;text-align:center}

/* zoom */
#zoom{position:fixed;inset:0;background:rgba(8,10,12,.96);display:none;
  align-items:center;justify-content:center;z-index:50;cursor:zoom-out;padding:12px}
#zoom.show{display:flex}
#zoom img{max-width:100%;max-height:100%;object-fit:contain;background:#fff;border-radius:8px}

<script>
const ALL = [{"kind": "theory", "src": "images/p307_b1.png", "front": "<div class='kindlabel'>THEORY</div><img src='images/p307_b1.png' class='cardimg'><p class='th-en'>(English not filled yet)</p><details><summary>original (IT)</summary><p class='th-it'>Cultura generale\n\nGli esercizi di cultura generale sono gli unici quesiti utilizzati nei test per l&#x27;ammissione ai corsi di laurea di\narchitettura a essere basati esclusivamente sulle conoscenze di carattere nozionistico di ogni candidato.\nNon si tratta dunque di esercizi di tipo attitudinale, volti a saggiare le capacità logiche, linguistiche, nu-\nmeriche, o di ragionamento, ma piuttosto di quesiti volti a misurare le conoscenze dei candidati. L&#x27;utilizzo\ndi tali quesiti nell&#x27;ambito dei test di ammissione alle università italiane è stato relativamente limitato per\nanni, ma è cresciuto fino a diventare importante dal 2019. Gli esercizi di cultura generale pesano ormai\nper un quinto del test e non possono essere presi alla leggera. Occorre quindi esaminare più in dettaglio\nle materie che sono generalmente oggetto dei quesiti e prepararsi adeguatamente con un ripasso delle\nnozioni fondamentali.\n\nIl termine cultura generale è piuttosto ambiguo, essendo teoricamente comprensivo di tutto il sapere\numano, ma di fatto limitandosi a coprire un arco specifico di conoscenze. In Italia, per qualche remoto\nmotivo che ha a che fare con la rilevanza storica degli studi di tipo classico, si è soliti identificare la cultura\ngenerale con le conoscenze di carattere umanistico: filosofia, storia, letteratura, latino, greco ecc. Minore\nimportanza è invece generalmente attribuita alle materie scientifiche, sulle quali uno studente diploma-\nto di scuola media superiore dovrebbe comunque avere una preparazione di base: fisica, matematica,\nbiologia e chimica. Lo stesso tipo di identificazione vige generalmente anche peri test di ammissione alle\nuniversità a numero chiuso. In altre parole, i quesiti della parte di cultura generale sono generalmente di\nnatura umanistica, comprendendo solo raramente domande di carattere scientifico.\n\nGli esercizi di questa parte si presentano, come sempre, sotto forma di quesiti a risposta multipla e verto-\nno generalmente sulle seguenti materie:\n\n* geografia;\n\n* letteratura italiana;\n\n* educazione civica;\n\n+ conoscenze informatiche;\n\n* conoscenze socioeconomiche;\n\n* grammatica italiana.\n\nOccorre anzitutto sottolineare che la vastità dei programmi e delle nozioni su cui vertono i quesiti di cul-\ntura generale rende scarsamente praticabile il ripasso dettagliato di tutte le materie per le quali il candi-\ndato non possieda una buona memoria di quanto studiato nella scuola media superiore. La pratica mi-\ngliore risulta spesso quella di esercitarsi con il maggior numero possibile di quesiti, in modo da\ncomprendere appieno la tipologia, la natura e gli argomenti trattati dalle domande.\n\nÈ tuttavia bene precisare che, rispetto alle domande prive di risposte alternative che inevitabilmente ri-\nchiedono di ricordare ogni singola nozione (per esempio date, nomi ecc.), i quesiti a risposta multipla of-\nfrono al candidato la possibilità di ragionare sulle diverse alternative e spesso di riuscire a scartare quelle\npalesemente errate. Anche un ripasso superficiale potrebbe dunque risultare utile per identificare quan-\ntomeno le risposte manifestamente infondate e per evitare di commettere errori grossolani.\n\nNei paragrafi seguenti vengono analizzate, mediante il ricorso a numerosi esempi, le principali tipologie\ndi quesiti delle materie oggetto degli esercizi di cultura generale.</p></details>", "back": "", "conf": "low", "page": 307, "section": "", "num": null, "_i": 0}, {"kind": "theory", "src": "images/p308_b1.png", "front": "<div class='kindlabel'>THEORY</div><img src='images/p308_b1.png' class='cardimg'><p class='th-en'>(English not filled yet)</p><details><summary>original (IT)</summary><p class='th-it'>A chi desidera approfondire la propria preparazione, si segnalano i due volumi MANUALE ED ESERCIZIARIO PER\n| TEST DI CULTURA GENERALE appartenenti alla collana PASSEPARTOUT (EDIZIONI ALPHA TEST). Attraverso ampie\nparti teoriche e centinaia di esercizi risoltie commentati, i due volumi si propongono come uno strumen-\nto completo per la preparazione ai test selettivi di cultura generale.\n\n$\n\n6.1| Geografia\n\n| quesiti di geografia fanno generalmente riferimento sia a nozioni di carattere puramente geografico\n(estensione geografica, fiumi, monti ecc.), sia a nozioni di tipo geopolitico (capitali, province, confini, po-\npolazioni, religioni ecc.). Negli ultimi decenni le spinte secessioniste verificatesi in numerosi Paesi (Ceco-\nslovacchia, Unione Sovietica, lugoslavia ecc.) hanno radicalmente trasformato la configurazione geopo-\nlitica europea; è dunque consigliabile consultare un atlante geografico aggiornato per rispondere\ncorrettamente anche alle domande più insidiose.\n\nLe tipologie di quesiti di geografia più frequenti sono:\n\n* Quale dei seguenti Paesi/regioni ha la maggiore estensione geografica?\n«Quale dei seguenti Paesi si affaccia/non si affaccia sul mare?\n\n*  Qualè la capitale del...?\n\n*  Qualè il principale fiume/monte/lago del...?\n\n* Dovesfocia il fiume...?\n\n* Quale delle seguenti città/regioni/Paesi è maggiormente popolata?\n\n*  Dovesitrova il fiume/monte/lago/città...?\n\nSono valide alcune considerazioni generali: il ripasso generalizzato è estremamente dispendioso; è pos-\nsibile sfruttare conoscenze superficiali procedendo per esclusione, grazie al fatto che le domande sono a\nrisposta multipla.\n\nDi seguito vengono analizzate, mediante il ricorso ad alcuni esempi commentati, le principali tipologie\ndi domande di geografia.</p></details>", "back": "", "conf": "low", "page": 308, "section": "6.1 Geografia", "num": null, "_i": 1}, {"kind": "question", "src": "images/p308_b2.png", "front": "<img src='images/p308_b2.png' class='cardimg'><p class='q'>(English not filled yet)</p><details><summary>original (IT)</summary><p class='th-it'>1 Quale delle seguenti città non si trova in Germania?\nStrasburgo\nStoccarda\nFrancoforte\nAmburgo\nHannover\n\nLa risposta esatta è la ... Strasburgo si trova nella regione francese dell&#x27;Alsazia. Non solo il nome della\ncittà, ma la lingua di quel territorio risente dell&#x27;influenza delle zone germanofone.</p></details>", "back": "", "conf": "low", "page": 308, "section": "6.1 Geografia", "num": 1, "_i": 2}, {"kind": "theory", "src": "images/p308_b3.png", "front": "<div class='kindlabel'>THEORY</div><img src='images/p308_b3.png' class='cardimg'><p class='th-en'>(English not filled yet)</p><details><summary>original (IT)</summary><p class='th-it'>2 Le “Colonne d&#x27;Ercole” sono:\nun nome del canale della Manica\nle isole Canarie\nle isole Baleari\nun nome del canale di Sicilia\nun nome dello stretto di Gibilterra\n\nSecondo la mitologia, le colonne d&#x27;Ercole erano il punto estremo raggiungibile dall&#x27;uomo navigando sul\nmare e furono poste dal semidio greco per avvisare di ciò i marinai. Questo avveniva quando il mondo\nera limitato praticamente all&#x27;orbita del Mediterraneo. Le colonne d&#x27;Ercole infatti separano il Mediterraneo\ndall&#x27;Oceano Atlantico e delimitano quindi lo stretto di Gibilterra (risposta | -).</p></details>", "back": "", "conf": "low", "page": 308, "section": "6.1 Geografia", "num": null, "_i": 3}, {"kind": "question", "src": "images/p309_b2.png", "front": "<img src='images/p309_b2.png' class='cardimg'><p class='q'>(English not filled yet)</p><details><summary>original (IT)</summary><p class='th-it'>3 Quale di queste città non è capitale di uno Stato?\n°° Taipei\nBuenos Aires\n{&amp; Washington\nReykjavik\n. Maracaibo\n\nTaipei è la capitale di Taiwan, Stato dell&#x27;Asia costituito dall&#x27;isola di Taiwan (o Formosa), dall&#x27;arcipelago del-\nle Pescadores e dalle due isole di Quemoy e Matsu (situate davanti alla costa della Repubblica Popolare\nCinese).\n\nBuenos Aires è la capitale dell&#x27;Argentina; è il principale centro economico e culturale del Paese e una delle\nmaggiori metropoli sudamericane.\n\nWashington è la capitale degli USA; fu costruita appositamente per sostenere il ruolo di capitale federale\ned è il principale centro politico e amministrativo degli Stati Uniti.\n\nReykjavik è la capitale dell&#x27;Islanda; nel 1986 fu la sede del vertice tra Ronald Reagan e Michail Gorbaciov\nche segnò un&#x27;inversione di tendenza nei rapporti tra URSS e USA.\n\nMaracaibo è una famosa e importante città del Venezuela, la cui capitale è Caracas. Pertanto la risposta\nesatta è la (&gt;.</p></details>", "back": "", "conf": "low", "page": 309, "section": "6.1 Geografia", "num": 3, "_i": 4}, {"kind": "question", "src": "images/p309_b3.png", "front": "<img src='images/p309_b3.png' class='cardimg'><p class='q'>(English not filled yet)</p><details><summary>original (IT)</summary><p class='th-it'>q Dove sfocia il Rio delle Amazzoni?\n. Oceano Atlantico\nOceano Indiano\nOceano Pacifico\nMar Caraibico\n. Mar Caspio\n\n| Rio delle Amazzoni è un fiume dell&#x27;America meridionale e sfocia nell&#x27;Oceano Atlantico (risposta esatta\n). È il primo fiume del mondo per ampiezza del bacino (oltre 6 milioni di km?) e il terzo tra i fiumi della\n‘erra per lunghezza (6280 km), dopo il Nilo e il Mississippi.</p></details>", "back": "", "conf": "low", "page": 309, "section": "6.1 Geografia", "num": 4, "_i": 5}, {"kind": "question", "src": "images/p309_b4.png", "front": "<img src='images/p309_b4.png' class='cardimg'><p class='q'>(English not filled yet)</p><details><summary>original (IT)</summary><p class='th-it'>5 Il fiume di Praga è:\nla Moscova\nil Don\nla Neva\n(© la Vistola\nla Moldava\n\na Moscova è il fiume di Mosca, il Don è un fiume della Russia meridionale, la Neva bagna San Pietroburgo,\na Vistola è il fiume di Varsavia. La Moldava è invece il fiume di Praga. Quindi la risposta corr label'>THEORY</div><img src='images/p312_b1.png' class='cardimg'><p class='th-en'>(English not filled yet)</p><details><summary>original (IT)</summary><p class='th-it'>di primo piano nelle lotte risorgimentali. Tra quanti furono influenzati dal pensiero mazziniano e aderiro-\nno alla Giovine Italia va ricordato Giuseppe Garibaldi.</p></details>", "back": "", "conf": "low", "page": 312, "section": "6.2 Letteratura italiana e straniera", "num": null, "_i": 14}, {"kind": "question", "src": "images/p312_b2.png", "front": "<img src='images/p312_b2.png' class='cardimg'><p class='q'>(English not filled yet)</p><details><summary>original (IT)</summary><p class='th-it'>3 Come si chiama il movimento letterario nato in Francia nella seconda metà dell&#x27;Ottocento\nsotto l&#x27;influsso del Positivismo, che prevede l&#x27;applicazione del metodo sperimentale al\nlavoro dello scrittore?\n\nAstrattismo\nClassicismo\nEsistenzialismo\nNaturalismo\n\nDecadentismo\n\nRicordato che astrattismo e esistenzialismo sono rispettivamente movimenti artistici e filosofici del pri-\nmo Novecento e che il classicismo si colloca nel secondo Settecento, la scelta si restringe a decadentismo\ne naturalismo, entrambi di origine francese, entrambi collocabili nel secondo Ottocento. Il primo si svi:\nluppò in opposizione al secondo, che ispirato dal positivismo si propose di applicare il metodo sperimen-\ntale in campo letterario, per descrivere la società e la psicologia dei personaggi che si muovevano in ur\ndeterminato ambiente sociale in una certa epoca storica. Principale teorico del movimento fu lo storico\nTaine. Autori significativi del naturalismo furono Maupassant e Zola. La risposta corretta è la</p></details>", "back": "", "conf": "low", "page": 312, "section": "6.2 Letteratura italiana e straniera", "num": 3, "_i": 15}, {"kind": "question", "src": "images/p312_b3.png", "front": "<img src='images/p312_b3.png' class='cardimg'><p class='q'>(English not filled yet)</p><details><summary>original (IT)</summary><p class='th-it'>4 Chi è l&#x27;autore del romanzo Se questo è un uomo?\n{. Franz Kafka\n(: Hermann Hesse\n(&amp; Thomas Mann\nPrimo Levi\n\nDino Buzzati\n\nLa risposta esatta è la .*.. In quest&#x27;opera, scritta nel 1947, Primo Levi narra la sua esperienza di internato\nnel lager nazista di Auschwitz e della lotta contro l&#x27;annientamento fisico e spirituale.</p></details>", "back": "", "conf": "low", "page": 312, "section": "6.2 Letteratura italiana e straniera", "num": 4, "_i": 16}, {"kind": "theory", "src": "images/p312_b4.png", "front": "<div class='kindlabel'>THEORY</div><img src='images/p312_b4.png' class='cardimg'><p class='th-en'>(English not filled yet)</p><details><summary>original (IT)</summary><p class='th-it'>5 Individuare quale delle seguenti opere NON appartiene al genere letterario delle altre.\nIl processo\nLa fattoria degli animali\nLa montagna incantata\nL&#x27;uomo senza qualità\n\nI fiori del male\n\nLe alternative riportano cinque capolavori della letteratura mondiale. // Processo (alternativa È.3) è un ro-\nmanzo di Kafka pubblicato nel 1925 il cui protagonista è il celebre Josef K, processato per motivi non\nchiari. La fattoria degli animali (alternativa ‘-.) è un romanzo satirico di George Orwell pubblicato nel\n1947; il riferimento polemico dell&#x27;intero romanzo è la dittatura staliniana che ha tradito gli ideali della ri-\nvoluzione; La montagna incantata (alternativa |) è un romanzo di Thomas Mann pubblicato nel 1924\nmentre Robert Musil è l&#x27;autore del romanzo incompiuto, pubblicato fra il 1930 e il 1943, L&#x27;uomo senza\nqualità (alternativa ‘ ©). / fiori del male è un&#x27;opera del poeta francese Charles Baudelaire; non si tratta però\ndi un romanzo ma di una raccolta poetica e quindi l&#x27;alternativa da scegliere è la Î:).\n\nPer la letteratura italiana, è utile disporre di una sintesi che costituisca un&#x27;utile punto di riferimento (e di\npartenza per eventuali approfondimenti) per il ripasso delle nozioni.</p></details>", "back": "", "conf": "low", "page": 312, "section": "6.2 Letteratura italiana e straniera", "num": null, "_i": 17}, {"kind": "theory", "src": "images/p313_b1.png", "front": "<div class='kindlabel'>THEORY</div><img src='images/p313_b1.png' class='cardimg'><p class='th-en'>(English not filled yet)</p><details><summary>original (IT)</summary><p class='th-it'>6.2.1 | Gli esordi\n\n| più antichi documenti in lingua italiana risalgono agli ultimi anni del secolo VIII o ai primi anni del secolo\nIX. Si tratta di un esiguo numero di carte, redatte sia in latino, sia in volgare. Proprio dal latino ha origine\nla lingua italiana, al pari delle altre lingue romanze, attraverso un processo plurisecolare che vede il latino\ncorrompersi in varietà vernacolari e l&#x27;italiano emergere da queste.\n\nSolo nel XIII secolo si producono testi in volgare di un certo valore letterario e la letteratura italiana ai suoi\nesordi comincia a diversificarsi in vari filoni: quello della poesia religiosa, quello didattico-allegorico, quel-\nlo della lirica d&#x27;arte e quello della prosa.\n\n6.2.2 | Il Medioevo\n\nIl Medioevo è compreso convenzionalmente tra il 476, anno della caduta dell&#x27;Impero d&#x27;Occidente, e il\n1492, anno ricco di avvenimenti di grande portata (i principali: morte di Lorenzo il Magnifico e primo\nviaggio di Colombo nelle Americhe). Dal Mille fino al secolo XIV circa l&#x27;economia è in espansione: è questo\nil mondo dei Comuni, della nuova borghesia e dei fervidi sviluppi culturali.\n\nTutto il Medioevo è permeato dalla spiritualità cristiana e percorso da fermenti religiosi. A questo propo-\nsito merita menzione Gioacchino da Fiore (1130-1202), monaco cistercense che concepiva la storia in\nmaniera ciclica distinguendo tre età, ognuna caratterizzata dal regno di ciascuna delle tre persone della\nTrinità. Gioacchino profetizzava l&#x27;avvento dell&#x27;età dello Spirito Santo e interpretava la Chiesa temporale\ncome simbolica prefigurazione del vero cristianesimo, la cui venuta avrebbe coinciso con la purificazione\ndi tutta l&#x27;umanità. Autore di opere di carattere dottrinario in latino, il monaco cistercense esercitò\nun&#x27;enorme influenza su tutto il Medioevo.\n\nLa lirica religiosa\n\nÈ un tipo di poesia molto diffusa nel Medioevo, interpretata da numerosi artisti. Tra i maggiori:\n\nSan Francesco (1181-1226). Legato ai principi evangelici della povertà e dell&#x27;amore verso il prossimo, rin-\nnovò profondamente il cristianesimo. Dal punto di vista letterario, viene ricordato per la composizione\ndel Cantico delle Creature (forse nel 1224), lirica ricca di semplicità e candore, non certo priva d&#x27;arte, con-\nsiderata una delle prime opere capitali della poesia italiana.\n\nJacopone da Todi (1236-1306). Personalità inquieta, travagliata, tesa al congiungimento con Dio e al ri-\npudio del male, del peccato e della vita stessa. Compose circa un centinaio di Laudi, ricche di misticismo.\nTra le più famose: O Signor per cortesia; Che farai, fra&#x27; lacopone? e Il pianto della Madonna.\n\nLa poesia popolare, giocosa, burlesca\n\nLa poesia popolare è un genere letterario diffuso più o meno in tutte le epoche. Gran parte di questa pro-\nduzione è sopravvissuta in forma anonima. La poesia giocosa e burlesca non è invece sempre di ascenden-\nza popolare: essa nasce dalla stessa matrice culturale della poesia cortese ed è un&#x27;arte matura e consape-\nvole. Suoi rappresentanti sono:\n\nCielo d’Alcamo (secolo XIII). Poche le notizie disponibili: fu con ogni probabilità un giullare. È autore di\nun famoso “contrasto” comico, di intento satirico, tra due popolani, intitolato Rosa fresca aulentissima.\nCecco Angiolieri (1260 ca.-1313 ca.). È il più famoso rimatore burlesco, ma seppe comporre anche sonet-\nti “seri” a riprova di come la scelta per il burlesco fosse dotta e matura, in contrapposizione con la produ-\nzione cortese e religiosa. Suoi temi preferiti sono l&#x27;amore terreno, la taverna, i dadi, il lamento della po-\nvertà, l&#x27;esaltazione della ricchezza, l&#x27;irritazione contro il padre. Celebri sono i sonetti Tre cose solamente e\nS&#x27;i&#x27; fosse foco.\n\nIl Cantar Cortese\n\nL&#x27;influenza della poesia francese trobadorica si fece sentire anche in Italia. Oltre ad artisti italiani, che po-\netarono in lingua provenzale, come Sordello da Goito, Lanfranco Cigala, Pier della Vigna, l&#x27;imperatore\nFederico Il e suo figlio Enzo, nacque in Italia un&#x27;autentica scuola poetica, quella del Cantar Cortese. Og-\ngetto esclusivo del Cantar Cortese è l&#x27;amore, visto soprattutto nella dimensione sensuale, ma ingentilito\ndalla concezione della donna come essere superiore, quasi ella fosse feudataria e il poeta vassallo. Il cen-\ntro di maggior diffusione di questo genere di lirica fu Palermo, sede della corte di Federico Il, ove già era-</p></details>", "back": "", "conf": "low", "page": 313, "section": "6.2.1 Gli esordi", "num": null, "_i": 18}, {"kind": "theory", "src": "images/p314_b1.png", "front": "<div class='kindlabel'>THEORY</div><img src='images/p314_b1.png' class='cardimg'><p class='th-en'>(English not filled yet)</p><details><summary>original (IT)</summary><p class='th-it'>no attivi i poeti italiani in lingua provenzale, rispetto ai quali gli artisti del Cantar Cortese si differenziano\nnon per una diversità di temi, ma per l&#x27;uso della lingua italiana. Questi poeti, che furono detti “siciliani”\nperché operarono sotto la protezione dell&#x27;imperatore, benché originari di un po&#x27; tutta la Penisola, ebbero\ni loro maggiori rappresentanti in: lacopo da Lentini, Guido delle Colonne, Rinaldo d&#x27;Aquino.\nUn&#x27;esperienza poetica per molti aspetti simile a quella della scuola siciliana si sviluppò in Toscana, la re-\ngione italiana a quel tempo più progredita nelle arti e nelle lettere. | poeti toscani cortesi più importanti\nsono Guittone d’Arezzo, Bonagiunta Orbicciani, Chiaro Davanzati e Monte Andrea. Essi sono anche\ndetti “pre-stilnovisti”, in quanto la loro poesia anticipa per diversi aspetti l&#x27;esperienza degli Stilnovisti di\nuna generazione successiva.\n\nO | Guittone d&#x27;Arezzo (1235 ca.-1294). Limitatamente alla sua produzione amorosa (di quella civile\n\ndì e religiosa si parlerà più oltre), occorre ricordare lo stile aspro, complesso e, persino, volutamente\noscuro, che si ispira alla tendenza stilistica della lirica provenzale, il trobar clus, caratterizzata da un\nlinguaggio ricercato.\n\nLo Stilnovo\n\nLo Stilnovo deriva dal Cantar Cortese. L&#x27;amore resta naturalmente il tema poetico privilegiato, anche se\ntalvolta a esso si affiancano argomenti diversi (didattici, morali, politici) e, soprattutto, il poeta si esprime\nin un&#x27;ottica più interiorizzata e personalizzata, abbandonando quel gusto esasperato peri modelli e le re-\ngole che aveva contraddistinto il Cantar Cortese. La donna occupa sempre una posizione superiore ri-\nspetto al poeta; ora, tuttavia, viene idealizzata e raffigurata come un angelo che muove al bene il cuore\ndell’uomo. L&#x27;amore è invece considerato come un soggetto autonomo, talvolta simile a un&#x27;idea platonica\noppure personificato, ma sempre come un&#x27;entità a sé stante, estranea al poeta e alla donna amata.\n\nLo Stilnovo è anche detto Dolce Stilnovo per sottolinearne un&#x27;altra esclusiva peculiarità, cioè la delica-\ntezza dei toni e delle espressioni impiegate dal poeta, la soavità espressiva e la musicalità. L&#x27;utilizzo\ndell&#x27;aggettivo “dolce” si deve a Dante, che per primo ha identificato questa nuova corrente poetica, nata\ncol Guinizzelli, a cui egli stesso ha aderito.\n\n&quot;a\n\n| Guido Guinizzelli (1235 ca.-1276). È il caposcuola dello Stilnovo. A lui si devono la rottura con gli\n| schemi cortesi e l&#x27;introduzione dei concetti della donna angelicata, la cui bellezza è emblema di\n| quella di Dio, e del cammino di nobilitazione del poeta che, grazie all&#x27;amore, arriva alla virtù e alla\n| salvezza dell&#x27;anima. Importante è la canzone Al cor gentile rempaira sempre Amore, vero e proprio\n| manifesto dello Stilnovo.\n\n| Guido Cavalcanti (1260 ca.-1300). Amico di Dante, uomo politico influente prima di essere esilia-\n| to da Firenze, elaborò una rappresentazione tragica dell&#x27;esperienza sentimentale. L&#x27;amore è vissu-\n| to drammaticamente come passione che ottenebra la ragione e suscita la morte. Le canzoni più fa-\n‘| mose di Cavalcanti sono Donna me prega perch&#x27;eo voglio dire, Perch&#x27;io no spero di tornar giammai e il\n‘ sonetto Chi è questa che ven, ch&#x27;ogn&#x27;om la mira.\n\n&#x27; Cino da Pistoia (1270 ca.-1336 ca.). Amico di Dante, dal quale fu esaltato come poeta eccelso, Ci-\n| no merita un posto nella storia anche come grande giurisperito. La sua poesia è autobiografica co-\n! me quella di Cavalcanti, ma meno metafisica e più umana. La rappresentazione che egli fa della\n| donna è meno astratta.\n\n| Dante (1265-1321). Merita qui una menzione per i suoi esordi stilnovistici, concretizzatisi nelle li-\nriche Guido, i’ vorrei che tu e Lapo ed io, Per una ghirlandetta, Per quella via che la bellezza corre e nel\nromanzo intimistico Vita nuova.\n\nLa poesia didattica e allegorica\n\nÈ un genere di poesia di importanza centrale nel Medioevo, in cui predomina la concezione di arte come\nstrumento di diffusione di fede e di morale, operante magari con forme e immagini che simbolicamente\ncelano verità superiori tramite la figura retorica dell&#x27;allegoria, che tanta fortuna ha nell&#x27;arte medievale.\nBrunetto Latini (1220 ca.-1294). Fu maestro riconosciuto di Dante. In questa sede deve essere ricordato\nper l&#x27;opera in versi // Tesoretto, compendio enciclopedico in forma allegorica di etica, filosofia naturale e\nteologia. Scrisse anche in prosa i Livres dou Tresor in francese, una sorta di enciclopedia precettistica, e La\nrettorica, in cui traduce e commenta alcune orazioni di Cicerone.</p></details>", "back": "", "conf": "low", "page": 314, "section": "6.2.1 Gli esordi", "num": null, "_i": 19}, {"kind": "theory", "src": "images/p315_b1.png", "front": "<div class='kindlabel'>THEORY</div><img src='images/p315_b1.png' class='cardimg'><p class='th-en'>(English not filled yet)</p><details><summary>original (IT)</summary><p class='th-it'>La prosa e la trattatistica\n\nLa produzione in prosa volgare è più tarda di quella in versi e compare solo nell&#x27;ultima parte del Duecen-\nto. L&#x27;influsso francese è notevole, come testimoniano le traduzioni delle gesta di cavalieri e crociati, delle\nleggende carolinge e bretoni (chansons de geste) e i Livres di Brunetto Latini.\n\nTra gli autori più importanti si ricordano:\n\nGuittone d&#x27;Arezzo (1235 ca.-1294). Rimatore toscano di ispirazione cortese, compose in poesia anche\ncanzoni politiche e civili. A circa trent&#x27;anni, riscoprì la fede ed entrò nell&#x27;ordine dei Cavalieri di Santa Maria.\nIl cambiamento di vita si riflesse anche sulla sua produzione letteraria. Abbandonate le liriche d&#x27;amore,\nscrisse una serie di Lettere in prosa, contenenti sermoni morali, in uno stile acceso e retorico.\n\nMarco Polo (1254-1324). Commerciante veneziano, da giovane fece viaggi nella Cina del Gran Khan, do-\nve soggiornò per 24 anni ricoprendo alti incarichi, ammirando le meraviglie del luogo e apprendendo i\ncostumi di quel Paese. Tornato in Italia, con l’aiuto del letterato Rustichello da Pisa, condensò la propria\nesperienza nel libro noto come // Milione. L&#x27;opera fu scritta in francese, a riprova dell&#x27;influenza della Fran-\ncia sulla cultura italiana del tempo.\n\nIl Novellino. È un&#x27;opera di autore ignoto del tardo Duecento, che raccoglie cento novelle e aneddoti, ispi-\nrati spesso a personaggi storici o leggendari. Lo scritto si rivolge al mondo borghese dell&#x27;età comunale,\ncon l&#x27;intento di istruirlo e di allietarlo.\n\nDino Compagni (1255 ca.-1324). Fu un importante uomo politico di Firenze, città della quale narrò le vi-\ncende accadute tra il 1280 e il 1312 nell&#x27;opera intitolata Cronica delle cose occorrenti ne&#x27; tempi suoi.\n\nPrincipali autori della letteratura medioevale\n\nDante Alighieri (1265-1321)\n\nMassimo poeta italiano, fu dotato di una personalità della cui rilevanza è impossibile dar conto in poche\nrighe. Gli avvenimenti salienti della sua vita furono: l&#x27;amore per Beatrice, l&#x27;attiva partecipazione alla vita\npolitica di Firenze nella fazione guelfa bianca; l&#x27;adesione all&#x27;ideologia imperiale; l&#x27;inimicizia con papa Bo-\nnifacio VIII; l&#x27;esilio e il girovagare tra le corti di amici potenti. Morì esule a Ravenna, avendo sempre rifiu-\ntato ogni compromesso politico e morale.\n\nAmpia fu la sua produzione letteraria. Vita nuova (1293) è un resoconto spirituale, che tratta dell&#x27;amore\ndi Dante per Beatrice e della precoce morte di lei. Si tratta di uno scritto misto di prosa e di poesia (detto\nquindi prosimetro, le cui canzoni più celebri sono Donne ch&#x27;avete intelletto d&#x27;amore e Tanto gentile e tanto\nonesta pare), che rivela l&#x27;adesione di Dante allo Stilnovo. Le Rime sono un&#x27;opera non unitaria, che racchiu-\nde tutta la produzione in versi di Dante, dalla giovinezza fino alla piena maturità. Il De vulgari eloquentia\n(1303) è un libro incompiuto, scritto in latino, attraverso il quale l&#x27;autore rivendica al volgare un valore ar-\ntistico e letterario. Ugualmente non finito è il Convivio (1304-1307): doveva essere un commento in vol-\ngare a quattordici canzoni dello stesso autore, ma, dopo un trattato introduttivo, si arresta alla quarta\ncanzone. La Monarchia (forse 1308) è un trattato politico in latino, in cui Dante espone compiutamente\nla teoria dell&#x27;indipendenza del potere imperiale da quello papale, sostenendo che entrambe le potestà\ndiscendono da Dio e hanno lo scopo di promuovere il bene temporale e spirituale dell&#x27;umanità. Le Epi-\nstole raccolgono tredici lettere scritte da Dante in tempi diversi e per scopi diversi. Infine la Divina Com-\nmedia è il capolavoro in tre cantiche (Inferno, Purgatorio e Paradiso), in cui Dante ha modo di esprimere\nal meglio le sue idee poetiche, filosofiche, politiche, morali, religiose; Beatrice ora più che mai è guida ce-\nleste alla salvezza dell&#x27;anima. L&#x27;opera è scritta in terza rima, metro inventato dallo stesso Dante.\nFrancesco Petrarca (1304-1374)\n\nPersonalità irrequieta, lontana dalle salde certezze di Dante, Petrarca ebbe una vita più tranquilla, ma non\nmeno errabonda. Credente fervido e tormentato , oscillò con perenne insoddisfazione tra tensioni spiri-\ntuali e godimento dei beni terreni, sempre con un sentimento pungente di vanità delle cose. La sua po-\nesia fu molto apprezzata già dai contemporanei, tanto che nel 1341 venne solennemente incoronato po-\neta dal Senato di Roma, dopo che anche la Sorbona di Parigi gli aveva offerto il medesimo onore. A\nNapoli, invece, conseguì la laurea, sottoponendosi all&#x27;esame dell&#x27;anziano e dottissimo re Roberto d&#x27;An-\ngiò. Per taluni aspetti Petrarca anticipa l&#x27;’Umanesimo: per il suo amore per i classici latini e greci; per la pas-\nsione filologica; per il ripudio consapevole dell&#x27;età altomedioevale, considerata età di decadenza, per l&#x27;at-\ntenzione all&#x27;interiorità dell&#x27;uomo. Tuttavia è ancora medioevale per la concezione dell&#x27;arte con finalità</p></details>", "back": "", "conf": "low", "page": 315, "section": "6.2.1 Gli esordi", "num": null, "_i": 20}, {"kind": "theory", "src": "images/p316_b1.png", "front": "<div class='kindlabel'>THEORY</div><img src='images/p316_b1.png' class='cardimg'><p class='th-en'>(English not filled yet)</p><details><summary>original (IT)</summary><p class='th-it'>dascalica e della poesia come ricerca di verità religiosa. Petrarca può essere considerato quindi il sim-\nolo della crisi e del trapasso dal Medioevo all&#x27;Umanesimo. Il Canzoniere rappresenta l&#x27;opera somma di\netrarca: fu composto tra il 1330 e il 1365, comprende 366 tra sonetti e altre poesie (la più famosa è la\ninzone Chiare, fresche e dolci acque), selezionate rigorosamente all&#x27;interno della sua più vasta produzio-\n2. Apparentemente il tema dell&#x27;opera è l&#x27;amore per Laura, che rappresenta a un tempo bellezza, arte,\nmore, gloria, peccato, onore, morte; in realtà il Canzoniere è la storia di un&#x27;anima inquieta e fragile, tesa\na l&#x27;ideale e la realtà, che attraverso una fitta rete di contraddizioni perviene all&#x27;incontro con Dio. | Trionfi\na cui elaborazione durerà fino alla morte) sono un&#x27;opera in terza rima, come la Divina Commedia, di sa-\nore piuttosto medioevale per il suo scopo pedagogico e l&#x27;affinità alle “visioni” medioevali, dove l&#x27;autore\nmagina di assistere al trionfo dell&#x27;Amore, della Pudicizia, della Morte, della Fama, del Tempo e dell’Eter-\ntà. L&#x27;Africa (1338-1341), in latino, è un poema incompiuto che tratta della storia di Roma antica, propo-\na a modello di civiltà. Le Epistolae metricae sono sessantasei lettere in versi, composte dal 1331 al 1361,\n\\vario argomento: politico, morale, autobiografico. Il Secretum, scritto in latino quasi di getto (1342-43),\nuna sorta di diario, nel quale Petrarca espone i suoi contrasti interiori e la sua ricerca di verità. Le Episto-\ne, infine, presentano una scelta, compiuta dall&#x27;autore stesso, di lettere scritte nel corso della sua vita.\n\niovanni Boccaccio (1313-1375)\n\nato nei dintorni di Firenze, in gioventù si trasferì a Napoli, città che amò molto e gli diede modo di osser-\nire e conoscere i più svariati tipi umani. Grande erudito autodidatta e costantemente perseguitato dalla\novertà, sperimentò l&#x27;amore per una donna (Fiammetta), che ritrasse nelle sue opere con tratti molto ter-\nni, diversamente dalla Beatrice di Dante e dalla Laura di Petrarca. Tornato a Firenze, ebbe importanti in-\nirichi per conto del Comune, tra cui quello di “leggere”, cioè di esporre e di commentare, la Divina Com-\nedia. Nella tarda maturità ebbe una crisi religiosa, che modificò sensibilmente il tono della sua\nroduzione letteraria e che superò grazie all&#x27;amicizia di Petrarca. L&#x27;opera principale di Boccaccio è il Deca-\neron (forse 1349-1353), raccolta di cento novelle, intervallate da parti in poesia. Esse sanno rappresentare\non impareggiabile maestria tutta la gamma di situazioni, sentimenti, aspirazioni, miserie e virtù umane, a\nrescindere da ogni moralismo, preoccupazione escatologica o intento allegorico. Altre opere degne di\nlenzione sono il Fi/ocolo, il Filostrato, il Teseida, la Comedia delle Ninfe fiorentine (1341), l&#x27;Elegia di madonna\nammetta (1343), il Ninfale fiesolano (1344) e il Corbaccio (1363-66), opera questa che risente della crisi spi-\ntuale della vecchiaia.\n\n.2.3 | L&#x27;Umanesimo\n\nimiti cronologici dell&#x27;Umanesimo sono convenzionalmente fissati tra il 1453 (anno della presa di Co-\nantinopoli da parte dei Turchi) e il 1492 (anno della morte di Lorenzo il Magnifico). | Comuni cominciano\ncedere il passo alle Signorie. Dal punto di vista culturale e artistico l&#x27;età è molto ricca e prelude al Rina-\nimento. Gli umanisti principali sono:\n\nlarsilio Ficino (1433-1499). È il fondatore e il massimo esponente dell&#x27;Accademia platonica di Firenze,\nalla quale nacque quella nuova filosofia, che ha di mira la bellezza dell&#x27;universo, la purezza delle forme e\narmonia delle creazioni, che doveva improntare di sé tutta l’arte del Rinascimento. Scrisse la Teologia pla-\nnica (1469-74).\n\nico della Mirandola (1463-1494). Personaggio di spicco del platonismo umanistico fiorentino, fu mem-\nro dell&#x27;Accademia platonica e amico del Ficino, del Poliziano e del Magnifico. Notissima è la sua Oratio de\nominis dignitate (1486).\n\nrigi Pulci (1432-1484). È un autore portato a cogliere il lato comico delle cose, senza tralasciare la me-\ntazione su problemi filosofici e religiosi. La sua opera principale è il Morgante, poema in ottave di argo-\nlento cavalleresco, che narra vicende del gigante Morgante a seguito del paladino Orlando.\n\nlatteo Maria Boiardo (1441-1499). Visse nell&#x27;orbita della corte degli Estensi di Ferrara, come letterato e\ninzionario d&#x27;alto rango. Fu un profondo conoscitore dei classici. L&#x27;Orlando innamorato è il suo capolavo-\n. Qui, il poeta fonde il ciclo di leggende carolinge con quello bretone, esprimendo i suoi supremi ideali\nvallereschi: la prodezza guerriera e l&#x27;amore. Altre opere degne di menzione sono le Rime di argomento\nnoroso e il Timone, tentativo di resuscitare il teatro classico.</p></details>", "back": "", "conf": "low", "page": 316, "section": "6.2.3 L'Umanesimo", "num": null, "_i": 21}, {"kind": "theory", "src": "images/p317_b1.png", "front": "<div class='kindlabel'>THEORY</div><img src='images/p317_b1.png' class='cardimg'><p class='th-en'>(English not filled yet)</p><details><summary>original (IT)</summary><p class='th-it'>Leon Battista Alberti (1404-1472). Molto dotto, architetto di primaria importanza (tra le sue opere: il\nTempio Malatestiano di Rimini e la facciata di Santa Maria Novella a Firenze) e grande ammiratore della\nclassicità, cercò di conciliare l&#x27;antico e il moderno tanto nelle sue opere architettoniche quanto in quelle\nletterarie. Il suo scritto più famoso è il Della Famiglia, dove esprime l&#x27;amore per l&#x27;armonia, la bellezza, la\nserenità, l&#x27;operosità, la vita e la fiducia nell&#x27;uomo, tutti elementi che la famiglia rappresenta e incarna.\n\nLorenzo de’ Medici (1449-1492). Fin dalla giovinezza fu il reggitore saggio e prudente del Governo fio-\nrentino. Di fatto, egli fu l&#x27;ago della bilancia di tutta la vita politica italiana e seppe sia mantenere la pace\nche preservare la Penisola dai tentativi espansionistici stranieri. È autore, tra altre opere, dei Canti Carna-\nscialeschi, tra i quali vi è la Canzona di Bacco, che inizia con i famosissimi versi: «Quant&#x27;è bella giovinezza,\n/ che si fugge tuttavia! / Chi vuol esser lieto sia: / di doman non c&#x27;è certezza». Le sue eccelse qualità gli\nvalsero il soprannome di Magnifico.\n\nAngelo Poliziano (1454-1494). Divise la sua vita tra la corte del Magnifico e quella dei Gonzaga di Man-\ntova. Le opere maggiori sono l&#x27;Orfeo, le Silvae, le Stanze per la giostra, i Carmina. La sua poesia è tesa alla\nricerca della bellezza e dell&#x27;armonia della natura, che si riflette nell&#x27;animo umano, portando saggezza e\nserenità. Tra le opere in prosa, ricordiamo le Praelectiones e la Miscellanea, che trattano di grammatica e\nortografia delle lingue classiche e di interpretazione di passi oscuri di antiche opere.\n\nLeonardo da Vinci (1452-1519). Personalità dagli interessi vastissimi, fu pittore sommo (ricordiamo il Cena-\ncolo, la Vergine delle Rocce e la Gioconda), pensatore originale, scienziato e filosofo. Elaborò il principio dell&#x27;in-\ndagine che parte dall&#x27;esperienza e rifiuta l&#x27;autorità precostituita, aprendo così la via al naturalismo filosofico\ne scientifico. Autodefinitosi “omo sanza lettere&quot;, scrisse sempre in volgare; le sue opere più importanti sono\nil Trattato della pittura, le Favole e le Facezie, oltre a una notevole mole di appunti, raccolti in codici diversi.\n\n6.2.4 | Il Rinascimento\n\nÈ il periodo aureo della cultura italiana, caratterizzato dal fiorire di tutte le arti e le scienze, che si estende\napprossimativamente dal 1492 al 1600, cioè fino al rogo di Giordano Bruno.\n\nGli esponenti principali della cultura rinascimentale sono:\n\nO Niccolò Machiavelli (1469-1527). Si formò nella Firenze del Magnifico e vi ricoprì incarichi diplo-\n\nÒ matici e politici importanti. Opera somma è il Principe, dove il Machiavelli espone le sue convin-\nzioni politiche: la costruzione dello Stato è lo scopo supremo, al quale bisogna sacrificare la vita e\nl&#x27;anima, in quanto esso incarna il bene collettivo. Il principe, identificato in Cesare Borgia (il Duca\nValentino), sarebbe stato così colui che avrebbe dato all&#x27;Italia un governo nuovo. Altre opere sono\nl&#x27;Arte della guerra, le Istorie fiorentine, la Vita di Castruccio Castracani, le Lettere, i Discorsi. Una men-\nzione particolare merita la Mandragola, capolavoro comico del teatro europeo.\n\nFrancesco Guicciardini (1483-1540). Come Machiavelli, anche Guicciardini ricoprì a Firenze importanti\nincarichi politici. Le sue tesi politiche sono però una revisione critica di quelle del Segretario fiorentino,\ndel quale egli rifiuta l’estremismo utilitaristico e dal quale diverge per il proprio pessimismo e per il ripie-\ngamento su orizzonti individuali, anziché collettivi e nazionali. Guicciardini ebbe soprattutto interessi\nstorici ed è considerato il fondatore della storiografia moderna. Tra le opere principali vi sono: Storia d&#x27;Ita-\nlia e Storie fiorentine, Ricordi politici e civili, Considerazioni intorno ai Discorsi del Machiavelli.\nO Ludovico Ariosto (1474-1533). Operò alla vivace corte ferrarese sia come letterato sia come fun-\nS zionario di alto rango. Il suo capolavoro è il poema in ottave Orlando furioso (prosecuzione di quel-\nlo del Boiardo), opera che sintetizza splendidamente la civiltà e i valori del Rinascimento: il caval-\nleresco, l&#x27;assenza di Dio, l&#x27;individualismo, la generosità, la nobiltà d&#x27;animo, l&#x27;amore sensuale,\nl&#x27;armonia; il tutto, cantato con ineffabile ironia.\nAltre opere di Ariosto sono le Rime, le Satire e alcune commedie (Cassaria, Suppositi, Negromante\necc.).</p></details>", "back": "", "conf": "low", "page": 317, "section": "6.2.4 Il Rinascimento", "num": null, "_i": 22}, {"kind": "theory", "src": "images/p318_b1.png", "front": "<div class='kindlabel'>THEORY</div><img src='images/p318_b1.png' class='cardimg'><p class='th-en'>(English not filled yet)</p><details><summary>original (IT)</summary><p class='th-it'>Pietro Bembo (1470-1547). Poeta e scrittore, conobbe alcune delle personalità letterarie più in vista dei\nsuoi tempi (tra cui l&#x27;Ariosto). Deve la sua fama principalmente alla difesa della lingua italiana come lingua\nletteraria e alla promozione di Petrarca come modello della poesia lirica (petrarchismo). Fu anche un\nesponente di spicco di quel neoplatonismo che pervase la cultura italiana verso la fine del Rinascimento.\nTra le sue opere si ricordano le Prose della volgar lingua, i Rerum venetarum historiae libri XII, gli Asolani, le\nRime.\n\nBaldassarre Castiglione (1478-1529). Visse in un periodo difficile, quello delle guerre tra Francia e Spa-\ngna per la supremazia in Italia. Fu uomo d&#x27;armi, diplomatico e in età matura nunzio apostolico. La sua per-\nsonalità fu talmente arguta da meritarsi l&#x27;ammirazione di Carlo V. L&#x27;opera maggiore del Castiglione fu il\nLibro del Cortegiano, in cui l&#x27;autore espose l&#x27;ideale del perfetto uomo di corte rinascimentale.\n\nGiovanni Della Casa (1503-1556). Fu arcivescovo di Benevento e partecipò a molti processi per eresia.\nScrisse in latino e in volgare. Le sue Orazioni e le Lettere sono modelli di eloquenza. Compose anche Rime\ndi ispirazione petrarchesca. L&#x27;opera maggiore è però il Galateo, che, analogamente al Principe di Machia-\nvelli e al Cortegiano di Castiglione, illustra regole ideali di comportamento per la vita mondana.\n\nMichelangelo Buonarroti (1475-1564). Oltreché pittore e scultore tra i più grandi di ogni tempo, fu an-\nche un letterato di buon livello. L&#x27;incontro con il Magnifico e con il Savonarola segnò profondamente la\nsua vita. Compose versi (le Rime), nei quali espresse il personale sentimento di caducità della vita, la sua\nfervida fede religiosa e gli ideali platonici di ricerca del bello.\n\nBenvenuto Cellini (1500-1571). Dotato di un&#x27;insopprimibile vitalità, convinto di essere un uomo supe-\nriore e come tale non tenuto all&#x27;osservanza della legge, ebbe una vita assai movimentata. Fu soprattutto\nun orafo e uno scultore abilissimo. In campo letterario, si segnala per l&#x27;autobiografica Vita, originale e co-\nlorita ricostruzione della sua personalità vulcanica.\n\nAngelo Beolco, detto il Ruzante o Ruzzante (1496 ca.-1542). È uno dei maggiori commediografi del Cin-\nquecento, nonostante si sia discostato volutamente dai canoni e dalla raffinatezza letterari rinascimenta-\nli. In quest&#x27;ottica, egli scelse di rappresentare il mondo degli umili e di servirsi del dialetto padovano. Sue\nopere principali sono la commedia nota come Betia, il Bilora e il Reduce.\n\n| Torquato Tasso (1544-1595). Personalità sensibile, ai limiti della follia, ebbe una vita travagliata e\n\nsofferta. Soggiornò alla corte degli Este di Ferrara; conobbe anche esperienze diverse e più dolo-\nÎ rose, come il faticoso errabondare per l’Italia e la detenzione per sette anni nell&#x27;ospedale psichia-\n{ trico di sant&#x27;Anna, quasi in regime carcerario. Opera somma è il poema epico di argomento caval-\n| leresco la Gerusalemme liberata; il poema venne rivisto più tardi dal Tasso, con lo scopo di\n| conformarla ai principi della censura controriformistica; ne vennero sacrificate le parti giudicate\n| più audaci, mentre ne furono inserite altre di esaltazione della devozione cattolica. Ne risultò così\n! un&#x27;opera nuova, la Gerusalemme conquistata. Altri componimenti del Tasso sono i Discorsi dell&#x27;arte\n| poetica, l&#x27;Aminta, le Rime, i Dialoghi, le Lettere.\n\nGiordano Bruno (1548-1600). Domenicano, colto e irrequieto, attirò più di una volta i sospetti dell’Inqui-\nsizione, tanto che dovette prudentemente riparare in Francia, in Inghilterra, dove compose alcune delle\nsue opere maggiori di argomento filosofico (la Cena de le ceneri, De la causa, principio et uno, De l&#x27;infinito\nuniverso et mondi), e poi in Germania. Rientrato in Italia, nel 1600, fu condannato per eresia e messo al\nrogo. La sua morte simboleggia la fine del Rinascimento. Altre opere di Bruno sono di argomento morale\n(lo Spaccio de la bestia trionfante, la Cabala del cavallo pegaseo con l&#x27;aggiunta dell&#x27;asino cillenico, De gli eroi-\nci furori). Scrisse anche tre poemi in latino (De minimo, De monade, De immenso et innumerabilius) e una\ncommedia di successo in volgare, Candelaio.\n\nTommaso Campanella (1568-1639). Nato da una famiglia di contadini calabresi, divenne uno dei mag-\ngiori filosofi italiani. Rifiutò l&#x27;aristotelismo imperante e si dedicò allo studio della natura e a quello della\nvita associata. Per tutta la vita gravarono su di lui i sospetti dell’Inquisizione: fu più volte torturato e incar-\ncerato per quasi metà della sua vita. La sua opera maggiore è la Città del Sole, trattato filosofico utopistico\nin cui descrive il modello di società ideale.</p></details>", "back": "", "conf": "low", "page": 318, "section": "6.2.4 Il Rinascimento", "num": null, "_i": 23}, {"kind": "theory", "src": "images/p319_b1.png", "front": "<div class='kindlabel'>THEORY</div><img src='images/p319_b1.png' class='cardimg'><p class='th-en'>(English not filled yet)</p><details><summary>original (IT)</summary><p class='th-it'>6.2.5 | Il Seicento\n\nÈ l&#x27;età in cui l’Italia è relegata, sul piano politico, al rango di terra di conquista mentre sul piano spirituale,\nincombono gli strali della Controriforma, con gravi conseguenze nell’ambito culturale. Artisticamente è\nil secolo del Barocco. Tra i principali autori si ricordano:\n\nPaolo Sarpi (1522-1623). Intelletto vivace, studiò la teologia, la filosofia, il diritto, la matematica, la medi-\ncina, le scienze naturali e la storia. Fu amico di Galileo. Entrò nell&#x27;ordine dei Servi di Maria e divenne Pro-\nvinciale dell&#x27;Ordine. Fu uno strenuo difensore della libertà della sua città natale, Venezia, contro le pretese\ndel papato, tanto che dapprima venne scomunicato e successivamente subì un attentato. L&#x27;opera mag-\ngiore è l&#x27;/storia del concilio tridentino.\n\nPietro Sforza Pallavicino (1607-1667). Cardinale, scrisse una /storia del Concilio di Trento, in opposizione\na quella di Sarpi.\n\n| Galileo Galilei (1564-1642). Scienziato e filosofo, realizzò numerose e importanti scoperte (per\n| esempio, i satelliti di Giove, le macchie solari, i “mari” della Luna, la legge di isocronia del pendolo\n| ecc.) e invenzioni (il telescopio, la bilancia idrostatica) e fu assertore di un nuovo metodo di inda-\n| gine scientifica, basato sulla sperimentazione e non più sul principio d&#x27;autorità. Espresse le sue te-\n| si nelle opere Sidereus Nuncius e Dialogo sopra i due massimi sistemi, oltre che in altri scritti specia-\n| listici. Condannato in tarda età dal Sant&#x27;Uffizio che vedeva in lui un nemico dell&#x27;ortodossia,\n| dovette abiurare e fu confinato in una casa di campagna, dove poté continuare con i suoi discepoli\n{ gli studi di fisica.\n\nGiambattista Marino (1569-1625). Ebbe una vita divisa tra avventure e scandali. La sua produzione fu\nvastissima. Tra le opere poetiche principali vanno ricordate l’Adone, la Galerìa, la Lira e la Sampogna. Pur\nnon incontrando il favore dei critici moderni e contemporanei, ai suoi tempi il Marino fu molto apprezza-\nto e imitato, tanto che nacque un&#x27;autentica maniera che da lui prese il nome di marinismo.\n\nFrancesco Redi (1626-1697). Medico e naturalista insigne, possedette anche doti di letterato. Apparten-\nne all&#x27;Accademia del Cimento e collaborò con l&#x27;Accademia della Crusca. Scrisse le Osservazioni, le Espe-\nrienze, gli Opuscoli di storia naturale, le Lettere e i Consulti. Per la chiarezza espositiva della prosa scientifica\nRedi viene assunto a modello e si pone consapevolmente al di fuori del Barocco.\n\n6.2.6 | Il Settecento\n\nÈ questa un&#x27;età di ripresa tanto della cultura quanto dell&#x27;economia. L&#x27;Italia è patria di letterati di fama in-\nternazionale, ma sono ormai l&#x27;Inghilterra e soprattutto la Francia i Paesi europei più all&#x27;avanguardia nel\ncampo economico, artistico e letterario.\n\nL’Arcadia\n\nL&#x27;Accademia dell&#x27;Arcadia nacque a Roma alla fine del secolo XVII. Il movimento letterario, che fiorì nella\nprima parte del Settecento, fu caratterizzato dal desiderio di evasione in un mondo fantastico, idillico e\npastorale. Significativamente, nel campo delle arti figurative si osserva il passaggio dal vitalismo esorna-\ntivo del Barocco alle aggraziate forme del rococò.\n\nPietro Metastasio (1698-1782) è il massimo rappresentante della poesia arcadica e del melodramma set-\ntecentesco. ll tema dominante delle sue arie e canzonette è l&#x27;amore, trattato con soavità sospirosa e ma-\nlinconica. Suo grande merito è aver rinnovato il melodramma, strappandolo all&#x27;invadenza della musica\nbarocca e riconferendo piena dignità al testo letterario. Il capolavoro dell&#x27;autore è Didone abbandonata.\nAltre opere degne di nota sono La clemenza di Tito, Temistocle, Attilio Regolo. Anche grazie a un lungo sog-\ngiorno alla corte di Vienna, Metastasio divenne uno dei librettisti e poeti italiani più famosi all&#x27;estero.\n\nL&#x27;Illuminismo\n\nGli scrittori illuministi si caratterizzano per il loro impegno civile, sollecitano le riforme necessarie allo Sta-\nto e alla società per il “trionfo della Ragione” e ricoprono spesso in prima persona incarichi di funzionari,\npolitici e insegnanti.</p></details>", "back": "", "conf": "low", "page": 319, "section": "6.2.5 || Seicento", "num": null, "_i": 24}, {"kind": "theory", "src": "images/p320_b1.png", "front": "<div class='kindlabel'>THEORY</div><img src='images/p320_b1.png' class='cardimg'><p class='th-en'>(English not filled yet)</p><details><summary>original (IT)</summary><p class='th-it'>Giambattista Vico (1668-1744). Filosofo, fu tanto in anticipo sui tempi che, pur essendo nato nel XVII se-\ncolo, può essere considerato un pre-illuminista. Le sue opere sono il De antiquissima Italorum sapientia, il\nDe universi iuris uno principio et fine uno, i Principj di una scienza nuova dintorno alla natura delle nazioni.\nCampo d&#x27;indagine di Vico sono le leggi universali dello spirito umano, indagate nello svolgimento stori-\nco. Nella storia dell&#x27;umanità si possono osservare fasi di progressivo incivilimento e maturazione intellet-\ntuale; al culmine dell&#x27;evoluzione, a esse seguono però nuove fasi di imbarbarimento (teoria dei corsi e dei\nricorsi storici).\n\nLudovico Antonio Muratori (1672-1750). Sacerdote, possedette un&#x27;erudizione straordinaria. Scrisse so-\nprattutto di storia (Rerum italicarum scriptores; Antiquitates italicae Medii aevi; Annali della storia d&#x27;Italia), ma\nsi occupò di molti e vari argomenti (alcune opere, tra le tante: La filosofia morale spiegata ai giovani, De su-\nperstitione vitanda, Dei difetti della giurisprudenza, Della perfetta poesia italiana).\n\nPietro Verri (1728-1797). Filosofo apprezzato da Kant, giornalista e uomo politico, è una delle figure più\nimportanti dell&#x27;Illuminismo italiano. Nonostante fosse nobile di nascita, si batté energicamente per l&#x27;abo-\nlizione dei privilegi di ogni tipo, liberalizzazione del commercio, il trionfo dell&#x27;assolutismo illuminato e il\nprogresso spirituale e materiale dell’Italia. Combatté altre battaglie per l&#x27;abolizione della tortura e della\npena di morte.\n\nCesare Beccaria (1738-1794). Fu amico dei fratelli Verri e membro dell&#x27;Accademia dei Pugni. A 25 anni scris-\nse un&#x27;opera che acquistò fama mondiale, Dei delitti e delle pene, in cui criticò l&#x27;arretrato sistema penale vigen-\nte in tutti gli Stati europei, basato su procedure assurde e crudeli, e si dichiarò contrario alla pena di morte.\n\n(II | Giuseppe Parini (1729-1799). La sua arte letteraria risente dell&#x27;Arcadia ma aderisce allo stesso\nS | tempo alle istanze illuministiche, egualitarie, riformistiche e ammodernatrici. Le sue opere princi-\n! pali sono: // Giorno, poema satirico che illustra parodiando il poema didascalico le fasi della gior-\n| nata di un giovane aristocratico milanese; e le Odi, raccolta di poesie di argomento vario. Altri ce-\n| lebri scritti sono il Dialogo sopra la nobiltà e La salubrità dell&#x27;aria.\nCarlo Goldoni (1707-1793). Commediografo di straordinario talento, condusse una vita errabonda con\nle compagnie teatrali. Fu un acuto e spregiudicato osservatore della società del suo tempo, che seppe\nportare sulle scene del teatro con impareggiabile maestria. Ebbe il merito di rinnovare la vita teatrale eu-\nropea, che ristagnava negli esausti schemi della commedia dell&#x27;arte italiana. Molte delle sue opere sono\nscritte in dialetto veneziano. Le più famose sono: Il servitore di due padroni, La Putta onorata, La Locandiera,\nLa Famiglia dell&#x27;antiquario, La Bottega del caffè, | Rusteghi, Le Baruffe chiozzotte.\n\nO | Vittorio Alfieri (1749-1803). Personalità complessa e irrequieta, che già prelude al Romanticismo,\n\nN | Alfieri compì numerosissimi viaggi in Italia e all&#x27;estero, entrando in contatto con la cultura illumi-\n| nistica più avanzata, dalla quale però si estranea per il suo pessimismo e per l&#x27;assenza di interesse\n| alle problematiche sociali, politiche ed economiche. Le sue opere principali sono le tragedie Sau/\n| e Mirra, trattati politici Della tirannide, Del principe e delle lettere, il Misogallo; scrisse inoltre alcune\n| | poesie (le Rime) e satire, oltre all&#x27;autobiografia (la Vita).\n\nE\n\nL&#x27;Ottocento\n\nIl primo Ottocento in Italia si svolge nei segni opposti della dominazione napoleonica e della Restaura-\nzione (1815). Dopo le lotte patriottiche contro l&#x27;Austria, l&#x27;Italia finalmente giunge all&#x27;indipendenza e\nall&#x27;Unità (1861). Nella seconda metà del secolo nella penisola come in Europa, dal punto di vista sociale\nsi assiste all&#x27;ascesa della borghesia e all&#x27;emergere della classe operaia.\n\nLa lirica neoclassica\n\nLa lirica neoclassica privilegia il recupero dei valori e delle forme della civiltà classica. Il maggiore rappre-\nsentante di questa corrente è Vincenzo Monti (1754-1828) le cui opere risentono dell&#x27;amore e della pro-\nfonda conoscenza dei miti e della cultura classica. La sua fama è legata soprattutto a una traduzione\ndell&#x27;Iliade di Omero. Altre sue opere sono la Bassvilliana, la Musogonia, la Feroniade.</p></details>", "back": "", "conf": "low", "page": 320, "section": "6.2.5 || Seicento", "num": null, "_i": 25}, {"kind": "theory", "src": "images/p321_b1.png", "front": "<div class='kindlabel'>THEORY</div><img src='images/p321_b1.png' class='cardimg'><p class='th-en'>(English not filled yet)</p><details><summary>original (IT)</summary><p class='th-it'>Il Romanticismo\n\nÈ un movimento europeo che pone l&#x27;accento sui sentimenti e sull&#x27;interiorità, rivaluta il Medioevo, ricerca\ne difende le tradizioni e le particolarità nazionali.\n\n| Ugo Foscolo (1778-1827). Condusse una vita raminga. Aderì agli ideali rivoluzionari prima e napo-\nN | leonici poi e si arruolò anche nelle armate filofrancesi. La sua produzione letteraria risente del pe-\n{ riodo storico in cui visse e in particolare delle aspirazioni alla libertà e all&#x27;Unità nazionale. Dal punto\n| di vista filosofico aderì al sensismo, che elabora una concezione meccanicistica e materialistica del\n| mondo dove tutte le cose, compresa l&#x27;anima, sono soggette alla trasformazione e alla morte. Da\n| qui scaturisce il pessimismo del Foscolo, che egli però dichiara di combattere con le illusioni, cioè\n| i valori più alti del vivere umano: l&#x27;amore per la bellezza e per le virtù, l&#x27;eroismo, l&#x27;amor di patria.\n| L&#x27;opera in prosa più famosa è il romanzo epistolare Le ultime lettere di Jacopo Ortis; l&#x27;autore scrive\n{ anche opere di critica letteraria (molto importanti quelle sulla Divina Commedia e sul Petrarca). La\n| sua vasta produzione poetica comprende molti sonetti (tra cui Alla sera, A Zacinto, In morte del fra-\n| tello Giovanni) e i componimenti le Odi, Le Grazie, | Sepolcri. Foscolo, pur essendo annoverato tra i\nRomantici, sui quali ebbe un&#x27;influenza profonda e ai quali è assimilabile per temperamento e stile\n{ di vita, ebbe in realtà come punto di riferimento della sua produzione letteraria i classici, cosicché\n| è possibile parlare di “due anime” foscoliane, una romantica e l’altra neoclassica.\n\nGiovanni Berchet (1783-1851). Conoscitore di molte lingue straniere, se ne servì per leggere e tradurre\nopere appartenenti alle maggiori letterature europee. Deve essere ricordato per la Lettera semiseria di Gri-\nsostomo al suo figliuolo, in cui prende posizione a favore del Romanticismo contro le regole classicistiche,\ne per il poemetto // Giuramento di Pontida.\n\nO | Giacomo Leopardi (1798-1837). Vita tanto povera di avvenimenti esteriori, quanto ricca di espe-\nS | rienze intime. Possedette un&#x27;erudizione fuori dal comune, che costruì faticosamente e caparbia-\nmente da autodidatta e si dedicò a una serie di ricerche filologiche e di traduzioni. Fu filosofo e stra-\nordinario poeta. La sua concezione del mondo e dell&#x27;esistenza fu pessimistica e materialistica:\nripudiò la fede, ma anche la Natura che con il suo moto lento e inesorabile cancella ogni bellezza\ne ogni speranza. Espresse in maniera sublime la sua amarissima visione della vita nei Canti, tra i\n| quali si ricordano All’Italia, Il Passero solitario, L&#x27;Infinito, A Silvia, La Quiete dopo la tempesta, Il Sabato\n{ del villaggio, La Ginestra. Tra le opere in prosa, devono essere ricordate le Operette morali, i Pensieri,\n| lo Zibaldone, l&#x27;Epistolario.\n\n|\n\nGiuseppe Mazzini (1805-1872). “Apostolo” dell&#x27;Unità d’Italia, concepì la patria come un ideale e la vita\ncome missione, fondata sul dovere. In queste idee, la religione detiene un posto centrale, sia come ispi-\nratrice dell&#x27;agire umano, sia come elemento della costruzione dello Stato e della civiltà. Anche l&#x27;arte si\npiega a questa necessità, dovendo operare in funzione del progresso. Mazzini scrisse numerosi saggi let-\nterari, politici ed economico-sociali. Ci ha lasciato anche un vasto Epistolario e delle Note autobiografiche.\n\nO { Alessandro Manzoni (1785-1873). Nipote di Cesare Beccaria, fu in diretto contatto con Vincenzo\n\nN | Cuoco, con Monti e con gli ambienti colti di Parigi, città nella quale soggiornò a lungo. L&#x27;avveni-\n| mento forse più saliente della sua vita fu la conversione al Cattolicesimo, non improvvisa, ma lun-\n| gamente maturata. Questa adesione, unitamente al suo senso di umanità e agli ideali illuministici\n{ di libertà, uguaglianza, fraternità e giustizia, caratterizza la sua produzione letteraria della maturi-\n| tà. Compose, oltre a liriche giovanili, gli /nni sacri, le Odi civili (tra cui Marzo 1821 e Il Cinque Maggio)\n| e le tragedie // Conte di Carmagnola e l’Adelchi. Il capolavoro di Manzoni è / Promessi sposi, romanzo\n{ storico ambientato nella Lombardia del Seicento.\n\nCarlo Cattaneo (1801-1869). Cattaneo fu politico, economista, scrittore, giurista, filosofo, storico, etno-\ngrafo, filologo e matematico. Partecipò attivamente al Risorgimento italiano, assumendo una posizione\nanti-sabauda, repubblicana e federalista. La sua produzione letteraria è vastissima: tra le altre opere com-\npose L&#x27;Insurrection de Milan, Notizie naturali e civili su la Lombardia, Psicologia delle menti associate.\n\nIppolito Nievo (1831-1861). Mazziniano, partecipò alla spedizione dei Mille e morì durante un naufragio.\nCompose poesie e racconti e il romanzo, pubblicato postumo, Le Confessioni di un italiano.</p></details>", "back": "", "conf": "low", "page": 321, "section": "6.2.5 || Seicento", "num": null, "_i": 26}, {"kind": "theory", "src": "images/p322_b1.png", "front": "<div class='kindlabel'>THEORY</div><img src='images/p322_b1.png' class='cardimg'><p class='th-en'>(English not filled yet)</p><details><summary>original (IT)</summary><p class='th-it'>Niccolò Tommaseo (1802-1874). Patriota, scrittore e poeta. Nato in Dalmazia, visse a Firenze, dove colla-\nborò all’«Antologia» di Viesseux, e poi esule in Francia (1834-1839). Ha lasciato una produzione ricchissi-\nma, specchio dei suoi interessi linguistici (Dizionario dei sinonimi e Dizionario della lingua italiana), poetici\n(Poesie), filologici (raccolta di Canti popolari toscani, lirici, greci) e di critica letteraria (fu uno dei più grandi\ndantisti del secolo: Commento alla Commedia, Nuovi studi su Dante). La sua opera maggiore è il romanzo\npsicologico Fede e bellezza (1840), in cui alcuni critici hanno voluto scorgere caratteri anticipatori del De-\ncadentismo di fine secolo.\n\nSilvio Pellico (1789-1854). Arrestato in quanto affiliato alla Carboneria, subì insieme all&#x27;amico Maroncelli\nla detenzione nel terribile carcere dello Spielberg. Il racconto di questa devastante esperienza è contenu-\nto nell&#x27;opera Le mie prigioni (1832) dove, accanto agli ideali patriottici, emergono quelli cristiani. Compo-\nse alcune tragedie tra cui Francesca da Rimini (1815).\n\nMassimo D&#x27;Azeglio (1798-1866). Uomo politico, pittore e scrittore. Fu autore di romanzi storici (Ettore\nFieramosca o la disfida di Barletta, 1833 e Niccolò de’ Lapi, 1841) e di un&#x27;opera autobiografica (/ miei ricordi),\npubblicata postuma nel 1867. Fu primo ministro del Regno di Sardegna prima di Cavour e governatore\ndi Milano nel 1860.\n\nFrancesco De Sanctis (1817-1883). Fu il primo critico letterario italiano; patriota e politico, fu più volte\nministro dell&#x27;Istruzione e presidente della Camera del Regno d&#x27;Italia. Il suo pensiero critico è esposto in\nnumerosi scritti monografici raccolti poi nei Saggi critici (1866), nei Nuovi saggi critici (1872) e in Storia del-\nla letteratura italiana (1870-71) nonché in La letteratura italiana nel XIX secolo (1897). Emblematici del suo\npensiero i saggi dedicati alla Divina Commedia (Francesca da Rimini, Il Farinata di Dante ecc.) o il Saggio sui\nPetrarca. La critica romantica desanctisiana si basò su una concezione dell&#x27;opera d&#x27;arte come coesione in-\nscindibile di contenuto e forma.\n\nO Giosue Carducci (1835-1907). Poeta e scrittore, titolare della cattedra di eloquenza dell&#x27;Università\nN di Bologna dal 1860 al 1904, critico letterario e curatore di edizioni di classici italiani, fu il primo\nitaliano insignito del premio Nobel per la letteratura nel 1906. Propugnò l&#x27;equilibrio classico in\nfunzione antiromantica, ma sono molte le eredità romantiche nella sua poesia: la rievocazione\ndella storia patria, il mito della natura, la mesta poetica della memoria. Tra i suoi temi trovano spa-\nzio anche il laicismo repubblicano (ma ripudiato negli anni della maturità, in cui fu filomonarchico\ne conservatore). Si ricordano le sue raccolte: Juvenilia (1850-60), versi giovanili di programmatico\nclassicismo; Levia Gravia (1861-71) e Giambi ed Epodi (1867-79), poesie civili dense di satira e di\npassione politica; Rime nuove (1861-87), di più spiccata intonazione lirica; Odi barbare (1873-89),\ncelebri per la ricerca metrica, a imitare le cadenze quantitative classiche e che, tuttavia, il poeta\nriteneva sarebbero risuonate “barbare” alle orecchie degli antichi; Rime e ritmi (1887-99), dai toni\nretorici e celebrativi.\n\nLa poesia dialettale\n\nÈ un genere letterario direttamente ispirato dal Romanticismo, per il legame tra poesia e tradizione po-\npolare.\n\nCarlo Porta (1776-1821). Amico di Berchet e di Manzoni, romantico e nemico del neoclassicismo, poetò\nin dialetto milanese, prediligendo temi realistici, già quasi veristi, come la descrizione della vita dei nobili,\nsatireggiata, e quella degli umili, dove al di sotto dell&#x27;ironia si avverte la compartecipazione per la soffe-\nrenza umana. Le sue composizioni più famose sono: Lament del Marchionn di gamb avert, Alter desgrazzi\nde Giovannin Bongee, La Ninetta del Verzee.\n\nGiuseppe Gioacchino Belli (1791-1863). Membro dell&#x27;Accademia degli Elleni e di quella Tiberina, scrisse\nben 2.400 sonetti in dialetto romanesco (i più noti sono La vita dell&#x27;omo, La creazione del mondo, Er giorno\ndergiudizzio). Belli si ispira alla vita del popolo, con realismo e partecipazione per il dolore degli umili, sen-\nza intenti morali o sociali.\n\nGiuseppe Giusti (1809-1850). Scrisse poesie in un dialetto toscano che in realtà non diverge molto dalla\nlingua letteraria aulica, tanto che da alcuni il Giusti non viene considerato un poeta dialettale. Il tono delle\nsue opere è satirico e scherzoso e lo stesso autore chiama le sue poesie “scherzi” o “ghiribizzi”. Le opere\npiù celebri sono Gingillo e Sant&#x27;Ambrogio.</p></details>", "back": "", "conf": "low", "page": 322, "section": "6.2.5 || Seicento", "num": null, "_i": 27}, {"kind": "theory", "src": "images/p323_b1.png", "front": "<div class='kindlabel'>THEORY</div><img src='images/p323_b1.png' class='cardimg'><p class='th-en'>(English not filled yet)</p><details><summary>original (IT)</summary><p class='th-it'>Il Verismo\n\nSi tratta di una tendenza letteraria ispirata dal Positivismo, quella corrente di pensiero che utilizza il me-\ntodo scientifico per analizzare anche i fenomeni sociali, e ritiene che la scienza porterà al progresso\ndell&#x27;umanità.\n\nDal Naturalismo francese, il Verismo trae il canone dell&#x27;impersonalità: l&#x27;autore deve sparire dalla narrazio-\nne in modo tale che la storia sembri “farsi” da sé.\n\nO { Giovanni Verga (1840-1922). In gioventù fu animato da un fervido patriottismo. In età matura,\nì | pur partecipando alla vita politica (poco prima di morire fu nominato anche senatore), visse quasi\nritirato nella natìa Catania. Dal punto di vista letterario, dopo gli esordi di ispirazione tardo-roman-\ntica (i romanzi Storia di una capinera, Eva e Tigre reale), Verga aderì alla corrente verista, della quale,\nì insieme all&#x27;amico Capuana, fu l&#x27;iniziatore.\n{ Scrisse una serie di novelle (famosissime Nedda, Rosso Malpelo e Cavalleria rusticana), nelle quali\n{ già compaiono quei temi che saranno poi magistralmente rappresentati nel suo capolavoro, il ro-\nmanzo / Malavoglia: il mondo degli umili, con la sua semplicità, le sue tradizioni, la sua sorpren-\ndente umanità e la sua intollerabile miseria, che travolge i protagonisti destinandoli alla rovina.\n| Insieme al romanzo Mastro don Gesualdo e altre opere rimaste incompiute o neppure iniziate, |\n| Malavoglia doveva essere parte di un «ciclo dei vinti», che avrebbe attraversato diverse ambien-\ntazioni sociali.\n\nGrazia Deledda (1871-1936). Fu premio Nobel per la Letteratura nel 1926. Può essere ascritta al Verismo\nper la sua ispirazione regionalistica, ma da esso si distacca per la sua analisi dell&#x27;interiorità dei personaggi,\nper il suo senso religioso e la visione della vita come tensione tra peccato e riscatto. Le sue opere più famo-\nse sono Chiaroscuro, Colombi e sparvieri e Canne al vento.\n\nLa Scapigliatura\n\nÈ un movimento che ha origine nell&#x27;ultimo trentennio dell&#x27;Ottocento a Milano. Gli scapigliati sono un\ngruppo di intellettuali giovani, ribelli, sregolati, maledetti, con qualche ascendenza nel Verismo per l&#x27;in-\ntento artistico di natura realistica e antiborghese, che viene esasperato e assume una svolta dissacrante\ne antiperbenista, ma che in definitiva non riesce a elaborare una proposta, uno sbocco che non sia un vel-\nleitario ribellismo. Gli scapigliati più famosi furono Emilio Praga (1839-1875), Arrigo Boito (1842-1918)\ne Carlo Alberto Pisani Dossi (1849-1910).\n\nIl Novecento\n\nLa prima metà del secolo è segnata dalle due guerre mondiali e dalle loro tragiche conseguenze. In Italia,\ndopo il secondo conflitto, si assiste alla ricostruzione e a un&#x27;ascesa economica che porta il Paese ai primi\nposti tra le nazioni industrializzate più ricche del mondo.\n\nDal punto di vista letterario, il secolo è attraversato da numerosi movimenti e tendenze, non di rado an-\ntitetiche. Il Romanticismo ha ormai esaurito la sua spinta innovativa, insieme al Positivismo e al Verismo.\nEmergono così nuovi atteggiamenti.\n\nIl Decadentismo\n\nÈ un movimento europeo che ha la sua origine in Francia. Il Decadentismo parte da una critica radicale al\nPositivismo e sostituisce al valore conoscitivo della scienza quello dell&#x27;arte che, mediante gli strumenti\ndell&#x27;intuito, dell&#x27;istinto e della fantasia, cerca di attingere al senso nascosto delle cose. Caratteri tipici del\nDecadentismo furono la ricerca della raffinatezza stilistica, l&#x27;esaltazione dell&#x27;irrazionalità e il gusto per le\nesperienze rare, sensuali, esclusive.\n\nal\n\nAntonio Fogazzaro (1842-1911). Nel suo celebre romanzo Malombra delinea la figura dell’“inetto a vive-\nre” tipica del Decadentismo: l&#x27;intellettuale sradicato dalla società, in preda all&#x27;incertezza, all&#x27;inquietudine\ne alla contraddizione, che si trascina in una vita vuota. Altri romanzi di Fogazzaro sono Piccolo mondo an-\ntico e Piccolo mondo moderno, dove il tema portante è quello del recupero memoriale dei luoghi dell&#x27;in-\nfanzia. Infine, il romanzo Il Santo si propone di conciliare la fede cattolica con il Modernismo: l&#x27;opera viene\nperò messa all&#x27;Indice dalla Chiesa.</p></details>", "back": "", "conf": "low", "page": 323, "section": "6.2.5 || Seicento", "num": null, "_i": 28}, {"kind": "theory", "src": "images/p324_b1.png", "front": "<div class='kindlabel'>THEORY</div><img src='images/p324_b1.png' class='cardimg'><p class='th-en'>(English not filled yet)</p><details><summary>original (IT)</summary><p class='th-it'>() Giovanni Pascoli (1855-1912). Secondo la concezione pascoliana, l&#x27;arte ha un carattere principa\n\n$ mente irrazionale e intuitivo. In ogni poeta c&#x27;è un “fanciullino”, capace di cogliere nel quotidiano\nvalori eterni del reale con uno sguardo nuovo come quello di un bambino. Tra le opere di Pasco\nvanno ricordate lo scritto // fanciullino, le raccolte poetiche Myricae, i Poemetti, i Canti di Castelvec\nchio, Odi e Inni, i Poemi Italici, i Poemi del Risorgimento, le Canzoni di re Enzio e il discorso relativ\nall&#x27;impresa italiana in Libia: La grande proletaria si è mossa.\n\nO Gabriele D&#x27;Annunzio (1863-1938). Aderì ai moduli decadenti, come mostrano i romanzi // piacere (1889\n\nN Giovanni Episcopo (1891), Linnocente (1892) e i versi delle Elegie romane (1892) e del Poema paradisiac\n(1893). Interpretò il mito del superuomo di Nietzsche in chiave estetizzante: la vita è un&#x27;opera d&#x27;arte, po:\nsibile solo a pochi eletti. Da questa concezione sortirono i romanzi Il trionfo della morte (1894), Le vergii\ndelle rocce (1896), Il fuoco (1900) e la produzione teatrale: le tragedie (Francesca da Rimini, 1902; La figlia\nJorio, 1904; La fiaccola sotto il moggio, 1905; La nave, 1908; Fedra, 1909), i libri delle Laudi del cielo, del mai\ne della terra, degli eroi (al terzo libro, Alcyone, appartengono le sue liriche forse più note: La pioggia nel pin:\nto e | pastori). Nella prima guerra mondiale e nel dopoguerra, acceso interventista, fu autore di imprese cl:\nmorose (la Beffa di Buccari e il volantinaggio aereo su Vienna, che gli costò la perdita di un occhio: durant\nla convalescenza scrisse il Notturno, opera in prosa densa di intima meditazione).\n\nIl Crepuscolarismo\n\nÈ un movimento poetico che si contrappone alla lirica d&#x27;alto tono carducciana e alle raffinatezze dannur\nziane e si ispira maggiormente alla poetica delle “piccole cose” di Pascoli: l&#x27;umile, il quotidiano, canta\ncon moderata malinconia e ironia. Tra i suoi interpreti si ricordano: Sergio Corazzini (1886-1907), Marin\nMoretti (1885-1979)e Corrado Govoni (1884-1965).\n\nGuido Gozzano (1883-1916). La sua poesia si contraddistingue per il senso di inquietudine provocat\ndallo scorrere del tempo e per il rifugio nella quotidianità più comune. Gozzano è autore di due raccolt\ndi versi La via del rifugio e i Colloqui, che contiene due opere famose La signorina Felicita e L&#x27;amica di nonn\nSperanza, e di un resoconto di viaggio, Verso la cuna del mondo.\n\nIl Futurismo\n\nFilippo Tommaso Marinetti (1876-1947) pubblicò su «Le Figaro» il Manifesto del futurismo (1909), mov\nmento che coinvolse tutte le espressione artistiche, dando forse i migliori frutti nelle arti figurative (il Mc\nnifesto della pittura futurista fu firmato da Boccioni e Carrà). Temi centrali sono: l&#x27;esaltazione della macch\nna, il progresso tecnico, la velocità, il prodotto industriale (in opposizione all&#x27;arte accademica), la vitalit\ne la forza fisica, compresa la guerra come «sola igiene del mondo». A Marinetti si deve lo scardinament\ndi sintassi e punteggiatura, il paroliberismo, cioè l&#x27;uso delle parole senza nessi logici, il valore espressiv\ndella grafica (dimensione dei caratteri, uso di grassetti, corsivi, disposizione delle lettere in forma circola\nre, a cascata ecc.). Tra i suoi componimenti più famosi: La bataille de Tripoli, Zang Tumb Tumb, 8 anime i\nuna bomba.\n\nAldo Palazzeschi (1885-1974). Rielaborò in autonomia crepuscolarismo e futurismo, mostrando una ve\nna umoristica e dissacrante per esempio nei versi di L’incendiario (1910). Fu anche un valido prosatore (So\nrelle Materassi, 1934; | fratelli Cuccoli, 1948; Stefanino, 1969; Il codice di Perelà, 1911).\n\nProsa del primo Novecento\n\nBenedetto Croce (1866-1952). Intellettuale di prima grandezza del Novecento italiano, fu massimo inte\nprete del neoidealismo. Si occupò anche di critica letteraria e nel 1903 fondò la rivista «La Critica». Moll\nsuoi articoli sulla letteratura europea del XIX secolo sono raccolti in Poesia e non poesia (1923). Criterio es\nsenziale adottato da Croce fu la distinzione tra poesia (pura intuizione lirica) e non poesia (risultato ibridi\ndi altre istanze intellettuali). Croce - di idee liberali — fu estensore nel 1925 del Manif
