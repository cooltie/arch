roduca le informazioni e le relazioni fornite, in modo da rendere più age-\nvole la comprensione e la risoluzione di questo tipo di problemi.\n\n4.2 | Problemi di lavoro\n\nSi tratta di quesiti caratterizzati dal fatto di coinvolgere per la loro risoluzione capacità sia logiche sia ma-\ntematiche (non richiedono conoscenze matematiche di tipo nozionistico, ma una certa attitudine al ragio-\nnamento con quantità e numeri). Più precisamente, con l&#x27;espressione “problemi di lavoro” si intende una\ncategoria di esercizi nei quali vengono descritte le modalità e i tempi di svolgimento di un generico lavo-\nro da parte di più soggetti. Nel termine “lavoro” rientrano vari tipi di attività, fisica e non: mangiare qual-\ncosa, costruire una casa, fumare sigarette ecc.\n\nLe variabili in gioco in questo tipo di problemi sono essenzialmente tre: i ritmi di lavoro dei singoli sog-\ngetti, la quantità di lavoro da svolgere e iltempo impiegato. Alcuni di questi elementi sono noti, altri sono\nda ricavare. Generalmente ai candidati viene richiesto di individuare iltempo che il singolo individuo o le\npersone coinvolte impiegano per portare a termine il lavoro.\n\nI problemi di lavoro possono essere distinti in due grandi categorie, a seconda del ritmo con cui il lavoro\nviene svolto dai differenti soggetti:\n* problemiin cuii soggetti lavorano allo stesso ritmo;\n\n* problemiin cuii soggetti lavorano a ritmi diversi.\n4.2.1 | Soggetti che lavorano allo stesso ritmo\n\nIn questo tipo di problemi si assume che tutti i lavoratori realizzino la stessa quantità di lavoro nell&#x27;unità\ndi tempo.\n\nIl ragionamento per risolvere questi esercizi è il seguente: se un lavoro richiede k lavoratori per 1 ora di\ntempo, significa che ogni soggetto realizza in 1 ora una quantità di lavoro pari a 1/k. Se un lavoro richiede\nm lavoratori per h ore, allora ogni soggetto realizza 1/m del lavoro in h ore e pertanto compie, in un&#x27;ora,\n1\n\npù del lavoro complessivo. Attraverso alcuni esempi, si vedrà concretamente come tali principi trovi-\n\nno applicazione negli esercizi.</p></details>", "back": "", "conf": "low", "page": 290, "section": "4.2 Problemi di lavoro", "num": null}, {"kind": "question", "src": "images/p291_b2.png", "front": "<img src='images/p291_b2.png' class='cardimg'><p class='q'>(English not filled yet)</p><details><summary>original text (IT)</summary><p class='th-it'>1 Sei artigiani, lavorando allo stesso ritmo, impiegano 24 giorni per realizzare un mosaico.\nQuanto impiegherebbe un solo artigiano a compiere lo stesso lavoro?\n\n36 giorni\n6 giorni\n124 giorni\n144 giorni\n78 giorni\n\nDal momento che i sei artigiani lavorano allo stesso ritmo, un operaio in un giorno svolge un lavoro pari a\n\nz . = = = del lavoro totale. Quindi per compiere l&#x27;intero lavoro un solo operaio impiega 144 giorni. Al-\nternativamente si può calcolare che un solo operaio impiega sei volte il tempo impiegato dal gruppo per\nrealizzare il mosaico (perché la forza lavoro è composta da 1 anziché da 6 operai): 24 giorni - 6 = 144 giorni\n(risposta). Si osservi che l&#x27;alternativa... è facilmente scartabile poiché propone un valore inferiore a 24\n(se 6 persone impiegano 24 giorni è impossibile che una persona sola impieghi un tempo minore).\n\nÈ utile precisare che l&#x27;applicazione delle proporzioni può facilmente condurre a una soluzione errata di tali\nesercizi. Infatti, si potrebbe intuitivamente esprimere il testo dell&#x27;esempio considerato attraverso la pro-\nporzione 6 : 24 = 1 : x. Così facendo si avrebbe: x = 26/6 = 4,3. La soluzione è evidentemente errata dal\nmomento che il valore di x (tempo impiegato da un solo artigiano per fare il mosaico) non può essere in-\nferiore a 24 (tempo impiegato da sei artigiani per realizzare il mosaico).</p></details>", "back": "", "conf": "low", "page": 291, "section": "4.2 Problemi di lavoro", "num": 1}, {"kind": "question", "src": "images/p291_b3.png", "front": "<img src='images/p291_b3.png' class='cardimg'><p class='q'>(English not filled yet)</p><details><summary>original text (IT)</summary><p class='th-it'>2 Se 6 persone, lavorando allo stesso ritmo, impiegano 1 ora a a dipingere un appartamento,\nquanto impiegano 12 persone a effettuare lo stesso lavoro?\n25 min. 2/5h 12/5h 1/5h 20 min\n\nSe i 5 soggetti impiegano 1 ora per realizzare il lavoro, ogni lavoratore realizza in 1 ora 1/5 del lavoro com-\nplessivo. Pertanto 12 persone in 1 ora realizzano 12/5 del lavoro totale. Se t è l&#x27;elemento richiesto dal pro-\nblema, cioè il tempo impiegato dai 12 soggetti per dipingere l&#x27;appartamento, si ha:\n\n12\n\n= -t a - Tora = 25 min (risposta .)\n\n= lavoro completato = lora &gt;t = n\nA volte i dati del problema vengono forniti in maniera implicita, ossia tramite relazioni tra le diverse va-\nriabili in gioco, piuttosto che tramite valori numerici; si consideri a questo proposito l&#x27;esempio seguente.</p></details>", "back": "", "conf": "low", "page": 291, "section": "4.2 Problemi di lavoro", "num": 2}, {"kind": "question", "src": "images/p291_b4.png", "front": "<img src='images/p291_b4.png' class='cardimg'><p class='q'>(English not filled yet)</p><details><summary>original text (IT)</summary><p class='th-it'>Appio e Beppo mangiano a più non posso (e allo stesso ritmo) e svuotano tutta la loro\ndispensa in 90 minuti. Se avessero invitato anche Cecco, mangiando tutti ugualmente allo\nstesso ritmo di prima, quanto tempo avrebbero impiegato ad esaurire le stesse scorte ali-\nmentari?\n\n45 minuti\n\n50 minuti\n40 minuti\nlora\n\n30 minuti\n\nSi tratta del classico problema di lavoro in cui occorre ricavare la quantità di lavoro svolta dai singoli\nnell&#x27;unità di tempo. Se due soggetti svolgono un lavoro in 90 minuti lavorando insieme allo stesso ritmo,\nsignifica che un solo soggetto svolgerebbe il medesimo lavoro in un tempo doppio, ossia in 180 minuti,\npari a 3 ore; pertanto in un ora ogni soggetto svolge 1/3 del lavoro complessivo. Se dunque si hanno 3\nsoggetti, per svolgere l&#x27;intero lavoro impiegheranno esattamente 1 ora (risposta corretta è).</p></details>", "back": "", "conf": "low", "page": 291, "section": "4.2 Problemi di lavoro", "num": 3}, {"kind": "theory", "src": null, "front": "<div class='kindlabel'>THEORY</div><p class='th-en'>(English not filled yet)</p><details><summary>original (IT)</summary><p class='th-it'>4.2.2 | Soggetti che lavorano a ritmi diversi\n\nIn questo tipo di problemi (più rari) i soggetti realizzano quantità di lavoro diverse nell&#x27;unità di tempo.\nPer risolvere questi esercizi, bisogna innanzitutto ricavare la quantità di lavoro svolta dai singoli soggetti\nnell&#x27;unità di tempo. In questo caso, come è facile intuire, rispetto alla tipologia precedente la quantità di\nlavoro svolto dai singoli nello stesso tempo sarà diversa a seconda del soggetto.\n\nEsempi</p></details>", "back": "", "conf": "low", "page": 292, "section": "4.2 Problemi di lavoro", "num": null}, {"kind": "question", "src": "images/p292_b2.png", "front": "<img src='images/p292_b2.png' class='cardimg'><p class='q'>(English not filled yet)</p><details><summary>original text (IT)</summary><p class='th-it'>Stefania, Piera e Maria lavorano in una biblioteca in cui, periodicamente, occorre spostare\ntutti i libri da una scaffalatura a un’altra. Per compiere questo lavoro Stefania da sola\nimpiega 8 ore, Piera da sola impiega 24 ore e Maria da sola impiega 12 ore. Quanto tempo\nimpiegherebbero le tre bibliotecarie a spostare i libri se lavorassero insieme?\n\n4 ore 2 ore 3 ore 6 ore 8 ore\n\n—_\n\nCome prima cosa, occorre ricavare la parte di lavoro che ciascuna persona svolge nell&#x27;unità di tempo: se\nStefania impiega 8 ore per effettuare il lavoro, in 1 ora (unità di tempo) compie 1/8 del lavoro. Lo stesso\nragionamento vale per Piera che in 1 ora compie 1/24 del lavoro e per Maria che in 1 ora compie 1/12 del\nlavoro.\n\nConoscendo il lavoro svolto dai singoli soggetti nell&#x27;unità di tempo, è possibile individuare (sommando\nle tre frazioni) la parte di lavoro svolta dalle tre bibliotecarie insieme, sempre nell&#x27;unità di tempo:\n\n1/8 + 1/24+ 1/12 = 1/4= lavoro svolto in 1 ora dai tre insieme.\nDato che i tre soggetti insieme in 1 ora svolgono un quarto del lavoro, per compiere l&#x27;intero lavoro hanno\nbisogno di 4 ore (risposta |. ).\nNell&#x27;esempio considerato sono noti i tempi impiegati dai singoli soggetti per compiere il lavoro e viene\nrichiesto il tempo impiegato dai tre insieme. È possibile invece che quest&#x27;ultimo dato sia noto e che l&#x27;in-\ncognita del problema sia iltempo impiegato da una singola persona per terminare il lavoro. Come si nota\nnell&#x27;esempio seguente, il ragionamento di fondo per giungere alla soluzione non cambia.</p></details>", "back": "", "conf": "low", "page": 292, "section": "4.2 Problemi di lavoro", "num": 1}, {"kind": "question", "src": "images/p292_b3.png", "front": "<img src='images/p292_b3.png' class='cardimg'><p class='q'>(English not filled yet)</p><details><summary>original text (IT)</summary><p class='th-it'>2 Lavorando insieme, Aldo, Giovanni e Giacomo fabbricano 10 tubi in 2 ore; Aldo da solo\nimpiegherebbe 5 ore e Giovanni da solo ne impiegherebbe 10. Quanto impiegherebbe\nGiacomo da solo a fabbricare i 10 tubi?\n\n10 ore 5 ore 30 minuti 3 ore 15 ore\n\nInizialmente si procede come nell&#x27;esempio precedente: si individua la quantità di lavoro svolta, nell&#x27;unità\ndi tempo (1 ora), dai diversi soggetti:\n* Aldo fabbrica 10/5=2 tubi in 1 ora;\n* Giovanni fabbrica 10/10= 1 tubo in 1 ora;\n*  itre insieme fabbricano 10/2 = 5 tubi in 1 ora.\nPer ottenere il numero di tubi che Giacomo è in grado di fabbricare da solo nell&#x27;unità di tempo, bisogna\nsottrarre il numero di tubi che Aldo e Giovanni fabbricano insieme (2 + 1 = 3), al numero di tubi che tutti\ne tre insieme fabbricano in un&#x27;ora (5):\n\n5-3=2= numero di tubi fabbricati da Giacomo nell&#x27;unità di tempo.\nAncora una volta, il ragionamento conclusivo è il seguente: se Giacomo in 1 ora fabbrica 2 tubi, per fab-\nbricarne 10 impiegherebbe 5 ore (risposta . ).\nTalvolta, come nell&#x27;esempio che segue, i dati del problema possono essere forniti in forma non del tutto\nesplicita.</p></details>", "back": "", "conf": "low", "page": 292, "section": "4.2 Problemi di lavoro", "num": 2}, {"kind": "question", "src": "images/p292_b4.png", "front": "<img src='images/p292_b4.png' class='cardimg'><p class='q'>(English not filled yet)</p><details><summary>original text (IT)</summary><p class='th-it'>3 Matteo e Paolo sono in grado di timbrare 12 fogli in 20 secondi. Matteo ne timbra il triplo\ndi Paolo che, a sua volta, ne timbra la metà di Sergio. Quanti fogli riuscirebbero a timbrare\ni tre lavorando insieme per 1 minuto?\n\n15 36 54 45 24</p></details>", "back": "", "conf": "low", "page": 292, "section": "4.2 Problemi di lavoro", "num": 3}, {"kind": "theory", "src": null, "front": "<div class='kindlabel'>THEORY</div><p class='th-en'>(English not filled yet)</p><details><summary>original (IT)</summary><p class='th-it'>Nell&#x27;esempio in esame, chi lavora più lentamente è Paolo. Dunque, per ogni foglio timbrato da Paolo, Ser-\ngio ne timbra 2 e Matteo 3.\n\nSchematicamente si ha:\n\nSoggetto N. fogli timbrati AA stesso bid\nPaolo 1\nSergio 2\n\nMatteo 3\n\nSi considerino ora Paolo e Matteo insieme: poiché in 20 secondi timbrano 12 fogli, in un minuto ne tim-</p></details>", "back": "", "conf": "low", "page": 293, "section": "4.3 Capacità geometriche e spaziali", "num": null}, {"kind": "passage", "src": "images/p293_b2.png", "front": "<div class='kindlabel'>PASSAGE</div><img src='images/p293_b2.png' class='cardimg'><p class='th-en'>(English not filled yet)</p><details><summary>original (IT)</summary><p class='th-it'>brano 36, di cui 9 sono timbrati da Paolo e 27 da Matteo. Inoltre, dato che Sergio lavora il doppio di Paolo,\nin un minuto timbra 18 fogli.\n\nDunque si hanno i seguenti dati:\n- incrementi di valore, la differenza tra il primo e il secondo dipinto è pari al 5%\n(80% —- 75%) mentre la differenza tra ilsecondo e il terzo è pari al triplo, ossia il 15% (75% - 60%). Il grafico\nche raffigura correttamente tale situazione è quello contenuto nell’alternativa ©. che è dunque la rispo-\nsta corretta.</p></details>", "back": "", "conf": "low", "page": 298, "section": "Esempi · Brano 36", "num": 1}, {"kind": "question", "src": "images/p299_b2.png", "front": "<img src='images/p299_b2.png' class='cardimg'><p class='q'>(English not filled yet)</p><details><summary>original text (IT)</summary><p class='th-it'>2 Lo scorso sabato 40 bambini, 100 adulti e 60 anziani sono andati in piscina. Per stabilire\nquanto tempo ciascun utente è rimasto in acqua è stato effettuato un sondaggio, i cui\nrisultati sono riportati nei seguenti grafici:\n\nBambini Adulti Anziani\nlora più dî\no meno piùdi 10ra 1 ora\npiù di lora omeno 1 ora\n1 ora o meno\n\nQuale tra i seguenti diagrammi a torta illustra il risultato complessivo calcolato sulla tota-\nlità degli utenti?\n\n1 ora\npiù di lora pia o meno\nlora omeno lor\npiù di |\n1 ora iù di ora\n\nlora p\no mena lora omeno\npiùdi lora\n\nlora omeno\n\nSulle 200 persone totali, 105 persone hanno nuotato per 1 ora o meno: 50 adulti (la metà di 100), 45 an-\nziani (i 3/4 di 60) e 10 bambini (1/4 di 40). Le altre 95 hanno quindi nuotato per più di 1 ora.</p></details>", "back": "", "conf": "low", "page": 299, "section": "Esempi · Brano 36", "num": 2}, {"kind": "theory", "src": null, "front": "<div class='kindlabel'>THEORY</div><p class='th-en'>(English not filled yet)</p><details><summary>original (IT)</summary><p class='th-it'>Bambini\n\nlora\no meno\npiù di\nlora\n\n40\n\nlorao meno 10\n\nAdulti Anziani\nN\npiù dî\npiù di lora 1 ora\nlora  omeno lora\no meno\nTotale\n100 60 200\n50 45 105</p></details>", "back": "", "conf": "low", "page": 299, "section": "4.3 Capacità geometriche e spaziali", "num": null}, {"kind": "theory", "src": null, "front": "<div class='kindlabel'>THEORY</div><p class='th-en'>(English not filled yet)</p><details><summary>original (IT)</summary><p class='th-it'>Il grafico che rappresenta al meglio l&#x27;utilizzo della piscina da parte dei 200 utenti è quello proposto\ndall&#x27;alternativa , soluzione del quesito.</p></details>", "back": "", "conf": "low", "page": 299, "section": "4.3 Capacità geometriche e spaziali", "num": null}, {"kind": "question", "src": "images/p300_b2.png", "front": "<img src='images/p300_b2.png' class='cardimg'><p class='q'>(English not filled yet)</p><details><summary>original text (IT)</summary><p class='th-it'>Il premio “Alunno dell’anno” verrà à assegnato secondo i i seguenti criteri:\n\ne il premio non verrà assegnato a chi è arrivato in ritardo per più di 2 volte e nemmeno a\nchi non ha consegnato più di 2 compiti assegnati a casa entro la data prevista;\n\ne il premio verrà assegnato all’alunno con il minor numero di voti inferiori al 9 nei com-\npiti assegnati a casa.\n\nI finalisti sono i seguenti:</p></details>", "back": "", "conf": "low", "page": 300, "section": "Esempi · Brano 36", "num": 3}, {"kind": "theory", "src": null, "front": "<div class='kindlabel'>THEORY</div><p class='th-en'>(English not filled yet)</p><details><summary>original (IT)</summary><p class='th-it'>Studente\n\nAndrea\nCarla\nEnrico\nGreta\n\nIlaria\n\nClasse Assenze Ritardi\n\nHID\n\nIVB\n\n10\n\nTotale di\ncompiti assegnati\na casa\n\n\n54\n\nCompiti\nconsegnati entro\nla data prevista\n\n53\n\nCompiti\ncon voto pari\no superiore a 9\n\n52</p></details>", "back": "", "conf": "low", "page": 300, "section": "4.3 Capacità geometriche e spaziali", "num": null}, {"kind": "theory", "src": null, "front": "<div class='kindlabel'>THEORY</div><p class='th-en'>(English not filled yet)</p><details><summary>original (IT)</summary><p class='th-it'>Sulla base della tabella sopra riportata, a chi verrà assegnato il premio?\nCarla\nEnrico\nGreta\nIlaria\n\nAndrea\n\nSecondo le regole del premio, non può essere Greta a vincerlo, perché ha totalizzato 3 ritardi. Non pos-\nsono vincere neanche Andrea ed Enrico perché hanno consegnato dopo la data prevista più di 3 compiti\nassegnati a casa. Tra i due rimanenti, Carla ha meritato in 3 compiti assegnati a casa una votazione infe-\nriore a 9 (infatti 53 su 56 compiti hanno una votazione pari o superiore a 9), mentre Ilaria ha preso meno\ndi 9 solo in 2 (infatti 52 compiti su 54 hanno una votazione pari o superiore a 9). Poiché tra i criteri di as-\nsegnazione del premio c&#x27;è proprio quello del minor numero di voti inferiori a 9 nei compiti assegnati a\ncasa, sarà Ilaria a vincere il premio, come correttamente riportato dall&#x27;alternativa\n\nSuggerimenti\n\nQuando la domanda e le alternative sono espresse come percentuali, può risultare vantaggioso\nusare un valore numerico (solitamente 100) da attribuire alla quantità a cui si riferisce il problema ed\neffettuare poi i ragionamenti del caso.\n\nNon confondere decimali con percentuali. Per esempio, la percentuale 0,3% è uguale a 0,003\n(decimale).\n\nValutare se sia possibile scartare alcune soluzioni proposte sulla base della semplice osserva-\nzione dei dati.\n\nMemorizzare la formula relativa alla variazione percentuale riportata in questo capitolo.</p></details>", "back": "", "conf": "low", "page": 300, "section": "4.3 Capacità geometriche e spaziali", "num": null}, {"kind": "theory", "src": null, "front": "<div class='kindlabel'>THEORY</div><p class='th-en'>(English not filled yet)</p><details><summary>original (IT)</summary><p class='th-it'>Successioni di numeri e lettere\n\nLe successioni di numeri e lettere rappresentano un tipo di esercizi da tempo diffuso nell&#x27;ambito dei test\nattitudinali. Si tratta di quesiti che intendono valutare la capacità del candidato di scoprire con rapi-\ndità il criterio in base al quale numeri e lettere sono disposti all’interno di una successione data.\nAnche in questo caso, non è richiesta alcuna nozione matematica né linguistica, se non la capacità di ef-\n\nfettuare elementari operazioni aritmetiche.\n\nData una successione incompleta di numeri o lettere, il candidato deve completarla scegliendo, tra le al-\nternative proposte, il numero o la lettera che soddisfa la logica della successione.\n\n5.1 | Successioni di numeri\n\nSi tratta di successioni nelle quali compare un&#x27;incognita che il candidato deve sostituire scegliendo, tra\nle alternative proposte, un numero che soddisfi il criterio logico che governa l’intera successione. Ven-\ngono analizzati di seguito alcuni esempi che mostrano i principali criteri logici alla base delle succes-\n\nsioni di numeri.</p></details>", "back": "", "conf": "low", "page": 301, "section": "5.1 Successioni di numeri", "num": null}, {"kind": "theory", "src": null, "front": "<div class='kindlabel'>THEORY</div><p class='th-en'>(English not filled yet)</p><details><summary>original (IT)</summary><p class='th-it'>1 11,17,.23, 29,35; ...?\nè 45\nSi tratta di una successione aritmetica additiva, in cui ogni numero è ottenuto sommando un valore costan-\nte al numero precedente. Nell&#x27;esercizio proposto la costante è pari a 6 e quindi l&#x27;incognita è uguale al nu-\n\nmero che si ottiene sommando 6 a 35, cioè 41 (alternativa . :.). Esistono anche esercizi in cui un valore co-\nstante viene sottratto passando da un numero al seguente della successione.</p></details>", "back": "", "conf": "low", "page": 301, "section": "5.1 Successioni di numeri", "num": null}, {"kind": "theory", "src": null, "front": "<div class='kindlabel'>THEORY</div><p class='th-en'>(English not filled yet)</p><details><summary>original (IT)</summary><p class='th-it'>2 5,20, 80, ...?\nQuesto esercizio mostra una successione geometrica, in cui cioè ciascun elemento è uguale al precedente\nmoltiplicato per un numero costante (nell&#x27;esempio pari a 4). Il numero mancante è quindi 320, che si ot-\n\ntiene moltiplicando 80 x 4 (alternativa +). In altri casi, i numeri della successione possono essere divisi,\nanziché moltiplicati, per un numero costante.</p></details>", "back": "", "conf": "low", "page": 301, "section": "5.1 Successioni di numeri", "num": null}, {"kind": "theory", "src": null, "front": "<div class='kindlabel'>THEORY</div><p class='th-en'>(English not filled yet)</p><details><summary>original (IT)</summary><p class='th-it'>3 3,4,7,11,18,29,...?\n\n\nlena\n\nIn questa tipologia non è utilizzato alcun numero costante da sommare, sottrarre o moltiplicare, ma ogni ele-\nmento della successione è ottenuto sommando i due numeri che lo precedono:\n\n3+4=7;4+7=11;7+11=18;11+18=29;18+29=47.\n\nIl numero mancante è dunque 47 (alternativa È.)</p></details>", "back": "", "conf": "low", "page": 302, "section": "5.1 Successioni di numeri", "num": null}, {"kind": "theory", "src": null, "front": "<div class='kindlabel'>THEORY</div><p class='th-en'>(English not filled yet)</p><details><summary>original (IT)</summary><p class='th-it'>4 2,4,7,6,12,15, 14, 28, 31,...?\n0) 29\n\nIn questa successione compaiono più operazioni aritmetiche che si ripetono ciclicamente; l&#x27;ordine delle\noperazioni è il seguente: moltiplicare per due (x 2), aggiungere tre (+ 3), sottrarre uno (- 1). Osservando\nla successione data, si nota il seguente andamento: 2x 2=4;4+3=7;7-1=6;6x2=12;12+3=15;\n15-1=14;14x2=28;28+3=31;31-1=30.\n\nIl numero mancante è perciò 30 (alternativa {7)).</p></details>", "back": "", "conf": "low", "page": 302, "section": "5.1 Successioni di numeri", "num": null}, {"kind": "question", "src": "images/p302_b4.png", "front": "<img src='images/p302_b4.png' class='cardimg'><p class='q'>(English not filled yet)</p><details><summary>original text (IT)</summary><p class='th-it'>5 Individuare il numero mancante.\n\nIn questo caso vi sono tre successioni di numeri (ciascuna delle quali disposta a triangolo) che rispondono\nallo stesso criterio logico. Per comprendere tale criterio e individuare il numero mancante occorre analiz-\nzare le due terne di numeri interamente note.\n\nNell&#x27;esempio, all&#x27;interno di ciascuna successione, il numero in alto a destra è ottenuto aggiungendo 3 alla\nsomma degli altri due: nelle prime due successioni si ha infatti:\n\n3+9+3=15e8+4+3=15.\nAllo stesso modo, nella terza successione il numero mancante deve essere uguale a:\n2+5+3=10 (alternativa |</p></details>", "back": "", "conf": "low", "page": 302, "section": "Esempi · Brano 36", "num": 5}, {"kind": "theory", "src": null, "front": "<div class='kindlabel'>THEORY</div><p class='th-en'>(English not filled yet)</p><details><summary>original (IT)</summary><p class='th-it'>5.1.1 | Successioni di lettere\n\nPer poter risolvere questo tipo di esercizi è indispensabile avere sempre ben presente la successione or-\ndinata e completa delle lettere dell&#x27;alfabeto utilizzato, scrivendola nell&#x27;ordine corretto.</p></details>", "back": "", "conf": "low", "page": 303, "section": "5.1.1 Successioni di lettere", "num": null}, {"kind": "question", "src": "images/p303_b2.png", "front": "<img src='images/p303_b2.png' class='cardimg'><p class='q'>(English not filled yet)</p><details><summary>original text (IT)</summary><p class='th-it'>1 GE LN, Q,.7\n\nSi tratta di una sequenza alfabetica il cui ordine va dalla A alla Z, ma in cui, tra un elemento e il successivo,\nmanca un gruppo di due lettere. In sostanza, è una successione del tutto simile a quella numerica additi-\nva (aggiunge 3 passando da un elemento all&#x27;altro). La lettera incognita è dunque T (risposta £:%) che è si-\ntuata a 3 posizioni dalla Q.\n\nSuggerimenti\n\n* Per quanto riguarda le successioni numeriche, è conveniente analizzare la sequenza dapprima nel\nsuo insieme per cercare di capire l&#x27;andamento che questa presenta (crescente, decrescente o com-\nposto). Successivamente è opportuno cercare tra gli elementi adiacenti l&#x27;operazione aritmetica\npiù semplice (addizione, sottrazione, moltiplicazione ecc.) che li lega. Nel caso non si riesca a indivi-\nduare un criterio logico che governi l&#x27;intera successione, occorre provare a scindere la stessa in due\nsequenze alternate e ripetere il procedimento per ciascuna di esse.\n\n«Perle successioni di lettere valgono gli stessi suggerimenti relativi alle sequenze numeriche. È inoltre\nutile scrivere l’intero alfabeto ordinato, in modo da averlo sempre sott&#x27;occhio per capire veloce-\nmente la relazione tra le lettere adiacenti della successione. Tale suggerimento risulta tanto più utile\nquanto più numerosi sono gli esercizi di successioni di lettere presenti nel test.\n\n5.2 | Logica figurale\n\nGli esercizi di logica figurale intendono valutare nei candidati l&#x27;attitudine logico-spaziale, intesa come\ncapacità di cogliere ed elaborare i rapporti quantitativi, qualitativi e spaziali esistenti tra più oggetti o fi-\ngure astratte.\n\n5.2.1 | Figura da scartare\n\nIn questo tipo di esercizi viene presentata una successione di figure (generalmente quattro o cinque) tra\nle quali il candidato deve indicare quella da scartare perché estranea rispetto alle altre. Occorre quindi\nindividuare la logica che accomuna tutte le figure date a eccezione di una.\n\nSi considerino i seguenti esempi.</p></details>", "back": "", "conf": "low", "page": 303, "section": "Esempi · Brano 36", "num": 1}, {"kind": "question", "src": "images/p303_b3.png", "front": "<img src='images/p303_b3.png' class='cardimg'><p class='q'>(English not filled yet)</p><details><summary>original text (IT)</summary><p class='th-it'>1 Individuare la figura da scartare.\n\nbe\n\negiezieziezio\n\nSi noti che tutte le figure rappresentano un pentagono (poligono con cinque lati), a eccezione della terza\nin cui il poligono ne ha sei; la figura da scartare è dunque la {*).</p></details>", "back": "", "conf": "low", "page": 303, "section": "Esempi · Brano 36", "num": 1}, {"kind": "question", "src": "images/p304_b3.png", "front": "<img src='images/p304_b3.png' class='cardimg'><p class='q'>(English not filled yet)</p><details><summary>original text (IT)</summary><p class='th-it'>2 Individuare la figura da scartare.\n\nSO\n\nLe prime quattro rappresentazioni grafiche sono composte dalle stesse figure geometriche: due triango-\nli, un quadrato e un cerchio. La figura da scartare è quindi quella individuata dall&#x27;alternativa 12, nella qua-\nle, al posto del triangolo piccolo, compare un quadrato.\n\n5.2.2 | Sequenze di figure\n\nQuesti esercizi richiedono di scoprire con rapidità il criterio in base al quale le figure sono disposte all&#x27;in-\nterno di una sequenza data. In questi esercizi viene fornita una serie incompleta di figure nella quale com-\npare un’incognita. Il candidato deve sostituirla scegliendo, tra le alternative proposte, la figura che sod-\ndisfa il criterio logico che governa l’intera sequenza. Vengono analizzati di seguito alcuni esempi, dai più\nsemplici ai più complessi, che mostrano i criteri logici alla base di questa tipologia di esercizi.</p></details>", "back": "", "conf": "low", "page": 304, "section": "Esempi · Brano 36", "num": 2}, {"kind": "question", "src": "images/p304_b4.png", "front": "<img src='images/p304_b4.png' class='cardimg'><p class='q'>(English not filled yet)</p><details><summary>original text (IT)</summary><p class='th-it'>&lt;q\nE\nT\n_\n\n1 Individuare la figura che completa correttamente la seguente serie.\n\nx DT\n\nAnalizzando le figure della sequenza, si osserva che, passando da una figura alla successiva, il cerchio\nbianco si sposta sui vertici della stella in senso antiorario mentre il cerchio nero si muove in senso oppo-\nsto. La risposta corretta è dunque la\n\ni</p></details>", "back": "", "conf": "low", "page": 304, "section": "Esempi · Brano 36", "num": 1}, {"kind": "question", "src": "images/p304_b5.png", "front": "<img src='images/p304_b5.png' class='cardimg'><p class='q'>(English not filled yet)</p><details><summary>original text (IT)</summary><p class='th-it'>2 Individuare la figura che completa correttamente la seguente serie.\n\nSIDVA\n\nLa serie data è costituita da poligoni irregolari aventi un numero di lati decrescente: il primo poligono ha\n8 lati, ilsuccessivo ne ha 7 e così via. La figuramancante deve dunque essere un poligono con 4 lati, come\nquello proposto dall&#x27;alternativa\n\ni</p></details>", "back": "", "conf": "low", "page": 304, "section": "Esempi · Brano 36", "num": 2}, {"kind": "theory", "src": null, "front": "<div class='kindlabel'>THEORY</div><p class='th-en'>(English not filled yet)</p><details><summary>original (IT)</summary><p class='th-it'>Suggerimento\n\n+ È consigliabile osservare con attenzione le figure e analizzare la relazione esistente tra gli ele-\nmenti adiacenti. È dunque opportuno riconoscere la relazione che lega le figure adiacenti, verifi-\ncando ciò che avviene passando da una figura alla successiva.\n\n5,2.3 | Analogie tra figure\n\nSi tratta di esercizi costituiti da una proporzione i cui termini sono rappresentati da figure. Uno dei quat-\ntro termini è incognito e va individuato scegliendo l&#x27;alternativa corretta tra quelle proposte. Trattandosi\ndi una proporzione, la condizione da rispettare è l&#x27;equivalenza della relazione esistente tra le due figure\ncostituenti la prima coppia con quella esistente tra le due figure della seconda.</p></details>", "back": "", "conf": "low", "page": 305, "section": "5.2.2 Sequenze di figure", "num": null}, {"kind": "question", "src": "images/p305_b2.png", "front": "<img src='images/p305_b2.png' class='cardimg'><p class='q'>(English not filled yet)</p><details><summary>original text (IT)</summary><p class='th-it'>1 Individuare la figura mancante.\n\nLara\nCAIO\n\nOsservando le figure che costituiscono il primo membro della proporzione si nota che la seconda è spe-\nculare e in negativo rispetto alla prima. Affinché la stessa relazione venga mantenuta anche al secondo\nmembro, è necessario invertire la posizione e il colore dei tre cerchi let pool = ALL.slice(), idx = 0, flipped = false, filter='all';
const card = document.getElementById('card');
function view(){
  pool = ALL.filter(c=> filter==='all' || (filter==='review' && c.conf==='low') || c.kind===filter);
  if(idx>=pool.length) idx=0; render();
}
function render(){
  const c = pool[idx];
  if(!c){card.innerHTML='<p>no cards</p>';return;}
  let body = `<p class="sec">${c.section} \u00b7 p${c.page}${c.num?(' \u00b7 Q'+c.num):''}</p>` + c.front;
  if(flipped && c.back) body += `<div class="back">${c.back}</div>`;
  card.className = 'card' + (c.kind!=='question' ? ' muted' : '');
  card.innerHTML = `<span class="tag ${c.conf==='low'?'low':''}">${c.conf}</span>` + body;
  document.getElementById('count').textContent = (idx+1)+' / '+pool.length;
  document.getElementById('conf').textContent = c.conf==='low'?'\u26a0 review':'';
  const ci = card.querySelector('.cardimg');
  if(ci) ci.addEventListener('click', e=>{e.stopPropagation(); openZoom(ci.src);});
}
function flip(){flipped=!flipped;render();}
function next(){idx=(idx+1)%pool.length;flipped=false;render();}
function prev(){idx=(idx-1+pool.length)%pool.length;flipped=false;render();}
function shuffle(){for(let i=ALL.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[ALL[i],ALL[j]]=[ALL[j],ALL[i]];}idx=0;flipped=false;view();}
function setFilter(f,btn){filter=f;idx=0;flipped=false;
  document.querySelectorAll('.controls button').forEach(b=>b.classList.remove('on'));
  if(f==='all')document.getElementById('all').classList.add('on'); else btn.classList.add('on');
  view();}
function openZoom(src){const z=document.getElementById('zoom');document.getElementById('zoomimg').src=src;z.classList.add('show');}
function closeZoom(){document.getElementById('zoom').classList.remove('show');}
card.addEventListener('click', e=>{ /* all content on front; no flip */ });
let sx=0,sy=0;
card.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;},{passive:true});
card.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
  if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.5){e.preventDefault();dx<0?next():prev();}},{passive:false});
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')next();if(e.key==='ArrowLeft')prev();
  if(e.key===' '){e.preventDefault();flip();}if(e.key==='Escape')closeZoom();});
view();
</script></body></html>
