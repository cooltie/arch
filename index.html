<style>
  :root{--bg:#171614;--card:#2a2722;--ink:#f4f1ea;--muted:#a19f9c;--accent:#e9be3b;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hanken Grotesk",sans-serif;
    min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:48px 20px}
  h1{font-size:22px;font-weight:600;margin:0 0 6px}
  p.sub{color:var(--muted);margin:0 0 32px;font-size:14px}
  ul{list-style:none;padding:0;margin:0;width:100%;max-width:480px;display:flex;flex-direction:column;gap:12px}
  a{display:block;background:var(--card);color:var(--ink);text-decoration:none;padding:16px 20px;
    border-radius:12px;font-size:16px;transition:background .15s}
  a:hover{background:#332f28}
  a .n{color:var(--accent);font-weight:600;margin-right:8px}
