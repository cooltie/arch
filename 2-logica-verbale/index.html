<!doctype html><html lang="en"><head><meta charset="utf-8">

<title>Verbal Logic · Ch. 2</title>

<style>
:root{
  --bg:#15181c; --card:#1f242a; --panel:#191d22; --panel-h:#242a30;
  --ink:#eef2f6; --body:#e6ecf2; --muted:#93a0ad; --muted2:#9aa7b3;
  --line:#2e353d; --accent:#4f9ad6; --accent-h:#74b3e4; --chip-on:#2a3138;
  --chip:rgba(255,255,255,.09); --chip-h:rgba(255,255,255,.14);
  --label:"Space Grotesk",ui-monospace,monospace;
}
body[data-theme=light]{
  --bg:#eee2cc; --card:#f6efdd; --panel:#e4d7bb; --panel-h:#d9cba9;
  --ink:#33291e; --body:#33291e; --muted:#7f7668; --muted2:#a89c85;
  --line:#ddd0b4; --accent:#7f7668; --accent-h:#9c8f76; --chip-on:#ddd0b4;
  --chip:rgba(0,0,0,.06); --chip-h:rgba(0,0,0,.1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{overflow-x:hidden}
html,body{margin:0;background:var(--bg)}
body{color:var(--ink);font-family:'Hanken Grotesk',sans-serif;
  min-height:100dvh;display:flex;flex-direction:column;align-items:center;
  padding:0 16px env(safe-area-inset-bottom,16px)}
a{color:var(--accent);text-decoration-color:rgba(79,154,214,.5)}
a:hover{color:var(--accent-h)}

/* header */
header{width:100%;max-width:760px;display:flex;justify-content:space-between;
  align-items:center;gap:12px;flex-wrap:wrap;padding:18px 2px 14px}
h1{font-family:var(--label);font-size:17px;font-weight:600;letter-spacing:.01em;margin:0}
h1 .sub{color:var(--muted);font-weight:400}
.themes{display:flex;gap:4px;background:var(--panel);border-radius:10px;padding:3px}
.themes button{font-family:var(--label);font-size:11px;letter-spacing:.09em;text-transform:uppercase;
  border:none;border-radius:8px;padding:7px 14px;cursor:pointer;white-space:nowrap;
  background:transparent;color:var(--muted)}
.themes button.on{background:var(--chip-on);color:var(--ink)}

/* tabs */
.controls{position:sticky;top:0;z-index:10;width:100%;max-width:760px;display:flex;
  align-items:stretch;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px;
  overflow-x:auto;background:var(--bg);padding-top:8px;
  scrollbar-width:none;-ms-overflow-style:none}
.controls::-webkit-scrollbar{display:none;width:0;height:0}
.controls button{font-family:var(--label);font-size:12px;letter-spacing:.11em;text-transform:uppercase;
  background:none;border:none;cursor:pointer;padding:10px 12px 12px;white-space:nowrap;
  display:flex;align-items:baseline;gap:6px;color:var(--muted);box-shadow:none}
.controls button .c{font-size:10px;color:var(--muted);opacity:.7}
.controls button.on{color:var(--ink);box-shadow:inset 0 -2px 0 0 var(--accent)}
.controls button.on .c{color:var(--accent)}
.controls .spacer{flex:1;min-width:8px;box-shadow:none;pointer-events:none}
.controls button.shuf{color:var(--muted)}
.controls button.shuf:hover{color:var(--accent)}

/* card */
.cardwrap{width:100%;max-width:760px;display:flex}
.card{flex:1;min-height:58dvh;background:var(--card);border-radius:16px;
  padding:26px 30px 26px;
  display:flex;flex-direction:column;user-select:none;touch-action:pan-y;cursor:default}
.cardbody{user-select:text;-webkit-user-select:text}
.card.empty{align-items:center;justify-content:center;background:var(--panel);
  color:var(--muted);font-family:var(--label);font-size:13px;letter-spacing:.1em;text-transform:uppercase}

.cardhead{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.cardhead .ord{font-family:var(--label);font-size:13px;font-weight:600;letter-spacing:.05em;
  color:var(--body);background:var(--chip);border-radius:8px;padding:5px 10px}
.cardhead .kind{font-family:var(--label);font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.cardhead .meta{font-family:var(--label);font-size:11px;letter-spacing:.07em;color:var(--muted)}

.cardbody{color:var(--body);font-family:'Hanken Grotesk',sans-serif;font-weight:300;font-size:18.5px;line-height:1.68}
.cardbody p{margin:0 0 1.2em;text-wrap:pretty}
.cardbody p:last-child{margin-bottom:0}
.cardbody p.bul{margin:2.5em 0 0;padding-left:1.4em;text-indent:-1.4em}
.cardbody p.th-en.bul{margin-top:0}
.cardbody .kindlabel{display:none}
.cardbody .sec{display:none}
.cardbody .q{margin:0 0 1.2em}
.cardbody .th-en{margin:0 0 1.2em}
.cardbody .th-it{color:var(--muted2);font-size:.82em;line-height:1.65;white-space:pre-wrap}
.cardbody details{margin-top:1.3em}
.cardbody summary{cursor:pointer;color:var(--accent-h);font-family:var(--label);font-size:12px;
  letter-spacing:.13em;text-transform:uppercase}
.cardbody img.cardimg{max-width:100%;border-radius:8px;background:#fff;display:block;
  margin:0 0 20px;cursor:zoom-in}

.cardfoot{margin-top:auto;padding-top:26px;display:flex;justify-content:center}
.pass-btn{font-family:var(--label);font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  cursor:pointer;border:none;border-radius:99px;padding:10px 22px;
  color:var(--body);background:var(--chip)}
.pass-btn:hover{background:var(--chip-h)}
.pass-btn.done{color:#a9d0b6;background:rgba(120,190,150,.18)}

/* nav */
.nav{position:sticky;bottom:0;z-index:10;width:100%;max-width:760px;display:flex;
  align-items:center;gap:10px;padding:14px 0 18px;background:var(--bg)}
.nav button{flex:1;font-family:var(--label);font-size:12px;letter-spacing:.13em;text-transform:uppercase;
  background:var(--panel);color:var(--ink);border:none;border-radius:12px;padding:13px 16px;
  min-height:46px;cursor:pointer}
.nav button:hover{background:var(--panel-h)}
.nav button:active{transform:scale(.98)}
.count{font-family:var(--label);color:var(--muted);font-size:13px;min-width:72px;text-align:center}

/* zoom */
#zoom{position:fixed;inset:0;background:rgba(8,10,12,.96);display:none;
  align-items:center;justify-content:center;z-index:50;cursor:zoom-out;padding:12px}
#zoom.show{display:flex}
#zoom img{max-width:100%;max-height:100%;object-fit:contain;background:#fff;border-radius:8px}

</div>

<script>
const ALL = [{"kind": "theory", "src": "images/p253_b1.png", "front": "<div class='kindlabel'>THEORY</div><img src='images/p253_b1.png' class='cardimg'><p class='th-en'>2 | Verbal Logic<br><br>Verbal logic exercises have been a staple of architecture admission tests for many years. The skills being tested mainly involve command of language and the ability to identify logical relationships between words. These exercises assess not only knowledge of the Italian language but also the candidate&#x27;s broader aptitude.<br><br>In recent admission tests, this section has typically included the following exercise types:</p><p class='bul'>• Conceptual analogies</p><p class='bul'>• Word series</p><p class='bul'>• Synonyms and antonyms</p><p class='bul'>• Word meanings</p><p class='bul'>• Sentence completion</p><p class='th-en'><br>2.1 | Conceptual Analogies<br><br>Conceptual analogy exercises develop the ability to analyse the relationship linking several pairs of words. In some cases the exercises ask you to identify the anomalous pair among several; in others they take the form of proportions — using a term borrowed from mathematics — between words, with one or two terms missing. In this second type the task is to identify, from the options provided, the one that correctly completes the proportion: i.e. the one that makes the relationship between the first two terms equal to the relationship linking the third with the fourth, the fifth with the sixth, and so on.</p><details><summary>original (IT)</summary><p class='th-it'>2 Logica verbale\n\nGli esercizi di logica verbale sono presenti da molti anni nei test di ammissione ai corsi dell’area di Archi-\ntettura. Le capacità sottoposte a verifica sono principalmente quelle relative alla proprietà di linguag-\ngio e all&#x27;individuazione delle relazioni logiche tra più vocaboli. Si tratta dunque di esercizi che valutano\nnon solo la conoscenza della lingua italiana, ma anche capacità e attitudini del candidato.\n\n2.1| Analogie concettuali\n\nGli esercizi di analogia concettuale stimolano la capacità di analizzare il rapporto che lega tra loro più cop-\npie di parole. In alcuni casi gli esercizi richiedono di individuare il rapporto anomalo tra più coppie di ter-\nmini, in altri casi si presentano come proporzioni - per utilizzare un termine mutuato dalla matematica - tra\nparole, incomplete di uno o due termini. In questa seconda eventualità, si tratta di individuare, tra le alter-\nnative proposte, quella che completa correttamente la proporzione, cioè quella che rende la relazione tra i\nprimi due termini uguale a quella che lega il terzo con il quarto termine, il quinto con il sesto e così via.</p></details>", "back": "", "conf": "high", "page": 253, "section": "2.1 Analogie concettuali", "num": null, "_i": 0}, {"kind": "theory", "src": "images/p253_b2.png", "front": "<div class='kindlabel'>THEORY</div><img src='images/p253_b2.png' class='cardimg'><p class='th-en'>In the following exercises, identify the pair of terms that correctly completes the proportion.</p><details><summary>original (IT)</summary><p class='th-it'>Individuare, negli esercizi che seguono, la coppia di termini che completa correttamente la pro-\nporzione.</p></details>", "back": "", "conf": "high", "page": 253, "section": "2.1 Analogie concettuali", "num": null, "_i": 1}, {"kind": "question", "src": "images/p253_b3.png", "front": "<img src='images/p253_b3.png' class='cardimg'><p class='q'>Q1. Goniometer : angle = X : Y<br><br>A) X = chronometer, Y = metre<br>B) X = thermometer, Y = degrees<br>C) X = pantograph, Y = colour<br>D) X = barometer, Y = pressure<br>E) X = odometer, Y = velocity<br><br>The logical relationship linking the two terms of the first pair (goniometer and angle) is one of measurement: the goniometer measures angles. The alternative that preserves this relationship is D: the barometer measures pressure.<br><br>Note that option B is wrong because &quot;degrees&quot; is the unit of measurement, not the quantity being measured. For B to be correct, it should have said &quot;temperature&quot; instead of &quot;degrees&quot;.</p><details><summary>Answers</summary><p>Answer: D</p></details><details><summary>original (IT)</summary><p class='th-it'>1 Goniometro : angolo=X:Y\nX = cronometro, Y = metro\n«;. X = termometro, Y = gradi\nX = pantografo, Y = colore\nX = barometro, Y = pressione\n| X= odomettro, Y = velocità\n\nLa relazione logica che lega i due termini del primo membro (goniometro e angolo) è in questo caso di\nmisurazione: il goniometro misura infatti l&#x27;angolo. L&#x27;alternativa che rispetta tale relazione è la {»):\nmetro misura la pressione. Si osservi che l&#x27;alternativa... è errata in quanto i gradi rappresentano l&#x27;unità di\nmisura della grandezza da misurare e non la grandezza stessa. Per essere corretta, al posto di gradi l&#x27;alter-\nnativa. avrebbe dovuto riportare il termine temperatura.</p></details>", "back": "", "conf": "high", "page": 253, "section": "2.1 Analogie concettuali", "num": null, "_i": 2}, {"kind": "question", "src": "images/p253_b4.png", "front": "<img src='images/p253_b4.png' class='cardimg'><p class='q'>Q2. X : Argentina = Portuguese : Y<br><br>A) X = Spanish, Y = Uruguay<br>B) X = South American, Y = European<br>C) X = Spanish, Y = Brazil<br>D) X = Chile, Y = Spanish<br>E) X = Patagonia, Y = Azores</p><details><summary>Answers</summary><p class='q'>The correct answer is C. Indeed, Spanish is the official language of Argentina just as Portuguese is the official language of Brazil.<br><br>Option A is wrong because the official language of Uruguay is not Portuguese but Spanish. Similarly, option D is wrong because the official language of Chile is not Portuguese but Spanish. Options B and E produce proportions that are meaningless.</p></details><details><summary>original (IT)</summary><p class='th-it'>2 X: Argentina = portoghese : Y\nX = spagnolo, Y = Uruguay\nX = sudamericano, Y = europeo\n(© X= spagnolo, Y = Brasile\n?. X= Cile, Y= spagnolo\nX = Patagonia, Y = Azzorre\nLa risposta esatta è la (*’. Infatti, lo spagnolo è la lingua ufficiale dell&#x27;Argentina così come il portoghese è la\nlingua ufficiale del Brasile. L&#x27;alternativa ©. è errata in quanto la lingua ufficiale dell&#x27;Uruguay non è il portoghe-\nse ma lo spagnolo. Analogamente, l&#x27;alternativa &#x27; *. è errata in quanto la lingua ufficiale del Cile non è il porto-\nghese ma lo spagnolo. Le alternative (©) ed (© danno invece luogo a proporzioni prive di significato.</p></details>", "back": "", "conf": "high", "page": 253, "section": "2.1 Analogie concettuali", "num": null, "_i": 3}, {"kind": "question", "src": "images/p254_b2.png", "front": "<img src='images/p254_b2.png' class='cardimg'><p class='q'>Q3. X : ship = take off : Y<br><br>A) X = navigate, Y = aeroplane<br>B) X = captain, Y = pilot<br>C) X = aeroplane, Y = dock<br>D) X = moor, Y = aeroplane<br>E) X = set sail, Y = aeroplane<br><br>Option B can easily be eliminated because, although a ship&#x27;s captain is the equivalent of a plane&#x27;s pilot, these are nouns, whereas &quot;take off&quot; (decollare) is a verb — so X must also be a verb. Options C and D fail because &quot;dock&quot; (approdare) means to arrive, not to depart. Between A and E, &quot;navigate&quot; describes ongoing movement while &quot;set sail&quot; (salpare) describes the specific act of departure — just as &quot;take off&quot; describes the specific act of departure for a plane.</p><details><summary>Answers</summary><p class='q'>The correct answer is therefore E.</p></details><details><summary>original (IT)</summary><p class='th-it'>3 X: nave = decollare : Y\nX = navigare, Y = aeroplano\n\n(-) X= capitano, Y = pilota\n\n© X= aeroplano, Y = approdare\n(®) X= ormeggiare, Y = aeroplano\n\n(= X= salpare, Y= aeroplano\n\nL&#x27;alternativa {-) può essere facilmente scartata in quanto, pur essendo il capitano di una nave l&#x27;equivalente\ndel pilota di un aeroplano, non compare nella proporzione il termine aeroplano. Le alternative. , | e. so-\nno errate in quanto i verbi navigare, approdare e ormeggiare non hanno un significato equivalente a quello\ndi decollare.\n\nLa risposta esatta è quindi la .-.. Infatti il verbo che indica la partenza di una nave è salpare così come il verbo\nche indica la partenza di un aeroplano è decollare.</p></details>", "back": "", "conf": "high", "page": 254, "section": "2.1 Analogie concettuali", "num": null, "_i": 4}, {"kind": "question", "src": "images/p254_b3.png", "front": "<img src='images/p254_b3.png' class='cardimg'><p class='q'>Q4. Doctor : lawyer = X : Y<br><br>A) X = client, Y = sick person<br>B) X = patient, Y = case<br>C) X = criminal, Y = dentist<br>D) X = dispute, Y = illness<br>E) X = patient, Y = client<br><br>In this case, no single precise relationship links the two given terms directly. It is better to look for a relationship between the first given term and the first term of each option, then check whether the second terms preserve the same relationship.</p><details><summary>Answers</summary><p class='q'>The correct answer is E: a patient is the person who receives the services of a doctor, just as a client is the person who receives the services of a lawyer.<br><br>Note that in option A the terms would complete the proportion if they were not presented in reversed order.</p></details><details><summary>original (IT)</summary><p class='th-it'>4 Medico : avvocato = X: Y\nX = cliente, Y= malato\nX = paziente, Y = causa\n‘ X= penale, Y = dentista\n\nX = disputa, Y = malattia\n\n| X = paziente, Y = cliente\n\nIn questo caso non è possibile determinare una relazione precisa tra i due termini noti della proporzione.\nConviene, dunque, cercare una relazione tra il primo termine dato e il primo termine di ciascuna delle al-\nternative proposte. Una volta individuata tale relazione, bisogna verificare se il secondo termine dell‘al-\nternativa in esame presenti la stessa relazione con il secondo termine dato. L&#x27;alternativa corretta è la\n\nil paziente, infatti, è la persona che beneficia dei servizi del medico, così come il cliente è colui che usufruisce\ndei servizi dell&#x27;avvocato.\n\nSi osservi che nell’alternativa .. i termini proposti completerebbero la proporzione se non fossero pre-\nsentati nell&#x27;ordine invertito.</p></details>", "back": "", "conf": "high", "page": 254, "section": "2.1 Analogie concettuali", "num": null, "_i": 5}, {"kind": "question", "src": "images/p254_b4.png", "front": "<img src='images/p254_b4.png' class='cardimg'><p class='q'>Q5. Tepid is to hot as X is to Y<br><br>A) X = ecstasy, Y = joy<br>B) X = beautiful, Y = stunning<br>C) X = boiling, Y = cold<br>D) X = summer, Y = sun<br>E) X = freezing, Y = cold<br><br>The proportion here is one of degree of intensity: &quot;tepid&quot; is a milder form of &quot;hot.&quot; We need X to be a milder form of Y.</p><details><summary>Answers</summary><p class='q'>The correct answer is B: &quot;beautiful&quot; is a milder form of &quot;stunning,&quot; preserving the same relationship of increasing intensity.<br><br>Option A is reversed (ecstasy is stronger than joy). Option C has opposite terms. Options D and E do not express a gradation of the same quality.</p></details><details><summary>original (IT)</summary><p class='th-it'>5 Tiepido sta a caldo come X sta aY\n) X= estasi, Y = gioia\nì X= bello, Y= stupendo\n| X= bollente, Y = freddo\nX = estate, Y = sole\n(= X= gelido, Y= freddo\n\nIn questo caso, il quesito si presenta in forma leggermente differente, anche se la logica dell&#x27;esercizio ri-\nmane inalterata: la proporzione non viene proposta in forma simbolica ma espressa in una frase per mez-\nzo del linguaggio comune. La relazione tra i due termini dati (tiepido e caldo) è di un grado di intensità dif-\nferente: tiepido e caldo sono due aggettivi che esprimono il concetto di temperatura elevata, ma con un\ndiverso grado di intensità (caldo è più intenso di tiepido).\n\nSi osservi che, tra le alternative proposte, ne esistono tre che rispettano la relazione di diverso grado di inten-\nsità: la. lal-Jela{.La{. ela. -, tuttavia, presentano i due termini in ordine inverso, ossia prima il più\nintenso e poi quello meno intenso. L&#x27;alternativa corretta è dunque la (-..</p></details>", "back": "", "conf": "high", "page": 254, "section": "2.1 Analogie concettuali", "num": null, "_i": 6}, {"kind": "theory", "src": "images/p255_b1.png", "front": "<div class='kindlabel'>THEORY</div><img src='images/p255_b1.png' class='cardimg'><p class='th-en'>Types of Relations<br><br>Below is a list of the most frequently used types of conceptual-analogy relationships in admission tests. This list is not exhaustive — other possible relationships could easily be identified.<br></p><p class='bul'>• Author and their work</p><p class='bul'>• Author and their literary movement</p><p class='bul'>• Character and their creator</p><p class='bul'>• Worker and the product of their work</p><p class='bul'>• Worker and the tool they use</p><p class='bul'>• Tool and the object it works on</p><p class='bul'>• Temporal sequence</p><p class='bul'>• Cause and effect</p><p class='bul'>• Degree of intensity</p><p class='bul'>• Class and species</p><p class='bul'>• Grammatical relationships</p><p class='bul'>• Synonyms</p><p class='bul'>• Antonyms</p><p class='bul'>• Measurement (instrument and what it measures)</p><p class='bul'>• Container and content</p><p class='bul'>• Object and the material it is made of</p><details><summary>original (IT)</summary><p class='th-it'>Tipologie di relazioni\n\nDi seguito viene riportata una lista delle tipologie di relazioni di analogia concettuale più frequentemen-\nte utilizzate nei test di ammissione. Tale lista non ha la pretesa di essere completa: si potrebbero infatti\nagevolmente individuare altre possibili relazioni).</p></details>", "back": "", "conf": "high", "page": 255, "section": "2.1 Analogie concettuali", "num": null, "_i": 7}, {"kind": "theory", "src": "images/p255_b2.png", "front": "<div class='kindlabel'>THEORY</div><img src='images/p255_b2.png' class='cardimg'><p class='th-en'>Relationship Examples<br><br>Author &amp; work: Manzoni : I Promessi Sposi<br>Author &amp; movement: Verga : Verismo<br>Character &amp; creator: Renzo : Manzoni<br>Worker &amp; product: Baker : bread<br>Worker &amp; tool: Farmer : plough<br>Tool &amp; object: Needle : fabric<br>Temporal sequence: Dawn : sunset<br>Cause &amp; effect: Fire : smoke<br>Degree of intensity: Tepid : boiling<br>Class &amp; species: Bird : eagle<br>Grammatical: Beautiful : ugly (antonyms)<br>Synonyms: House : dwelling<br>Measurement: Thermometer : temperature</p><details><summary>original (IT)</summary><p class='th-it'>RELAZIONI\nAutore e sua opera\n\nAutore e corrente di appartenenza\nPersonaggio e suo ideatore\nLavoratore e frutto del lavoro\nLavoratore e strumento utilizzato\nStrumento e oggetto su cui si lavora\nSequenza temporale\n\nCausa ed effetto\n\nGrado di intensità\n\nClasse e specie\n\nRelazioni grammaticali\n\nSinonimi\n\nContrari\n\nParte del tutto\n\nElemento di un insieme\n\nSesso\n\nVerga :/ Malavoglia;\n\nMarinetti : Futurismo;\n\nGargantua : Rabelais;\n\nscrittore : libro;\nscultore : scalpello;\npenna : carta;\npresto : tardi;\n\nvirus : influenza;\ntiepido : caldo;\ninsetti : formica;\n\nio : mio;\n\ngentile : benevolo;\nmai : sempre;\nscafo : nave;\nsoldato : esercito;\n\nmucca : toro;\n\nESEMPI\n\nPirandello : /l fu Mattia Pascal\nMonet : Impressionismo\nDon Chisciotte: Cervantes\ncompositore : sinfonia\npittore : pennello\n\npialla : legno\n\nalba : tramonto\nesplosione : macerie\n\ngioia : estasi\n\nmammiferi : delfino\n\nha : ebbe\n\nbugia : menzogna\n\namore : odio\n\nruota : bicicletta\n\nstella : costellazione\n\ngallina : gallo</p></details>", "back": "", "conf": "high", "page": 255, "section": "2.1 Analogie concettuali", "num": null, "_i": 8}, {"kind": "theory", "src": "images/p255_b3.png", "front": "<div class='kindlabel'>THEORY</div><img src='images/p255_b3.png' class='cardimg'><p class='th-en'>Tips for Conceptual Analogies<br></p><p class='bul'>• Before analysing the options, try to identify the type of relationship between the two given terms of the proportion. Then examine each option to see which one preserves that relationship.</p><p class='bul'>• If the unknowns of a proportion are X : known = known : Y, it is advisable to start by looking for the relationship between the first known term and the first term of each option (i.e. between the two terms in the &quot;X&quot; position).</p><p class='bul'>• If several options seem to fit, re-read the question and pay attention to the order of the terms — sometimes options are traps with correct terms but reversed positions.</p><details><summary>original (IT)</summary><p class='th-it'>Suggerimenti\n\n* Prima di analizzare le alternative possibili, occorre cercare di individuare il tipo di relazione esi-\nstente tra i due termini dati della proporzione. Quindi analizzare le varie alternative, per vedere\nquale di esse rispetta tale relazione.\n\n* Nelcaso in cui le incognite di una proporzione siano relative a due membri diversi della stessa,\noccorre andare per tentativi, ossia provare a sostituire i vocaboli delle diverse alternative e control-\nlare se la proporzione acquista significato.\n\n* In questi esercizi, è importante controllare tutte le alternative, verificando che quelle scartate\nsiano effettivamente errate.\n\n«+  Èimportante prestare attenzione all&#x27;ordine con cui sono presentati i due termini della relazione.\nA volte infatti sono presenti alternative che rispettano la relazione di partenza, ma con l&#x27;ordine delle\nincognite invertito.</p></details>", "back": "", "conf": "high", "page": 255, "section": "2.1 Analogie concettuali", "num": null, "_i": 9}, {"kind": "theory", "src": "images/p256_b1.png", "front": "<div class='kindlabel'>THEORY</div><img src='images/p256_b1.png' class='cardimg'><p class='th-en'>2.2 | Word Series<br><br>These are presented as sequences of words among which the candidate must identify the one to eliminate because it is not coherent (for a reason to be identified) with the rest of the series.<br><br>In this type of exercise the task is to identify the logical or formal link that exists between the words in the sequence, and on the basis of that link identify the term that does not respect it. There are two different types of exercise, depending on the kind of link between the words. The first, more frequent, is one in which the logical link relates to the meaning of the words; the second, much less frequent, is one in which the logical link relates to the signifier — i.e. the way the words are written.<br><br>2.2.1 | Semantic logical link<br><br>Within this first type it is possible to identify various categories of logical links between the words in the series. Consider the following exercises as examples.</p><details><summary>original (IT)</summary><p class='th-it'>| Serie di parole\n\nSi presentano come sequenze di vocaboli, tra i quali il candidato deve riconoscere quello da scartare per-\nché non coerente (per una ragione da individuare) rispetto alla serie data. In questa tipologia di esercizi,\nin altre parole, si tratta di identificare il legame logico o formale esistente tra le parole della sequenza e,\nsulla base di tale legame, individuare iltermine che non lo rispetta. Esistono due diverse tipologie di eser-\ncizi, a seconda del tipo di legame esistente tra i vocaboli. La prima, più frequente, è quella in cui il nesso\nlogico è riferito al significato delle parole; la seconda, molto meno frequente, è quella in cui il nesso logico\nè riferito al significante, ossia al modo in cui i vocaboli sono scritti.\n\n2.2.1 | Nesso logico del significato\n\nAll&#x27;interno di questa prima tipologia è possibile identificare diverse categorie di legami logici fra le parole\ndella serie. Si considerino, a titolo di esempio, i seguenti esercizi.</p></details>", "back": "", "conf": "high", "page": 256, "section": "2.2.1 Nesso logico del significato", "num": null, "_i": 10}, {"kind": "question", "src": "images/p256_b2.png", "front": "<img src='images/p256_b2.png' class='cardimg'><p class='q'>Q1. Identify the word to eliminate.<br>Ecuador — [?] — [?] — [?] — Canada<br><br>A) Ecuador<br>B) [?]<br>C) [?]<br>D) [?]<br>E) Canada<br><br>Geographical link. The correct answer is E: all are Latin American nations, except Canada.</p><details><summary>Answers</summary><p>Answer: E</p></details><details><summary>original (IT)</summary><p class='th-it'>1 Indicare la parola da scartare.\nEcuador\n\nNesso geografico. La risposta esatta è la‘ : si tratta infatti di nazioni dell&#x27;America Latina, a eccezione del\nCanada.</p></details>", "back": "", "conf": "high", "page": 256, "section": "2.2.1 Nesso logico del significato", "num": 1, "_i": 11}, {"kind": "question", "src": "images/p256_b3.png", "front": "<img src='images/p256_b3.png' class='cardimg'><p class='q'>Q2. Identify the name to eliminate.<br>Giuseppe Tomasi di Lampedusa — Torquato Tasso — Giovanni Verga — Filippo Tommaso Marinetti — Carlo Emilio Gadda<br><br>A) Giuseppe Tomasi di Lampedusa<br>B) Torquato Tasso<br>C) Giovanni Verga<br>D) Filippo Tommaso Marinetti<br>E) Carlo Emilio Gadda<br><br>Temporal link. The correct answer is B: all are writers who lived between the 19th and 20th centuries, except Torquato Tasso, who belongs to the 16th century.</p><details><summary>Answers</summary><p>Answer: B</p></details><details><summary>original (IT)</summary><p class='th-it'>2 Indicare il nome da scartare.\nGiuseppe Tomasi di Lampedusa\nTorquato Tasso\n\nGiovanni Verga\n\nFilippo Tommaso Marinetti\nCarlo Emilio Gadda\n\nNesso temporale. La risposta esatta è la. : si tratta infatti di scrittori vissuti a cavallo tra il secolo XIX e il\nsecolo XX, a eccezione di Torquato Tasso che è del secolo XVI.\n\nÈ\n(ns\ns</p></details>", "back": "", "conf": "high", "page": 256, "section": "2.2.1 Nesso logico del significato", "num": 2, "_i": 12}, {"kind": "question", "src": "images/p256_b4.png", "front": "<img src='images/p256_b4.png' class='cardimg'><p class='q'>Q3. Identify the word to eliminate.<br>Whale — Snake — Bat — Gnu — Rabbit<br><br>A) Whale<br>B) Snake<br>C) Bat<br>D) Gnu<br>E) Rabbit<br><br>Class/genus link. The correct answer is B: all are mammals, except the snake, which is a reptile.</p><details><summary>Answers</summary><p>Answer: B</p></details><details><summary>original (IT)</summary><p class='th-it'>3 Indicare la parola da scartare.\nBalena\n\nSerpente\n\n| Pipistrello\n\nGnu\n\nConiglio\n\nNesso di classe o genere. La risposta esatta è la. : si tratta infatti di mammiferi, a eccezione del serpente,\nche è un rettile.</p></details>", "back": "", "conf": "high", "page": 256, "section": "2.2.1 Nesso logico del significato", "num": 3, "_i": 13}, {"kind": "question", "src": "images/p256_b5.png", "front": "<img src='images/p256_b5.png' class='cardimg'><p class='q'>Q4. Identify the word to eliminate.<br>Mozzarella — Yogurt — Oil — Cream — Ricotta<br><br>A) Mozzarella<br>B) Yogurt<br>C) Oil<br>D) Cream<br>E) Ricotta<br><br>Derivation link. The correct answer is C: oil is the only food among those listed that is not derived from milk.</p><details><summary>Answers</summary><p>Answer: C</p></details><details><summary>original (IT)</summary><p class='th-it'>4 Indicare la parola da scartare.\nMozzarella\n\n. Yogurt\n\n. Olio\n\nPanna\n\nRicotta\n\nNesso di derivazione. La risposta esatta è la\n\n: l&#x27;olio è l&#x27;unico alimento, fra quelli elencati, non derivato dal latte.</p></details>", "back": "", "conf": "high", "page": 256, "section": "2.2.1 Nesso logico del significato", "num": 4, "_i": 14}, {"kind": "question", "src": "images/p257_b2.png", "front": "<img src='images/p257_b2.png' class='cardimg'><p class='q'>Q5. Identify the word to eliminate.<br>Avvalorare (to corroborate) — Confermare (to confirm) — Ratificare (to ratify) — Giustificare (to justify) — Convalidare (to validate)<br><br>A) Avvalorare<br>B) Confermare<br>C) Ratificare<br>D) Giustificare<br>E) Convalidare<br><br>Except for &quot;giustificare&quot; (to justify), all the other verbs are synonyms meaning &quot;to confirm/validate.&quot; The correct answer is therefore D.<br><br>Formal link of the signifier: This second type of exercise, much less common, resembles certain word puzzles. See the following example.</p><details><summary>Answers</summary><p>Answer: D</p></details><details><summary>original (IT)</summary><p class='th-it'>5 Indicare la parola da scartare.\n\nAvvalorare\nConfermare\nRatificare\nGiustificare\nConvalidare\n\nA eccezione di giustificare, tutti gli altri verbi sono sinonimi. La risposta esatta è quindi la °*..\n\nNesso logico del significante\n\nGli esercizi di questa seconda tipologia, molto meno frequenti, somigliano ad alcuni rompicapo di tipo\nenigmistico. Un esempio risulterà sufficiente a comprendere la loro natura. Occorre ricordare che in que-\n\nsto caso il nesso logico fa riferimento al significante dei vocaboli, ossia a come i vocaboli sono scritti e non\nal loro senso.</p></details>", "back": "", "conf": "high", "page": 257, "section": "2.2.1 Nesso logico del significato", "num": 5, "_i": 15}, {"kind": "theory", "src": "images/p257_b3.png", "front": "<div class='kindlabel'>THEORY</div><img src='images/p257_b3.png' class='cardimg'><p class='th-en'>Q (example). Identify the word to eliminate.<br>Nerone (Nero) — Sindaco (Mayor) — Grosso (Big) — Viola (Violet) — Regime<br><br>A) Nerone<br>B) Sindaco<br>C) Grosso<br>D) Viola<br>E) Regime<br><br>The correct answer is E. All the words contain, hidden within them, the name of a colour (NERO-ne, s-INDACO, g-ROSSO, VIOLA), except &quot;regime.&quot;<br><br>Tips:</p><p class='bul'>• Examine words two by two, trying to identify the link connecting them. Then check if the same link applies to all the others.</p><p class='bul'>• Try to recall some of the most common logical links listed above and see whether the words in the exercise fit one of them.</p><p class='bul'>• Focus first on finding a semantic link (related to meaning) rather than a formal one. Formal links are much rarer; only if you cannot find a semantic logic should you look at the form of the proposed terms.</p><p class='th-en'><br>2.3 | Synonyms and Antonyms<br><br>In this type of exercise the candidate must identify, from a series of options, the synonym or antonym of the given word.<br><br>Pay attention to the alternation between questions asking for an antonym and those asking for a synonym.<br><br>Furthermore, in some exercises asking for an antonym the candidate may find the synonym of the given word among the options, and vice versa.</p><details><summary>original (IT)</summary><p class='th-it'>1 Indicare la parola da scartare.\nNerone Sindaco Grosso Viola = Regime\n\nLa risposta esatta è la - . Infatti tutti i vocaboli contengono, al loro interno, il nome di un colore (nero,\nindaco, rosso, viola), a eccezione di regime.\n\nSuggerimenti\n\n* Esaminare i vocaboli a due a due, cercando di identificare il nesso che li lega. Successivamente,\ncontrollare se lo stesso nesso logico viene rispettato dagli altri vocaboli.\n\n* Ricordare almeno alcuni dei nessi logici più comuni esaminati sopra e provare a vedere se i voca-\nboli presenti negli esercizi sono riconducibili a uno di essi.\n\n* Concentrarsi dapprima sulla ricerca di un nesso logico riferito al significato e non al signifi-\ncante. Esercizi basati su quest&#x27;ultimo sono infatti molto più rari. Solo se non si riesce a individuare\nuna logica legata al significato, è opportuno ragionare sul significante dei termini proposti.\n\n2.3! Sinonimi e contrari\n\nIn questo tipo di esercizio il candidato deve individuare, tra una serie di alternative, il sinonimo o il con-\ntrario del termine proposto.\n\nOccorre prestare attenzione all&#x27;alternanza tra le domande che richiedono il contrario e quelle che richie-\ndono il sinonimo.\n\nInoltre, in alcuni esercizi che richiedono il contrario il candidato può trovare tra le alternative anche il si-\nnonimo del termine proposto e viceversa.</p></details>", "back": "", "conf": "high", "page": 257, "section": "2.2.1 Nesso logico del significato", "num": null, "_i": 16}, {"kind": "question", "src": "images/p257_b4.png", "front": "<img src='images/p257_b4.png' class='cardimg'><p class='q'>Q1. A synonym of &quot;epigono&quot; (epigone) is:<br>A) rhymer<br>B) angle opposite the vertex of another angle<br>C) disciple<br>D) symmetric<br>E) mentally ill person<br><br>The &quot;Epigoni&quot; were the Greek princes who laid the second siege to Thebes, being the sons of those who had besieged the city the first time. The word &quot;epigone&quot; therefore means successor, descendant, disciple. The correct answer is C.</p><details><summary>Answers</summary><p>Answer: C</p></details><details><summary>original (IT)</summary><p class='th-it'>1 Un sinonimo di epigono è:\nrimatore\nangolo opposto al vertice di un altro angolo\ndiscepolo\nsimmetrico\nmalato di mente\n\nVennero chiamati epigoni i Principi Greci che fecero il secondo assedio a Tebe perché erano i figli di coloro\nche avevano assediato la città la prima volta. La parola epigono significa, quindi, successore, discendente,\ndiscepolo. La soluzione al quesito è fornita dall&#x27;alternativa</p></details>", "back": "", "conf": "high", "page": 257, "section": "2.2.1 Nesso logico del significato", "num": 1, "_i": 17}, {"kind": "question", "src": "images/p258_b1.png", "front": "<img src='images/p258_b1.png' class='cardimg'><p class='q'>Q2. A synonym of &quot;ipotesi&quot; (hypothesis) is:<br>A) presumption<br>B) prejudice<br>C) conjecture<br>D) falsehood<br>E) example<br><br>A hypothesis is a supposition, a conjecture aimed at explaining facts that are not perfectly known. In mathematical language too, the hypothesis of a theorem is a statement, a conjecture assumed to be true in order to prove a thesis.</p><details><summary>Answers</summary><p class='q'>The correct answer is C.</p></details><details><summary>original (IT)</summary><p class='th-it'>2 Un sinonimo di ipotesi è:\n. presunzione\npregiudizio\n| congettura\n| falsità\nesempio\n\nL&#x27;ipotesi è una supposizione, una congettura che tende a spiegare fatti di cui non si ha una perfetta cono-\nscenza. Anche nel linguaggio matematico, all&#x27;interno di un teorema, l&#x27;ipotesi è un&#x27;affermazione, una con-\ngettura che si suppone essere vera per spiegare una tesi. La soluzione al quesito è dunque la.</p></details>", "back": "", "conf": "high", "page": 258, "section": "2.4 Significato di parole", "num": null, "_i": 18}, {"kind": "question", "src": "images/p258_b2.png", "front": "<img src='images/p258_b2.png' class='cardimg'><p class='q'>Q3. What is a synonym of &quot;flebile&quot; (feeble/faint)?<br>A) Feverish<br>B) Faint (fioco)<br>C) Flexible<br>D) Strong<br>E) Intense<br><br>&quot;Flebile&quot; means feeble, faint, subdued. The correct answer is B. &quot;Strong&quot; and &quot;intense&quot; have the opposite meaning, so options D and E are wrong.<br><br>2.4 | Word Meanings<br><br>In this type of exercise the candidate must identify, from the options, the one that gives the correct meaning of the proposed word. If the meaning of the word is completely unknown, try to trace the etymology of the terms if known, and eliminate the obviously wrong options to increase the probability of answering correctly.</p><details><summary>Answers</summary><p>Answer: B</p></details><details><summary>original (IT)</summary><p class='th-it'>3 Qual è è un sinonimo di flebile?\n. Febbricitante\nFioco\nFlessibile\n. Forte\n. Intenso\n\nFlebile significa fievole, fioco, sommesso. La risposta esatta è quindi la... Forte e intenso sono due termini\ncon significato contrario a quello di flebile e quindi le risposte ©. ed sono sbagliate.\n\n2.4 | Significato di parole\n\nIn questa tipologia di esercizi il candidato deve individuare, fra le alternative, quella che riporta il signifi-\ncato corretto della parola proposta. Qualora si ignori del tutto il significato del termine proposto si può\n\ncercare di risalire all&#x27;etimologia dei termini se conosciuta e di eliminare le alternative palesemente errate\nper aumentare la probabilità di rispondere correttamente.</p></details>", "back": "", "conf": "high", "page": 258, "section": "2.4 Significato di parole", "num": 3, "_i": 19}, {"kind": "question", "src": "images/p258_b3.png", "front": "<img src='images/p258_b3.png' class='cardimg'><p class='q'>Q1. Which of the following meanings belongs to the term &quot;domotica&quot; (home automation)?<br>A) Science applied to building techniques<br>B) Applied science that studies machines, instruments, and work environments to make them maximally functional<br>C) Study of measurements made with a domograph<br>D) Study and application of technologies to improve quality of life in human environments<br>E) Study of the history of material culture relating to dwellings<br><br>&quot;Domotica&quot; is the science that studies technologies aimed at improving quality of life in the home (and more generally in human-inhabited environments) through automation (option D). The term &quot;domotica&quot; is a neologism derived from the Latin word domus (home, dwelling) combined with the noun automatica (or, according to some, informatica or robotica).</p><details><summary>Answers</summary><p>Answer: D</p></details><details><summary>original (IT)</summary><p class='th-it'>1 Quale dei seguenti significati è proprio del termine domotica?\nScienza applicata alle tecniche costruttive\n. Scienza applicata che studia macchine, strumenti e ambienti di lavoro per renderli massima-\n\nmente funzionali\n\n*. Studio delle misurazioni compiute con il domografo\nStudio e applicazione delle tecnologie per migliorare la qualità della vita negli ambienti\nantropizzati\n\n-. Studio della storia della cultura materiale relativa alle abitazioni\n\nLa domotica è la scienza che studia le tecnologie finalizzate a migliorare la qualità della vita nella casa (e\npiù in generale negli ambienti antropizzati, cioè abitati da esseri umani) grazie all&#x27;automazione (soluzio-\nne -.). Il termine domotica è un neologismo che deriva dalla parola latina domus (casa, abitazione) unita\nal sostantivo automatica (0, secondo alcuni, a informatica o a robotica).</p></details>", "back": "", "conf": "high", "page": 258, "section": "2.4 Significato di parole", "num": 1, "_i": 20}, {"kind": "question", "src": "images/p258_b4.png", "front": "<img src='images/p258_b4.png' class='cardimg'><p class='q'>Q2. Glaucoma is a disease that affects which organ of the body?<br>A) Heart<br>B) Ear<br>C) Liver<br>D) Eye<br>E) Stomach<br><br>Glaucoma is a disease that affects the optic nerve and can cause serious damage to vision, including irreversible lesions. The frequency with which glaucoma affects the population increases significantly in people over forty.</p><details><summary>Answers</summary><p class='q'>The correct answer is therefore D (eye).</p></details><details><summary>original (IT)</summary><p class='th-it'>2\n\nIl glaucoma è è una malattia che colpisce quale organo del corpo?\n. Cuore\n. Orecchio\n. Fegato\n.. Occhio\n. Stomaco</p></details>", "back": "", "conf": "high", "page": 258, "section": "2.4 Significato di parole", "num": 2, "_i": 21}, {"kind": "question", "src": "images/p259_b2.png", "front": "<img src='images/p259_b2.png' class='cardimg'><p class='q'>Q3. An &quot;epitaffio&quot; (epitaph) is:<br>A) a tombstone inscription containing expressions of praise for the deceased<br>B) a sailing rope used to stretch the sail when there is no wind<br>C) a satirical poem in ottava rima<br>D) a typical Catalan fish dish<br>E) a material used to seal pipe joints in plumbing</p><details><summary>Answers</summary><p class='q'>The correct definition of &quot;epitaph&quot; is that given by option A. In ancient Greece the epitaph was a funeral oration composed to celebrate national heroes and those who fell in war. The correct answer is A.<br><br>2.5 | Sentence Completion<br><br>In this type of exercise incomplete sentences are presented, generally missing one or two words. The candidate is asked to identify, from the options, the one that best completes the sentence. The subject matter may be scientific, literary, journalistic, artistic, or other. A common case is sentences composed of two clauses, one main and one subordinate. Identifying the missing word (or words) is linked to understanding the conclusions that can be drawn from the main clause (if the missing word is in the subordinate), or to identifying the premises when the conclusion is known (if the missing word is in the main clause).</p></details><details><summary>original (IT)</summary><p class='th-it'>3 L&#x27;epitaffio è\nun&#x27;iscrizione tombale che contiene espressioni di lode nei confronti del defunto\nuna corda da regata che si utilizza per tendere la vela in assenza di vento\nun poema satirico in ottave\nun piatto tipico catalano a base di pesce\nun materiale utilizzato per rendere stagni i punti di giuntura delle tubature dell&#x27;acqua\n\nLa definizione esatta di epitaffio è quella fornita dall&#x27;alternativa . . Nell&#x27;antica Grecia l&#x27;epitaffio era un&#x27;ora-\nzione funebre composta per celebrare gli eroi nazionali e i caduti in guerra.\n\n2.5 | Frasi incomplete\n\nIn questo tipo di esercizi vengono presentate frasi incomplete, generalmente mancanti di uno o due vo-\ncaboli. Al candidato viene richiesto di individuare, tra le alternative presenti, quella che meglio completa\nla frase. L&#x27;argomento delle frasi può essere scientifico, letterario, giornalistico, artistico o di altra natura. È\nfrequente il caso di frasi composte da due proposizioni, una principale e una subordinata. L&#x27;individuazio-\nne del vocabolo mancante (o dei vocaboli mancanti) è legata alla comprensione delle conclusioni che si\npossono trarre dalla principale (se il vocabolo mancante è nella subordinata), o all&#x27;individuazione delle\npremesse quando se ne conosce la conclusione (se il vocabolo mancante è nella principale).</p></details>", "back": "", "conf": "high", "page": 259, "section": "2.5 Frasi incomplete", "num": null, "_i": 22}, {"kind": "question", "src": "images/p259_b3.png", "front": "<img src='images/p259_b3.png' class='cardimg'><p class='q'>Q1. Although he was usually a _____ person, his speech at the conference was very _____.<br><br>A) intelligent — critical<br>B) erudite — attentive<br>C) loyal — incorrect<br>D) timid — subdued<br>E) brilliant — listened to</p><details><summary>Answers</summary><p class='q'>The correct answer is C. The sentence indicates an expectation of something different from the person&#x27;s usual quality (&quot;although&quot; signals contrast). Therefore the two adjectives must be opposite in meaning: &quot;loyal&quot; (leale) contrasts with &quot;incorrect/dishonest&quot; (scorretto).</p></details><details><summary>original (IT)</summary><p class='th-it'>1 Nonostante fosse una persona solitamente ..., il suo intervento al convegno era stato\nmolto ...\nintelligente - critico\nerudita - attento\nleale - scorretto\ntimido - sommesso\n\nbrillante - ascoltato\n\nLa risposta corretta è la .. La frase riportata, infatti, indica l&#x27;aspettativa di qualcosa di diverso dalla qua-\nlità o caratteristica della persona in esame (nonostante). Dunque i due aggettivi devono essere opposti\nnel significato: leale e scorretto rispondono a tale requisito di opposizione.</p></details>", "back": "", "conf": "high", "page": 259, "section": "2.5 Frasi incomplete", "num": 1, "_i": 23}, {"kind": "question", "src": "images/p259_b4.png", "front": "<img src='images/p259_b4.png' class='cardimg'><p class='q'>Q2. _____ has caused the tremendous problem of _____ of hundreds of workers, replaced by machines.<br><br>A) The speciality — of reallocation<br>B) Automation — of retraining<br>C) Unemployment — of education<br>D) Disease — of recovery<br>E) Mechanisation — of training</p><details><summary>Answers</summary><p class='q'>The correct answer is B. The replacement of workers by machines (automation) creates the need to retrain (readdestramento) those workers for new roles.</p></details><details><summary>original (IT)</summary><p class='th-it'>2 ... ha determinato il tremendo problema ... di centinaia di lavoratori, rimpiazzati dalle\nmacchine.\n\nLa specialità - della riallocazione\nL&#x27;automazione - del riaddestramento\nLa disoccupazione - dell&#x27;istruzione\nLa malattia - del recupero\n\nLa macchinizzazione - dell&#x27;addestramento\n\nL&#x27;alternativa corretta è la .- . Il ricollocamento dei lavoratori sostituiti dalle macchine necessita infatti\ndel loro riaddestramento. L&#x27;alternativa, unica apparentemente corretta oltre alla ‘-‘, può essere scar-\ntata in quanto da un lato il termine macchinizzazione non è appropriato, dall&#x27;altro si tratta di un riad-\ndestramento (è verosimile che i lavoratori fossero già addestrati a compiere un determinato lavoro).</p></details>", "back": "", "conf": "high", "page": 259, "section": "2.5 Frasi incomplete", "num": null, "_i": 24}, {"kind": "question", "src": "images/p260_b2.png", "front": "<img src='images/p260_b2.png' class='cardimg'><p class='q'>Q3. Which words should replace the numbers to give the following sentence a complete and logical meaning?<br><br>&quot;Si _(1)_ la mia sottolineatura del fatto che nessuno mi _(2)_ cercato in occasione della candidatura.&quot;<br><br>A) (1) deduce; (2) avessero<br>B) (1) vince; (2) avrebbe<br>C) (1) evince; (2) avesse<br>D) (1) irride; (2) abbia<br>E) (1) addice; (2) abbiano<br><br>The sentence, completed to have a clear and coherent meaning, requires &quot;evince&quot; (it is evident / one gathers) and the subjunctive &quot;avesse&quot; (had). The correct answer is C.</p><details><summary>Answers</summary><p>Answer: C</p></details><details><summary>original (IT)</summary><p class='th-it'>3 Quali parole vanno sostituite ai numeri per dare un senso compiuto e logico alla frase\nseguente?\n“Si _(1)__lamia sottolineatura del fatto che nessuno mi __(2)__ cercato in occasione della\ncandidatura”\n© (1) deduce; (2) avessero\n\n(1) vince; (2) avrebbe\n\n(1) evince; (2) avesse\n\n(1) irride; (2) abbia\n\n(1) addice; (2) abbiano\n\nLa frase, completata in modo da assumere un significato chiaro e coerente, risulta essere: “Si irride la\nmia sottolineatura del fatto che nessuno mi abbia cercato in occasione della candidatura” come indi-\ncato dall&#x27;alternativa</p></details>", "back": "", "conf": "high", "page": 260, "section": "2.5 Frasi incomplete", "num": 3, "_i": 25}, {"kind": "question", "src": "images/p260_b3.png", "front": "<img src='images/p260_b3.png' class='cardimg'><p class='q'>Q4. Which words should replace the numbers to give the following sentence a complete and logical meaning?<br><br>&quot;The barricades had been set up at the start of the protest, begun on 28 September, against the current _(1)_ law that gives Beijing the right to _(2)_ candidates for the election of Hong Kong&#x27;s highest office, that of _(3)_.&quot;<br><br>A) (1) earthy; (2) recess; (3) of the judiciary<br>B) (1) ethereal; (2) pre-emption; (3) apophantic<br>C) (1) overreaching; (2) deference; (3) pro partes<br>D) (1) electoral; (2) veto; (3) executive<br>E) (1) tax; (2) preface; (3) honorary<br><br>It is very useful to try inserting the first words proposed by each option into the blank spaces. Doing so, one immediately notices that a law cannot be &quot;ethereal&quot; or &quot;earthy,&quot; so options A and B are eliminated. Likewise for the second gap, the right of &quot;preface&quot; (option E) and &quot;deference&quot; (option C) do not fit. Only one option remains: electoral — veto — executive. The correct answer is D.<br><br>Tips for sentence completion:</p><p class='bul'>• Read the whole sentence carefully, paying attention not only to meaning but also to syntax and register.</p><p class='bul'>• Try to give your own answer before consulting the options; then simply choose the option closest to your initial answer.</p><p class='bul'>• Pay attention not only to the meaning of the words to be inserted but also to their correct syntactic fit.</p><p class='bul'>• Exercises are often based on a contrast between two ideas expressed in the main and subordinate clauses. This contrast is signalled by key words such as: nonostante (although), ma (but), tuttavia (however), anche se (even if), per quanto (as much as), and so on.</p><p class='bul'>• When multiple unknowns make the choice difficult, proceed by substitution — inserting each option into the sentence until you find a version that makes complete sense.</p><p class='bul'>• Before moving on, re-read the complete sentence with your chosen option inserted to check for coherence.</p><details><summary>Answers</summary><p>Answer: D</p></details><details><summary>original (IT)</summary><p class='th-it'>Quali parole vanno sostituite ai numeri per dare un senso compiuto e logico alla frase\nseguente?\n\n“Le barricate erano state allestite all&#x27;inizio della protesta, cominciata il 28 settembre, contro\nl’attuale legge ___(1)___ che assicura a Pechino il diritto di ___(2)___ sui candidati per l’ele-\n\n”\n\nzione della massima carica di Hong Kong, quella di capo___(3)___.\n1) terrea; (2) recesso; (3) della magistratura\n1) eterea; (2) prelazione; (3) apofantico\n\n(\n(\n(1) prevaricante; (2) deferenza; (3) pro partes\n(1) elettorale; (2) veto; (3) esecutivo\n\n(1) tributaria; (2) prefazione; (3) ad honorem\n\nIn questo caso è molto utile provare a inserire negli spazi vuoti le prime parole proposte dalle alternative.\nCosì facendo si nota subito il fatto che una legge non può essere “eterea” o “terrea” e quindi scartiamo le\n\nalternative\nche il diritto di “prefazione” (risposta | ) e di “deferenza” (risposta |\n\n; allo stesso modo nel secondo spazio da riempire possiamo immediatamente notare\n.#) non vanno bene, rimane infine una\n\nsola alternativa che è quella della sequenza elettorale — veto — esecutivo. La risposta esatta è la |.\n\nSuggerimenti\n\nLeggere attentamente l&#x27;intera frase, prestando attenzione non solo al significato, ma anche alla sin-\ntassi e al registro.\n\nCercare di dare la propria risposta corretta prima di consultare le diverse alternative disponibili. Se\nciò è possibile, la fase successiva sarà semplicemente quella di scegliere l&#x27;alternativa più vicina alla\nrisposta iniziale.\n\nPrestare attenzione non solo al significato delle parole da inserire nella frase, ma anche al loro cor-\nretto inserimento sintattico.\n\nSpesso gli esercizi sono basati sul contrasto tra due idee espresse nella proposizione principale e in quella\nsubordinata. Tale contrasto è indicato da vocaboli chiave quali: nonostante, ma, tuttavia, anche se, per\nquanto e così via. In questi casi, la risposta esatta è quella che consente di esprimere tale contrasto.\n\nSpesso la scelta delle parole mancanti è complicata dalla presenza di più incognite o dal loro ordine\nsparso, che non consente di dare immediatamente un senso alla frase. In questi casi occorre proce-\ndere per sostituzione, inserendo di volta in volta nella frase le diverse alternative, fino a ottenere un\ncompletamento di senso compiuto.\n\nPrima di passare all&#x27;esercizio successivo, provare a rileggere la frase completa, inserendo i vocaboli\ndell&#x27;alternativa prescelta, in modo da controllarne la coerenza.</p></details>", "back": "", "conf": "high", "page": 260, "section": "2.5 Frasi incomplete", "num": 4, "_i": 26}, {"kind": "theory", "src": "images/p261_b1.png", "front": "<div class='kindlabel'>THEORY</div><img src='images/p261_b1.png' class='cardimg'><p class='th-en'>2.6 | Figurative Language<br><br>Figurative language is a mode of expression in which words are not meant in their literal sense. For example, in the sentence &quot;Hannibal was lightning,&quot; we are clearly using &quot;lightning&quot; not in its proper meaning but in an extended, intuitive, or figurative sense that implies a connection between the literal meaning of the word and the subject being described (Hannibal was extremely fast, like a bolt of lightning).<br><br>The main figures of speech tested in admission exams are:</p><p class='bul'>• Metaphor — implicit comparison (e.g. &quot;he is a lion&quot;)</p><p class='bul'>• Simile — explicit comparison using &quot;like&quot; or &quot;as&quot;</p><p class='bul'>• Metonymy — replacing a word with a related concept (container for content, cause for effect)</p><p class='bul'>• Synecdoche — using a part for the whole or vice versa</p><p class='bul'>• Hyperbole — exaggeration</p><p class='bul'>• Allegory — extended metaphor representing abstract ideas</p><details><summary>original (IT)</summary><p class='th-it'>2.6 | Linguaggio figurato\n\nSi intende per linguaggio figurato quella modalità espressiva per cui le parole devono essere intese non\nnel loro senso letterale. Per chiarire tutto con un esempio, nella frase “Annibale era un fulmine”, è evidente\nche stiamo utilizzando la parola “fulmine” non nel suo significato proprio, ma in un senso esteso, intuitivo\no, appunto, figurato che implica la connessione nella nostra mente del concetto di fulmine con quello di\nvelocità, pericolo ecc.\n\nLe figure retoriche legate allo slittamento di senso sono molte e - negli ultimi anni — piuttosto amate dai\ncompilatori dei test di selezione. È bene, dunque, imparare a riconoscere almeno le principali (di seguito\nriportate in ordine alfabetico).</p></details>", "back": "", "conf": "high", "page": 261, "section": "2.6 Linguaggio figurato", "num": null, "_i": 27}, {"kind": "question", "src": "images/p261_b2.png", "front": "<img src='images/p261_b2.png' class='cardimg'><p class='q'>Q1. &quot;Drinking a bottle of wine&quot; is a/an:<br>A) metonymic expression<br>B) metaphorical expression<br>C) hyperbolic expression<br>D) analogical expression<br>E) onomatopoeic expression</p><details><summary>Answers</summary><p class='q'>The correct answer is A. Metonymy is the figure of speech that evokes an idea by citing a related concept in its place — for example, the container (the bottle) for the content (the wine).<br><br>2.6.1 | Some examples of figurative language<br><br>Allegory. An expressive procedure whereby, beyond the literal meaning, the text carries another more or less hidden meaning that the reader identifies through an interpretive process. Allegory is a figure of thought by substitution of content. A typical example is a poet describing the voyage of a ship in a storm, leaving implied that it represents his own life: &quot;Passa la nave mia, sola, tra il pianto degli alcioni, per l&#x27;acqua procellosa&quot; (Carducci).<br><br>Antonomasia. A rhetorical figure based on the exchange of function between a proper noun and a common noun, and vice versa.</p><p class='bul'>• Person: the name of a figure known for a certain quality is used to indicate that another person possesses that same quality. For example: un Mecenate (a patron of artists, citing Maecenas, the patron of Virgil in the age of Augustus); un Otello (the Shakespearean character cited to indicate a particularly jealous person); un Einstein (to indicate a person of brilliant intelligence), etc.</p><p class='bul'>• Conversely, the common noun can be used as a proper noun: il Ghibellin fuggiasco (= Dante, so called in Foscolo&#x27;s Sepolcri); il Segretario fiorentino (= Machiavelli, secretary of the second chancellery of the Republic of Florence), etc.</p><p class='bul'>• Place: un Eden to indicate a delightful and serene place; una Babilonia to indicate a chaotic place; il Bel Paese (to indicate Italy), etc.</p><p class='q'><br>Climax. A scale of ascending gradation (or, conversely, descending: anticlimax) of a series of elements in a discourse: &quot;Tu duca, tu segnore, e tu maestro&quot;; &quot;Esige, interroga, domanda.&quot;<br><br>Euphemism. Softens an expression considered too harsh, crude, unpleasant, or inappropriate, by reducing the forcefulness of a statement through suppression (&quot;Lucia behaved like a...&quot;) or substitution with generic terms (&quot;Where can I wash my hands?&quot; instead of &quot;Where is the bathroom?&quot;); allusive periphrases are used especially for death and illness (&quot;passed on to a better life,&quot; &quot;stopped suffering,&quot; &quot;has a serious illness&quot;) or for activities considered too menial (operatore ecologico / collaboratore scolastico for the more direct spazzino / bidello).</p></details><details><summary>original (IT)</summary><p class='th-it'>1 Bere u una bottiglia di vino è un&#x27;espressione:\nmetonimica\nmetaforica\niperbolica\nanalogica\n\nonomatopeica\n\nLa soluzione al quesito è rappresentato dall&#x27;alternativa ‘., infatti la metonimia è la figura retorica che\nevoca un&#x27;idea citando al suo posto un concetto ad essa relativo, per esempio il contenente (la bottiglia)\nper il contenuto (il vino).\n\n2.6.1 | Alcuni esempi di linguaggio figurato\n\nAllegoria. È un procedimento espressivo per cui oltre al senso letterale (quello proprio) il testo ne ha un\naltro più o meno nascosto, che il lettore individua tramite un processo interpretativo. L&#x27;allegoria è una fi-\ngura di pensiero per sostituzione nel contenuto. Per esempio un tipico esempio di discorso allegorico è\nquello di un poeta che descrive il viaggio di una nave nella tempesta, lasciando sottinteso che si tratta\ndella rappresentazione della propria vita: «Passa la nave mia, sola, tra il pianto degli alcioni, per l&#x27;acqua pro-\ncellosa» (Carducci).\n\nAntonomasia. Figura retorica fondata sullo scambio di funzione tra un nome proprio e un nome comune\ne viceversa.\n\n* Persona: si usa il nome di un personaggio noto per una certa qualità per indicare che una persona\npossiede quella stessa qualità. Per esempio: un Mecenate (si indica un protettore di artisti citando il\npiù noto, il protettore di Virgilio e altri poeti all&#x27;epoca di Augusto); un Otello (si cita il personaggio\nshakespeariano per indicare una persona particolarmente gelosa); un Einstein (per indicare una per-\nsona d&#x27;intelligenza geniale, dal nome dello scienziato famoso per la teoria della relatività) ecc.\n\n* Alcontrario, si può usare il nome comune in funzione di nome proprio: if Ghibellin fuggiasco (= Dante, così\ndesignato nei Sepolcri foscoliani); il Segretario fiorentino (= Machiavelli, segretario della seconda cancelle-\nria della Repubblica di Firenze) ecc.\n\n* Luogo: un Eden per indicare un luogo leggiadro e sereno; una Babilonia per indicare un posto cao-\ntico ecc. Al contrario: il Bel Paese (per indicare l’Italia) ecc.\n\nClimax. Consiste in una scala di gradazione ascendente (o, all&#x27;opposto, discendente: anticlimax) di una\nserie di elementi del discorso: Tu duca, tu segnore, e tu maestro; Esige, interroga, domanda.\n\nEufemismo. Mitiga un&#x27;espressione considerata troppo forte, cruda, spiacevole o sconveniente. Consiste\nnel ridurre e nello smorzare il tono di un&#x27;affermazione (sottrazione) mediante strategie di soppressione\n(«Lucia si è comportata da...») o sostituzione con termini generici («dove posso lavarmi le mani?» in luogo\ndi «dove è ilbagno?»); si usano perifrasi allusive (soprattutto in luogo di morte e malattia: «è passato a mi-\nglior vita», «ha smesso di soffrire», «ha un brutto male»; oppure per attività considerate troppo umili ope-\nratore ecologico o collaboratore scolastico per i più diretti spazzino e bidello).</p></details>", "back": "", "conf": "high", "page": 261, "section": "2.6 Linguaggio figurato", "num": null, "_i": 28}, {"kind": "theory", "src": "images/p262_b1.png", "front": "<div class='kindlabel'>THEORY</div><img src='images/p262_b1.png' class='cardimg'><p class='th-en'>Hyperbole. Consists in exaggerating, beyond reality or plausibility, the representation of the subject of discourse, artificially amplifying or minimising its characteristics. Some hyperboles have become common everyday expressions: &quot;È un secolo che non ti vedo&quot; (I haven&#x27;t seen you in ages); &quot;Sei lento come una lumaca&quot; (You&#x27;re as slow as a snail); &quot;Mi fai morire dal ridere&quot; (You&#x27;re killing me with laughter). In literary language it is often based on the use of metaphors.<br><br>Irony. Occurs when one speaks of something using intentionally expressions with a meaning distant from or even opposite to what would be properly coherent; it consists in &quot;saying the opposite of what one thinks or of what one really wants others to believe.&quot; It is a stratagem of language that the listener grasps by means of clues: context, surrounding phrases, the general intention of the discourse, the intonation and attitude of the speaker. Manzoni&#x27;s famous ironic passage (I Promessi Sposi): the Spanish soldiers who &quot;taught modesty to the young women and ladies of the village, occasionally stroked the shoulders of a husband or father, and at the end of summer never failed to spread through the vineyards, to thin the grapes and lighten the peasants&#x27; harvesting labours.&quot;<br><br>Litotes. Expresses a concept by negating the opposite concept: &quot;qualche giorno non è poi l&#x27;eternità&quot; (a few days is not quite eternity); &quot;Orlando non era un&#x27;aquila&quot; (Orlando was no eagle); &quot;non di rado&quot; (not infrequently), etc.<br><br>Metaphor. Consists in substituting one term with another that bears an analogy to the first. It can be defined as an abbreviated simile, in which the comparative word &quot;come&quot; (like/as) is omitted and a direct relationship is established between two elements. &quot;Achille è un leone&quot; condenses the simile &quot;Achilles is strong/brave/dangerous as a lion.&quot; Metaphor has greater expressive power than simile and enriches the text with supplementary values. It may consist in coupling an attribute with a noun from a different semantic field (una sporca guerra — a dirty war), an action with an unrelated subject, or a genitive complement with a noun. Some metaphors have entered everyday speech: il piede del tavolo (the foot of the table), il cane del fucile (the hammer of a gun), etc.<br><br>Metonymy. Consists in substituting one term with another linked to it by a relationship of causality, reciprocity, contiguity, or dependence. For example: container for content (bere un bicchiere — to drink a glass); cause for effect (lamentation for the pain); effect for cause (le sudate carte — the laboured pages); instrument for user (opera di una penna sapiente — the work of a learned pen); author for work (ascoltare Beethoven, leggere Manzoni); deity for sphere of influence (cedere a Bacco e a Venere — to yield to wine and love); place for its inhabitants (Ahi serva Italia); colour as symbol of a group (nerazzurri = Inter supporters; rossi = communists); abstract for concrete; concrete for abstract (quell&#x27;uomo ha del fegato — that man has guts); material for object (i legni nemici — the enemy ships), etc.<br><br>Periphrasis. The proper term for a person, thing, or concept is replaced by a roundabout expression: &quot;la gloria di colui che tutto move&quot; = God.<br><br>Simile. Consists in comparing two elements, highlighting the analogy that makes them comparable from a certain point of view. It is characterised by a linguistic element of comparison: an adverb (come, così), an adjective (simile a), or a verb (somigliare): forte come una roccia (strong as a rock); per carattere simile a un agnellino (in character similar to a little lamb), etc.<br><br>Synecdoche. Consists in substituting the proper term with a word linked to it by a quantitative relationship: part for whole (In casa ci sono tante bocche da sfamare — many mouths to feed); whole for part (borsa di coccodrillo — crocodile-skin bag); species for genus (si guadagnava il pane — earned his bread = food); genus for species (vilissimo bipede — vile biped = person); singular for plural (il romano è buongustaio — the Roman is a gourmet); determinate number for indeterminate (ho mille nemici — I have a thousand enemies); plural for singular (voglio vedere nuovi cieli — I want to see new skies).</p><details><summary>original (IT)</summary><p class='th-it'>Iperbole. Consiste nell&#x27;esagerare, oltre la realtà o il verosimile, la rappresentazione dell&#x27;oggetto del di-\nscorso, amplificandone o minimizzandone artificialmente le caratteristiche. Alcune iperboli sono ormai\nlocuzioni della lingua corrente: «È un secolo che non ti vedo», «Sei lento come una lumaca», «Mi fai morire\ndal ridere». Nel linguaggio letterario è un&#x27;invenzione spesso basata sull&#x27;uso di metafore.\n\nIronia Si ha quando si parla di qualcosa utilizzando intenzionalmente espressioni con un significato lonta-\nno o addirittura opposto a quello propriamente coerente; consiste nel «dire il contrario di quello che si pen-\nsa o di quello che si vuol far veramente credere». È un&#x27;astuzia del linguaggio che l&#x27;ascoltatore coglie valen-\ndosi di indizi: il contesto, le frasi vicine, l&#x27;intenzione generale del discorso, l&#x27;intonazione e l&#x27;atteggiamento\ndi chi parla. L&#x27;ironia gioca sull&#x27;ambiguità della parola arte. «Ai tempi in cui accaddero i fatti che imprendiamo\na raccontare, quel borgo già considerabile era anche un castello, e aveva perciò l&#x27;onore di alloggiare un co-\nmandante, e il vantaggio di possedere una stabile guarnigione di soldati spagnuoli, che insegnavano la mo-\ndestia alle fanciulle e alle donne del paese, accarezzavano di tempo in tempo le spalle a qualche marito, a\nqualche padre, e sul finire della state, non mancavano mai di spandersi nelle vigne, per diradare le uve, e al-\nleggerire ai contadini le fatiche della vendemmia» (Alessandro Manzoni, | Promessi Sposi).\n\nLitote. Esprime un concetto negando il concetto opposto: «qualche giorno non è poi l&#x27;eternità»; «Orlan-\ndo non era un&#x27;aquila»; «non di rado» ecc.\n\nMetafora. Consiste nella sostituzione di un termine con un altro che con il primo intrattiene un rapporto\ndi analogia. Si può definire una similitudine abbreviata, in cui si omette l&#x27;avverbio di paragone «come» e\nsi istituisce un rapporto senza mediazione tra due elementi. «Achille è un leone» condensa la similitudine\n«Achille è forte/coraggioso/pericoloso come un leone». La metafora non solo ha più potenza espressiva\ne originalità, ma assorbe l’attenzione, arricchisce il testo con valori supplementari. La metafora può con-\nsistere nell&#x27;accostare un attributo a un sostantivo di diverso campo di senso (una sporca guerra), un&#x27;azio-\nne a un soggetto non pertinente («faceva tutto rider l&#x27;oriente»), un complemento di specificazione o di\nmateria a un sostantivo («Erano i capei d&#x27;oro a l&#x27;aura sparsi»). Alcune metafore sono entrate nel parlare\ncomune: il piede del tavolo, il cane del fucile ecc.\n\nMetonimia. Consiste nella sostituzione di un termine con un altro legato al primo da rapporto di causa-\nlità, reciprocità, vicinanza e dipendenza. Per esempio: contenitore per il contenuto (bere un bicchiere);\ncausa per l&#x27;effetto (nelle orecchie mi percosse un duolo = lamento per il dolore); effetto per la causa (le\nsudate carte); strumento per chi lo usa (opera di una penna sapiente); autore per l&#x27;opera (ascoltare Beetho-\nven, leggere Manzoni); divinità per la sua sfera d&#x27;influenza (cedere a Bacco e a Venere = al vino e all&#x27;amore);\nil luogo per i suoi abitanti (Ahi serva /talia); colore come simbolo di un gruppo (nerazzurri = interisti; rossi\n= comunisti); astratto per il concreto (è sfuggito all&#x27;inseguimento); concreto per l&#x27;astratto (quell&#x27;uomo ha\ndel fegato); materia per l&#x27;oggetto (i legni nemici = le navi nemiche) ecc.\n\nPerifrasi. || termine proprio per indicare una persona, una cosa, un concetto viene sostituito da un giro\ndi parole: «la gloria di colui che tutto move» = Dio.\n\nSimilitudine. Consiste nel paragonare due elementi, evidenziando il rapporto di analogia che li rende ac-\ncostabili l&#x27;un l&#x27;altro da un determinato punto di vista. È caratterizzata dalla presenza di un elemento lin-\nguistico di comparazione: avverbio (come, così), aggettivo (simile a), verbo (somigliare): forte come una\nroccia; per carattere simile a un agnellino ecc.\n\nSineddoche. Consiste nel sostituire al termine proprio una parola che gli è legata per un rapporto quan-\ntitativo: parte per il tutto (In casa ci sono tante bocche da sfamare); tutto per la parte (borsa di coccodrillo);\nspecie per il genere (si guadagnava il pane = cibo); genere per la specie (vilissimo bipede = persona); sin-\ngolare per il plurale (il romano è buongustaio); numero determinato per numero indeterminato (ho mille\nnemici); plurale per il singolare (voglio vedere nuovi cieli).</p></details>", "back": "", "conf": "high", "page": 262, "section": "2.6 Linguaggio figurato", "num": null, "_i": 29}];

const KIND={
  question:{label:'Question',color:'#98a2d4'},
  passage:{label:'Passage',color:'#de8a76'},
  theory:{label:'Theory',color:'#e9be3b'},
  artwork:{label:'Artwork',color:'#e9be3b'}
};
const TKEY='theme_'+location.pathname.replace(/\W/g,'_');
let theme=localStorage.getItem(TKEY)||'cool';

const SK='done_'+location.pathname.replace(/\W/g,'_');
let passed=new Set(JSON.parse(localStorage.getItem(SK)||'[]'));
function savePassed(){localStorage.setItem(SK,JSON.stringify([...passed]));}
function togglePassed(i,e){
  e.stopPropagation();
  if(passed.has(i))passed.delete(i);else passed.add(i);
  savePassed();
  if(filter==='all'||filter==='passed'){
    pool=poolFor(filter);
    if(!pool.length)idx=0;else if(idx>=pool.length)idx=pool.length-1;
  }
  render();
}

let pool=ALL.slice(),idx=0,filter='all';
const card=document.getElementById('card');

function poolFor(f){
  return ALL.filter(c=>
    f==='all'?!passed.has(c._i):
    f==='passed'?passed.has(c._i):
    f==='review'?c.conf==='low':
    c.kind===f);
}
function counts(){
  return {
    all:ALL.filter(c=>!passed.has(c._i)).length,
    question:ALL.filter(c=>c.kind==='question').length,
    passage:ALL.filter(c=>c.kind==='passage').length,
    theory:ALL.filter(c=>c.kind==='theory').length,
    artwork:ALL.filter(c=>c.kind==='artwork').length,
    review:ALL.filter(c=>c.conf==='low').length,
    passed:passed.size
  };
}
function refreshCounts(){
  const n=counts();
  document.querySelectorAll('[data-count]').forEach(s=>{
    s.textContent=n[s.getAttribute('data-count')]||0;});
}
function view(){pool=poolFor(filter);if(idx>=pool.length)idx=0;render();}
function render(){
  refreshCounts();
  const c=pool[idx];
  if(!c){card.className='card empty';card.innerHTML='No cards here';
    document.getElementById('count').textContent='0 / 0';return;}
  const k=KIND[c.kind]||{label:c.kind,color:'#93a0ad'};
  const ord=String(c._i+1).padStart(2,'0');
  const meta=(c.section||'')+' · p'+c.page+(c.num?(' · Q'+c.num):'');
  const isDone=passed.has(c._i);
  const passBtn=`<button class="pass-btn${isDone?' done':''}" onclick="togglePassed(${c._i},event)">${isDone?'\u2713 done':'mark done'}</button>`;
  card.className='card';
  card.innerHTML=
    `<div class="cardhead">`+
      `<span class="ord">\u2116 ${ord}</span>`+
      `<span class="kind" style="color:${k.color}">${k.label}</span>`+
      `<span class="meta">${meta}</span>`+
    `</div>`+
    `<div class="cardbody">${c.front}</div>`+
    `<div class="cardfoot">${passBtn}</div>`;
  document.getElementById('count').textContent=(idx+1)+' / '+pool.length;
  window.scrollTo(0,0);
  const ci=card.querySelector('.cardimg');
  if(ci)ci.addEventListener('click',e=>{e.stopPropagation();openZoom(ci.src);});
}
function next(){if(!pool.length)return;idx=(idx+1)%pool.length;render();}
function prev(){if(!pool.length)return;idx=(idx-1+pool.length)%pool.length;render();}
function shuffle(){for(let i=ALL.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[ALL[i],ALL[j]]=[ALL[j],ALL[i]];}idx=0;view();}
function setFilter(f,btn){filter=f;idx=0;
  document.querySelectorAll('.controls button').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');view();}
function setTheme(t,btn){document.body.dataset.theme=t;localStorage.setItem(TKEY,t);
  document.querySelectorAll('.themes button').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');}
function openZoom(src){const z=document.getElementById('zoom');document.getElementById('zoomimg').src=src;z.classList.add('show');}
function closeZoom(){document.getElementById('zoom').classList.remove('show');}

let sx=0,sy=0;
card.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;},{passive:true});
card.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
  if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.5){e.preventDefault();dx<0?next():prev();}},{passive:false});
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')next();if(e.key==='ArrowLeft')prev();
  if(e.key==='Escape')closeZoom();});

document.body.dataset.theme=theme;
document.querySelectorAll('.themes button').forEach(b=>b.classList.toggle('on',b.getAttribute('data-theme')===theme));
view();
</script></body></html>
