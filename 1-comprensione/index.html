xpressions of creativity. The desire for possession can be aggressive or defensive: it seeks to retain what one possesses or to take from others. In both cases, an attitude of hostility towards others is part of its essence. It would be a mistake to suppose that the impulse of defensive possession is always justifiable, while the offensive impulse is always blameworthy; when a great injustice exists in the status quo, it may be exactly the opposite, and usually neither case is justifiable.<br><br>State interference in the actions of individuals is made necessary by the impulse of possession. Some goods can be acquired or retained by force, while others cannot. One can obtain a wife by force, as the Romans did with the Sabine women; but a wife&#x27;s affection cannot be acquired in this way. It is not known, however, whether the Romans desired the affection of the Sabine women. Those in whom the impulse of possession is strong tend to concern themselves above all with goods that force can obtain. All material goods belong to this category. Freedom with regard to these goods, if unlimited, would tend to make the strong rich and the weak poor. A capitalist society, because of the partial impediments imposed by law, makes shrewd men rich and honest men poor, because the force of the State is made available to men not according to a just or rational principle, but according to a set of traditional maxims whose explanation is purely historical.<br><br>In everything concerning the possession and use of force, unlimited freedom leads to anarchy and injustice. The freedom to kill, the freedom to steal, the freedom to defraud no longer belong to individuals, yet they still belong to great States and are exercised by them in the name of patriotism. Both individuals and States should not be free to exercise force on their own initiative, except in cases of sudden emergency, which will subsequently be established as justification before a tribunal. The reason is that the exercise of force by one individual against another is always an evil, on both sides, and can be tolerated only when it is offset by an overwhelming good that results from it.<br><br>In order to reduce to a minimum the amount of force currently exercised in the world, it is necessary that there exist a public authority possessing a practically irresistible force, whose function should be above all to repress the private use of force. The use of force is private when it is exercised by one of the parties concerned, or by their friends or accomplices, rather than by a neutral public authority acting according to a fixed rule designed for the public interest.<br><br>The regime of private property under which we live does very little to prevent the private use of force. When a man owns a piece of land, for example, he can use force against those who trespass on it, though they must not use force against him. Clearly, restrictions on freedom of movement are necessary so that land can be cultivated. But if this power is to belong to the individual, the State should ensure that he occupies no more land than the public interest warrants, and that the share of the produce he receives is no more than a just reward for his labour. Owners of land and capital today can, through economic pressure, use force against those who possess nothing. This force is sanctioned by law, while the force exercised by the poor against the rich is illegal. This state of affairs is unjust and does not prevent the private use of force as it should.<br><br>The entire sphere of possessive impulses, and of the use of force they generate, requires control by a neutral public authority, in the interest both of justice and of freedom. Within a nation, this public authority will naturally be the State; in relations between nations, if the present anarchy is to cease, it will need to be an international parliament.</p><details><summary>original (IT)</summary><p class='th-it'>Brano 4 In base alle informazioni contenute nel brano seguente, rispondere alle succes-\nsive domande.\n\nLa maggior parte degli impulsi umani si può dividere in due classi, quelli che sono possessivi e quelli che\nsono costruttivi o creativi. Le istituzioni sociali sono i rivestimenti o le personificazioni degli impulsi e si\npossono classificare approssimativamente secondo gli impulsi che rappresentano. La proprietà è\nl&#x27;espressione diretta del possesso; scienza e arte sono tra le più dirette espressioni della creatività. Il desi-\nderio di possesso può essere aggressivo o difensivo: cerca di trattenere quanto si possiede o di togliere\nad altri. Nei due casi, l&#x27;atteggiamento di ostilità verso gli altri fa parte della sua essenza. Sarebbe un errore\nsupporre che l&#x27;impulso di possesso difensivo sia sempre giustificabile, mentre quello offensivo sia sem-\npre biasimevole; quando nello status quo esiste una grande ingiustizia, può essere l&#x27;esatto opposto e di\nsolito nessuno dei due casi è giustificabile. L&#x27;interferenza dello Stato nelle azioni degli individui è resa ne-\ncessaria dall&#x27;impulso del possesso. Alcuni beni possono essere acquistati o mantenuti con la forza, men-\ntre altri no. Si può ottenere una moglie con la forza, come hanno fatto i Romani con le donne sabine; ma\nl&#x27;affetto di una moglie non può essere acquistato in questo modo. Non si sa però se i Romani desideras-\nsero l&#x27;affetto delle donne sabine. Coloro nei quali gli impulsi di possesso sono forti, tendono a preoccu-\nparsi soprattutto dei beni che la forza può ottenere. Tutti i beni materiali appartengono a questa\ncategoria. La libertà nei confronti di questi beni, se fosse illimitata, tenderebbe a rendere ricchi i forti e\npoveri i deboli. Una società capitalista, a causa degli impedimenti parziali imposti dalla legge, rende ricchi\ngli uomini astuti e poveri gli uomini onesti, perché la forza dello Stato è messa a disposizione degli uomi-\nni, non secondo un principio giusto o razionale, ma secondo una serie di massime tradizionali la cui spie-\ngazione è puramente storica. Per tutto quel che riguarda il possesso e l&#x27;uso della forza, la libertà illimitata\nporta anarchia e ingiustizia. La libertà di uccidere, la libertà di rubare, la libertà di defraudare, non appar-\ntengono più agli individui, però appartengono ancora ai grandi Stati e vengono da essi esercitate in\nnome del patriottismo. Tanto gli individui, quanto gli Stati, non dovrebbero essere liberi di esercitare la\nforza secondo la loro iniziativa, se non nei casi di improvvisa emergenza, come verrà in seguito stabilito\na giustificazione davanti a un tribunale. La ragione è che l&#x27;esercizio della forza da parte di un individuo\ncontro un altro è sempre male, da ambedue le parti, e può essere tollerato soltanto quando viene com-\npensato da un preponderante bene che ne consegue. Allo scopo di rendere minima la quantità di forza\nesercitata attualmente nel mondo, è necessaria l&#x27;esistenza di un&#x27;autorità pubblica, depositaria di una for-\nza praticamente irresistibile la cui funzione dovrebbe essere soprattutto quella di reprimere l’uso privato\ndella forza. L&#x27;uso della forza è privato quando viene esercitato da una delle parti interessate, o dai suoi\namici o complici, enon da un&#x27;autorità pubblica neutrale, secondo una determinata regola intesa nel pub-\nblico interesse. Il regime della proprietà privata sotto il quale viviamo fa ben poco per impedire l’uso pri-\nvato della forza. Quando un tale è proprietario di un pezzo di terra, ad esempio, può usare la forza contro\ncoloro che vi transitano abusivamente, che però non devono usare la forza contro di lui. È chiaro che sono\nnecessarie restrizioni alla libertà di transito, perché la terra possa essere coltivata. Ma se questo potere\ndeve appartenere all&#x27;individuo, lo Stato dovrebbe assicurarsi che non occupi più terra di quanta gli spetti,\nnell&#x27;interesse pubblico, e che la parte dei prodotti che ne ricava non sia più di un giusto compenso per la\nsua fatica. | possessori di terre e di capitali oggi possono, con la pressione economica, usare la forza con-\ntro quelli che non posseggono niente. Questa forza è sanzionata dalla legge, mentre la forza esercitata\ndai poveri contro i ricchi è illegale. Questo stato di cose è ingiusto e non impedisce l&#x27;uso della forza pri-\nvata come dovrebbe. L&#x27;intero campo degli impulsi possessivi, e dell&#x27;uso della forza che producono, ha bi-\nsogno di un controllo da parte di un&#x27;autorità neutrale pubblica, nell&#x27;interesse tanto della giustizia, quanto\ndella libertà. Nell&#x27;interno di una nazione, quest&#x27;autorità pubblica sarà naturalmente lo Stato; nei rapporti\ntra le nazioni, se l&#x27;attuale anarchia deve cessare, dovrà essere un parlamento internazionale.</p></details>", "back": "", "conf": "high", "page": 245, "section": "Esempi · Brano 4", "num": null, "_i": 22}, {"kind": "question", "src": "images/p246_b2.png", "front": "<img src='images/p246_b2.png' class='cardimg'><p class='q'>Q16. According to the author, a public force:<br>A) should be superior to any private force<br>B) is capable of reducing the use of force in the world<br>C) is capable of giving priority to public interests over private ones<br>D) can counteract the force deriving from private property<br>E) all of the preceding answers are correct<br><br>Option A contains a claim equivalent to what the author maintains, according to whom &quot;it is necessary that there exist a public authority possessing a practically irresistible force.&quot; Similarly, option B is consistent with the opinion expressed by the author, who associates the existence of a public force with the aim of &quot;reducing to a minimum the amount of force currently exercised in the world.&quot; Option C is also consistent with what the author states in the second part of the passage. Finally, option D takes up the claim that the public authority is neutral and acts in the common interest, whereas &quot;the regime of private property under which we live does very little to prevent the private use of force.&quot; The solution is therefore E.</p><details><summary>Answers</summary><p>Answer: E</p></details><details><summary>original (IT)</summary><p class='th-it'>16 Secondo l&#x27;autore, una forza pubblica:\ndovrebbe essere superiore a qualsiasi forza privata\nè in grado di diminuire l&#x27;uso della forza nel mondo\nè in grado di privilegiare gli interessi pubblici rispetto a quelli privati\n\npuò contrastare la forza che deriva dalla proprietà privata\n\ntutte le precedenti risposte sono esatte\n\nL&#x27;alternativa ‘;. contiene un&#x27;affermazione equivalente a quanto sostenuto dall&#x27;autore, secondo il quale\n“è necessaria l&#x27;esistenza di un&#x27;autorità pubblica, depositaria di una forza praticamente irresistibile”, Ana-\nlogamente, l&#x27;alternativa {-. è coerente con l&#x27;opinione espressa dall&#x27;autore, il quale associa all&#x27;esistenza di\nuna forza pubblica la finalità di rendere minima la quantità di forza esercitata nel Mondo. L&#x27;alternativa (®}\nè anch&#x27;essa coerente con quanto affermato dall&#x27;autore nella seconda parte del brano. Infine, l&#x27;alternativa\nriprende l&#x27;affermazione secondo cui l&#x27;autorità pubblica è neutrale e agisce per l&#x27;interesse comune,\nmentre il “regime della proprietà privata sotto il quale viviamo fa ben poco per impedire l’uso privato del-\nla forza”. La soluzione al quesito è dunque la</p></details>", "back": "", "conf": "high", "page": 246, "section": "Esempi · Brano 4", "num": 16, "_i": 23}, {"kind": "question", "src": "images/p247_b2.png", "front": "<img src='images/p247_b2.png' class='cardimg'><p class='q'>Q17. The passage states that:<br>A) the exercise of force by one individual against another can never be tolerated<br>B) the use of force is always illegal<br>C) unlimited freedom naturally leads to a balance founded on justice<br>D) there exists an unjust form of force recognised by law<br>E) none of the preceding alternatives is correct<br><br>A little past the midpoint of the passage, the author states that the exercise of force by one individual against another can be tolerated when it is offset by an overwhelming good that results. Option A is to be ruled out. Likewise, towards the end of the passage it is stated that there is a &quot;force sanctioned by law,&quot; so the use of force is not always illegal (option B is also to be ruled out). It is in fact true, according to what is stated in the passage, that there exists an unjust form of force recognised by law — that exercised by landowners and capitalists against the poor. The correct answer is D.</p><details><summary>Answers</summary><p>Answer: D</p></details><details><summary>original (IT)</summary><p class='th-it'>17 Nel brano si afferma che:\nl&#x27;esercizio della forza da parte di un individuo contro un altro non può essere mai tollerato\nl&#x27;uso della forza è sempre illegale\nla libertà illimitata porta naturalmente a un equilibrio fondato sulla giustizia\nesiste una forza ingiusta riconosciuta dalla legge\n. nessuna delle precedenti alternative è corretta\n\nPoco oltre la metà del brano, l&#x27;autore afferma che l&#x27;esercizio della forza da parte di un individuo contro un\naltro può essere tollerato quando viene compensato da un preponderante bene che ne consegua. L&#x27;al-\nternativa .. è da scartare. Allo stesso modo, verso la fine del brano, si dice che vi è una “forza sanzionata\ndalla legge” e dunque non sempre l&#x27;uso della forza è illegale (anche l&#x27;alternativa (:) è da scartare). È vero\ninvece, secondo quanto affermato nel brano, che esiste una forza ingiusta riconosciuta dalla legge quale\nquella esercitata dai proprietari di terra e di capitali contro i poveri: la risposta corretta è dunque la {#).</p></details>", "back": "", "conf": "high", "page": 247, "section": "Esempi · Brano 4", "num": 17, "_i": 24}, {"kind": "question", "src": "images/p247_b3.png", "front": "<img src='images/p247_b3.png' class='cardimg'><p class='q'>Q18. According to the author of the passage:<br>A) science is an expression of the desire for possession<br>B) it is not known whether the Romans obtained the Sabine women by force<br>C) today the owners of land and capital cannot use force against those who own nothing<br>D) in the desire for defensive possession there is an essence of hostility<br>E) none of the preceding alternatives is correct<br><br>The author states, in the first part of the passage, that in the desire for possession — whether aggressive or defensive — there is an essence of hostility; the correct answer is therefore D. Option B may seem correct, but according to the passage what is not known is whether the Romans desired the affection of the Sabine women, not whether they obtained wives by force.</p><details><summary>Answers</summary><p>Answer: D</p></details><details><summary>original (IT)</summary><p class='th-it'>18 Secondo l&#x27;autore del brano:\n© la scienza è espressione del desiderio di possesso\nnon si sa se i Romani ottenessero le sabine con la forza\n\noggi i possessori di terre e di capitali non possono utilizzare la forza contro chi non possiede\nnulla\n\nnel desiderio di possesso di tipo difensivo c&#x27;è un&#x27;essenza di ostilità\n\nnessuna delle precedenti alternative è corretta\n\nL&#x27;autore afferma, nella prima parte del brano, che nel desiderio di possesso, sia di tipo aggressivo che di\ntipo difensivo, c&#x27;è un&#x27;essenza di ostilità e dunque l&#x27;alternativa corretta è la L&#x27;alternativa {F) può sem-\nbrare corretta, ma secondo il brano ciò che non si sa è se i Romani desiderassero l&#x27;affetto delle donne sa-\nbine e non se i Romani ottenessero le mogli con la forza.</p></details>", "back": "", "conf": "high", "page": 247, "section": "Esempi · Brano 4", "num": 18, "_i": 25}, {"kind": "question", "src": "images/p247_b4.png", "front": "<img src='images/p247_b4.png' class='cardimg'><p class='q'>Q19. The title of the passage could be:<br>A) The Nature of Human Impulses<br>B) Individual Freedom and Public Control<br>C) Freedom and Individual Impulses<br>D) Land and Freedom<br>E) Public and Private from the Romans to Today<br><br>The passage briefly illustrates the nature of human impulses, but is centred on the theme of individual freedom and the use of force to control interpersonal relationships. Option B is therefore to be preferred over A, C, and D. Option E, finally, is incorrect because, although the Romans are mentioned in the passage, no historical treatment of the topic is developed. The correct answer is B.</p><details><summary>Answers</summary><p>Answer: B</p></details><details><summary>original (IT)</summary><p class='th-it'>19 Il titolo del brano potrebbe essere:\nNatura degli impulsi umani\n‘’ Libertà individuale e pubblico controllo\n| Libertà e impulsi individuali\n. Terra e libertà\nPubblico e privato dai Romani a oggi\n\nIl brano illustra brevemente la natura degli impulsi umani, ma è incentrato sul tema della libertà indivi-\nduale e dell&#x27;uso della forza per il controllo dei rapporti interpersonali. L&#x27;alternativa {:) è dunque da prefe-\nrire alla ©, alla (© e alla (*.. L&#x27;alternativa .—, infine, è errata perché, nonostante nel brano vengano citati\n\ni Romani, non viene svolta alcuna trattazione storica dell&#x27;argomento.</p></details>", "back": "", "conf": "high", "page": 247, "section": "Esempi · Brano 4", "num": 19, "_i": 26}, {"kind": "question", "src": "images/p247_b6.png", "front": "<img src='images/p247_b6.png' class='cardimg'><p class='q'>Q20. The passage is of a nature that is:<br>A) historical<br>B) ethical<br>C) civic<br>D) scientific<br>E) pedagogical<br><br>The nature of the passage is neither historical nor scientific. Although ethics is not entirely foreign to the subject treated, the passage — analysing certain aspects and rules of coexistence among individuals within society — is civic in content: the correct answer is C.</p><details><summary>Answers</summary><p>Answer: C</p></details><details><summary>original (IT)</summary><p class='th-it'>20 Il brano è di natura:\n{. storica\n‘ etica\n© civica\n‘». scientifica\n. pedagogica\n\nLa natura del brano non è né storica né tanto meno scientifica. Sebbene l&#x27;etica non sia totalmente estra-\nnea all&#x27;argomento trattato nel brano, quest&#x27;ultimo, analizzando alcuni aspetti e norme della convivenza\ntra individui all’interno di una società, è di contenuto propriamente civico: è quindi corretta la risposta (3).</p></details>", "back": "", "conf": "high", "page": 247, "section": "Esempi · Brano 4", "num": 20, "_i": 27}, {"kind": "passage", "src": "images/p248_b2.png", "front": "<div class='kindlabel'>PASSAGE</div><img src='images/p248_b2.png' class='cardimg'><p class='th-en'>Passage 5 — Based on the information contained in the following passage, answer the questions below.<br><br>First of all, the Baroque city, with its monumental buildings, magnificent palaces, and perspective used to focus attention on majestic views along wide, straight avenues, was conceived with the aim of impressing. Symmetry, with a classical sense of balance and harmony, was its fundamental characteristic.<br><br>Although the most extravagant expressions of the Baroque style were developed later — at Versailles, for example, Karlsruhe, and St Petersburg — its principles were well established by the time of Wren&#x27;s study visit to France, and the desire to impress is certainly evident in the plan for the reconstruction of London that Wren presented to Charles II.<br><br>The urban plan essentially divided London into two sections: a western section made up of rectangular blocks, and an eastern section of polygonal squares linked by streets radiating from each section. These two substantially different sections were joined by two major arteries, which converged in a V-shape on St Paul&#x27;s. There were several squares, merchant navy wharves, and also a Grand Terrace along the Thames with adjacent public halls.<br><br>On paper, Wren&#x27;s urban plan for London offered an impressive city — worthy of a king, even if it lacked a palace. Wren himself should perhaps have known that his scheme was not appropriate to the needs of the City. A.E.J. Morris describes it as &quot;a nocturnal exercise based on a superficial use of the plan-motifs of the continental Renaissance.&quot; This may seem somewhat unkind, but it reinforces Morris&#x27;s impression that the plan was not intended for everyone, but was simply a pre-emptive strike by an untested but ambitious architect eager to establish his claim to a significant share of the reconstruction work. If so, his nocturnal exercise certainly paid off. Wren became one of the six members of the commission formed to advise and oversee the reconstruction programme; he was subsequently appointed Surveyor General in 1699 and was commissioned to design the new Cathedral of St Paul&#x27;s as well as sixty City churches and many other architectural works of merit of the period.<br><br>Despite its conceptual content, Wren&#x27;s plan was deficient from a practical standpoint in that it ignored the topography of London. The new city was designed as if it were a flat area, whereas the location was rather undulating (more so then than now), with hills on both sides of the two tributaries of the Thames, the Fleet and the Walbrook. The contours of the hills would have obscured the magnificent perspectival views that the plan promised, as well as disturbing the proposed neat arrangement of blocks, orderly squares, and radiating streets. In reality Wren&#x27;s Baroque vision could never have existed. The odds were practically nil.<br><br>Apart from the practical difficulties of encapsulating a three-dimensional landscape in a two-dimensional plan, Wren&#x27;s scheme entailed an almost total reorganisation of streets and buildings within the City. Many property owners would have been forced to rebuild on different sites — and this without anyone having the authority to decide the matter, not even the King, given London&#x27;s success in limiting royal involvement in affairs of the City. Wren presented the plan to King Charles II, who however could do nothing without the unanimous agreement of Parliament and all the property owners and institutions of London. Such consensus would have been difficult to obtain even on the most trivial question; it was impossible when all parties involved wanted to get on with the urgent task of rebuilding their lives and livelihoods — and consequently, London could either fail or prosper.<br><br>The King was nevertheless &quot;at one&quot; with the city. On 13 September he published a royal proclamation on reconstruction procedures, pledged to ensure the timely rebuilding of the Custom House, and relinquished crown properties in the City wherever it would be of common benefit. By the end of September, general agreement had been reached on accepting the existing street lines and property boundaries, and at the beginning of October six commissioners were appointed to oversee and effectively control all technical aspects of the reconstruction work. Three were appointed by the King and three by the City. Wren was among those appointed by the King; Hooke among those of the City.</p><details><summary>original (IT)</summary><p class='th-it'>Brano 5 In base alle informazioni contenute nel brano seguente, rispondere alle succes-\nsive domande.\n\nInnanzitutto, la città barocca, con i suoi edifici monumentali, magnifici palazzi e prospettiva usata per\ncentrare l&#x27;attenzione su vedute maestose lungo viali ampi e rettilinei, fu concepita con l&#x27;obiettivo di stu-\npire. La simmetria, con un senso classico di equilibrio ed armonia, era la sua caratteristica fondamentale.\n\nAnche se le espressioni più stravaganti della corrente barocca furono messe a punto più tardi - a Versail-\nles, per esempio, Karlsruhe e San Pietroburgo - i suoi principi erano ormai ben stabiliti ai tempi del viag-\ngio studio francese di Wren, e la volontà di stupire è certamente evidente nel piano per la ricostruzione\ndi Londra che Wren presentò a Carlo Il.\n\nIl piano urbanistico in sostanza divideva Londra in due sezioni: una sezione occidentale costituita da blocchi\nrettangolari, ed una sezione orientale di piazze poligonali unite da strade che si diramavano da ciascuna se-\nzione. Queste due sezioni sostanzialmente diverse erano unite da due grandi arterie, che si univano a freccia\nper convergere a Saint Paul. C&#x27;erano diverse piazze, banchine della marina mercantile, e anche una Grande\nTerrazza lungo il Tamigi con adiacenti sale pubbliche.\n\nSu carta, il piano urbanistico per Londra di Wren offriva una città impressionante - degna di un re anche se\nmancava il palazzo. Wren stesso avrebbe dovuto però sapere che il suo schema non era appropriato alle esi-\ngenze della City. A.E.J. Morris lo descrive come un «esercizio notturno basato su un uso superficiale dei plan-\nmotifs del Rinascimento continentale». Forse sembra un po&#x27; scortese, ma rafforza l&#x27;impressione di Morris che\nil piano non era inteso a tutti, ma era semplicemente un attacco preventivo da parte di un architetto non\ncollaudato ma ambizioso, che si premurava di stabilire il suo diritto su una quota importante del lavoro di\nricostruzione. In tal caso, il suo esercizio notturno lo ripagò sicuramente. Wren divenne uno dei sei membri\ndella commissione formata per consigliare e sovraintendere il programma per la ricostruzione; in seguito fu\nnominato Sovraintendente Generale nel 1699 e gli fu commissionato di progettare la nuova cattedrale di\nSaint Paul oltre a sessanta chiese della City, nonché tante altre opere architettoniche di merito del periodo.\n\nNonostante i contenuti concettuali, il piano di Wren peccava da un punto di vista pratico in quanto ignorava\nla topografia di Londra. La nuova città fu progettata come se si trattasse di una zona pianeggiante, mentre\nl&#x27;ubicazione era piuttosto ondeggiante (allora più di oggi), con le colline ad entrambi i lati dei due affluenti\ndel Tamigi, il Fleet ed il Walbrook. | contorni delle colline avrebbero oscurato la magnifica veduta prospetti-\nca che il piano prometteva, oltre ad alterare la proposta di nitida disposizione di blocchi, di piazze ordinate\ne del diramarsi di strade. Nella realtà la visione barocca di Wren non sarebbe mai potuta esistere. Di fatto le\nprobabilità erano praticamente nulle.\n\nA parte le difficoltà pratiche di incapsulare un paesaggio tridimensionale in un piano bidimensionale, lo\nschema di Wren prevedeva una quasi totale riorganizzazione di strade ed edifici all&#x27;interno della City.\nMolti proprietari sarebbero stati costretti a ricostruire su siti diversi e ciò senza che nessuno avesse l&#x27;au-\ntorità di decidere a riguardo -neanche il Re, dato il successo di Londra nel limitare il coinvolgimento reale\nnelle questioni riguardanti la City. Wren presentò il progetto al re Carlo II, il quale però non poteva fare\nniente senza l&#x27;accordo unanime del Parlamento e di tutti i proprietari e le istituzioni di Londra. Tale con-\nsenso sarebbe stato difficile da ottenere anche sulla questione più banale; impossibile quando tutte le\nparti coinvolte volevano andare avanti con l&#x27;urgente compito di ricostruire le loro vite e le loro attività di\nsussistenza - di conseguenza, Londra sarebbe potuta fallire o prosperare.\n\nIl Re ad ogni modo era “tutt&#x27;uno” con la città. Il 13 settembre pubblicò un proclama reale sulle procedure\ndi ricostruzione, si impegnò per la tempestiva ricostruzione della Custom House, e rinunciò alle proprietà\ndella corona nella City laddove sarebbe stato di comune beneficio. Entro la fine di settembre, si venne ad\nun accordo generale nell&#x27;accettare le linee di strade ed i confini di proprietà già esistenti, ed all&#x27;inizio di\nottobre furono nominati sei commissari incaricati della sovraintendenza e l’efficace controllo di tutti gli\naspetti tecnici dei lavori di ricostruzione. Tre furono nominati dal Re e tre dalla City. Wren fu tra quelli no-\nminati dal Re; Hooke tra quelli della City.</p></details>", "back": "", "conf": "high", "page": 248, "section": "Esempi · Brano 5", "num": null, "_i": 28}, {"kind": "question", "src": "images/p249_b2.png", "front": "<img src='images/p249_b2.png' class='cardimg'><p class='q'>Q21. At the centre of Wren&#x27;s urban plan for London was:<br>A) the site of the new Cathedral of St Paul&#x27;s<br>B) the link between districts via two main avenues<br>C) a grand terrace along the river<br>D) a bipartition emphasising classical harmony<br>E) a total renewal of the old urban plan of the city<br><br>To answer the first of the five questions about the passage, no deductive reasoning is required, since the question asks for a specific detail of the urban plan conceived by Wren for London; this information is explicitly stated in paragraphs 1 and 3. The text states, at the beginning of the third paragraph, that &quot;the urban plan essentially divided London into two sections,&quot; from which it can be inferred that the plan provided for a bipartite layout (two sections), as clearly reported by option D — &quot;a bipartition emphasising classical harmony.&quot; As for this last detail referring to classical harmony, note the concluding passage of the first paragraph: &quot;Symmetry, with a classical sense of balance and harmony, was its fundamental characteristic.&quot; The correct answer is D.</p><details><summary>Answers</summary><p>Answer: D</p></details><details><summary>original (IT)</summary><p class='th-it'>21 AI centro del piano urbanistico di Wren per Londra, vi era:\n\nil luogo della nuova Cattedrale di Saint Paul\n\nil collegamento tra quartieri attraverso due viali principali\n\nuna grande terrazza lungo il fiume\n\nuna bipartizione che enfatizzasse l&#x27;armonia classica\n\nun rinnovamento totale del vecchio piano urbanistico della città\n\n?er risolvere correttamente il primo dei cinque quesiti relativi al brano proposto non è necessario pro-\n‘edere con alcun ragionamento di tipo deduttivo, in quanto ia domanda chiede di individuare un det-\naglio relativo al piano urbanistico concepito da Wren per la città di Londra; tale informazione è chia-\namente esplicitata nei paragrafi 1 e 3. Il testo afferma, all’inizio del terzo paragrafo, che «Il piano\nirbanistico in sostanza divideva Londra in due sezioni» quindi si evince che tale piano urbanistico pre-\n/edeva un assetto con una bipartizione (due sezioni) come riporta chiaramente l&#x27;alternativa «una bi-\nnartizione che enfatizzasse l&#x27;armonia classica». In quanto a questo ultimo dettaglio, che fa riferimento\nll&#x27;armonia classica di tale piano, si presti attenzione al passaggio conclusivo del primo paragrafo: «La\nimmetria, con un senso classico di equilibrio ed armonia, era la sua caratteristica fondamentale». La\nisposta corretta è quindi la</p></details>", "back": "", "conf": "high", "page": 249, "section": "Esempi · Brano 5", "num": 21, "_i": 29}, {"kind": "question", "src": "images/p249_b3.png", "front": "<img src='images/p249_b3.png' class='cardimg'><p class='q'>Q22. The description by A.E.J. Morris suggests that Wren:<br>A) wanted to obtain oversight of some of the work<br>B) was not interested in the commission<br>C) did not understand the principles of the Baroque<br>D) was not an innovative architect<br>E) made deep use of Renaissance plan-motifs<br><br>To answer this question correctly, note what is reported in the fourth paragraph, where reference is made to Morris&#x27;s impression that the plan was &quot;a pre-emptive strike by an untested but ambitious architect eager to establish his claim to a significant share of the reconstruction work.&quot; Morris therefore suggests that Wren wanted to obtain oversight of some of the work, as indicated by option A. The correct answer is A.</p><details><summary>Answers</summary><p>Answer: A</p></details><details><summary>original (IT)</summary><p class='th-it'>2 La descrizione di A.E.J. Morris suggerisce che Wren:\n\nvolesse ottenere la direzione di alcuni lavori\n\nnon fosse interessato alla commissione\n\nnon capisse i principi del barocco\n\nnon fosse un architetto innovativo\n\nfacesse un uso approfondito dei planmotifs rinascimentali\n\ner rispondere correttamente al quesito si presti attenzione a quanto riportato nel quarto paragrafo, in cui\ni fa riferimento all&#x27;impressione di Morris che il piano fosse il tentativo da parte di un architetto non collau-\nlato ma ambizioso di stabilire il suo diritto su una quota importante del lavoro di ricostruzione. Morris sug-\nJerisce quindi che Wren volesse ottenere la direzione di alcuni lavori, come indicato dall&#x27;alternativa È.</p></details>", "back": "", "conf": "high", "page": 249, "section": "Esempi · Brano 5", "num": 22, "_i": 30}, {"kind": "question", "src": "images/p249_b4.png", "front": "<img src='images/p249_b4.png' class='cardimg'><p class='q'>Q23. Wren&#x27;s plan was impractical because:<br>A) the rivers Fleet and Walbrook disrupted the harmony of the design<br>B) the hills would have blocked the view<br>C) it was not suited to the topography of the site<br>D) Baroque architecture was excessively innovative<br>E) those who owned property preferred the old urban plan<br><br>The opening of the fifth paragraph states that &quot;Wren&#x27;s plan was deficient from a practical standpoint in that it ignored the topography of London&quot; and that the city &quot;was designed as if it were a flat area, whereas the location was rather undulating.&quot; These statements answer the question of why Wren&#x27;s urban plan was impractical: the correct answer is C — the plan was not suited to the topography of the site.</p><details><summary>Answers</summary><p>Answer: C</p></details><details><summary>original (IT)</summary><p class='th-it'>13 Il piano di Wren era poco pratico perché:\ni fiumi Fleet e Walbrook intralciavano l&#x27;armonia della pianta\nle colline avrebbero oscurato la veduta\nnon era adatto alla topografia del luogo\nl&#x27;architettura barocca era eccessivamente innovativa\ncoloro i quali avevano proprietà preferivano il vecchio piano urbanistico\n\nlell’incipit del quinto paragrafo si afferma che “il piano di Wren peccava da un punto di vista pratico in\njuanto ignorava la topografia di Londra” e che quest&#x27;ultima (la città di Londra) “fu progettata come se si\nrattasse di una zona pianeggiante, mentre l&#x27;ubicazione era piuttosto ondeggiante”. Di fatto queste affer-\nnazioni rispondono alla domanda sul perché il piano urbanistico concepito da Wren fosse poco pratico:\na risposta esatta è l&#x27;alternativa in cui si afferma che il piano non era adatto alla topografia del luogo.</p></details>", "back": "", "conf": "high", "page": 249, "section": "Esempi · Brano 5", "num": 23, "_i": 31}, {"kind": "question", "src": "images/p249_b5.png", "front": "<img src='images/p249_b5.png' class='cardimg'><p class='q'>Q24. The King was unable to proceed with the plan because:<br>A) he did not consider it suitable<br>B) approval was a prerogative of Parliament<br>C) approval had to come from opposing factions<br>D) he preferred to appoint technical commissioners<br>E) he did not have the necessary authority<br><br>The King was unable to proceed with the realisation of the plan since he lacked the authority to act unilaterally, as is clear from the penultimate paragraph: &quot;Wren presented the plan to King Charles II, who however could do nothing without the unanimous agreement of Parliament and all the property owners and institutions of London.&quot; The correct answer is E.</p><details><summary>Answers</summary><p>Answer: E</p></details><details><summary>original (IT)</summary><p class='th-it'>Il Re non poté portare avanti il piano perché:\n\nri\nnon lo riteneva idoneo\nl&#x27;approvazione era una prerogativa del Parlamento\nl&#x27;approvazione doveva venire da fazioni opposte\npreferì nominare dei commissari tecnici\nnon aveva l&#x27;autorità necessaria\n\nIl Re non potè proseguire nella realizzazione del piano in quanto non aveva l&#x27;autorità necessaria per po-\nterlo fare di sua volontà, come si evince nel penultimo paragrafo del brano: “Wren presentò il progetto\nal re Carlo Il, il quale però non poteva fare niente senza l&#x27;accordo unanime del Parlamento e di tutti i pro-\nprietari e le istituzioni di Londra”. La risposta corretta è quindi la .</p></details>", "back": "", "conf": "high", "page": 249, "section": "Esempi · Brano 5", "num": 24, "_i": 32}, {"kind": "question", "src": "images/p250_b2.png", "front": "<img src='images/p250_b2.png' class='cardimg'><p class='q'>Q25. The first consequence of Wren&#x27;s proposal was that he was:<br>A) appointed as one of the six commissioners<br>B) commissioned to design the Cathedral of St Paul&#x27;s<br>C) tasked with rebuilding London as before<br>D) appointed Surveyor General<br>E) forced to abandon his Baroque vision</p><details><summary>Answers</summary><p class='q'>The correct answer is A: Wren was appointed one of the six commissioners charged with overseeing the construction works. Specifically, he was appointed by the King himself (as stated in the final two lines of the passage about the Wren plan).</p></details><details><summary>original (IT)</summary><p class='th-it'>25 La prima conseguenza della proposta di Wren fu che venne:\n. nominato come uno dei sei commissari\n. incaricato di progettare la Cattedrale di Saint Paul\nincaricato di ricostruire Londra come prima\n. nominato sovraintendente generale\n\n. costretto ad abbandonare la sua visione barocca\n\nLa risposta corretta è la. : Wren fu nominato tra i sei commissari incaricati della sovraintendenza sui la-\nvori di costruzione. Nello specifico fu nominato dal re stesso (ultime due righe del brano).</p></details>", "back": "", "conf": "high", "page": 250, "section": "Esempi · Brano 5", "num": 25, "_i": 33}, {"kind": "question", "src": "images/p250_b3.png", "front": "<img src='images/p250_b3.png' class='cardimg'><p class='q'>Q26. On what date did the Red Army attack the Polish forces from the east?<br>A) 17 September<br>B) 9 September<br>C) 6 October<br>D) 27 September<br>E) 1 September<br><br>To find the answer it is necessary to focus on the last paragraph. The text states that the Polish capital surrendered on 27 September, and that ten days before (i.e. on 17 September) the Red Army had launched a surprise attack from the east against weak Polish forces. The solution is therefore provided by option A.</p><details><summary>Answers</summary><p>Answer: A</p></details><details><summary>original (IT)</summary><p class='th-it'>26 In quale data l&#x27;Armata Rossa attaccò da est le forze polacche?\n17 settembre 9 settembre 6 ottobre 27 settembre 1° settembre\nPer trovare la risposta è necessario concentrare l’attenzione sull&#x27;ultimo capoverso. Il testo afferma che la\ncapitale polacca si arrese il 27 settembre e dieci giorni prima (cioè il 17 settembre), l&#x27;Armata Rossa aveva\nattaccato deboli forze polacche improvvisamente da est. La soluzione al quesito è, quindi, fornita dall&#x27;al-\n\nternativa</p></details>", "back": "", "conf": "high", "page": 250, "section": "Esempi · Brano 5", "num": 26, "_i": 34}, {"kind": "question", "src": "images/p251_b2.png", "front": "<img src='images/p251_b2.png' class='cardimg'><p class='q'>Q27. The Blitzkrieg:<br>A) was tested in the period 1914–1918<br>B) was based on rapid attacks<br>C) originated from studies carried out in the Soviet Union<br>D) is a static technique of war based on the attrition of enemy forces<br>E) had been prohibited by the Treaty of Versailles<br><br>The definition of Blitzkrieg is found in the first paragraph. About halfway through, it is stated that &quot;the Blitzkrieg was essentially based on rapid deep attacks carried out by armoured force units [...] supported by aviation.&quot; The solution is therefore provided by option B.</p><details><summary>Answers</summary><p>Answer: B</p></details><details><summary>original (IT)</summary><p class='th-it'>27 La Blitzkrieg:\nè stata sperimentata nel periodo 1914-1918\nsi basava su attacchi veloci\nnasce da studi effettuati in Unione Sovietica\nè una tecnica di guerra statica, basata sul logoramento delle forze avversarie\nera stata proibita dal trattato di Versailles\n\nLa definizione di Blitzkrieg si trova nel primo capoverso. Verso la metà di questo, infatti, si afferma che “Ia\nBlitzkrieg si basava essenzialmente su veloci attacchi in profondità effettuati da reparti di forze corazzate\n(carri armati, artiglieria semovente, fanteria motorizzata ecc.) appoggiati dall&#x27;aviazione”. La soluzione è\nfornita, quindi, dall&#x27;alternativa</p></details>", "back": "", "conf": "high", "page": 251, "section": "Esempi · Brano 5", "num": 27, "_i": 35}, {"kind": "question", "src": "images/p251_b3.png", "front": "<img src='images/p251_b3.png' class='cardimg'><p class='q'>Q28. In 1939, the largest component of Germany&#x27;s ground forces was made up of:<br>A) self-propelled artillery<br>B) tanks<br>C) horses<br>D) infantry soldiers<br>E) none of the preceding alternatives is correct</p><details><summary>Answers</summary><p class='q'>The solution can easily be derived from the final lines of the first paragraph, where the author states that &quot;in 1939, and in subsequent years as well, the largest component of Germany&#x27;s ground forces consisted of infantry soldiers marching on foot, while most supplies were transported on horse-drawn carts.&quot; The correct answer is therefore D.</p></details><details><summary>original (IT)</summary><p class='th-it'>28 Nel 1939, il nucleo più consistente delle forze di terra della Germania era formato da:\nartiglieria semovente\ncarri armati\n\ncavalli\nsoldati di fanteria\nnessuna delle precedenti alternative è esatta\n\nLa soluzione al quesito è facilmente ricavabile dalle ultime righe del primo capoverso in cui l&#x27;autore affer-\nma che “nel 1939, ma anche negli anni successivi, il nucleo più consistente delle forze di terra della Ger-\nmania era formato da soldati di fanteria che marciavano a piedi, mentre la maggior parte dei riforni-\nmenti era trasportata su carri trainati da cavalli”. La risposta esatta è dunque la</p></details>", "back": "", "conf": "high", "page": 251, "section": "Esempi · Brano 5", "num": 28, "_i": 36}, {"kind": "question", "src": "images/p251_b4.png", "front": "<img src='images/p251_b4.png' class='cardimg'><p class='q'>Q29. The passage is of a nature that is:<br>A) scientific<br>B) literary<br>C) medical<br>D) historical<br>E) educational<br><br>The nature of a passage is its subject — the topic treated. Option E can be immediately ruled out because &quot;educational&quot; (divulgativo) is a possible style, not a subject. Options A and C can also be immediately ruled out because it is clear that the passage does not address scientific or medical topics. The passage is instead historical in nature — as correctly expressed by option D. The correct answer is D.</p><details><summary>Answers</summary><p>Answer: D</p></details><details><summary>original (IT)</summary><p class='th-it'>29 Il brano è di natura:\nscientifica\nletteraria\nmedica\nstorica\ndivulgativa\n\nLa natura di un brano è il suo oggetto, l&#x27;argomento trattato: l&#x27;alternativa... può essere immediatamente\nscartata perché divulgativo è un possibile carattere, cioè uno stile, e non un oggetto di un brano. Anche\nle alternative. e. possono essere immediatamente scartate perché è evidente che il brano non af-\nfronta argomenti scientifici, né medici. Il brano ha, invece, una natura storica, come correttamente\nespresso dall&#x27;alternativa</p></details>", "back": "", "conf": "high", "page": 251, "section": "Esempi · Brano 5", "num": 29, "_i": 37}, {"kind": "question", "src": "images/p251_b6.png", "front": "<img src='images/p251_b6.png' class='cardimg'><p class='q'>Q30. The invasion of Poland took place on:<br>A) 26 August 1939<br>B) 9 September 1940<br>C) 27 September 1940<br>D) 1 September 1939<br>E) 31 August 1939<br><br>The passage states that Hitler had set the start of the invasion of Poland for 26 August 1939, but postponed it to 1 September, also because of Mussolini&#x27;s decision not to enter the war immediately alongside Germany. The solution to the question is therefore D.</p><details><summary>Answers</summary><p>Answer: D</p></details><details><summary>original (IT)</summary><p class='th-it'>30 L&#x27;invasione della Polonia avvenne il:\n26 agosto 1939\n9 settembre 1940\n27 settembre 1940\n1° settembre 1939\n31 agosto 1939\n\nIl brano afferma che Hitler aveva stabilito l&#x27;inizio dell&#x27;invasione della Polonia per il 26 agosto 1939, ma che\nrimandò al 1° settembre anche per la decisione di Mussolini di non entrare subito in guerra al fianco della\nGermania (.-. soluzione del quesito).</p></details>", "back": "", "conf": "high", "page": 251, "section": "Esempi · Brano 5", "num": 30, "_i": 38}, {"kind": "passage", "src": "images/p250_b2.png", "front": "<div class='kindlabel'>PASSAGE</div><img src='images/p250_b2.png' class='cardimg'><p class='th-en'>Passage 6 — Based on the information contained in the following passage, answer the questions below.<br><br>Germany&#x27;s invasion of Poland represented the first practical demonstration of a new way of fighting, called the Blitzkrieg, or lightning war. Its origins can be traced to studies carried out in Great Britain by certain military theorists — including Liddell Hart — with the aim of avoiding the tragic and futile attrition of forces in the static trench warfare of 1914–1918, and of securing victory more rapidly through a war of movement. The Germans faced the same problem, but found themselves at an advantage, being able to operate without constraints from the past — because the harsh clauses of the Treaty of Versailles on armaments and troops forced them to start from scratch. The Blitzkrieg was essentially based on rapid deep attacks carried out by armoured force units (tanks, self-propelled artillery, motorised infantry, etc.) supported by aviation. Moreover, the German soldier was better trained and above all more motivated, in part as a result of skilful propaganda campaigns conducted by those in charge of the Nazi Party among the armed forces. It must be noted, however, that the shortage of raw materials prevented the German army from having at its disposal the quantity of armoured vehicles necessary to always conduct offensives based on great mobility, firepower, and speed of execution. In 1939, and in subsequent years as well, the largest component of Germany&#x27;s ground forces consisted of infantry soldiers marching on foot, while most supplies were transported on horse-drawn carts.<br><br>Hitler, having refined the new war machine, had set the start of the invasion for 26 August 1939, later postponed to 1 September, also because of Mussolini&#x27;s decision not to enter the war immediately alongside Germany. The non-aggression pact signed with Stalin secured Soviet Union support in the elimination of Poland. The German forces, divided into Army Group North, deployed in Pomerania and East Prussia, and Army Group South, located in Silesia and Slovakia, totalled 55 divisions with 1,250 aircraft, while the Polish army had 30 infantry divisions, 11 cavalry brigades, and 1 armoured brigade with approximately 400 aircraft, largely of an outdated type.<br><br>The German advance guard reached the outskirts of Warsaw as early as 9 September. Surrounded and subjected to heavy aerial and artillery bombardment, the capital surrendered on 27 September. Ten days earlier, the Red Army had launched a surprise attack from the east, overwhelming the weak Polish forces deployed to guard the eastern front. Although the last units surrendered on 6 October, by the end of September Poland had ceased to exist and its territory was divided between Germany and the Soviet Union along the line of the River Bug.</p><details><summary>original (IT)</summary><p class='th-it'>Brano 6 In basealle informazioni contenute nel brano seguente, rispondere alle succes-\nsive domande.\n\nL&#x27;invasione della Polonia da parte della Germania rappresentò la prima dimostrazione pratica di un nuo-\nvo modo di combattere, denominato Blitzkrieg, guerra-lampo. Le sue origini si possono far risalire agli\nstudi effettuati in Gran Bretagna da alcuni teorici militari, fra cui Liddell Hart, per evitare il tragico e inutile\nlogoramento delle forze nella statica guerra di trincea, come era avvenuto nel 1914-1918, e cercare di as-\nsicurarsi la vittoria con maggior rapidità attraverso la guerra di movimento. Anche i tedeschi affrontarono\nlo stesso problema, ma si trovarono avvantaggiati potendo operare senza vincoli rispetto al passato, per-\nché le dure clausole del trattato di Versailles in materia di armamenti e soldati li costrinsero a partire da\nzero. La Blitzkrieg si basava essenzialmente su veloci attacchi in profondità effettuati da reparti di forze\ncorazzate (carri armati, artiglieria semovente, fanteria motorizzata ecc.) appoggiati dall&#x27;aviazione. Inoltre\nil soldato tedesco era meglio addestrato e soprattutto più motivato, in seguito anche ad abili campagne\ndi propaganda attuate dai responsabili del partito nazista fra le forze armate. Va tuttavia sottolineato che\nla carenza di materie prime non permise all&#x27;esercito tedesco di avere a disposizione la quantità di mezzi\ncorazzati necessari per condurre sempre offensive basate su grande mobilità, potenza di fuoco e rapidità\nd&#x27;esecuzione. Nel 1939, ma anche negli anni successivi, il nucleo più consistente delle forze di terra della\nGermania era formato da soldati di fanteria che marciavano a piedi, mentre la maggior parte dei riforni-\nmenti era trasportata su carri trainati da cavalli.\n\nHitler, messa a punto la nuova macchina bellica, aveva stabilito l&#x27;inizio dell&#x27;invasione per il 26 agosto 1939,\npoi rimandata al primo settembre anche per la decisione di Mussolini di non entrare subito in guerra a fian-\nco della Germania. Il patto di non aggressione firmato con Stalin gli assicurò l&#x27;appoggio dell&#x27;Unione Sovie-\ntica nell&#x27;eliminazione della Polonia. Le forze tedesche, suddivise nel gruppo d&#x27;armate nord, schierato in\nPomerania e Prussia Orientale, e sud, dislocato in Slesia e Slovacchia, assommavano a 55 divisioni, con\n1250 aerei, mentre l&#x27;esercito polacco aveva 30 divisioni di fanteria, 11 brigate di cavalleria e 1 brigata carri\ncon circa 400 aerei, in gran parte di tipo antiquato.\n\nLe avanguardie tedesche raggiunsero già il 9 settembre i sobborghi di Varsavia. Circondata e sottoposta a\npesanti bombardamenti aerei e d&#x27;artiglieria, la capitale si arrese il 27 settembre. Dieci giorni prima, l&#x27;Armata\nRossa aveva attaccato improvvisamente da est, travolgendo le deboli forze polacche schierate a presidio del\nfronte orientale. Anche se gli ultimi reparti si arresero il 6 ottobre, già alla fine di settembre la Polonia cessava\ndi esistere e il suo territorio fu diviso tra Germania e Unione Sovietica dalla linea del fiume Bug.</p></details>", "back": "", "conf": "high", "page": 252, "section": "1.3.3 Quesiti che richiedono di identificare le implic", "num": null, "_i": 39}];

const KIND={
  question:{label:'Question',color:'#98a2d4'},
  passage:{label:'Passage',color:'#de8a76'},
  theory:{label:'Theory',color:'#e9be3b'},
  artwork:{label:'Artwork',color:'#e9be3b'}
};
const TKEY='theme_'+location.pathname.replace(/\W/g,'_');
let theme=localStorage.getItem(TKEY)||'cool';

const SK='done_'+location.pathname.replace(/\W/g,'_');
let passed=new Set(JSON.parse(localStorage.getItem(SK)||'[]'));
function savePassed(){localStorage.setItem(SK,JSON.stringify([...passed]));}
function togglePassed(i,e){
  e.stopPropagation();
  if(passed.has(i))passed.delete(i);else passed.add(i);
  savePassed();
  if(filter==='all'||filter==='passed'){
    pool=poolFor(filter);
    if(!pool.length)idx=0;else if(idx>=pool.length)idx=pool.length-1;
  }
  render();
}

let pool=ALL.slice(),idx=0,filter='all';
const card=document.getElementById('card');

function poolFor(f){
  return ALL.filter(c=>
    f==='all'?!passed.has(c._i):
    f==='passed'?passed.has(c._i):
    f==='review'?c.conf==='low':
    c.kind===f);
}
function counts(){
  return {
    all:ALL.filter(c=>!passed.has(c._i)).length,
    question:ALL.filter(c=>c.kind==='question').length,
    passage:ALL.filter(c=>c.kind==='passage').length,
    theory:ALL.filter(c=>c.kind==='theory').length,
    artwork:ALL.filter(c=>c.kind==='artwork').length,
    review:ALL.filter(c=>c.conf==='low').length,
    passed:passed.size
  };
}
function refreshCounts(){
  const n=counts();
  document.querySelectorAll('[data-count]').forEach(s=>{
    s.textContent=n[s.getAttribute('data-count')]||0;});
}
function view(){pool=poolFor(filter);if(idx>=pool.length)idx=0;render();}
function render(){
  refreshCounts();
  const c=pool[idx];
  if(!c){card.className='card empty';card.innerHTML='No cards here';
    document.getElementById('count').textContent='0 / 0';return;}
  const k=KIND[c.kind]||{label:c.kind,color:'#93a0ad'};
  const ord=String(c._i+1).padStart(2,'0');
  const meta=(c.section||'')+' · p'+c.page+(c.num?(' · Q'+c.num):'');
  const isDone=passed.has(c._i);
  const passBtn=`<button class="pass-btn${isDone?' done':''}" onclick="togglePassed(${c._i},event)">${isDone?'\u2713 done':'mark done'}</button>`;
  card.className='card';
  card.innerHTML=
    `<div class="cardhead">`+
      `<span class="ord">\u2116 ${ord}</span>`+
      `<span class="kind" style="color:${k.color}">${k.label}</span>`+
      `<span class="meta">${meta}</span>`+
    `</div>`+
    `<div class="cardbody">${c.front}</div>`+
    `<div class="cardfoot">${passBtn}</div>`;
  document.getElementById('count').textContent=(idx+1)+' / '+pool.length;
  window.scrollTo(0,0);
  const ci=card.querySelector('.cardimg');
  if(ci)ci.addEventListener('click',e=>{e.stopPropagation();openZoom(ci.src);});
}
function next(){if(!pool.length)return;idx=(idx+1)%pool.length;render();}
function prev(){if(!pool.length)return;idx=(idx-1+pool.length)%pool.length;render();}
function shuffle(){for(let i=ALL.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[ALL[i],ALL[j]]=[ALL[j],ALL[i]];}idx=0;view();}
function setFilter(f,btn){filter=f;idx=0;
  document.querySelectorAll('.controls button').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');view();}
function setTheme(t,btn){document.body.dataset.theme=t;localStorage.setItem(TKEY,t);
  document.querySelectorAll('.themes button').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');}
function openZoom(src){const z=document.getElementById('zoom');document.getElementById('zoomimg').src=src;z.classList.add('show');}
function closeZoom(){document.getElementById('zoom').classList.remove('show');}

let sx=0,sy=0;
card.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;},{passive:true});
card.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
  if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.5){e.preventDefault();dx<0?next():prev();}},{passive:false});
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')next();if(e.key==='ArrowLeft')prev();
  if(e.key==='Escape')closeZoom();});

document.body.dataset.theme=theme;
document.querySelectorAll('.themes button').forEach(b=>b.classList.toggle('on',b.getAttribute('data-theme')===theme));
view();
</script></body></html>
