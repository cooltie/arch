<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Reading Comprehension · Ch. 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500&family=Space+Grotesk:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#15181c; --card:#1f242a; --panel:#191d22; --panel-h:#242a30;
  --ink:#eef2f6; --body:#e6ecf2; --muted:#93a0ad; --muted2:#9aa7b3;
  --line:#2e353d; --accent:#4f9ad6; --accent-h:#74b3e4; --chip-on:#2a3138;
  --chip:rgba(255,255,255,.09); --chip-h:rgba(255,255,255,.14);
  --label:"Space Grotesk",ui-monospace,monospace;
}
body[data-theme=light]{
  --bg:#eee2cc; --card:#f6efdd; --panel:#e4d7bb; --panel-h:#d9cba9;
  --ink:#33291e; --body:#33291e; --muted:#7f7668; --muted2:#a89c85;
  --line:#ddd0b4; --accent:#7f7668; --accent-h:#9c8f76; --chip-on:#ddd0b4;
  --chip:rgba(0,0,0,.06); --chip-h:rgba(0,0,0,.1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{overflow-x:hidden}
html,body{margin:0;background:var(--bg)}
body{color:var(--ink);font-family:'Hanken Grotesk',sans-serif;
  min-height:100dvh;display:flex;flex-direction:column;align-items:center;
  padding:0 16px env(safe-area-inset-bottom,16px)}
a{color:var(--accent);text-decoration-color:rgba(79,154,214,.5)}
a:hover{color:var(--accent-h)}

/* header */
header{width:100%;max-width:760px;display:flex;justify-content:space-between;
  align-items:center;gap:12px;flex-wrap:wrap;padding:18px 2px 14px}
h1{font-family:var(--label);font-size:17px;font-weight:600;letter-spacing:.01em;margin:0}
h1 .sub{color:var(--muted);font-weight:400}
.themes{display:flex;gap:4px;background:var(--panel);border-radius:10px;padding:3px}
.themes button{font-family:var(--label);font-size:11px;letter-spacing:.09em;text-transform:uppercase;
  border:none;border-radius:8px;padding:7px 14px;cursor:pointer;white-space:nowrap;
  background:transparent;color:var(--muted)}
.themes button.on{background:var(--chip-on);color:var(--ink)}

/* tabs */
.controls{position:sticky;top:0;z-index:10;width:100%;max-width:760px;display:flex;
  align-items:stretch;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px;
  overflow-x:auto;background:var(--bg);padding-top:8px;
  scrollbar-width:none;-ms-overflow-style:none}
.controls::-webkit-scrollbar{display:none;width:0;height:0}
.controls button{font-family:var(--label);font-size:12px;letter-spacing:.11em;text-transform:uppercase;
  background:none;border:none;cursor:pointer;padding:10px 12px 12px;white-space:nowrap;
  display:flex;align-items:baseline;gap:6px;color:var(--muted);box-shadow:none}
.controls button .c{font-size:10px;color:var(--muted);opacity:.7}
.controls button.on{color:var(--ink);box-shadow:inset 0 -2px 0 0 var(--accent)}
.controls button.on .c{color:var(--accent)}
.controls .spacer{flex:1;min-width:8px;box-shadow:none;pointer-events:none}
.controls button.shuf{color:var(--muted)}
.controls button.shuf:hover{color:var(--accent)}

/* card */
.cardwrap{width:100%;max-width:760px;display:flex}
.card{flex:1;min-height:58dvh;background:var(--card);border-radius:16px;
  padding:26px 30px 26px;
  display:flex;flex-direction:column;user-select:none;touch-action:pan-y;cursor:default}
.cardbody{user-select:text;-webkit-user-select:text}
.card.empty{align-items:center;justify-content:center;background:var(--panel);
  color:var(--muted);font-family:var(--label);font-size:13px;letter-spacing:.1em;text-transform:uppercase}

.cardhead{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.cardhead .ord{font-family:var(--label);font-size:13px;font-weight:600;letter-spacing:.05em;
  color:var(--body);background:var(--chip);border-radius:8px;padding:5px 10px}
.cardhead .kind{font-family:var(--label);font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.cardhead .meta{font-family:var(--label);font-size:11px;letter-spacing:.07em;color:var(--muted)}

.cardbody{color:var(--body);font-family:'Hanken Grotesk',sans-serif;font-weight:300;font-size:18.5px;line-height:1.68}
.cardbody p{margin:0 0 1.2em;text-wrap:pretty}
.cardbody p:last-child{margin-bottom:0}
.cardbody p.bul{margin:2.5em 0 0;padding-left:1.4em;text-indent:-1.4em}
.cardbody p.th-en.bul{margin-top:0}
.cardbody .kindlabel{display:none}
.cardbody .sec{display:none}
.cardbody .q{margin:0 0 1.2em}
.cardbody .th-en{margin:0 0 1.2em}
.cardbody .th-it{color:var(--muted2);font-size:.82em;line-height:1.65;white-space:pre-wrap}
.cardbody details{margin-top:1.3em}
.cardbody summary{cursor:pointer;color:var(--accent-h);font-family:var(--label);font-size:12px;
  letter-spacing:.13em;text-transform:uppercase}
.cardbody img.cardimg{max-width:100%;border-radius:8px;background:#fff;display:block;
  margin:0 0 20px;cursor:zoom-in}

.cardfoot{margin-top:auto;padding-top:26px;display:flex;justify-content:center}
.pass-btn{font-family:var(--label);font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  cursor:pointer;border:none;border-radius:99px;padding:10px 22px;
  color:var(--body);background:var(--chip)}
.pass-btn:hover{background:var(--chip-h)}
.pass-btn.done{color:#a9d0b6;background:rgba(120,190,150,.18)}

/* nav */
.nav{position:sticky;bottom:0;z-index:10;width:100%;max-width:760px;display:flex;
  align-items:center;gap:10px;padding:14px 0 18px;background:var(--bg)}
.nav button{flex:1;font-family:var(--label);font-size:12px;letter-spacing:.13em;text-transform:uppercase;
  background:var(--panel);color:var(--ink);border:none;border-radius:12px;padding:13px 16px;
  min-height:46px;cursor:pointer}
.nav button:hover{background:var(--panel-h)}
.nav button:active{transform:scale(.98)}
.count{font-family:var(--label);color:var(--muted);font-size:13px;min-width:72px;text-align:center}

/* zoom */
#zoom{position:fixed;inset:0;background:rgba(8,10,12,.96);display:none;
  align-items:center;justify-content:center;z-index:50;cursor:zoom-out;padding:12px}
#zoom.show{display:flex}
#zoom img{max-width:100%;max-height:100%;object-fit:contain;background:#fff;border-radius:8px}
</style></head><body>
<header>
  <h1>Reading Comprehension <span class="sub">· Ch. 1</span></h1>
  <div class="themes">
    <button data-theme="cool" class="on" onclick="setTheme('cool',this)">Cool</button>

</header>

<div class="controls">
  <button id="all" class="on" onclick="setFilter('all',this)">All <span class="c" data-count="all"></span></button>
  <button onclick="setFilter('question',this)">Questions <span class="c" data-count="question"></span></button>
  <button onclick="setFilter('passage',this)">Passages <span class="c" data-count="passage"></span></button>
  <button onclick="setFilter('theory',this)">Theory <span class="c" data-count="theory"></span></button>
  <button onclick="setFilter('review',this)">Review <span class="c" data-count="review"></span></button>

<script>
const ALL = [{"kind": "theory", "src": "images/p237_b2.png", "front": "<div class='kindlabel'>THEORY</div><img src='images/p237_b2.png' class='cardimg'><p class='th-en'>7 | Reading Comprehension<br><br>In reading comprehension exercises, the candidate is given a passage of various kinds (scientific, technical, literary, historical, journalistic, etc.), generally between one and two pages long, followed by several questions (normally four or five).<br><br>The purpose of reading comprehension exercises is to assess the candidate&#x27;s ability, on the one hand, to assimilate the main concepts, data, and information contained in a text and where possible to draw conclusions from them; on the other hand, to place the text in context — a context shaped by various factors such as the identity and nationality of the author, the style and subject of the passage, the historical period and geographical area in which the events are set, the author&#x27;s intention, and so on.<br><br>In recent admission tests, questions about passages have focused in particular on the assimilation of concepts explicitly or implicitly present in the passage.<br><br>1.1 | Principles for critical reading of passages<br><br>The work to be done on a passage cannot consist exclusively of a quick read. The typical mistake is to dive straight into reading the text without trying to differentiate the information received or analyse it critically.<br><br>First, keep the following principles in mind:</p><p class='bul'>• Every passage is based on a central idea or concept: it is essential to focus on that idea, paying less attention to superfluous phrases and vocabulary and concentrating instead on the author&#x27;s theses and arguments.</p><details><summary>original (IT)</summary><p class='th-it'>7 Comprensione di testi\n\nNegli esercizi di comprensione di testi viene sottoposto al candidato un brano di varia natura (scientifico,\ntecnico, letterario, storico, giornalistico ecc.), di lunghezza generalmente compresa tra una e due pagine\ne seguito da alcuni quesiti (di norma quattro o cinque).\n\nLa finalità degli esercizi di comprensione di testi è quella di valutare le capacità del candidato, da un lato,\ndi assimilare i concetti principali, i dati e le nozioni riportate in un testo ed eventualmente di dedurne\ndelle conclusioni; dall&#x27;altro, di inserire il testo in un contesto, alla cui definizione concorrono vari fattori,\nquali l&#x27;identità e la nazionalità dell&#x27;autore, lo stile e l&#x27;argomento del brano, l&#x27;epoca storica e la zona geo-\ngrafica in cui gli avvenimenti sono collocati, l&#x27;intento dell&#x27;autore e così via.\n\nNei test di ammissione degli ultimi anni i quesiti relativi a brani si sono concentrati in modo particolare\nsull&#x27;assimilazione di concetti esplicitamente o implicitamente presenti nel brano.\n\n1.1 | Principi utili per una lettura critica dei brani\n\nIl lavoro da svolgere su un brano non può consistere esclusivamente in una rapida lettura. L&#x27;errore tipico\ndel candidato è quello di “buttarsi” a leggere il testo, senza cercare di differenziare le informazioni che\nriceve e senza analizzarle criticamente.\n\nInnanzitutto, si tengano presenti alcuni principi.\n* Ognibrano è basato su un&#x27;idea o concetto centrale: è necessario mettere a fuoco tale idea, pre-\n\nstando minore attenzione a tutte le frasi e i vocaboli superflui e concentrandosi invece sulle tesi e\nsulle argomentazioni dell&#x27;autore.</p></details>", "back": "", "conf": "high", "page": 237, "section": "1.1 Principi utili per una lettura critica dei brani", "num": null, "_i": 0}, {"kind": "theory", "src": "images/p237_b3.png", "front": "<div class='kindlabel'>THEORY</div><img src='images/p237_b3.png' class='cardimg'><p class='bul'>• The first part of the passage is usually the most important, since it contains key information about the author&#x27;s purpose, what they intend to demonstrate, their point of view, and the tone used. Read the opening paragraphs carefully, re-read them if necessary, and in any case devote more time to them than to the rest.</p><p class='bul'>• Details serve only to clarify the more general concepts: read them quickly and return to them only if the questions make it necessary, avoiding trying to memorise them during the initial read.</p><p class='bul'>• Each paragraph aims to clarify one element useful for expressing the central idea of the passage: for each paragraph, try to extract the concept or idea the author is attempting to communicate, mentally paraphrasing the text if necessary.</p><p class='th-en'><br>1.2 | How to work in a structured way<br><br>Reading comprehension exercises often present greater difficulties than other types, both because of their inherent complexity and because of the time they require. It is therefore important for the candidate to establish an effective working method that optimises the time devoted to reading and speeds up the answering of questions.</p><details><summary>original (IT)</summary><p class='th-it'>- La prima parte del brano è solitamente quella più importante poiché contiene informazioni\nchiave circa la finalità dell&#x27;autore, ciò che egli intende dimostrare, il suo punto di vista e il tono utiliz-\nzato: occorre dunque leggere attentamente i primi paragrafi, se necessario rileggerli e comunque\ndedicarvi un tempo superiore rispetto al resto del brano.\n\n* dettagli servono solo a chiarire i concetti più generali: si consiglia di leggere tali dettagli veloce-\nmente e di tornarvi unicamente nel caso in cui i quesiti lo rendano necessario, evitando di memoriz-\nzarli nel corso della lettura.\n\n* Ogni paragrafo è volto a chiarire un elemento utile all&#x27;espressione dell&#x27;idea centrale del\nbrano: occorre dunque, per ogni paragrafo, cercare di estrapolare il concetto o l’idea che l&#x27;autore ha\ncercato di comunicare, se necessario parafrasando mentalmente il testo.\n\n1,2 | Come svolgere un lavoro ben strutturato\n\nGli esercizi di comprensione di testi presentano spesso problemi maggiori rispetto alle altre tipologie, sia\nper la loro intrinseca complessità sia per iltempo che richiedono. Diviene, dunque, importante per il can-\ndidato impostare un efficace metodo di lavoro, che consenta di ottimizzare il tempo dedicato alla lettura\ne di velocizzare la risoluzione dei quesiti.</p></details>", "back": "", "conf": "high", "page": 237, "section": "1.1 Principi utili per una lettura critica dei brani", "num": null, "_i": 1}, {"kind": "theory", "src": "images/p238_b1.png", "front": "<div class='kindlabel'>THEORY</div><img src='images/p238_b1.png' class='cardimg'><p class='bul'>• It is essential to read the questions quickly before reading the passage. This allows you to:</p><p class='th-en'>  – anticipate the subject of the passage before you begin to read;<br>  – focus your attention more closely on those parts of the passage that will be the subject of questions.</p><p class='bul'>• It is useful to underline those sentences on which any questions about specific concepts or details in the passage are based (places, dates, statements, characters, quantities, prices, etc.).</p><p class='bul'>• It is advisable to analyse all the options offered by a question before choosing the correct one. Reading comprehension questions are often characterised by several &quot;plausible&quot; alternatives. The candidate must therefore identify the one that answers the question in the most precise and complete way (i.e. the answer most consistent with the content of the passage).</p><p class='bul'>• In order to answer questions about the implications and logical consequences of what is stated in the passage, concentrate not only on the explicit meaning of the text but also on its implicit meaning. This can be achieved by asking what the premises or consequences of a given statement or opinion expressed by the author might be.</p><p class='bul'>• Answer solely on the basis of what is stated in the text and not on the basis of any personal knowledge of the subject. Everything needed to answer the reading comprehension questions is contained in the passage itself. The questions relate exclusively to what is maintained in the text or to what can logically be deduced from it. Even if you are an expert in the subject of the passage, set aside your own knowledge and focus on the content. Conversely, if the topic is unfamiliar, there is no cause for alarm.</p><p class='th-en'><br>1.3 | Types of questions<br><br>The following paragraphs outline the four main types of questions used in reading comprehension exercises.</p><details><summary>original (IT)</summary><p class='th-it'>« Èindispensabile una veloce lettura delle domande prima di leggere il brano. Ciò consente di:\n* intuire l&#x27;argomento oggetto del brano prima di iniziare a leggere;\n* concentrare maggiormente l’attenzione su quelle parti del brano che saranno poi oggetto dei\n\nquesiti.\n\n- Èutile sottolineare quelle frasi su cui si basano eventuali quesiti relativi a specifici concetti o det-\ntagli riportati dal brano (luoghi, date, affermazioni, personaggi, date, quantità, prezzi ecc.).\n\n+ È opportuno analizzare tutte le alternative proposte da una domanda prima di scegliere quella\ncorretta. Infatti, le domande di comprensione di testi sono spesso caratterizzate dalla presenza di\n\ndiverse alternative “verosimili”. Il candidato deve dunque individuare quella che risponde al quesito\nin esame nel modo più preciso e completo (ossia la risposta più coerente con il contenuto del\nbrano).\n\n* AI fine di poter rispondere agevolmente ai quesiti relativi alle implicazioni e alle conseguenze logi-\nche di quanto affermato nel brano, è opportuno concentrarsi non solo sul significato esplicito del\ntesto, ma anche sul significato implicito. Si può ottenere ciò domandandosi quale siano le pre-\nmesse o le conseguenze di una determinata affermazione o di una certa opinione espressa\ndall&#x27;autore.\n\n+ Rispondere unicamente sulla base di quanto affermato nel testo e non sulla base di eventuali cono-\nscenze personali sull&#x27;argomento trattato. Meglio ancora: tutto ciò che serve per rispondere alle\ndomande di comprensione testuale si trova nel brano stesso. Le domande, infatti, vertono esclu-\nsivamente su quanto sostenuto nel testo o su quanto da esso è possibile dedurre in modo logico.\nPertanto, anche se si è esperti della materia oggetto del brano, occorre prescindere dalle proprie\nconoscenze e concentrarsi sul contenuto. Viceversa, se il tema risulta sconosciuto, non è il caso di\nallarmarsi.\n\n1.3 | Tipologie di quesiti\n\nNei paragrafi che seguono vengono evidenziate le quattro principali tipologie di domande utilizzate in\nquesto genere di esercizi.\n\n1.3.1 | Quesiti relativi a specifici concetti o idee espresse nel brano\n\nSi tratta della tipologia di domande più frequenti e costituita essenzialmente da frasi da completare. Per</p></details>", "back": "", "conf": "high", "page": 238, "section": "1.3 Tipologie di quesiti", "num": null, "_i": 2}, {"kind": "theory", "src": "images/p238_b2.png", "front": "<div class='kindlabel'>THEORY</div><img src='images/p238_b2.png' class='cardimg'><p class='th-en'>For example, in a passage about the economic crisis of 1929 — such as one that appeared in a past test — the questions might be of the following type:</p><p class='bul'>• What were the causes of the crisis?</p><p class='bul'>• What were the economic conditions at the end of the First World War?</p><p class='bul'>• What was the reaction of governments in the face of the economic crisis?</p><p class='th-en'><br>These are clearly questions whose preliminary reading guides the reader in highlighting the parts of the text most useful for answering.<br><br>1.3.2 | Questions relating to the central argument of the passage<br><br>These are questions generally posed in one of the following forms:</p><p class='bul'>• The title that best expresses the ideas in the passage is ...</p><p class='bul'>• The main idea expressed by the passage is ...</p><p class='bul'>• The statement that best summarises the central theme of the passage is ...</p><p class='bul'>• The passage illustrates ...</p><p class='bul'>• The author&#x27;s purpose in the passage is to ...</p><p class='th-en'><br>These are questions intended to assess the candidate&#x27;s understanding of the central theme of the passage and of the purpose the author pursued in writing it.</p><details><summary>original (IT)</summary><p class='th-it'>esempio, in un brano sulla crisi economica del 1929, come quello comparso in un test somministrato nel\npassato, le domande potrebbero essere del tipo:\n\n* Qualisono state le cause della crisi?\n+ Qualierano ie condizioni economiche alla fine della Prima Guerra Mondiale?\ne Quale fula reazione dei Governi di fronte alla crisi economica?\n\nSono evidentemente domande la cui lettura preliminare guida in modo prezioso nella sottolineatura del-\nle parti del testo utili per rispondere.\n\n1.3.2 | Quesiti relativi al pensiero centrale del brano\n\nSi tratta di domande che sono generalmente poste in una delle seguenti forme:\n\n* Il titolo che meglio esprime le idee del brano è ...\n\n* L&#x27;idea principale espressa dal brano è...\n\n* L&#x27;affermazione che meglio sintetizza il tema centrale del brano è ...\n\n* IIbrano illustra ...\n\n* Lo scopo dell&#x27;autore del brano è di...\n\nSi tratta dunque di quesiti che intendono valutare la comprensione da parte del candidato del tema cen-</p></details>", "back": "", "conf": "high", "page": 238, "section": "1.3 Tipologie di quesiti", "num": null, "_i": 3}, {"kind": "theory", "src": "images/p238_b3.png", "front": "<div class='kindlabel'>THEORY</div><img src='images/p238_b3.png' class='cardimg'><p class='th-en'>The central theme can generally be summarised in a single sentence, which could also serve as a possible title for the extract.<br><br>To answer this type of question, it is usually sufficient to read carefully the opening section of the passage.</p><details><summary>original (IT)</summary><p class='th-it'>trale del brano e della finalità perseguita dall&#x27;autore nello scriverlo. Generalmente il tema centrale può\nessere sintetizzato in una singola frase, che potrebbe coincidere anche con un possibile titolo del passo.\n\nPer rispondere a questa tipologia di quesiti, è per lo più sufficiente leggere attentamente la parte iniziale\ndel brano.</p></details>", "back": "", "conf": "high", "page": 238, "section": "1.3 Tipologie di quesiti", "num": null, "_i": 4}, {"kind": "theory", "src": "images/p239_b1.png", "front": "<div class='kindlabel'>THEORY</div><img src='images/p239_b1.png' class='cardimg'><p class='th-en'>1.3.3 | Questions requiring identification of the implications and logical consequences of what is stated in the passage<br><br>These questions are most often expressed in one of the following forms:</p><p class='bul'>• From the passage it is / is not possible to deduce that ...</p><p class='bul'>• The paragraph preceding the given passage probably states that ...</p><p class='bul'>• Which of the following would be a logical continuation of the passage?</p><p class='bul'>• Which of the following conclusions cannot be deduced from the passage?</p><p class='th-en'><br>These are more complex questions than the previous types, since they do not merely investigate understanding of what is explicitly stated in the passage, but also aim to assess understanding of what can be logically deduced from the text.<br><br>It is above all these questions that require a critical reading of the passage.<br><br>Examples</p><details><summary>original (IT)</summary><p class='th-it'>1,3.3 | Quesiti che richiedono di identificare le implicazioni\ne le conseguenze logiche di quanto affermato nel brano\n\nQueste domande sono il più delle volte espresse in una delle seguenti forme:\n* Dalbranoè possibile / non è possibile dedurre che ...\n\n* Il paragrafo che precede il brano riportato probabilmente afferma che ...\n* Quale delle seguenti sarebbe una logica continuazione del brano?\n\n* Quale delle seguenti conclusioni non può essere dedotta dal brano?\n\nSi tratta di quesiti più complessi dei precedenti, giacché non si limitano a indagare la comprensione di\nquanto esplicitamente affermato nel passo, ma mirano a valutare anche la comprensione di ciò che può\nessere logicamente dedotto dal testo.\n\nSono soprattutto questi quesiti a richiedere una lettura critica del brano.\n\nEsempi</p></details>", "back": "", "conf": "high", "page": 239, "section": "1.3.3 Quesiti che richiedono di identificare le implic", "num": null, "_i": 5}, {"kind": "passage", "src": "images/p239_b2.png", "front": "<div class='kindlabel'>PASSAGE</div><img src='images/p239_b2.png' class='cardimg'><p class='th-en'>Passage 1 — Based on the information contained in the following passage, answer the questions below.<br><br>The function of the postage stamp is to frank correspondence so that it can be forwarded to the recipient through postal services, whether public or private. To fulfil this function, the stamp must bear the indication of the authority that issued it (an indication that also denotes the origin of the franked correspondence) and must include a figure indicating its face value. In other words, the stamp is a graphic means of communication carrying two messages: one relating to the issuing authority, the other to its cost, which is also the cost of the function it is designed to perform. Made from a small piece of paper with regular edges, in a rectangular, square, or (rarely) triangular format (it does not matter here whether the back is gummed or not, nor whether the margins are perforated or must be cut individually with scissors), the stamp bears on its face, printed, the two messages that constitute its essential elements.<br><br>Under ideal conditions — free of every accessory element — constitutive data and function ought to be identical. But these conditions break down in the very birth of the stamp, whose genesis and production necessarily entail a series of graphic, technical, and symbolic choices. The type of printing, the typefaces of the text and figures, the image with which the issuing authority presents itself — all of these give the postage stamp a precise historical position, far more complex than what is implicit in its simple act of birth. And it is a position whose roots take on cultural values and connections, which have become progressively more elaborate with the spread of commemorative issues (the oldest of which, dedicated to the fiftieth anniversary of Queen Victoria&#x27;s accession to the throne, appeared in 1887 in the United Kingdom), followed by other types celebrating special occasions, events of particular political significance, or relating to aspects of customs and art, flora or fauna.<br><br>Of course there will always be occasions on which the stamp (like banknotes) may appear in forms of extreme conciseness, with indispensable information reduced to a minimum; but even in such cases (which are infrequent) the type of paper, the generic anonymity of the typefaces, and the roughness of execution will constitute the main stylistic components and distinguishing features, betraying abnormal circumstances of social or political crisis, which have prevented the necessary preliminary preparation, the full range of choices, and the care in realising them.<br><br>Endowed with such varied and complex characteristics, with a semantic charge so wide and with historical and figurative roots so deep and intricate, the stamp can also be considered and judged from a purely aesthetic standpoint, on a par with an engraving or a print of greater or lesser artistic merit. Such a reading will take no account of its rich (and practically infinite) series of allusions, symbols, and references, nor will it trouble to identify what is its primary meaning: that of being a very precise indicator of political and cultural situations. But an interpretation of the major figurative works — be they paintings or sculptures, architecture or engravings — turns out to be partial when conducted from the sole and exclusive formal standpoint (without taking any account of iconographic or iconological characteristics, or socio-cultural aspects), resulting in a succession of figurative texts detached from historical reality and linked to one another by an abstract network of stylistic relationships and the evolution of forms. Similarly, reading the stamp in a one-sided way under the exclusive graphic aspect remains deaf and blind to its most valid and significant characteristics. In reality, the stamp is today the most concise and concentrated figurative means of propaganda — almost a wall poster reduced to bare essentials — from which the social and political substratum is revealed with extreme clarity and force. And it is also the most capillarily diffused figurative means of propaganda, both among the different strata of society at local level and, horizontally, among its recipients situated in a terminal system that ignores distances and frontiers.</p><details><summary>original (IT)</summary><p class='th-it'>Brano 1 In base alle informazioni contenute nel brano seguente, rispondere alle succes-\nsive domande.\n\nLa funzione del francobollo è di affrancare la corrispondenza al fine di inoltrarla al destinatario, attraverso\ni servizi postali, pubblici o privati. Affinché possa espletare questa funzione è indispensabile che il fran-\ncobollo rechi l&#x27;indicazione dell&#x27;autorità che lo ha emesso (indicazione che denota anche l&#x27;origine della\ncorrispondenza affrancata) includendo anche una cifra relativa al suo valore facciale. In altre parole, il\nfrancobollo è un mezzo di comunicazione grafica latore di due messaggi, l&#x27;uno relativo all&#x27;autorità emit-\ntente, l&#x27;altro riguardante il suo costo, che è anche il costo della funzione cui è destinato. Costituito da un\npiccolo pezzo di carta dai contorni regolari, di formato rettangolare, quadrato o (raramente) triangolare\n(non interessa qui se il verso ne sia gommato o no e neppure se i suoi margini siano dentellati o debbano\nessere singolarmente ritagliati con le forbici) il francobollo reca sulla sua faccia, eseguiti a stampa, i due\nmessaggi che ne costituiscono gli elementi essenziali. In condizioni ideali, da cui fosse esente ogni ele-\nmento accessorio, dati costitutivi e funzione dovrebbero identificarsi. Ma tali condizioni vengono meno\nnella nascita stessa del francobollo, la cui genesi e la cui realizzazione ne comportano necessariamente\nuna serie di scelte grafiche, tecniche e simboliche. Il tipo della stampa, i caratteri delle scritte e delle cifre,\nl&#x27;immagine con cui l&#x27;autorità emittente si dichiara, sono tutti dati da cui il bollo postale deriva una precisa\nposizione storica, ben più complessa di quel che sia implicito nel suo semplice atto di nascita. Ed è una\nposizione le cui radici assumono valori e legami culturali, divenuti via via più articolati con il diffondersi\ndelle emissioni commemorative (di cui la più antica, dedicata al cinquantesimo anniversario dell&#x27;assun-\nzione al trono della regina Vittoria, apparve nel 1887 nel Regno Unito d&#x27;Inghilterra) seguite poi da altri\ntipi, celebrativi di speciali occasioni, di avvenimenti di particolare significato politico, oppure relativi ad\naspetti di costume e di arte, della fauna o della flora. Beninteso, non mancheranno certo occasioni in cui\nil francobollo (come la carta moneta) potrà presentarsi sotto aspetti di estrema concisione, con le indica-\nzioni indispensabili ridotte al minimo; ma anche in casi siffatti (e infrequenti) saranno il tipo della carta,\nl&#x27;anonimità generica dei caratteri di stampa, la rozzezza dell&#x27;esecuzione a costituire le precipue compo-\nnenti di stile e di connotati, denunciando anormali circostanze di crisi sociale o politica, dalle quali è stata\npreclusa la necessaria gestazione preliminare, la rosa delle scelte e la cura nel realizzarle.\n\nProvvisto di connotati così vari e complessi, di una carica semantica talmente ampia e di radici storiche e\nfigurative tanto profonde e articolate, il francobollo può anche venire considerato e giudicato sotto il\nsemplice profilo estetico, alla stregua cioè di un&#x27;incisione o di una stampa più o meno d&#x27;arte. Una lettura\ndel genere non terrà in alcun conto la sua ricca (e praticamente infinita) serie di allusioni, simboli, riferi-\nmenti, né si preoccuperà di rilevare quello che è il suo significato primario: di essere un indicatore assai\npreciso di situazioni politiche e culturali. Ma un&#x27;interpretazione delle opere figurative maggiori, siano\nesse dipinti o sculture, architetture o incisioni, risulta parziale, quando venga condotta sotto il solo ed\nesclusivo aspetto formale (senza tenere cioè in alcun conto i connotati iconografici o iconologici, e gli\naspetti socio-culturali) risultandone una successione di testi figurativi avulsi dalla realtà storica e legati\ntra di loro da una astratta rete di rapporti di stile e di evoluzione delle forme; così la lettura del francobollo,\nse condotta in modo unilaterale sotto l&#x27;esclusivo aspetto grafico, rimane sorda e cieca ai suoi connotati\npiù validi e significativi. In realtà, il francobollo è oggi il mezzo figurativo più stringato e concentrato di\npropaganda, quasi un manifesto murale ridotto ai minimi termini, dal quale il substrato sociale e politico\nsi rivela con estrema chiarezza e pregnanza. Ed è anche il mezzo figurativo di propaganda più capillar-\nmente diffuso, sia nei diversi strati della società, cioè a livello locale, sia, in senso orizzontale, per i suoi\ndestinatari situati in un sistema terminale che ignora distanze e frontiere.</p></details>", "back": "", "conf": "high", "page": 239, "section": "Esempi · Brano 1", "num": null, "_i": 6}, {"kind": "question", "src": "images/p240_b2.png", "front": "<img src='images/p240_b2.png' class='cardimg'><p class='q'>Q1. The &quot;face value&quot; (valore facciale) is:<br>A) the cost of transport<br>B) the conventional standard price<br>C) the actual cost of the postal service<br>D) the production cost of the stamp<br>E) the purchase price of the stamp</p><details><summary>Answers</summary><p class='q'>The solution is A. The relevant passage is: &quot;it is essential that the stamp bear the indication of the authority that issued it [...] and must include a figure indicating its face value. In other words, the stamp is a graphic means of communication carrying two messages: one relating to the issuing authority, the other to its cost, which is also the cost of the function it is designed to perform.&quot; The face value is therefore the cost of the postal function — i.e. the conventional price of sending the letter. The correct answer is A.</p></details><details><summary>original (IT)</summary><p class='th-it'>1 Il valore facciale è:\n\nil costo del trasporto\nil prezzo convenzionale unico\n\nil costo effettivo del servizio postale\n\nil costo di produzione del francobollo\n\nil prezzo di acquisto del francobollo\n\nLa soluzione del quesito è la (&gt;. Il passaggio del brano cui la domanda fa riferimento è il seguente (la pa-\nrola chiave presente nella domanda e che si ritrova nel testo è evidenziata in grassetto): “è indispensabile\nche il francobollo rechi l&#x27;indicazione dell&#x27;autorità che lo ha emesso (indicazione che denota anche l&#x27;origi-\nne della corrispondenza affrancata) includendo anche una cifra relativa al suo valore facciale. In altre pa-\nrole, il francobollo è un mezzo di comunicazione grafica latore di due messaggi, l&#x27;uno relativo all&#x27;autorità\nemittente, l&#x27;altro riguardante il suo costo, che è anche il costo della funzione cui è destinato”</p></details>", "back": "", "conf": "high", "page": 240, "section": "Esempi · Brano 1", "num": 1, "_i": 7}, {"kind": "question", "src": "images/p240_b3.png", "front": "<img src='images/p240_b3.png' class='cardimg'><p class='q'>Q2. Reading the stamp from a purely aesthetic standpoint:<br>A) serves to establish its origin<br>B) constitutes a partial reading<br>C) ignores its symbolic value<br>D) is completely misleading<br>E) highlights its functional value</p><details><summary>Answers</summary><p class='q'>The solution is A. The relevant passage: &quot;the stamp can also be considered and judged from a purely aesthetic standpoint [...]. Such a reading will take no account of its rich (and practically infinite) series of allusions, symbols, and references, nor will it trouble to identify what is its primary meaning: that of being a very precise indicator of political and cultural situations.&quot; A purely aesthetic reading is therefore partial — it ignores the stamp&#x27;s full meaning. The correct answer is A.</p></details><details><summary>original (IT)</summary><p class='th-it'>2 La lettura del francobollo sotto l&#x27;aspetto estetico:\n\n‘ serve per stabilirne l&#x27;origine\n\nPa\n\n) costituisce una lettura parziale\n\nî ignora il valore simbolico\n) è completamente fuorviante\n\nne mette in risalto il valore funzionale\n\nLa soluzione del quesito è la (-.. Il passaggio del brano cui la domanda fa riferimento è il seguente (anche\nin questo caso la parola chiave è evidenziata in grassetto): “il francobollo può anche venire considerato e\ngiudicato sotto il semplice profilo estetico, alla stregua cioè di un&#x27;incisione o di una stampa più o meno\nd&#x27;arte. Una lettura del genere non terrà in alcun conto la sua ricca (e praticamente infinita) serie di allu-\nsioni, simboli, riferimenti, né si preoccuperà di rilevare quello che è il suo significato primario: di essere\n\nun indicatore assai preciso di situazioni politiche e culturali”</p></details>", "back": "", "conf": "high", "page": 240, "section": "Esempi · Brano 1", "num": 2, "_i": 8}, {"kind": "question", "src": "images/p240_b4.png", "front": "<img src='images/p240_b4.png' class='cardimg'><p class='q'>Q3. The &quot;historical position&quot; of the stamp refers to:<br>A) its figurative and cultural elements<br>B) the territory for which it is valid<br>C) the duration of its validity<br>D) the issuing authority<br>E) the year of issue<br><br>As shown in two passages: &quot;The type of printing, the typefaces of the text and figures, the image with which the issuing authority presents itself — all of these give the postage stamp a precise historical position&quot;; and &quot;Endowed with such varied and complex characteristics, with a semantic charge so wide and with historical and figurative roots so deep and intricate.&quot; The correct answer is A.</p><details><summary>Answers</summary><p>Answer: A</p></details><details><summary>original (IT)</summary><p class='th-it'>3 La “posizione storica” del francobollo indica:\n©) i suoi elementi figurativi e culturali\n\nil territorio per cui è valido\n\nla durata della sua validità\n\nl&#x27;ente emittente\n\nl&#x27;anno di emissione\n\nCome evidenziato nei due passaggi seguenti, la soluzione è rappresentata dall&#x27;alternativa È: “Il tipo del-\nla stampa, i caratteri delle scritte e delle cifre, l&#x27;immagine con cui l&#x27;autorità emittente si dichiara, sono tutti\ndati da cui il bollo postale deriva una precisa posizione storica”; ‘“Provvisto di connotati così vari e com-\nplessi, di una carica semantica talmente ampia e di radici storiche e figurative tanto profonde e artico-\n\nlate”.</p></details>", "back": "", "conf": "high", "page": 240, "section": "Esempi · Brano 1", "num": 3, "_i": 9}, {"kind": "question", "src": "images/p241_b2.png", "front": "<img src='images/p241_b2.png' class='cardimg'><p class='q'>Q4. A stamp that appears rough and has extremely concise indications signals:<br>A) its origin from the Third World<br>B) its rarity<br>C) its lesser value<br>D) its age<br>E) a social or political crisis<br><br>The relevant passage: &quot;there will always be occasions on which the stamp may appear in forms of extreme conciseness, with indispensable information reduced to a minimum; but even in such cases the type of paper, the generic anonymity of the typefaces, and the roughness of execution will constitute the main stylistic components and distinguishing features, betraying abnormal circumstances of social or political crisis.&quot; The correct answer is E.</p><details><summary>Answers</summary><p>Answer: E</p></details><details><summary>original (IT)</summary><p class='th-it'>4 Un francobollo di aspetto rozzo e con indicazioni estremamente concise indica:\nla provenienza dal Terzo mondo\nla sua rarità\nil suo minor pregio\nla sua antichità\nuna crisi sociale o politica\n\nPer risolvere l&#x27;esercizio occorre fare riferimento al seguente passaggio: “non mancheranno certo occasio-\nni in cui il francobollo (come la carta moneta) potrà presentarsi sotto aspetti di estrema concisione, con\nle indicazioni indispensabili ridotte al minimo; ma anche in casi siffatti (e infrequenti) saranno il tipo della\ncarta, l&#x27;anonimità generica dei caratteri di stampa, la rozzezza dell&#x27;esecuzione a costituire le precipue\ncomponenti di stile e di connotati, denunciando anormali circostanze di crisi sociale o politica”. La solu-\nzione, di conseguenza, è la</p></details>", "back": "", "conf": "high", "page": 241, "section": "Esempi · Brano 1", "num": 4, "_i": 10}, {"kind": "question", "src": "images/p241_b3.png", "front": "<img src='images/p241_b3.png' class='cardimg'><p class='q'>Q5. A special issue:<br>A) has limited validity<br>B) is valid only in certain territories<br>C) is made for commemorative or celebrative purposes<br>D) has philatelic purposes<br>E) serves special correspondence<br><br>The passage states that the stamp communicates &quot;cultural values and connections, which have become progressively more elaborate with the spread of commemorative issues [...] followed by other types celebrating special occasions, events of particular political significance.&quot; The correct answer is C.</p><details><summary>Answers</summary><p>Answer: C</p></details><details><summary>original (IT)</summary><p class='th-it'>5 Una emissione speciale:\nha validità limitata\nvale solo per certi territori\n| è fatta per scopi commemorativi o celebrativi\nha finalità filateliche\nserve per corrispondenze particolari\n\nUn francobollo, riporta il testo, comunica “valori e legami culturali, divenuti via via più articolati con il dif-\nfondersi delle emissioni commemorative [...] seguite poi da altri tipi, celebrativi di speciali occasioni, di\navvenimenti di particolare significato politico”. La soluzione è dunque la {®}.</p></details>", "back": "", "conf": "high", "page": 241, "section": "Esempi · Brano 1", "num": 5, "_i": 11}, {"kind": "passage", "src": "images/p241_b4.png", "front": "<div class='kindlabel'>PASSAGE</div><img src='images/p241_b4.png' class='cardimg'><p class='th-en'>Passage 2 — Based on the information contained in the following passage, answer the questions below.<br><br>The Morellian Method<br><br>Between 1874 and 1876, a series of articles on Italian painting appeared in the Zeitschrift für bildende Kunst. They were signed by an unknown Russian scholar, Ivan Lermolieff; the German translations bore the name of an equally unknown Johannes Schwarze. The articles proposed a new method for the attribution of old paintings, which provoked among art historians both contrasting reactions and lively discussions. Only some years later did the author drop the double mask behind which he had been hiding. He was in fact the Italian Giovanni Morelli (whose surname Schwarze is a German rendering and Lermolieff an anagram, or nearly so). And art historians still routinely speak of the &quot;Morellian method&quot; today.<br><br>Let us briefly consider what this method consisted of. Museums, said Morelli, are full of paintings attributed incorrectly. But restoring each painting to its true author is difficult: one is very often faced with unsigned works, sometimes repainted or in poor condition. In this situation it is essential to be able to distinguish originals from copies. To do this, however (said Morelli), one must not rely, as is usually done, on the most striking and therefore most easily imitated characteristics of pictures — the upturned eyes of Perugino&#x27;s figures, the smile of Leonardo&#x27;s, and so on. One must instead examine the most negligible details, least influenced by the characteristics of the school to which the painter belonged: the ear lobes, the fingernails, the shape of the fingers of the hands and feet. In this way Morelli discovered, and meticulously catalogued, the characteristic ear-shape of Botticelli, that of Cosmè Tura, and so on — traits present in the originals but not in the copies. With this method he proposed dozens of new attributions in some of the principal museums of Europe. Often these were sensational: in a Reclining Venus preserved in the Dresden gallery, which had been taken for a copy by Sassoferrato of a lost painting by Titian, Morelli identified one of the very few works securely autograph to Giorgione.<br><br>Despite these results, Morelli&#x27;s method was strongly criticised, perhaps also because of the almost arrogant confidence with which it was proposed. It was subsequently judged mechanical and crudely positivistic, and fell into discredit. (It is possible, on the other hand, that many scholars who spoke of it condescendingly continued to use it tacitly in their own attributions.) The renewed interest in Morelli&#x27;s work is due to Wind, who saw in it a typical example of the modern attitude towards works of art — an attitude that leads one to savour individual details rather than the work as a whole. In Morelli, according to Wind, there is an exasperated cult of the immediacy of genius, which he absorbed in youth through contact with Romantic circles in Berlin. This is not a very convincing interpretation, given that Morelli was not concerned with aesthetic problems (which is what he was later reproached for) but with preliminary problems of a philological order.<br><br>In reality, the implications of the method proposed by Morelli were different, and far richer. &quot;Morelli&#x27;s books,&quot; writes Wind, &quot;have a rather unusual appearance compared with those of other art historians. They are strewn with illustrations of fingers and ears, meticulous records of those characteristic minutiae that betray the presence of a given artist, as a criminal is betrayed by his fingerprints... any museum studied by Morelli immediately acquires the aspect of a criminal museum...&quot; This comparison was brilliantly developed by Castelnuovo, who linked Morelli&#x27;s circumstantial method to the one attributed at almost the same period to Sherlock Holmes by his creator Arthur Conan Doyle. The art connoisseur is comparable to the detective who discovers the perpetrator of the crime (of the painting) on the basis of clues imperceptible to most. The examples of Holmes&#x27;s acuity in interpreting footprints in the mud, cigarette ash, and so on are, as is well known, innumerable.<br><br>Before considering the implications of this parallel, it will be worth returning to another valuable insight of Wind: &quot;To some of Morelli&#x27;s critics it seemed strange that the dictum &#x27;personality is to be sought where personal effort is least intense&#x27; should be maintained. But on this point modern psychology would certainly side with Morelli: our small unconscious gestures reveal our character more than any formal attitude carefully prepared by us.&quot; &quot;Our small unconscious gestures...&quot;: to the generic expression &quot;modern psychology&quot; we can quite safely substitute the name of Freud. Wind&#x27;s pages on Morelli have in fact drawn scholars&#x27; attention to a long-neglected passage in Freud&#x27;s famous essay The Moses of Michelangelo (1914).<br><br>Freud himself indicated what Morelli&#x27;s method could have represented for him — for the young Freud, still very far from psychoanalysis: the proposal of an interpretive method pivoting on residues, on marginal data, considered as revelatory. In this way, details usually regarded as unimportant, or even trivial and &quot;low,&quot; provided the key to accessing the highest products of the human spirit. &quot;My opponents,&quot; wrote Morelli ironically, &quot;are pleased to describe me as one who is unable to see the spiritual meaning of a work of art and who therefore attaches particular importance to external means, such as the forms of the hand, of the ear, and even — horribile dictu — of such an unpleasant object as the fingernails.&quot; Moreover, these marginal data were, for Morelli, revelatory precisely because they constituted the moments in which the artist&#x27;s control, linked to cultural tradition, relaxed to give way to purely individual traits that &quot;escape him without his being aware of it.&quot; Even more striking than this allusion — not exceptional for the period — to unconscious activity is the identification of the intimate core of artistic individuality with elements withdrawn from the control of consciousness.</p><details><summary>original (IT)</summary><p class='th-it'>Brano 2 In base alle informazioni contenute nel brano seguente, rispondere alle succes-\nsive domande.\n\nIl metodo morelliano\n\nTra il 1874 e il 1876 apparvero sulla «Zeitschrift fùr bildende Kunst» una serie di articoli sulla pittura italiana.\nEssi erano firmati da un ignoto studioso russo, Ivan Lermolieff; a tradurli in tedesco era stato un altrettanto\nignoto Johannes Schwarze. Gli articoli proponevano un nuovo metodo per l&#x27;attribuzione dei quadri antichi,\nche suscitò tra gli storici dell&#x27;arte reazioni contrastanti e vivaci discussioni. Solo alcuni anni dopo l&#x27;autore gettò\nla duplice maschera dietro a cui si era nascosto. Si trattava infatti dell&#x27;italiano Giovanni Morelli (Cognome di cui\nSchwarze è il calco e Lermolieff l&#x27;anagramma, o quasi). E di «metodo morelliano» gli storici dell&#x27;arte parlano\ncorrentemente ancora oggi. Vediamo brevemente in che cosa consisteva questo metodo. | musei, diceva Mo-\nrelli, sono pieni di quadri attribuiti in maniera inesatta. Ma restituire ogni quadro al suo vero autore è difficile:\nmolto spesso ci si trova di fronte a opere non firmate, magari ridipinte o in cattivo stato di conservazione. In\nquesta situazione è indispensabile poter distinguere gli originali dalle copie. Per far questo, però (diceva Mo-\nrelli) non bisogna basarsi, come si fa di solito, sui caratteri più appariscenti, e perciò più facilmente imitabili,\ndei quadri: gli occhi alzati al cielo dei personaggi di Perugino, il sorriso di quelli di Leonardo, e così via. Bisogna\ninvece esaminare i particolari più trascurabili, e meno influenzati dalle caratteristiche della scuola a cui il pit-\ntore apparteneva: i lobi delle orecchie, le unghie, la forma delle dita delle mani e dei piedi. In tal modo Morelli\nscoperse, e scrupolosamente catalogò, la forma di orecchio propria di Botticelli, quella di Cosmé Tura e così\nvia: tratti presenti negli originali ma non nelle copie. Con questo metodo propose decine e decine di nuove\nattribuzioni in alcuni dei principali musei d&#x27;Europa. Spesso si trattava di attribuzioni sensazionali: in una Vene-\nre sdraiata conservata nella galleria di Dresda, che passava per una copia di mano del Sassoferrato di un dipin-\nto perduto di Tiziano, Morelli identificò una delle pochissime opere sicuramente autografe di Giorgione.\nNonostante questi risultati, il metodo di Morelli fu molto criticato, forse anche per la sicurezza quasi arrogante\ncon cui veniva proposto. Successivamente fu giudicato meccanico, grossolanamente positivistico, e cadde in\ndiscredito. (È possibile, d&#x27;altra parte, che molti studiosi che ne parlavano con sufficienza continuassero a ser-\nvirsene tacitamente per le loro attribuzioni). Il rinnovato interesse per i lavori di Morelli è merito del Wind, che\nha visto in essi un esempio tipico dell&#x27;atteggiamento moderno nei confronti dell&#x27;opera d&#x27;arte - atteggiamento\nche porta a gustare i particolari anziché l&#x27;opera complessiva. In Morelli ci sarebbe, secondo Wind, un&#x27;esaspe-\nrazione del culto per l&#x27;immediatezza del genio, da lui assimilato in gioventù, a contatto con i circoli romantici\nberlinesi. È un’interpretazione poco convincente, dato che Morelli non si poneva problemi di ordine estetico\n(ciò che gli venne poi rimproverato) ma problemi preliminari, di ordine filologico. In realtà, le implicazioni del\nmetodo proposto da Morelli erano diverse, e molto più ricche. «I libri di Morelli, - scrive Wind, - hanno un\naspetto piuttosto insolito se paragonati a quelli degli altri storici dell&#x27;arte. Essi sono cosparsi di illustrazioni di\ndita e di orecchie, accurati registri di quelle caratteristiche minuzie che tradiscono la presenza di un dato arti-\nsta, come un criminale viene tradito dalle sue impronte digitali..., qualsiasi museo d&#x27;arte studiato da Morelli\nacquista subito l&#x27;aspetto di un museo criminale...». Questo paragone è stato brillantemente sviluppato da Ca-\nstelnuovo, che ha accostato il metodo indiziario di Morelli a quello che quasi negli stessi anni veniva attribuito\na Sherlock Holmes dal suo creatore, Arthur Conan Doyle. Il conoscitore d&#x27;arte è paragonabile al detective che\nscopre l&#x27;autore del delitto (del quadro) sulla base di indizi impercettibili ai più. Gli esempi della sagacia di Hol-\nmes nell’interpretare orme nella fanghiglia, ceneri di sigaretta e così via sono, com&#x27;è noto, innumerevoli. Ve-\ndremo tra poco le implicazioni di questo parallelismo. Prima però sarà bene riprendere un&#x27;altra preziosa\nintuizione di Wind: «Ad alcuni tra i critici di Morelli sembrava strano il dettame che “la personalità va cercata là\ndove lo sforzo personale è meno intenso”. Ma su questo punto la psicologia moderna sarebbe certamente dal-\nla parte di Morelli: i nostri piccoli gesti inconsapevoli rivelano il nostro carattere più di qualunque atteggia-\nmento formale, da noi accuratamente preparato». “| nostri piccoli gesti inconsapevoli...’: alla generica\nespressione “psicologia moderna” possiamo sostituire senz&#x27;altro il nome di Freud. Le pagine di Wind su Morelli\nhanno infatti attirato l&#x27;attenzione degli studiosi su un passo, rimasto a lungo trascurato, del famoso saggio di\nFreud // Mosè di Michelangelo (1914). Ridurre quest&#x27;influsso, come è stato fatto, al solo saggio sul Mose di Mi-\nchelangelo, o in genere ai saggi su argomenti legati alla storia dell&#x27;arte significa limitare indebitamente la por-\ntata delle parole di Freud: «lo credo che il suo metodo [di Morelli] sia strettamente apparentato con la tecnica\ndella psicoanalisi medica». Ma che cosa poté rappresentare per Freud - per il giovane Freud, ancora lontanis-\nsimo dalla psicoanalisi — la lettura dei saggi di Morelli? È Freud stesso a indicarlo; la proposta di un metodo in-\nterpretativo imperniato sugli scarti, sui dati marginali, considerati come rivelatori. In tal modo, particolari\nconsiderati di solito senza importanza, o addirittura triviali, «bassi», fornivano la chiave per accedere ai prodot-\nti più elevati dello spirito umano; «i miei avversari» scriveva ironicamente Morelli (un&#x27;ironia fatta apposta per\npiacere a Freud) «si compiacciono di qualificarmi per uno il quale non sa vedere il senso spirituale di un&#x27;opera\nd&#x27;arte e per questo dà una particolare importanza a mezzi esteriori, quali le forme della mano, dell&#x27;orecchio, e\npersino, horribile dictu, di così antipatico oggetto qual è quello delle unghie». Inoltre, questi dati marginali era-\nno, per Morelli, rivelatori, perché costituivano i momenti in cui il controllo dell&#x27;artista, legato alla tradizione cul-\nturale, si allentava per cedere il posto a tratti puramente individuali, «che gli sfuggono senza che egli se ne\naccorga». Ancor più dell&#x27;accenno, in quel periodo non eccezionale, a un&#x27;attività inconscia, colpisce l&#x27;identifica-\nzione del nucleo intimo dell&#x27;individualità artistica con gli elementi sottratti al controllo della coscienza.</p></details>", "back": "", "conf": "high", "page": 241, "section": "Esempi · Brano 2", "num": null, "_i": 12}, {"kind": "question", "src": "images/p242_b2.png", "front": "<img src='images/p242_b2.png' class='cardimg'><p class='q'>Q6. Why, according to Morelli, are the &quot;exterior means&quot; the most important for attributing works of art?<br>A) Because they reveal the most individual traits of an artist most clearly<br>B) Because they are the ones an artist pays least attention to<br>C) Because they are the ones no one looks at carefully<br>D) Because they are the most easily imitated<br>E) Because they are the ones most strongly influenced by the typical traits of the painter&#x27;s school<br><br>The question concerns the central argument of the passage — the reason the text was written, the central theme running throughout. It is the small clues, &quot;the most negligible details,&quot; the minor elements of a work of art that, according to Morelli, allow its correct attribution and even reveal part of the artist&#x27;s personality. In the light of this, the correct answer is undoubtedly A.<br><br>Note that although option E is mentioned explicitly in the text, it describes what one should NOT look at (the most imitated characteristics of the school) and does not answer the question posed.</p><details><summary>Answers</summary><p>Answer: A</p></details><details><summary>original (IT)</summary><p class='th-it'>6 Perché, secondo Morelli, i mezzi esteriori sono i più importanti per l&#x27;attribuzione delle\nopere?\n\nPerché sono quelli che dimostrano maggiormente i tratti più individuali di un artista\n| Perché sono quelli a cui un artista dà meno importanza\nPerché sono quelli a cui nessuno guarda con attenzione\n\nPerché sono quelli più facilmente imitabili\n\n* Perché sono quelli su cui agiscono di più i tratti tipici della scuola di appartenenza\n\nLa domanda verte sull&#x27;idea centrale del brano, ovverosia il motivo per cui il brano è stato scritto, iltema\ncentrale che percorre tutto il testo. Sono i piccoli indizi, “i particolari più trascurabili”, gli elementi minori\ndi un&#x27;opera d&#x27;arte che, secondo Morelli, ne permettono la corretta attribuzione e lasciano perfino intra-\nvedere una parte della personalità dell&#x27;artista. Alla luce di ciò, la risposta corretta risulta indubbiamente\nSi noti come, per quanto riportata esplicitamente nel testo, l&#x27;alternativa .:. non risponda alla do-\nmanda posta e non possa quindi essere considerata la risposta cercata.</p></details>", "back": "", "conf": "high", "page": 242, "section": "Esempi · Brano 2", "num": 6, "_i": 13}, {"kind": "question", "src": "images/p243_b2.png", "front": "<img src='images/p243_b2.png' class='cardimg'><p class='q'>Q7. The Morellian method:<br>A) was accepted by art historians because it solved all attribution problems<br>B) was accepted by all art historians only after fierce and violent criticism<br>C) was considered too mechanical and positivistic<br>D) was never convincingly criticised<br>E) was rejected for being too psychoanalytical but rehabilitated after Freud&#x27;s books<br><br>Concerning the method proposed by Morelli for the attribution of works of art, about halfway through the passage one reads: &quot;It was subsequently judged mechanical and crudely positivistic, and fell into discredit.&quot; The correct answer is C.</p><details><summary>Answers</summary><p>Answer: C</p></details><details><summary>original (IT)</summary><p class='th-it'>7 Il metodo morelliano:\n\nfu accettato dagli storici dell&#x27;arte, perché permetteva di risolvere tutti i problemi di attribu-\nzione\n\nfu accettato da tutti gli storici dell&#x27;arte, solo dopo aspre violente critiche\n\nfu considerato troppo meccanicistico e positivistico\n\nnon fu mai criticato in maniera convincente\n\nfu rifiutato perché troppo psicoanalitico, ma fu rivalutato dopo i libri di Freud\n\nA proposito del metodo proposto da Morelli per l&#x27;attribuzione delle opere d&#x27;arte, a metà del brano si leg-\nge che «successivamente fu giudicato meccanico, grossolanamente positivistico, e cadde in discredito»\n(risposta corretta. ).</p></details>", "back": "", "conf": "high", "page": 243, "section": "Esempi · Brano 2", "num": 7, "_i": 14}, {"kind": "question", "src": "images/p243_b3.png", "front": "<img src='images/p243_b3.png' class='cardimg'><p class='q'>Q8. The Morellian method for attributing works of art is based on:<br>A) checking for the presence of an artist&#x27;s most imitated elements<br>B) checking for the presence of an artist&#x27;s most recognisable elements<br>C) checking the most negligible elements, which are those most influenced by the stylistic traits of a school<br>D) checking secondary details, least influenced by the stylistic traits of a school or artist<br>E) checking the elements to which the artist devotes the greatest attention and which best reveal their style<br><br>The passage states that &quot;one must instead examine the most negligible details, least influenced by the characteristics of the school to which the painter belonged.&quot; The correct answer is D.</p><details><summary>Answers</summary><p>Answer: D</p></details><details><summary>original (IT)</summary><p class='th-it'>8 Il metodo morelliano per l&#x27;attribuzione delle opere d’arte si basa:\n\nsul riscontro della presenza degli elementi più imitati di un artista\nsul riscontro della presenza degli elementi noti di un artista\n\nsul riscontro degli elementi più trascurabili, che sono quelli più influenzati dagli stilemi di\nscuola\n\nsul riscontro dei dettagli secondari, meno influenzati dagli stilemi di una scuola o di un artista\n\nsul riscontro degli elementi dove maggiore è l&#x27;attenzione dell&#x27;artista e che meglio dimo-\nstrano il suo stile\n\nAnche a questa domanda è facile rispondere correttamente a partire dalle affermazioni contenute nel\n\nbrano, laddove si legge che “bisogna invece esaminare i particolari più trascurabili, e meno influenzati\n. . &lt; . ”&quot; .\n\ndalle caratteristiche della scuola a cui il pittore apparteneva (risposta corretta .:.).</p></details>", "back": "", "conf": "high", "page": 243, "section": "Esempi · Brano 2", "num": 8, "_i": 15}, {"kind": "question", "src": "images/p243_b4.png", "front": "<img src='images/p243_b4.png' class='cardimg'><p class='q'>Q9. The Morellian method reveals an attitude towards the work of art:<br>A) of a Romantic type<br>B) consistent with modern sensibilities<br>C) based solely on the psychology of the artist<br>D) of an aesthetic type<br>E) treating the work as an autonomous entity unrelated to the rest of an artist&#x27;s output<br><br>According to Wind, Morelli adopts, in the examination of a work of art, an attitude consistent with modern psychology — according to which our small everyday gestures are profoundly revealing of an individual&#x27;s real personality. The correct answer is therefore B.</p><details><summary>Answers</summary><p>Answer: B</p></details><details><summary>original (IT)</summary><p class='th-it'>9 Il metodo morelliano dimostra un atteggiamento davanti all&#x27;opera d’arte:\ndi tipo romantico\ncoerente con le moderne sensibilità\nbasato solo sulla psicologia dell&#x27;artista\ndi tipo estetico\n\nconsiderata come entità autonoma che non ha relazioni con le restanti opere di un artista\n\nMorelli, secondo quanto riportato da Wind, adotta, nella disanima di un&#x27;opera d&#x27;arte, un atteggiamento\ncoerente con la psicologia moderna secondo la quale i piccoli gesti quotidiani sono profondamente rile-\nvatori della reale personalità dell&#x27;individuo; corretta è pertanto l&#x27;alternativa</p></details>", "back": "", "conf": "high", "page": 243, "section": "Esempi · Brano 2", "num": 9, "_i": 16}, {"kind": "question", "src": "images/p243_b5.png", "front": "<img src='images/p243_b5.png' class='cardimg'><p class='q'>Q10. What is the most striking characteristic of Morelli&#x27;s books?<br>A) They are catalogues of the most easily imitable details of an artist<br>B) They are catalogues of the most striking stylistic details of an artist<br>C) They are catalogues of details useful to writers of detective fiction<br>D) They are works of medical psychoanalysis rather than art history<br>E) They are catalogues of the most negligible details of an artist<br><br>Wind writes that &quot;Morelli&#x27;s books have a rather unusual appearance compared with those of other art historians. They are strewn with illustrations of fingers and ears, meticulous records of those characteristic minutiae that betray the presence of a given artist.&quot; In other words, Morelli&#x27;s books are, as stated by option E, catalogues of the minor details of an artist. The correct answer is E.</p><details><summary>Answers</summary><p>Answer: E</p></details><details><summary>original (IT)</summary><p class='th-it'>10 Qual è la caratteristica più evidente dei libri di Morelli?\n\nSono cataloghi dei particolari più facilmente imitabili di un artista\nSono cataloghi dei particolari più appariscenti dello stile di un artista\nSono cataloghi di particolari utili agli scrittori di romanzi gialli\n\nSono libri di psicanalisi medica più che di storia dell&#x27;arte\n\nSono cataloghi dei particolari più trascurabili di un artista\n\nWind scrive che ‘I libri di Morellli [...] hanno un aspetto piuttosto insolito se paragonati a quelli degli altri\nstorici dell&#x27;arte. Essi sono cosparsi di illustrazioni di dita e di orecchie, accurati registri di quelle caratteri-\nstiche minuzie che tradiscono la presenza di un dato artista”. In altre parole i libri di Morelli sono, così co-\nme sostenuto dall&#x27;alternativa -, dei cataloghi dei particolari minori di un artista.</p></details>", "back": "", "conf": "high", "page": 243, "section": "Esempi · Brano 2", "num": 10, "_i": 17}, {"kind": "passage", "src": "images/p244_b2.png", "front": "<div class='kindlabel'>PASSAGE</div><img src='images/p244_b2.png' class='cardimg'><p class='th-en'>Passage 3 — Based on the information contained in the following passage, answer the questions below.<br><br>Bramante and his collaborators — Peruzzi, Antonio da Sangallo, Raphael — designed the new monuments of Christian Rome according to the same gigantic scale as the ancient monuments: the new St Peter&#x27;s, a vast temple on a central plan crowned by a dome as large as the Pantheon; the new Vatican Palace, which was to have presented to the city a colossal façade of loggias, like the Septizonium (a fragment of this façade is the loggia arcade of the Courtyard of San Damaso); the terraced courtyard connecting the Vatican Palace to the Villa del Belvedere, more than 300 metres long and organised as a single perspectival space.<br><br>The modest, tangled fabric of the medieval city was cut without hesitation to make way for new straight streets and new regular buildings (here, as in Ferrara, one can appreciate the contrast between the medieval and the modern city; but the medieval fabric is destroyed, with new regular grids superimposed on the old, irregular ones). Near the banks of the Tiber two straight roads were opened: Via della Lungara and Via Giulia (where Bramante began to build the immense Palazzo dei Tribunali); at the edge of the built-up area the Roman straight line of the Corso was restored, and a new system of three straight roads was designed (the Corso, Via Ripetta, and Via del Babuino), converging at Porta del Popolo where one enters the city from the north.<br><br>This ambitious programme was modified and interrupted by decisive events — political, religious, and cultural — in the first decades of the sixteenth century. In 1513 Julius II died, and in 1514 Bramante. The new pope, Leo X of the Medici family, divided his interests between Rome and Florence; Roman cultural life was dominated by Raphael, who directed a vast organisation of executors and simultaneously carried out many different tasks: he oversaw urban and building works, supervised the discovery and documentation of ancient monuments, painted pictures, designed theatrical performances, and — appointed by Leo X as Superintendent of Roman Antiquities — worked to prevent the systematic looting of ancient buildings.<br><br>Raphael&#x27;s working method, which required simultaneous commitment on many fronts, contrasted with the individualism of the most important artists and writers of the time: Michelangelo, Ariosto, Machiavelli worked each alone, with an almost absolute personal autonomy. Raphael&#x27;s method, moreover, was not transmitted to later artistic culture: in the second half of the sixteenth century, the tradition of the great workshop organisation, which in Raphael&#x27;s hands had governed Rome&#x27;s artistic life, lost ground. After the Sack of Rome in 1527, which violently interrupted the programme of renovations, artistic life no longer recovered the character of a vast, co-ordinated urban enterprise.</p><details><summary>original (IT)</summary><p class='th-it'>Brano 3 In base alle informazioni contenute nel brano seguente, rispondere alle succes-\nsive domande.\n\nBramante e i suoi collaboratori — Peruzzi, Antonio da Sangallo, Raffaello - progettano i nuovi monumenti\ndella Roma cristiana secondo la stessa misura gigantesca dei monumenti antichi: il nuovo San Pietro, che\nè un enorme tempio a pianta centrale, coronato da una cupola grande come il Pantheon, il nuovo palazzo\nVaticano, che avrebbe dovuto presentare verso la città una facciata colossale a logge, come il Settizonio\n(un frammento di questa facciata è il loggiato del cortile di S. Damaso); il cortile a gradoni per collegare\nil palazzo Vaticano con la villa del Belvedere, lungo più di 300 metri e organizzato come un unico ambien-\nte prospettico.\nIl tessuto umile e aggrovigliato della città medioevale è tagliato senza esitazione per far posto a nuove\nstrade rettilinee e a nuovi edifici regolari (anche qui come a Ferrara si valuta il contrasto tra la città me-\ndioevale e la città moderna; ma si distrugge il tessuto medioevale, sovrapponendo i nuovi tracciati rego-\nlari a quelli antichi irregolari). Presso le rive del Tevere si aprono due strade diritte: via della Lungara e via\nGiulia (dove Bramante comincia a costruire l&#x27;immenso palazzo dei Tribunali); ai limiti dell&#x27;abitato si ripri-\nstina il rettifilo romano del Corso, e si progetta un nuovo sistema di tre strade rettilinee (il Corso, via Ri-\npetta e via del Babuino), che convergono a porta del Popolo dove si entra in città da nord.\nQuesto ambizioso programma è modificato e interrotto dagli avvenimenti decisivi — politici, religiosi e\nculturali - dei primi decenni del ‘500. Nel 1513 muore Giulio Il e nel 1514 Bramante. Il nuovo papa Leone\nX, della famiglia Medici, divide i suoi interessi tra Roma e Firenze; la vita culturale romana è dominata da\nRaffaello, che dirige una vasta organizzazione di esecutori e svolge contemporaneamente molti compiti\ndiversi: segue i lavori urbanistici e edilizi, sorveglia il ritrovamento delle opere d&#x27;arte e delle iscrizioni an-\ntiche, esegue pitture e decorazioni, allestisce spettacoli teatrali, fornisce i modelli di scrittura alla cancel-\nleria papale.\nQuesto metodo di lavoro collettivo - contrastante con l&#x27;individualismo dei più importanti artisti e scrittori\ndel tempo - sembra adatto a realizzare finalmente uno stile moderno coerente e trasmissibile. Ma nel\n1520 Raffaello muore a trentasette anni e nello stesso periodo cambia bruscamente l&#x27;equilibrio politico\ne culturale: nel 1519 Carlo V è eletto imperatore; nel 1520 la scomunica di Lutero rende inevitabile lo sci-\nsma protestante; nel 1521 muore Leone X e i suoi successori devono ormai difendere l&#x27;indipendenza di\nRoma dalla crescente potenza imperiale. Nel 1527 Roma e il Vaticano sono occupati da un esercito pro-\ntestante agli ordini di Carlo V, che saccheggia la città come al tempo dei barbari.\n11 Il progetto di Bramante:\n\n©. prevedeva una coesistenza armonica tra città medioevale e città moderna\n\n{=} preferiva i tracciati rettilinei a quelli irregolari\n{®&amp; prevedeva la costruzione del Palazzo dei Tribunali lungo il rettifilo romano del Corso\n:®) prevedeva un sistema di tre strade rettilinee situate a sud di Roma\nnessuna delle precedenti\n\nIl secondo paragrafo del brano consente di scartare la risposta .. (se la città moderna “distrugge” il tes-\nsuto medioevale, non c&#x27;è assolutamente coesistenza armonica tra i due elementi). La risposta | -. è invece\nconcorde con quanto affermato all&#x27;inizio del secondo paragrafo ed è dunque la soluzione del quesito.\nD&#x27;altro canto, le risposte &gt; e». si escludono facilmente, visto che il Palazzo dei Tribunali viene costruito\nlungo le rive del Tevere e non lungo il rettifilo romano del Corso, e il sistema di tre strade rettilinee citato\n12\n\nce\n\nvenne portato a termine nei primi due decenni del 1500\n\nsi contrapponeva alle caratteristiche di monumenti antichi come il Pantheon\nsubì diverse modifiche in rapporto agli avvenimenti politici e religiosi\n\n{®) lascia intatto il tessuto della città medioevale\n\n{2 nessuna delle precedenti alternative è corretta\nIl terzo paragrafo del brano consente di escludere la risposta #. e di individuare nella î®ì la risposta esatta\nal quesito. In esso si afferma infatti che il programma del Bramante fu interrotto e modificato da decisivi\navvenimenti politici, religiosi e culturali dei primi decenni del ‘500. La risposta {=} si scarta facilmente per-\nché il brano inizia affermando che Bramante progetta i nuovi monumenti di Roma secondo la stessa mi-\nsura di quelli antichi come il Pantheon e la Î*} è da escludere perché il programma prevedeva che il tes-\nsuto della città medievale fosse “tagliato senza esitazione per far posto a nuove strade rettilinee e a nuovi\nedifici regolari”.</p></details>", "back": "", "conf": "high", "page": 244, "section": "Esempi · Brano 3", "num": null, "_i": 18}, {"kind": "question", "src": "images/p245_b4.png", "front": "<img src='images/p245_b4.png' class='cardimg'><p class='q'>Q13. The realisation of Bramante&#x27;s project was obstructed:<br>A) by the artist&#x27;s death<br>B) by the election of Charles V as emperor<br>C) by the death of Leo X<br>D) by Luther&#x27;s excommunication and the Protestant schism<br>E) by all the events mentioned in the preceding answers<br><br>The author mentions, among the decisive events that interrupted and modified the realisation of Bramante&#x27;s project, options A, B, C, and D. The correct answer is therefore E.</p><details><summary>Answers</summary><p>Answer: E</p></details><details><summary>original (IT)</summary><p class='th-it'>13 La realizzazione del progetto di Bramante viene ostacolata:\n©. dalla morte dell&#x27;artista\n-} dall’elezione di Carlo V a imperatore\n{® dalla morte di Leone X\n{) dalla scomunica di Lutero e dallo scisma protestante\nÈ da tutti gli eventi citati nelle precedenti risposte\n\nL&#x27;autore menziona, tra gli avvenimenti decisivi che hanno interrotto e modificato la realizzazione del pro-\ngetto del Bramante, le alternative ©}, ©}, {8 e 3}. L&#x27;alternativa corretta è dunque la 8.</p></details>", "back": "", "conf": "high", "page": 245, "section": "Esempi · Brano 3", "num": 13, "_i": 19}, {"kind": "question", "src": "images/p245_b5.png", "front": "<img src='images/p245_b5.png' class='cardimg'><p class='q'>Q14. Raphael&#x27;s working method:<br>A) was in harmony with the individualism of other important cultural figures of his time<br>B) succeeded in being transmitted and diffused in the second half of the sixteenth century<br>C) involved simultaneously undertaking several tasks in different cultural spheres<br>D) was inspired by Bramante&#x27;s organisational meticulousness<br>E) was characterised by little attention to completion timescales</p><details><summary>Answers</summary><p class='q'>The correct answer is C. When the author speaks of Raphael (about halfway through the third paragraph), he states that Raphael &quot;simultaneously carried out many different tasks, in the spheres of urban planning, works of art, theatrical performances, etc.&quot; This working method, the author adds a little further on, contrasted with the individualism of the most important artists and writers of the time: answer A is therefore clearly wrong, while the claims proposed by options B and D are not contained in the passage.</p></details><details><summary>original (IT)</summary><p class='th-it'>14 Il metodo di lavoro di Raffaello:\nera in sintonia con l’individualismo di altri importanti uomini di cultura del suo tempo\nebbe modo di essere trasmesso e diffuso nella seconda metà del ‘500\nprevedeva di seguire contemporaneamente più compiti in diversi ambiti culturali\nsi ispira alla meticolosità organizzativa di Bramante\nsi caratterizzava per una scarsa attenzione ai tempi di realizzazione\n\nLa risposta esatta è la {*. Infatti quando l&#x27;autore parla di Raffaello (a metà circa del terzo paragrafo) affer-\nma che egli svolgeva contemporaneamente molti compiti diversi, nell&#x27;ambito dell&#x27;urbanistica, delle ope-\nre d&#x27;arte, del teatro ecc. Questo metodo di lavoro, aggiunge poco più avanti l&#x27;autore, era contrastante con\nl&#x27;individualismo dei più importanti artisti e scrittori del tempo: la risposta £} è dunque evidentemente\nerrata mentre le affermazioni proposte dalle alternative {:} e (+) non sono contenute nel brano.</p></details>", "back": "", "conf": "high", "page": 245, "section": "Esempi · Brano 3", "num": 14, "_i": 20}, {"kind": "question", "src": "images/p245_b6.png", "front": "<img src='images/p245_b6.png' class='cardimg'><p class='q'>Q15. The courtyard connecting the Vatican Palace to the Villa del Belvedere:<br>A) is situated to the north of Rome<br>B) is organised according to several perspectives<br>C) is at least three hundred metres long<br>D) is situated near the banks of the Tiber<br>E) is a creation of Raphael<br><br>At the end of the first paragraph of the passage, it is stated that the courtyard is more than 300 metres long — information equivalent to that given by option C, which is therefore the correct answer.</p><details><summary>Answers</summary><p>Answer: C</p></details><details><summary>original (IT)</summary><p class='th-it'>15 Il cortile che collega il Palazzo del Vaticano con la Villa del Belvedere è:\n©.) situato a nord di Roma\n\n:) organizzato secondo più prospettive\n\nlungo almeno trecento metri\n\n*) situato vicino alle rive del Tevere\n\nuna creazione di Raffaello\n\nAlla fine del primo paragrafo del brano, si dice che il cortile è lungo oltre 300 metri, informazione equiva-\nlente a quella fornita dalla risposta (*&amp;, che è pertanto l&#x27;alternativa corretta.</p></details>", "back": "", "conf": "high", "page": 245, "section": "Esempi · Brano 3", "num": 15, "_i": 21}, {"kind": "passage", "src": "images/p245_b7.png", "front": "<div class='kindlabel'>PASSAGE</div><img src='images/p245_b7.png' class='cardimg'><p class='th-en'>Passage 4 — Based on the information contained in the following passage, answer the questions below.<br><br>Most human impulses can be divided into two classes: those that are possessive and those that are constructive or creative. Social institutions are the embodiments or personifications of impulses and can be classified approximately according to the impulses they represent. Property is the direct expression of possession; science and art are among the most direct e
