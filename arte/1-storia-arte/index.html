ed sure virtuosity in landscape views, lively interior scenes, and small pictures of childhood. In these one can find a light touch and a discreet sensuality. Among Fragonard&#x27;s works are: The Reader (date uncertain), Washington, National Gallery, and The Washerwomen (1756-57), Amiens, Musée de Picardie.<br><br>William Hogarth (English artist, 1697-1764)<br><br>Working from an unusual selection of subjects (portraits of servants, of the middle class individually or in groups), he was not content with traditional compositions in his paintings, achieving a remarkable expressive force and realistic effectiveness that partly anticipate later nineteenth-century solutions.<br><br>Among his works, particularly indicative is Marriage à la Mode, a painting in several scenes (1743-45), London, National Gallery.<br><br>Giambattista Tiepolo (1696-1770)<br><br>The space of Tiepolo&#x27;s compositions is a space of light, often projected into infinity, beyond the architecture, which was painted by his collaborator G.M. Colonna with magical illusionism and confident mastery of perspective. On the walls of palaces and the vaults of churches, Tiepolo brings to life luminous fantasies; his transparent skies and cool tones (in which lilac, pink and bluish hues predominate) constitute unmistakable features of his painting. With Tiepolo, Italian Rococo can be said to have come to an end.<br><br>Among the Venetian painter&#x27;s most striking works are the Frescoes of the Archbishop&#x27;s Palace of Udine (1726-28); the Frescoes of the Salone delle Feste (1747-50), Venice, Palazzo Labia; the Frescoes of the Würzburg Residence (1751-53).<br><br>Canaletto (1697-1768)<br><br>Antonio Canal, known as Canaletto, represents an exceptional case in the figurative culture of the eighteenth century: he did not invent the genre of the view painting (veduta), but recreated it, surpassing his contemporaries. His views of his native city (Venice) are rendered with a rigorous, almost photographic perspective; he orders the Venetian spectacle of canals and palaces, to which the luminous setting lends a tone of soft poetry. The chiaroscuro contrasts, which mark the succession of planes, and the numerous small figures, animate the composition and faithfully render the scale of the buildings. Among the most important works to note are the Church of the Carità from the Marble Workshop of San Vidal (1727-1728), various views of the Grand Canal: the Grand Canal toward the Rialto, the Grand Canal seen from Campo San Vio, the Grand Canal from Palazzo Corner Spinelli toward the Rialto, the Riva degli Schiavoni from the Bacino di San Marco, the Bacino di San Marco with the Bucintoro.</p><details><summary>original (IT)</summary><p class='th-it'>Jean-Antoine Watteau (artista francese, 1684-1721)\n\nNei suoi quadri una luce calda e sapiente dà vita a un realismo analitico, attento ai particolari minuti. Sce-\nne di feste galanti, calate in atmosfere trasognate e leggere, lasciano però trapelare talvolta un&#x27;inquietu-\ndine e una profondità esistenziali che faranno di Watteau un pittore caro ai romantici.\n\nTra le opere si segnalano la Conversazione all&#x27;aperto (1716-19), Dresda; l&#x27;Imbarco per Citera (1717-18), Ber-\nlino, Castello di Charlottenburg.\n\nJean-Honoré Fragonard (artista francese, 1732-1806)\n\nEsponente di spicco del Rococò al tramonto, diede prova di sicuro virtuosismo in vedute paesaggistiche,\nscene movimentate di interni, quadretti dell&#x27;infanzia. Vi si può riscontrare un tocco lieve e una sensualità\ndiscreta. Tra le opere di Fragonard si ricordano: la Lettrice (data incerta), Washington, National Gallery e le\nLavandaie (1756-57), Amiens, Musée de Picardie.\n\nWilliam Hogarth (artista inglese, 1697-1764)\n\nMuovendo da un&#x27;insolita selezione di soggetti (ritratti di servitori, borghesi singoli o a gruppi), nei suoi\nquadri non si accontenta della tradizionalità d&#x27;impianto, ottenendo una notevole forza espressiva e un&#x27;ef-\nficacia realistica che in parte precorrono più tarde soluzioni ottocentesche.\n\nTra le sue opere, particolarmente indicativa è il Mariage à la mode, quadro in più scene (1743-45), Londra,\nNational Gallery.\n\nGiambattista Tiepolo (1696-1770)\n\nLo spazio delle composizioni di Tiepolo è uno spazio di luce, spesso proiettato all&#x27;infinito, al di là delle ar-\nchitetture, dipinte dal suo collaboratore G.M. Colonna con magico illusionismo e sicuro dominio della\nprospettiva. Sulle pareti dei palazzi e sulle volte delle chiese, Tiepolo dà vita a fantasie luminose, i suoi\ncieli trasparenti e le tonalità fredde (dove predominano i lilla, i rosa e i bluastri) costituiscono altrettanti\ncaratteri inconfondibili della sua pittura. Con Tiepolo può dirsi concluso il Rococò italiano.\n\nTra i quadri più suggestivi del pittore veneto figurano gli Affreschi dell&#x27;Arcivescovado di Udine (1726-28); gli\nAffreschi del Salone delle feste (1747-50), Venezia, Palazzo Labia; gli Affreschi del palazzo di Wurzburg (1751-53).\n\nCanaletto (1697-1768)\n\nAntonio Canal detto Canaletto rappresenta un caso eccezionale nella cultura figurativa del Settecento:\nnon inventa il genere della veduta, ma lo ricrea, superando i suoi contemporanei. Le sue vedute della città\nnatale (Venezia) sono rappresentate con una prospettiva rigorosa, quasi fotografica, ordina lo spettacolo\nveneziano dei canali e dei palazzi, cui l&#x27;ambientazione luminosa conferisce un tono di poesia soffusa. |\ncontrasti chiaroscurali, che segnano la successione dei piani, e le numerose piccole figure, animano la\ncomposizione e rendono fedelmente la dimensione degli edifici. Tra le opere più importanti si devono\nsegnalare Chiesa della Carità dal laboratorio dei marmi di San Vidal (1727-1728), varie vedute del canal\nGrande: Canal Grande verso Rialto, Canal grande visto da campo San Vio, Canal Grande da Palazzo Corner\nSpinelli verso Rialto, Riva degli Schiavoni dal bacino di San Marco, Il Bacino di San Marco con il Bucintoro.</p></details>", "back": "", "conf": "low", "page": 43, "section": "", "num": null, "_i": 50}, {"kind": "artwork", "src": "images/page43_img1.png", "front": "<img src='images/page43_img1.png' class='cardimg'><p class='q'>Which artwork is this? (artist / title / year)</p><details><summary>Answers</summary><p class='q'>Tiepolo: Triumph of Zephyr and Flora (1746-1747), Venice, Palazzo Labia, fresco.</p></details>", "back": "", "conf": "med", "page": 43, "section": "", "num": null, "_i": 51}, {"kind": "artwork", "src": "images/page43_img2.png", "front": "<img src='images/page43_img2.png' class='cardimg'><p class='q'>Which artwork is this? (artist / title / year)</p><details><summary>Answers</summary><p class='q'>Canaletto: Riva degli Schiavoni from the Bacino di San Marco (1740), Toledo, Museum of Art, oil on canvas, 46 x 63 cm.</p></details>", "back": "", "conf": "med", "page": 43, "section": "", "num": null, "_i": 52}, {"kind": "theory", "src": null, "front": "<div class='kindlabel'>THEORY</div><p class='th-en'>1.5.2 | Neoclassicism<br><br>With Neoclassicism (c. 1750-1815) there is a radical change in the conception and evaluation of ancient art. It is no longer freely interpreted (as had happened from the Renaissance onward), but becomes the object of erudite theorization and rigorous archaeological reconstruction.<br><br>In classical antiquity, people began to identify a perfection that was not only aesthetic but also ethical and civic in character, whose foundation was seen in the rationality of the ancients.<br><br>Precisely because of this reference to rationality as a supreme value, it is possible to establish a connection between Neoclassicism and the Enlightenment (which is, essentially, trust in the application of human reason to the various aspects of life, individual and social, in place of the previous subjection to metaphysical or religious systems). The compositional structure is worked out with greater rigor. Painting is no longer assigned metaphysical purposes or the celebration of sacred and religious content: now it is the historical event that is given prominence.<br><br>Jacques-Louis David (French artist, 1748-1825)<br><br>The greatest exponent of Neoclassicism, David conceives of the Greek model as an indication not only formal but also of content. That is, he wants to grasp in it, beyond the aesthetic aspect (beauty and harmony), also and above all strength and rigor, as essential moral components. He further maintains that, in the absence of examples of ancient painting, Neoclassical painters must take classical sculpture as their model.<br><br>Among his paintings are recalled: The Oath of the Horatii (1784), Paris, Louvre; the Portrait of Lavoisier and His Wife (1788), New York, Rockefeller Institute for Medical Research; The Lictors Bring Brutus the Bodies of His Sons (1789), Paris, Louvre; The Death of Marat (1793), Brussels, Musées Royaux des Beaux-Arts; The Intervention of the Sabine Women (1799), Paris, Louvre.<br><br>Francisco Goya y Lucientes (Spanish artist, 1746-1828)<br><br>In capturing and depicting both the most sinister and the most frivolous traits of the society of his time, Goya shows himself to be a profoundly Enlightenment figure: in paintings depicting scenes of torment and witchlike madness he relentlessly denounces the world of stupidity, wickedness and fanaticism. His female portraits, such as the Maja Desnuda and the Maja Vestida, appear instead as sweet evocations of a dreamlike beauty. His paintings are all marked by great freedom and creative boldness, in rejection of any academic model. This makes him a precursor of countless later artistic experiences.<br><br>Among the Spanish artist&#x27;s masterpieces are: The Family of Charles IV (1800-01), Madrid, Prado; The Devil&#x27;s Lamp, from the Witches series (1797-98), London, National Gallery; The Maja Desnuda (c. 1805), The Maja Vestida (c. 1805), the Witches&#x27; Sabbath, the Black Paintings (1821-23), The Third of May 1808 (1814), Madrid, Prado; The Disasters of War (c. 1810), Madrid, Calcografía Nacional.</p><details><summary>original (IT)</summary><p class='th-it'>1.5.2 | Il Neoclassicismo\n\nCon il Neoclassicismo (1750 ca.-1815) si assiste a un radicale mutamento nella concezione e valutazione\ndell’arte antica. Essa non viene più liberamente interpretata (com&#x27;era avvenuto dal Rinascimento in poi),\nma diviene oggetto di teorizzazione erudita e di una rigorosa ricostruzione archeologica.\n\nNella classicità si incomincia a individuare una perfezione di carattere non solo estetico, ma anche etico\ne civile, al cui fondamento si individua la razionalità degli antichi.\n\nProprio per questo riferimento alla razionalità come valore supremo, è possibile stabilire un collegamen-\nto tra Neoclassicismo e Illuminismo (che è, essenzialmente, la fiducia nell&#x27;applicazione della ragione uma-\nna ai vari aspetti della vita, individuale e sociale al posto della precedente sudditanza nei confronti dei\nsistemi metafisici o religiosi). L&#x27;impianto compositivo viene messo a punto con maggiore rigore. Alla pit-\ntura non vengono più assegnate finalità metafisiche o di celebrazione di contenuti sacri e religiosi: ora è\nl&#x27;evento storico a essere posto in rilievo.\n\nJacques-Louis David (artista francese, 1748-1825)\n\nMassimo esponente del Neoclassicismo, David concepisce il modello greco come una indicazione non\nsoltanto formale, ma anche contenutistica. Vuole cogliervi cioè, oltre all&#x27;aspetto estetico (la bellezza e\nl&#x27;armonia), anche e soprattutto la forza e il rigore, quali imprescindibili componenti morali. Egli sostiene\ninoltre che, in mancanza di esempi di pittura antica, i pittori neoclassici devono prendere a modello la\nscultura classica.\n\nTra i suoi quadri si ricordano: // giuramento degli Orazi (1784), Parigi, Louvre; il Ritratto di Lavoisier e della\nmoglie (1788), New York, Rockefeller Institute for Medical Research; /littori portano a Bruto le salme dei figli\n(1789), Parigi, Louvre; La morte di Marat (1793), Bruxelles, Musées Royaux des Beaux-Arts; Le Sabine inter-\nrompono il combattimento tra Romani e Sabini (1799), Parigi, Louvre.\n\nFrancisco Goya y Lucientes (artista spagnolo, 1746-1828)\n\nNel cogliere e rappresentare sia i caratteri più biechi sia quelli più fatui della società del suo tempo, Goya\nsi dimostra profondamente illuminista: nei quadri con scene di supplizi e di follie stregonesche denuncia\nimplacabilmente il mondo della stupidità, della malvagità, del fanatismo. | suoi ritratti femminili come la\nMaja desnuda e la Maja vestida appaiono invece come dolci evocazioni di una bellezza onirica. | suoi di-\npinti sono tutti improntati a una grande libertà e spregiudicatezza creativa, nel rifiuto di ogni modello ac-\ncademico. Ciò fa di lui un precursore di innumerevoli esperienze artistiche.\n\nTra i capolavori dell&#x27;artista spagnolo vanno citati: La famiglia di Carlos IV (1800-01), Madrid, Prado; La lam-\npada del diavolo, dalle Stregonerie (1797-98), Londra, National Gallery; La Maja desnuda (1805 ca.), La Maja\nvestida (1805 ca.), il Sabba, le Pitture nere (1821-23), Fucilazioni del 3 maggio 1808 (1814), Madrid, Prado; i\nDisastri della guerra (1810 ca.), Madrid, Calcografia Nacional.</p></details>", "back": "", "conf": "low", "page": 44, "section": "", "num": null, "_i": 53}, {"kind": "artwork", "src": "images/page44_img1.png", "front": "<img src='images/page44_img1.png' class='cardimg'><p class='q'>Which artwork is this? (artist / title / year)</p><details><summary>Answers</summary><p class='q'>Witches&#x27; Sabbath (1821-1823), Madrid, Prado Museum, oil on plaster, transferred to canvas, 140 x 438 cm.</p></details>", "back": "", "conf": "med", "page": 44, "section": "", "num": null, "_i": 54}, {"kind": "theory", "src": null, "front": "<div class='kindlabel'>THEORY</div><p class='th-en'>Antonio Canova (1757-1822)<br><br>He is one of the greatest Neoclassical sculptors, official sculptor to Napoleon and other European rulers of his time. In works of absolute smoothness, whose constitutive elements stand in harmonious relation to one another, Canova created figures inspired by a classical ideal of beauty, meant to evoke a clear moral sentiment. Among his works are recalled Cupid and Psyche (1793), the group of the Three Graces (c. 1815), Pauline Bonaparte Borghese as Venus Victrix (1804-08) and Hebe (1817).</p><details><summary>original (IT)</summary><p class='th-it'>Antonio Canova (1757-1822)\n\nÈ uno dei maggiori scultori neoclassici, statuario ufficiale di Napoleone e di altri regnanti europei\ndell&#x27;epoca. In opere di levigatezza assoluta, i cui elementi costituivi si pongono in armonioso rapporto tra\nloro, Canova ha elaborato figure ispirate a un ideale bellezza classica, che vogliono suscitare un nitido\nsentimento morale. Delle sue opere si ricordano Amore e Psiche (1793), il gruppo delle Grazie (1815 ca.),\nla Paolina Bonaparte Borghese come Venere vincitrice (1804-08) e Ebe (1817).</p></details>", "back": "", "conf": "low", "page": 45, "section": "", "num": null, "_i": 55}, {"kind": "artwork", "src": "images/page45_img1.png", "front": "<img src='images/page45_img1.png' class='cardimg'><p class='q'>Which artwork is this? (artist / title / year)</p><details><summary>Answers</summary><p class='q'>Cupid and Psyche (1793), Paris, Louvre Museum, white marble sculpture, height 155 cm.</p></details>", "back": "", "conf": "med", "page": 45, "section": "", "num": null, "_i": 56}, {"kind": "question", "src": "images/page45_img2.png", "front": "<img src='images/page45_img2.png' class='cardimg'><p class='q'>The Rococo style prevailed mainly in:<br><br>A) interior decoration and the minor arts<br>B) portraiture<br>C) history painting<br>D) civil architecture<br>E) sacred architecture</p><details><summary>Answers</summary><p class='q'>The correct answer is A. In the Rococo era, both official and religious architecture, given their need for imposing solemnity, remained anchored to classical or late-Baroque models.</p></details><details><summary>original (IT)</summary><p class='th-it'>Lo stile rococò si impone soprattutto: € nell&#x27;architettura sacra\nA) nella decorazione degli interni e nelle arti minori\nB) nella ritrattistica\nC) nei quadri d&#x27;argomento storico\nD) 3 nell&#x27;architettura civile\n\nLa risposta esatta è la (3). Nell&#x27;epoca rococò l&#x27;architettura ufficiale e quella religiosa, con la loro esigenza di imponente solennità, rimasero ancorate agli schemi classici o tardo-barocchi.</p></details>", "back": "", "conf": "low", "page": 45, "section": "", "num": "1", "_i": 57}, {"kind": "question", "src": null, "front": "<p class='q'>The Veiled Christ is a marble sculpture by:<br><br>A) Gian Lorenzo Bernini<br>B) Giovanni C... (name illegible in the source)<br>C) Giuseppe Sanmartino<br>D) Michelangelo<br>E) Antonio C... (name illegible in the source)</p><details><summary>Answers</summary><p class='q'>The correct answer is C: Giuseppe Sanmartino rendered the veil in a remarkably realistic way.</p></details><details><summary>original (IT)</summary><p class='th-it'>Il Cristo velato è una scultura marmorea di:\nA) Gian Lorer\nB) Giovannic\nC) Giuseppe\nD) Michelang\nE) Antonio Ci\n\nLa risposta esatta è la | ha reso in ma- niera realistica il velo</p></details>", "back": "", "conf": "low", "page": 45, "section": "", "num": "2", "_i": 58}, {"kind": "theory", "src": null, "front": "<div class='kindlabel'>THEORY</div><p class='th-en'>The Nineteenth Century<br><br>What characterizes nineteenth-century art is the emphasis placed on painting, which in this century becomes the privileged art form, marked by continuous innovations. In the field of painting, it will no longer be Italy (not even through visiting foreign artists) that plays a decisive cultural and historical role, but France.<br><br>1.6.1 | From Neoclassicism to Romanticism<br><br>From the early decades of the century, French painting placed itself at the forefront of Europe in the search for a &quot;truthful&quot; representation, and this not only in relation to the world of objects, but also to the very meaning and function of art.<br><br>Jean-Auguste-Dominique Ingres (French artist, 1780-1867)<br><br>In keeping with Neoclassical aesthetics, Ingres sought to outline perfect forms in his paintings, paying particular attention to drawing (in him the curved line predominates) rather than to color.<br><br>Among his works are Mademoiselle Rivière (1805), Paris, Louvre; The Valpinçon Bather (1814), Paris, Louvre; Oedipus and the Sphinx (1808), Paris, Louvre; The Turkish Bath (1862), Paris, Louvre; The Dream of Ossian (1813-35), Montauban, Musée Ingres.<br><br>Théodore Géricault (French artist, 1791-1824)<br><br>He was long considered a Romantic painter, but his taste for classicism and for Baroque art actually places him in an intermediate position between Romanticism and the Baroque. It is nonetheless certain that in some works, dealing even with current events unusual for the period, he was able to achieve a realism of remarkable quality, marked by great plastic force.<br><br>Among Géricault&#x27;s works are recalled The Races of the Riderless Horses (1816-17), Paris, Louvre; The Raft of the Medusa (1819), Paris, Louvre; The Capture of a Wild Horse (1817), Rouen, Musée des Beaux-Arts.<br><br>Eugène Delacroix (French artist, 1798-1863)<br><br>In his declared intent to become an interpreter of the spirituality of his age, in his vocation to live history directly and bear witness to it in his own works, Delacroix represents the Romantic artist par excellence. Engaging with classical themes as well as with episodes of contemporary history, Delacroix always shows an inventiveness rebellious toward any academicism, a lively spirit curious for continual novelty. His painting is incandescent, tumultuous, nourished by inspiration drawn from the surrounding reality as much as from the lessons of the great masters of the past (as demonstrated, among other things, by his revival of the so-called &quot;great diagonal,&quot; celebrated in the past by Rubens - that is, the compositional structure consisting of arranging figures along the line joining the two opposite corners of a painting).</p><details><summary>original (IT)</summary><p class='th-it'>1.6 | Ottocento\n\nCiò che caratterizza l&#x27;arte ottocentesca è l&#x27;accento che viene posto sulla pittura, che diventa in questo se-\ncolo la forma d&#x27;arte privilegiata, caratterizzata da continue innovazioni. In campo pittorico non sarà più\nl&#x27;Italia (neppure tramite artisti stranieri di passaggio) a svolgere un ruolo culturale e storico decisivo, ben-\nsì la Francia.\n\n1.6.1 | Dal Neoclassicismo al Romanticismo\n\nLa pittura francese si pone, sin dai primi decenni del secolo, all&#x27;avanguardia in Europa nella ricerca di una\nrappresentazione che sia “veritiera” e questo non solo in rapporto al mondo oggettuale, ma anche al si-\ngnificato e alla funzione stessa dell’arte.\n\nJean-Auguste-Dominique Ingres (artista francese, 1780-1867)\n\nIn accordo con l&#x27;estetica neoclassica, Ingres cerca di delineare nei suoi quadri forme perfette, prestando\nparticolare cura al disegno (domina in lui la linea curva) più che al colore.\n\nTra le sue opere vanno citate la Mademoiselle Rivière (1805), Parigi, Louvre; la Donna al bagno (1814), Pa-\nrigi, Louvre; Edipo e la sfinge (1808), Parigi, Louvre; // bagno turco (1862), Parigi, Louvre; /l sogno di Ossian\n(1813-35), Montauban, Musée Ingres.\n\nTheodore Géricault (artista francese, 1791-1824)\n\nÈ stato considerato a lungo un pittore romantico, ma il suo gusto per la classicità e per l&#x27;arte barocca lo\nsitua di fatto in una posizione intermedia tra Romanticismo e Barocco. È però indubbio che in alcune ope-\nre, trattando anche temi di cronaca inusuali per l&#x27;epoca, egli seppe pervenire a un realismo di notevole\nfattura, caratterizzato da una grande forza plastica.\n\nTra le opere di Géricault si ricordano La corsa dei Berberi (1816-17), Parigi, Louvre; La zattera della Medusa\n(1819), Parigi, Louvre; Cattura del cavallo brado (1817), Rouen, Musée des Beaux-arts.\n\nEugène Delacroix (artista francese, 1798-1863)\n\nNel suo dichiarato intento di farsi interprete della spiritualità dell&#x27;epoca, nella sua vocazione a vivere la\nstoria in maniera diretta e a testimoniarla nelle proprie opere, Delacroix rappresenta l&#x27;artista romantico\nper eccellenza. Cimentandosi tanto in temi classici come in episodi di storia contemporanea, Delacroix\nmostra sempre un&#x27;inventiva ribelle a qualsiasi accademismo, uno spirito vivace e curioso di continue no-\nvità. La sua pittura è incandescente, tumultuosa, nutrita di spunti suggeritigli dalla realtà circostante, co-\nme dalla lezione dei grandi maestri del passato (come dimostra tra l’altro la ripresa della cosiddetta “gran-\nde diagonale”, magnificata in passato da Rubens, ovvero della struttura compositiva consistente nel\ndislocare le figure lungo la linea che congiunge i due angoli contrapposti di un quadro).</p></details>", "back": "", "conf": "low", "page": 46, "section": "", "num": null, "_i": 59}, {"kind": "artwork", "src": "images/page46_img1.png", "front": "<img src='images/page46_img1.png' class='cardimg'><p class='q'>Which artwork is this? (artist / title / year)</p><details><summary>Answers</summary><p class='q'>Liberty Leading the People (1830), Paris, Louvre Museum, oil on canvas, 260 x 325 cm.</p></details>", "back": "", "conf": "med", "page": 46, "section": "", "num": null, "_i": 60}, {"kind": "theory", "src": null, "front": "<div class='kindlabel'>THEORY</div><p class='th-en'>Among the artist&#x27;s works should be noted: The Massacre at Chios (1824), Paris, Louvre; The Death of Sardanapalus (1827), Paris, Louvre; The Women of Algiers in Their Apartment (1834), Paris, Louvre; Liberty Leading the People (1830), Paris, Louvre; The Sea Viewed from the Heights of Dieppe (1852), Paris, private collection; The Shipwreck of Don Juan (1840), Paris, Louvre.<br><br>Gustave Courbet (French artist, 1819-77)<br><br>Courbet&#x27;s realism deals, in addition to the world of labor and toil, with a broad gallery of situations that reflect art&#x27;s final turn toward the most direct and immediate reality, portrayed in its bare form, without idealizing screens. Among Courbet&#x27;s works are The Painter&#x27;s Studio (1855), Paris, Louvre, and Young Ladies on the Banks of the Seine (1857), Paris, Petit Palais.<br><br>1.6.2 | Impressionism<br><br>The Impressionist movement developed between 1860 and 1866 in Paris. Its distinctive characteristics are:<br><br>- painting the picture outdoors, without preparatory or concluding stages in the studio, letting oneself be captured by natural reality and attempting to represent both the emotion arising from the relationship with the environment and with light, and the very passage of time on the surface of things;<br><br>- fixing constantly changing reality with a quick, decisive gesture, without the slowing, schematizing mediation of drawing;<br><br>- using colors as pure as possible, abolishing academic chiaroscuro, since, upon careful observation of reality, one realizes that shadows too are colored.<br><br>Édouard Manet (French artist, 1832-83)<br><br>He is the forerunner and acknowledged master of the movement. His painting stirred endless scandal and controversy in academic circles, both for the subjects treated and for the techniques employed. Manet often depicted scenes of everyday life deemed &quot;improper.&quot; Doing away with the canonical resources of painting, such as perspective, chiaroscuro, and representation through volumes, he created two-dimensional figures enclosed within clear outlines, animating them with flat colors, often set against one another. Among Manet&#x27;s masterpieces are The Execution of Maximilian (1867), Copenhagen; A Bar at the Folies-Bergère (1881), London, Tate Gallery; Luncheon on the Grass (1863), Paris, Musée d&#x27;Orsay; Olympia (1863), Paris, Musée d&#x27;Orsay; Portrait of Émile Zola (1867), Paris, Louvre; Argenteuil (1864), Paris, Louvre.<br><br>Claude Monet (French artist, 1840-1926)<br><br>Monet is considered the Impressionist painter par excellence. He not only outlines the main directions of research of the Impressionist poetics, but lives out all its developments to the very limits of abstraction. In him what predominates is not so much interest in the subject itself, as interest in the atmosphere surrounding and determining it: this atmosphere is given by light, which constitutes the true subject of the painting.</p><details><summary>original (IT)</summary><p class='th-it'>Tra le opere dell&#x27;artista vanno segnalate: // massacro di Scio (1824), Parigi, Louvre; La morte di Sardanapalo\n(1827), Parigi, Louvre; le Donne di Algeri nelle loro stanze (1834), Parigi, Louvre; La libertà che guida il popolo\n(1830), Parigi, Louvre; // mare dalle alture di Dieppe (1852), Parigi, proprietà privata; // naufragio di Don Gio-\nvanni (1840), Parigi, Louvre.\n\nGustave Courbet (artista francese, 1819-77)\n\nIl realismo di Courbet ha per tema, oltre al mondo del lavoro e della fatica, un&#x27;ampia galleria di situazioni\nche riflettono la definitiva attenzione dell&#x27;arte verso la realtà più diretta e immediata ritratta nella sua nu-\nda veste, senza schermi idealizzanti. Tra le opere di Courbet si segnalano L&#x27;atelier (1855), Parigi, Louvre, e\nLes demoiselles des bords de la Seine (1857), Parigi, Petit Palais.\n\n1.6.2 | L&#x27;Impressionismo\n\nIl movimento impressionista si sviluppa tra il 1860 e il 1866 a Parigi. Le sue caratteristiche peculiari sono:\n\n+ dipingere il quadro all&#x27;aria aperta, senza fasi preparatorie o conclusive nell&#x27;atelier, lasciandosi cattu-\nrare dalla realtà naturale e tentando di rappresentare tanto l&#x27;emozione derivante dal rapporto con\nl&#x27;ambiente e con la luce, quanto il trascorrere stesso del tempo sulla superficie delle cose;\n\n+ fissare la realtà continuamente mutevole con gesto veloce e deciso, senza la mediazione rallentante\ne schematizzante del disegno;\n\n». utilizzare colori il più possibile puri, abolendo l&#x27;accademico chiaroscuro, poiché, a una attenta osser-\nvazione della realtà, ci si rende conto che le ombre sono anch&#x27;esse colorate.\n\nEdouard Manet (artista francese, 1832-83)\n\nÈ l&#x27;anticipatore e il maestro riconosciuto del movimento. La sua pittura solleva scandalo e polemiche a\nnon finire negli ambienti accademici, sia per i soggetti trattati, sia per le tecniche impiegate. Manet ritrae\nspesso scene d&#x27;ambientazione quotidiana reputate “sconvenienti”. Abolendo le risorse canoniche della\npittura, come la prospettiva, il chiaroscuro, la rappresentazione per volumi, egli crea figure bidimensio-\nnali racchiuse in nitidi contorni, animandole di colori piatti, spesso contrapposti fra loro. Tra i capolavori\ndi Manet si ricordano L&#x27;esecuzione di Massimiliano del Messico (1867), Copenaghen; /l bar delle Folies-Ber-\ngère (1881), Londra, Tate Gallery; La colazione sull&#x27;erba (1863), Parigi, Musée d&#x27;Orsay; Olympia (1863), Pa-\nrigi, Musée d&#x27;Orsay; Ritratto di E. Zola (1867), Parigi, Louvre; Argenteuil (1864), Parigi, Louvre.\n\nClaude Monet (artista francese, 1840-1926)\n\nMonet è considerato il pittore impressionista per eccellenza. Egli non solo enuclea le principali direzioni\ndi ricerca della poetica impressionista, ma ne vive tutti gli sviluppi fino ai limiti dell’astrazione. In lui pre-\ndomina non tanto l&#x27;interesse per il soggetto in sé, quanto quello per l&#x27;atmosfera che lo circonda e lo de-\ntermina: questa atmosfera è data dalla luce, che costituisce il vero oggetto del quadro.</p></details>", "back": "", "conf": "low", "page": 47, "section": "", "num": null, "_i": 61}, {"kind": "artwork", "src": "images/page47_img1.png", "front": "<img src='images/page47_img1.png' class='cardimg'><p class='q'>Which artwork is this? (artist / title / year)</p><details><summary>Answers</summary><p class='q'>Manet: Argenteuil (1874), Tournai, Museum of Fine Arts, oil on canvas, 149 x 115 cm.</p></details>", "back": "", "conf": "med", "page": 47, "section": "", "num": null, "_i": 62}, {"kind": "artwork", "src": "images/page47_img2.png", "front": "<img src='images/page47_img2.png' class='cardimg'><p class='q'>Which artwork is this? (artist / title / year)</p><details><summary>Answers</summary><p class='q'>Monet: Poppies (1873), Paris, Musée d&#x27;Orsay, oil on canvas, 50 x 65 cm.</p></details>", "back": "", "conf": "med", "page": 47, "section": "", "num": null, "_i": 63}, {"kind": "theory", "src": null, "front": "<div class='kindlabel'>THEORY</div><p class='th-en'>Among Monet&#x27;s works are recalled the View of Venice (1908), Washington, National Gallery of Art; the Poppies (1873), Paris, Musée d&#x27;Orsay; Rouen Cathedral, Morning Light Effect (1894), Paris, Musée d&#x27;Orsay; Rouen Cathedral in Full Sunlight (1894), Paris, Musée d&#x27;Orsay; Water Lilies in Evening Light (c. 1910), Zurich, Kunsthaus.<br><br>Pierre-Auguste Renoir (French artist, 1841-1919)<br><br>Renoir&#x27;s artistic culture strove to resolve the most urgent and novel issue of the moment: the representation of atmospheric effect, the discovery of light not as a phenomenon external to things, but as a property that pervades all parts of the visible world as one. Among his works are recalled: L&#x27;Estaque (1882), Boston, Museum of Fine Arts; Monet Painting in His Garden at Argenteuil (1873), Hartford, The Wadsworth Atheneum; The Theater Box (1874), London, Courtauld Institute; The Moulin de la Galette (1876), Paris, Louvre; The Swing (1876), Paris, Louvre; Bather Drying Her Foot (1883), Paris, Orangerie.</p><details><summary>original (IT)</summary><p class='th-it'>Tra le opere di Monet si ricordano la Veduta di Venezia (1908), Washington, National Gallery of Art; /papa-\nveri (1873), Parigi, Musée d&#x27;Orsay; la Cattedrale di Roma, effetto di luce mattutina (1894), Parigi, Musée d&#x27;Or-\nsay; la Cattedrale di Rouen in pieno sole (1894), Parigi, Musée d&#x27;Orsay; Ninfee nella luce della sera (1910 ca.),\nZurigo, Kunsthaus.\n\nPierre-Auguste Renoir (artista francese, 1841-1919)\n\nLa cultura artistica di Renoir è tesa a risolvere il dato più urgente e più nuovo del momento: la rappresen-\ntazione dell&#x27;effetto atmosferico, della scoperta della luce, non come fenomeno esterno alle cose, bensì co-\nme proprietà che intride unitariamente tutte le parti del mondo visibile. Tra le sue opere vanno ricordate:\nAll&#x27;Estaque (1882), Boston, Museum of Fine Art; Monet che dipinge nel giardino di Argenteuil (1873), Hartford,\nThe Wodsworth Athenaeum; // palco (1874), Londra, Courtauld Institute; Moulin de la Galette (1876), Parigi,\nLouvre; L&#x27;altalena (1876), Parigi, Louvre; Bagnante seduta che si asciuga un piede (1883), Parigi, Orangerie.</p></details>", "back": "", "conf": "low", "page": 48, "section": "", "num": null, "_i": 64}, {"kind": "artwork", "src": "images/page48_img1.png", "front": "<img src='images/page48_img1.png' class='cardimg'><p class='q'>Which artwork is this? (artist / title / year)</p><details><summary>Answers</summary><p class='q'>Renoir: The Swing (1876), Paris, Musée d&#x27;Orsay, oil on canvas, 92 x 73 cm.</p></details>", "back": "", "conf": "med", "page": 48, "section": "", "num": null, "_i": 65}, {"kind": "theory", "src": null, "front": "<div class='kindlabel'>THEORY</div><p class='th-en'>1.6.3 | Post-Impressionism<br><br>Under the rather generic label of Post-Impressionism are included those artists who, starting in 1886, inaugurated a profound critical reconsideration of their aesthetics, breaking the apparent homogeneity of the earlier Impressionist vision with a series of provocative innovations.</p><details><summary>original (IT)</summary><p class='th-it'>1.6.3 | Il Postimpressionismo\n\nSotto la definizione assai generica di Postimpressionismo vanno annoverati quegli artisti che, a partire dal\n1886, inaugurarono una profonda riconsiderazione critica della loro estetica, rompendo l&#x27;apparente\nomogeneità della precedente visione impressionistica in una serie di provocatorie novità.</p></details>", "back": "", "conf": "low", "page": 48, "section": "", "num": null, "_i": 66}, {"kind": "artwork", "src": "images/page48_img2.png", "front": "<img src='images/page48_img2.png' class='cardimg'><p class='q'>Which artwork is this? (artist / title / year)</p><details><summary>Answers</summary><p class='q'>Rodin: The Thinker (1880), Paris, Musée Rodin, bronze sculpture, height 180 cm.</p></details>", "back": "", "conf": "med", "page": 48, "section": "", "num": null, "_i": 67}, {"kind": "theory", "src": null, "front": "<div class='kindlabel'>THEORY</div><p class='th-en'>The true revolutions brought about by Cézanne, Van Gogh and Gauguin mark the very origins of contemporary art, which would develop along paths quite different from one another. In sculpture, an analogous role was played by Auguste Rodin (1840-1917), with figurative works that combined an exasperated realism with a highly effective rendering of movement. Notable is The Thinker (1880).<br><br>Paul Cézanne (French artist, 1839-1906)<br><br>With Cézanne, painting attempts, for the first time in a consciously deliberate way, to create its own reality, without concern for the verisimilitude of the depiction or the impression aroused in the viewer. Rejecting the dissolution of reality into light pursued by the Impressionists, Cézanne set out to represent reality not as it appears, but as it can be conceived in its innermost essence, in its logical structure, at times arriving at decidedly abstract results.<br><br>Among Cézanne&#x27;s works: The House of the Hanged Man at Auvers (1873), Paris, Musée d&#x27;Orsay; The Great Pine (1885-87), London, Home House Trustees; Two Card Players (1890-92), London, Home House Trustees; the Large Bathers cycle (1898-1905), Philadelphia, Museum of Art; Cabanon de Jourdan (1906), Milan, private collection.<br><br>Paul Gauguin (French artist, 1848-1903)<br><br>He sought to go beyond the formal aestheticism of the Impressionists, charging his painting with meanings that go beyond art itself and thereby imbuing it with a strong symbolism. His painting manifests a &quot;wild&quot; freedom, experimenting with the most unprecedented solutions (including recourse to often invented, &quot;impossible&quot; chromatic tones). Through such a use of color, Gauguin does away with three-dimensionality and perspective in his paintings.</p><details><summary>original (IT)</summary><p class='th-it'>Le vere e proprie rivoluzioni operate da Cézanne, Van Gogh, Gauguin, segnano le origini stesse dell&#x27;arte\ncontemporanea, che si svilupperà lungo strade anche molto diverse tra loro. In campo scultoreo, un ruolo\nanalogo svolse Auguste Rodin (1840-1917), con opere figurative che al realismo esasperato univano una\nefficacissima resa del movimento. Notevole è // pensatore (1880).\n\nPaul Cézanne (artista francese, 1839-1906)\n\nCon Cézanne la pittura tenta di creare, per la prima volta in maniera consapevole, una propria realtà, sen-\nza preoccuparsi della verosimiglianza della raffigurazione o dell&#x27;impressione suscitata nello spettatore.\nRifiutando il disfacimento della realtà in luce, perseguito dagli impressionisti, Cézanne si prefigge di rap-\npresentare la realtà non per come appare, ma per come può essere pensata nella sua intima essenza, nel-\nla sua struttura logica, giungendo a esiti talora decisamente astratti.\n\nTra le opere di Cézanne: La casa dell&#x27;impiccato ad Auvèrs (1873), Parigi, Musée d&#x27;Orsay; Il grande pino\n(1885-87), Londra, Home Hause Trustees; Due giocatori di carte (1890-92), Londra, Home Hause Trustees;\nil ciclo Le grandi bagnanti (1898-1905), Philadelphia, Museum of Art; Cabanon de Jourdan (1906), Milano,\ncollezione privata.\n\nPaul Gauguin (artista francese, 1848-1903)\n\nVuole superare l&#x27;estetismo formale degli impressionisti, caricando la sua pittura di significati che vanno\nal di là della stessa arte e impregnandola con ciò di un forte simbolismo. La pittura si manifesta con una\nsua libertà “selvaggia” sperimentando le soluzioni più inedite (tra le quali il ricorso a toni cromatici spesso\ninventati, impossibili”). Attraverso un tale uso del colore, Gauguin annulla nei suoi dipinti la tridimensio-\nnalità e la prospettiva.\n\nTra le sue opere spiccano: la Visione dopo il sermone. Lotta di Giacobbe con l&#x27;angelo (1888), Edimburgo, Na-\ntional Gallery of Scotland; Nafea foa ipoipo (Quando ti sposi?, 1892), Berlino, Kunstmuseum; Ta Matete (II\nmercato, 1892), Basilea, Kunstmuseum; /l cavallo bianco (1898), Parigi, Musée d&#x27;Orsay; L&#x27;oro dei loro corpi\n(1901), Parigi, Louvre.</p></details>", "back": "", "conf": "low", "page": 49, "section": "", "num": null, "_i": 68}, {"kind": "theory", "src": null, "front": "<div class='kindlabel'>THEORY</div><p class='th-en'>Vincent van Gogh (Dutch artist, 1853-1890)<br><br>Van Gogh expresses in painting the despair and the loneliness of the artist in the world. The work in depth that he carries out in oil paint is a means of digging into the very meaning of things: the brushstrokes, the palette-knife strokes, the way of laying down color on the canvas are all so many modes of total physical and psychic engagement in the act of painting. Among his most famous works: The Old Church Tower at Nuenen with Birds (1885), Amsterdam, Van Gogh Museum; Five Peasants (The Potato Eaters, 1885), Amsterdam, Van Gogh Museum; Van Gogh&#x27;s Room at Arles (1888), Amsterdam, Van Gogh Museum; The Sunflowers (1888), London, National Gallery; Self-Portrait of January 1889, with Bandaged Head, Chicago, Block Collection; Self-Portrait of September 1889, Paris, Musée d&#x27;Orsay; Wheatfield with Crows (1890), Amsterdam, Stedelijk Museum.</p><details><summary>original (IT)</summary><p class='th-it'>Vincent Van Gogh (artista olandese, 1853\n\nVan Gogh esprime in pittura la disperazione e la si\ntista nel mondo. Il lavoro in profondità che egli or\nè un mezzo per scavare dentro il senso stesso delli\npennellate, delle spatolate, il collocare il colore st\n\nll&#x27;ar-\n‘olio\nelle\npre-</p></details>", "back": "", "conf": "low", "page": 49, "section": "", "num": null, "_i": 69}, {"kind": "artwork", "src": "images/page49_img1.png", "front": "<img src='images/page49_img1.png' class='cardimg'><p class='q'>Which artwork is this? (artist / title / year)</p><details><summary>Answers</summary><p class='q'>Gauguin: Ta Matete (The Market, 1892), Basel, Kunstmuseum, oil on canvas, 73 x 92 cm.</p></details>", "back": "", "conf": "med", "page": 49, "section": "", "num": null, "_i": 70}, {"kind": "artwork", "src": "images/page49_img2.png", "front": "<img src='images/page49_img2.png' class='cardimg'><p class='q'>Which artwork is this? (artist / title / year)</p><details><summary>Answers</summary><p class='q'>Cézanne: The Card Players (1893-1896), Paris, Musée d&#x27;Orsay, oil on canvas, 47 x 56 cm.</p></details>", "back": "", "conf": "med", "page": 49, "section": "", "num": null, "_i": 71}, {"kind": "theory", "src": null, "front": "<div class='kindlabel'>THEORY</div><p class='th-en'>Van Gogh expresses in painting the despair and the loneliness of the artist in the world. The work in depth that he carries out in oil paint is a means of digging into the very meaning of things: the brushstrokes, the palette-knife strokes, the way of laying down color on the canvas are all so many modes of total physical and psychic engagement in the act of painting. Among his most famous works: The Old Church Tower at Nuenen with Birds (1885), Amsterdam, Van Gogh Museum; Five Peasants (The Potato Eaters, 1885), Amsterdam, Van Gogh Museum; Van Gogh&#x27;s Room at Arles (1888), Amsterdam, Van Gogh Museum; The Sunflowers (1888), London, National Gallery; Self-Portrait of January 1889, with Bandaged Head, Chicago, Block Collection; Self-Portrait of September 1889, Paris, Musée d&#x27;Orsay; Wheatfield with Crows (1890), Amsterdam, Stedelijk Museum.</p><details><summary>original (IT)</summary><p class='th-it'>sentano altrettanti modi di totale coinvolgimento fisico e psichico del fare pittura. Tra le sue opere più\nfamose: La torre del cimitero di Neunen con uccelli (1885), Amsterdam, Rijks-museum Vincent Van Gogh;\nCinque contadini (i mangiatori di patate, 1885), Amsterdam, Rijksmuseum Vincent Van Gogh; Camera di\nVan Gogh ad Arles (1888), Amsterdam, Rijksmuseum Vincent Van Gogh; / girasoli (1888), Londra, National\nGallery; Autoritratto del gennaio 1889, con il capo bendato, Chicago, Proprietà Block; Autoritratto del set-\ntembre 1889, Parigi, Musée d&#x27;Orsay; Campo di grano con corvi (1890), Amsterdam, Stedlyk Museum.</p></details>", "back": "", "conf": "low", "page": 49, "section": "", "num": null, "_i": 72}, {"kind": "artwork", "src": "images/page50_img1.png", "front": "<img src='images/page50_img1.png' class='cardimg'><p class='q'>Which artwork is this? (artist / title / year)</p><details><summary>Answers</summary><p class='q'>Sunflowers (1888), Munich, Neue Pinakothek, oil on canvas, 91 x 72 cm.</p></details>", "back": "", "conf": "med", "page": 50, "section": "", "num": null, "_i": 73}, {"kind": "artwork", "src": "images/page50_img2.png", "front": "<img src='images/page50_img2.png' class='cardimg'><p class='q'>Which artwork is this? (artist / title / year)</p><details><summary>Answers</summary><p class='q'>The Bedroom in Arles (1888), Amsterdam, Van Gogh Museum, oil on canvas, 72 x 90 cm.</p></details>", "back": "", "conf": "med", "page": 50, "section": "", "num": null, "_i": 74}, {"kind": "theory", "src": null, "front": "<div class='kindlabel'>THEORY</div><p class='th-en'>1.6.4 | Divisionism and Symbolism<br><br>Within the Post-Impressionist period are generally included the artists of so-called Neo-Impressionism, among them Georges Seurat (1859-91) and Paul Signac (1863-1935), founders of the poetics of Pointillism (also called Divisionism), that is, the use of small dots of pure, separate colors, so that the chromatic fusion takes place in the eye of the viewer.<br><br>Other groups are those of the Symbolists, such as Moreau, Redon, Whistler, Puvis de Chavannes, that of the Nabis, and some artists who are difficult to classify, such as Toulouse-Lautrec and Rousseau.</p><details><summary>original (IT)</summary><p class='th-it'>1.6.4|Il Divisionismo e il Simbolismo\n\nNell&#x27;ambito del periodo postimpressionista sono generalmente compresi gli artisti del cosiddetto Neo-\nimpressionismo, tra cui George Seurat (1859-91) e Paul Signac (1863-1935), fondatori della poetica del\nPointillisme (detto anche Divisionismo), cioè l&#x27;uso di piccoli punti di colori puri e separati, in modo che la\nfusione cromatica si realizzi nell&#x27;occhio dello spettatore.\n\nAltri gruppi sono quelli dei simbolisti come Moreau, Redon, Whistler, Puvis de Chavannes, quello dei Na-\nbis e alcuni artisti difficilmente catalogabili come per esempio Toulouse-Lautrec e Rousseau.</p></details>", "back": "", "conf": "low", "page": 50, "section": "", "num": null, "_i": 75}, {"kind": "question", "src": null, "front": "<p class='q'>Which of the following nineteenth-century French painters has the most markedly Romantic personality?<br><br>A) Gericault<br>B) Ingres<br>C) Delacroix<br>D) Daumier<br>E) Courbet<br><br>Delacroix&#x27;s work best expresses a vivid Romantic sensibility. The correct answer is therefore C.</p><details><summary>Answers</summary><p>Answer: C</p></details><details><summary>original (IT)</summary><p class='th-it'>Quale tra i seguenti pittori francesi dell&#x27;Ottocento possiede la personalità più spiccata- mente romantica?\nA) Gericault\nB) iIngres\nC) elacroix\nD) aumier\nE) ourbet\n\nvo gusto romantico. La risposta corretta è la (9.</p></details>", "back": "", "conf": "low", "page": 50, "section": "", "num": "1", "_i": 76}, {"kind": "question", "src": null, "front": "<p class='q'>What was the reaction of official critics to the innovations of the Impressionist painters?<br><br>A) Unconditional enthusiasm<br>B) Indifference<br>C) Ironic skepticism<br>D) Open hostility<br>E) Curiosity<br><br>A few critics defended the new school, breaking away from the general chorus of scandalized criticism. The correct answer is D.</p><details><summary>Answers</summary><p>Answer: D</p></details><details><summary>original (IT)</summary><p class='th-it'>Quale fu la reazione della critica ufficiale di fronte alle innovazioni dei pittori impressioni- sti?\nA) ntusiasmo incondizionato\nB) Indifferenza\nC) ironico scetticismo\nD) perta ostilità\nE) uriosità\n\nno la nuova scuola, staccandosi dal generale coro scandalizzato delle critiche (risposta esatta [D))</p></details>", "back": "", "conf": "low", "page": 50, "section": "", "num": "2", "_i": 77}, {"kind": "theory", "src": null, "front": "<div class='kindlabel'>THEORY</div><p class='th-en'>1.7 | The Twentieth Century<br><br>The twentieth century records an incredible number of styles and artistic movements which, beyond a general tendency to move past figurative representation in favor of abstraction, cannot be reduced to a single unifying formula. The early twentieth century sees the birth of the so-called &quot;artistic avant-gardes,&quot; defined as groups of artists, united under a manifesto they themselves signed, who set themselves in polemical rupture with academic figurative conventions and proposed the use of innovative expressive means. Among the main avant-garde artistic movements were Expressionism, Cubism, Futurism, Dadaism, Surrealism, and Neoplasticism.<br><br>1.7.1 | The Fauves<br><br>The term fauve (which in French means &quot;wild animal,&quot; &quot;fierce beast&quot;) was ironically attributed by the critic Vauxcelles to the entire group of artists who in 1905 exhibited their works at the Salon d&#x27;Automne in Paris, meaning thereby to signal the extreme provocation of their painting. This painting abandons every trace of naturalistic color and rejects the conventional perspectival rules of representation: it eliminates shadows, chiaroscuro, gradations and volumetric modeling, in order to create an image based on the exaltation of color and the contour line of the figures.<br><br>Henri Matisse (French artist, 1869-1954)<br><br>He tends to break with the formalistic conventions of figurative representation, reducing it to its essentials and to a free play of color and marks. Color is no longer conceived - as it was by the Impressionists - as a means of translating the impression aroused by reality, but as the ultimate aim of painting, as an autonomous world governed by its own internal laws (the juxtaposition and alternation of tones, of intensities, of different depths of color).</p><details><summary>original (IT)</summary><p class='th-it'>| Novecento\n\nIl Novecento registra un&#x27;incredibile quantità di stili e di movimenti artistici che, al di là di una generale\ntendenza a superare il figurativismo a favore dell&#x27;astrattismo, non è possibile ridurre a una precisa cifra\nunitaria. Il primo Novecento vede la nascita delle cosiddette “Avanguardie artistiche”, definite come grup-\npi di artisti, riuniti sotto un manifesto da loro firmato, che si posero in polemica rottura con gli schemi fi-\ngurativi accademici e proposero l&#x27;uso di mezzi espressivi innovativi. Fra i movimenti artistici di avanguar-\ndia i principali furono l&#x27;Espressionismo, il Cubismo, il Futurismo, il Dadaismo, il Surrealismo, il\nNeoplasticismo.\n\n1.7.1|1 Fauves\n\nIl termine fauve (che in francese significa “animale selvaggio”, “bestia feroce&quot;) venne ironicamente attri-\nbuito dal critico Vauxcelles all&#x27;intero gruppo di artisti che nel 1905 esposero le loro opere al Salon d&#x27;Au-\ntomne a Parigi, volendo con ciò significare l&#x27;estrema provocazione della loro pittura. Questa abbandona\nogni traccia di colore naturalistico e rifiuta le convenzionali regole prospettiche della rappresentazione:\nelimina ombre, chiaroscuri, sfumature, volumetrie, per realizzare un&#x27;immagine basata sull&#x27;esaltazione del\ncolore e della linea di contorno delle figure.\n\nHenri Matisse (artista francese, 1869-1954)\n\nTende a rompere con le convenzioni formalistiche della rappresentazione figurativa, essenzializzandola\ne riducendola a un libero gioco di colore e di tratti. Il colore non viene più concepito - come dagli impres-\nsionisti - come un mezzo per tradurre l&#x27;impressione suscitata dal reale, ma come il fine ultimo della pit-\ntura, come un mondo autonomo, regolato da proprie leggi interne (l&#x27;accostarsi e alternarsi di toni, di al-\ntezze, di diverse profondità del colore).\n\nsar</p></details>", "back": "", "conf": "low", "page": 51, "section": "", "num": null, "_i": 78}, {"kind": "theory", "src": null, "front": "<div class='kindlabel'>THEORY</div><p class='th-en'>Among Matisse&#x27;s works are to be recalled the Young Sailor (1906), Lomas, Gelman collection; The Dance (1909), Leningrad, Hermitage; Goldfish (1911), Moscow, Pushkin Museum; Luxury, Calm and Pleasure (c. 1905); Odalisque with Red Trousers (1922), Paris, Musée National d&#x27;Art Moderne; The Red Studio (1911), New York, Museum of Modern Art.<br><br>Among the artists belonging to this movement should also be recalled: Vlaminck, Marquet, Derain, Van Dongen, Friesz, Rouault.</p><details><summary>original (IT)</summary><p class='th-it'>TTG TC UPITE UI IVIALISSE SUTTO Ud 117\ncordare il Giovane marinaio\n(1906), Lomas, proprietà Gelman;\nLa danza (1909), Leningrado, Er-\nmitage; Pesci rossi (1911), Mosca,\nMuseo Puskin; Lusso, calma e vo-\nluttà (1905 ca.); Odalisca con pan-\ntaloni rossi (1922), Parigi, Museo\nNazionale d’arte Moderna; L&#x27;ate-\nlier rosso (1911), New York, Mu-\nseum of Modern Art.\n\nTra gli artisti appartenenti a que-\nsta corrente vanno ricordati an-\nche: Viaminck, Marquet, Derain,\nVan Dongen, Friesz, Rouault.</p></details>", "back": "", "conf": "low", "page": 51, "section": "", "num": null, "_i": 79}, {"kind": "artwork", "src": "images/page51_img1.png", "front": "<img src='images/page51_img1.png' class='cardimg'><p class='q'>Which artwork is this? (artist / title / year)</p><details><summary>Answers</summary><p class='q'>Dance (1909), New York, Museum of Modern Art (MoMA), oil on canvas, 260 x 390 cm.</p></details>", "back": "", "conf": "med", "page": 51, "section": "", "num": null, "_i": 80}, {"kind": "theory", "src": null, "front": "<div class='kindlabel'>THEORY</div><p class='th-en'>In these two decades the most important artistic groups developed:<br><br>1. Die Brücke (The Bridge), with artists such as E. Heckel, O. Müller, K. Schmidt-Rottluff, M. Pechstein;<br><br>2. Der Blaue Reiter (The Blue Rider), founded by W. Kandinsky and F. Marc and considered the most important group within the Expressionist movement;<br><br>3. Die Neue Sachlichkeit (New Objectivity), with painters such as O. Dix and G. Grosz.</p><details><summary>original (IT)</summary><p class='th-it'>1.7.2 | L&#x27;Espressionismo\n\nIl termine Espressionismo non designa un fenomeno artistico circoscritto, identificabile in una scuola o in\n\nun gruppo precisi, ma qualcosa di molto più vasto e sfumato, un complesso di idee, di eventi artistici e\n\nproduzioni materiali anche molto diversi tra loro, la cui area di diffusione è costituita dalla Germania e\n\ndall&#x27;Austria. L&#x27;arco cronologico interessato comprende gli anni 1905-25.\n\nIn questo ventennio si sviluppano i gruppi artistici più importanti:\n\n1. Die Briicke (Il ponte), con artisti come E. Heckel, O. Muller, K. Schimdt- Rottluf, M. Pechstein;\n\n2. Der Blau Reiter (Il cavaliere azzurro), fondato da W. Kandinsky e F. Marc e considerato il gruppo più\nimportante all’interno del movimento espressionista;\n\n3. Die Neue Sachlichkeit (la Nuova oggettività) con pittori quali O. Dix e G. Grosz.</p></details>", "back": "", "conf": "low", "page": 51, "section": "", "num": null, "_i": 81}, {"kind": "theory", "src": null, "front": "<div class='kindlabel'>THEORY</div><p class='th-en'>Wassily Kandinsky (Russian artist, 1866-1944)<br><br>He is considered the father of lyrical abstraction. His constant intent is to represent the &quot;invisible.&quot; From this arises the particular coexistence, in his painting, of comprehensible and incomprehensible forms, of elements of experience and others that allude to a different dimension, the spiritual one. With his work the nineteenth-century era of the art of appearance can be said to have come to an end, while the modern era of the art of meaning opens, one that requires a deep interpretation in order to be understood. Among his main works: the First Abstract Watercolor (1910), Neuilly-sur-Seine, Nina Kandinsky collection; Painting with Red Spot (1914), Neuilly-sur-Seine, Nina Kandinsky collection; Compositions IV, VII and VIII (1923), New York, Museum of Modern Art (MoMA); Yellow-Red-Blue (1925), Neuilly-sur-Seine, Nina Kandinsky collection; Lyrical (1911), Rotterdam, Boijmans Van Beuningen Museum; Small Dream in Red (1925), Paris, Centre Georges Pompidou.<br><br>Paul Klee (Swiss artist, 1879-1940)<br><br>The whole of Klee&#x27;s output is characterized by the same objective: the representation of a world parallel to the real one. The latter serves as a stimulus toward its own transcendence, in an inexhaustible eagerness to discover what lies behind things. Klee&#x27;s research gives rise to abstract compositions, aimed at communicating the poetic experience of unveiling an inner world. Among the artist&#x27;s most representative works are: In Front of the Gates of Kairouan (1914), Bern, Kunstmuseum, Klee Foundation; A Page from the Town Book (1928), Basel, Kunstmuseum; Senecio (1922), Basel, Kunstmuseum; Highway and Byways (1929), Munich, Werner Vowinckel collection; Part of G. (1929), Berlin, Staatliche Museen; Head of a Barbarian (1932), Bern, Felix Klee collection; Even the Body Has a Face (1939), Bern, Felix Klee collection.</p><details><summary>original (IT)</summary><p class='th-it'>Wassily Kandinsky (artista russo, 1866-1944)\n\nÈ considerato il padre dell&#x27;astrattismo lirico. Suo intento costante è quello di rappresentare “invisibile”.\nDa ciò nasce la particolare compresenza nella sua pittura di forme comprensibili e forme incomprensibili,\ndi elementi dell&#x27;esperienza e di altri che alludono a una diversa dimensione, quella spirituale. Con la sua\nopera può dirsi conclusa l&#x27;epoca ottocentesca dell&#x27;arte dell&#x27;apparenza, mentre si apre quella moderna\ndell&#x27;arte del senso, che ha cioè bisogno di una interpretazione profonda per essere compresa. Tra le sue\nopere principali: il Primo acquerello astratto (1910), Neully-sur-Seine, collezione Nina Kandinsky; il Quadro\ncon macchia rossa (1914), Neully-sur-Seine, collezione Nina Kandinsky; Composizione IV, VII e VIII (1923)\nNew York, Museum of Modern art (MOMA);Giallo-rosso-azzurro (1925), Neully-sur-Seine, collezione Nina\nKandinsky; Lirica (1911), Rotterdam, Boymans van Beunigen Museum; Piccolo sogno rosso (1925), Parigi,\nCentre George Pompidou.\n\nPaul Klee (artista svizzero, 1879-1940)\n\nTutta la produzione di Klee è caratterizzata dallo stesso obiettivo: la rappresentazione di un mondo pa-\nrallelo a quello reale. Quest&#x27;ultimo funge da stimolo al suo stesso superamento, in un&#x27;inesauribile ansia\ndi scoperta di ciò che sta dietro le cose. La ricerca di Klee dà vita a composizioni astratte, mirate a comu-\nnicare l&#x27;esperienza poetica del disvelamento di un mondo interiore. Tra le opere più rappresentative\ndell&#x27;artista si ricordano: Dinanzi alle porte di Kairuan (1914), Berna, Kunstmuseum, Klee-Stiftung; Un foglio\ndi libro urbano (1928), Basilea, Kunstmuseum; Senecio (1922), Basilea, Kunstmuseum; Strada principale e\nstrade laterali (1929), Monaco, collezione Werner Vowinckel; Parte di G (1929) Berlino, Staatliche Museen;\nCapo dei barbari (1932), Berna, collezione Felix Klee; Anche il corpo ha un volto (1939), Berna, collezione\nFelix Klee.</p></details>", "back": "", "conf": "low", "page": 52, "section": "", "num": null, "_i": 82}, {"kind": "artwork", "src": "images/page52_img1.png", "front": "<img src='images/page52_img1.png' class='cardimg'><p class='q'>Which artwork is this? (artist / title / year)</p><details><summary>Answers</summary><p class='q'>Kandinsky: Composition VIII (1923), New York, Museum of Modern Art (MoMA), oil on canvas, 140 x 201 cm.</p></details>", "back": "", "conf": "med", "page": 52, "section": "", "num": null, "_i": 83}, {"kind": "artwork", "src": "images/page52_img2.png", "front": "<img src='images/page52_img2.png' class='cardimg'><p class='q'>Which artwork is this? (artist / title / year)</p><details><summary>Answers</summary><p class='q'>Klee: Part of G. (1927), Berlin, Staatliche Museen, watercolor, 32 x 24 cm.</p></details>", "back": "", "conf": "med", "page": 52, "section": "", "num": null, "_i": 84}, {"kind": "theory", "src": null, "front": "<div class='kindlabel'>THEORY</div><p class='th-en'>Marc Chagall (Russian artist, 1887-1985)<br><br>Chagall&#x27;s work represents a meeting point of different cultural components: the tradition of Russian folk art, Jewish culture, and the artistic climate of Paris. This eclecticism would remain a constant of his painting. The privileged subject of his output is childhood memories: the peasant village, festive atmospheres, wooden houses with their interiors, the small objects of everyday reality. He depicts them immersed in an aura of dream, seeking to bring to light the &quot;invisible&quot; that is hidden within them and that can only be rendered allusively, symbolically.<br><br>Among the Russian painter&#x27;s works are: The Sabbath (1910), Cologne, Wallraf-Richartz Museum; I and the Village (1911), New York, Museum of Modern Art; The Fall of the Angel (1923, 1933 and 1947), Basel, Kunstmuseum; At Twilight (1938-43), Basel, Ida Meyer-Chagall Collection; Around Her (1945), Paris, Centre Georges Pompidou.<br><br>1.7.3 | Cubism<br><br>It conventionally takes its start from a painting by Pablo Picasso, Les Demoiselles d&#x27;Avignon, of 1907. Its main exponents are Picasso himself and Georges Braque. In a first period, called Cézannian</p><details><summary>original (IT)</summary><p class='th-it'>Marc Chagall (artista russo, 1887-1985)\n\nL&#x27;opera di Chagall rappresenta un punto d&#x27;incontro di diverse componenti culturali: la tradizione dell’arte\npopolare russa, la cultura ebraica, il clima artistico di Parigi. Tale eclettismo rimarrà una costante della sua\npittura. Oggetto privilegiato della sua produzione sono i ricordi d&#x27;infanzia: il villaggio contadino, le atmo-\nsfere di festa, le case di legno con i loro interni, i piccoli oggetti della realtà quotidiana. Egli li ritrae immer-\ngendoli in un&#x27;aura di sogno, cercando di portare alla luce l&#x27;“invisibile” che vi si cela e che può essere reso\nsolo per via allusiva, simbolica.\n\nTra le opere del pittore russo vi sono: // sabato (1910), Colonia, Wallraf-Richartz Museum; lo e il villaggio\n(1911), New York, Museum of Modern Art; La caduta dell&#x27;angelo (1923, 1933 e 1947), Basilea, Kunstmu-\nseum; Nel crepuscolo (1938-43), Basilea, Collezione Ida Meyer-Chagall; /ntorno a lei (1945), Parigi, Centre\nGeorge Pompidou.\n\n1.7.3|Il Cubismo\n\nPrende convenzionalmente avvio da un quadro di Pablo Picasso, Les demoiselles d&#x27;Avignon, del 1907. |\nsuoi esponenti principali sono lo stesso Picasso e George Braque. In un primo periodo, definito cezannia-</p></details>", "back": "", "conf": "low", "page": 52, "section": "", "num": null, "_i": 85}, {"kind": "theory", "src": null, "front": "<div class='kindlabel'>THEORY</div><p class='th-en'>or Proto-Cubist (1907-09), Picasso concentrates on compositional drawing, while Braque develops chromatic charge and surface values, but neither of the two yet arrives at a definitive breaking-up of form. In the second period, called Analytic, they instead turn to a new pictorial representation, and forms appear as a many-faceted assembly of tilted and overlapping planes. In the third period, called Synthetic (1913-14), the active participation of the painters Gris and Léger is added. In this phase painting tends toward representations as essentialized as possible, and every remaining trace of representational verisimilitude is abandoned; Cubism reaches the depth of a coherent and rigorous aesthetic, seeking to represent the different valences of objects in space.<br><br>Pablo Picasso (Spanish artist, 1881-1973)<br><br>With his vast and multifaceted output (which also includes intense activity as a sculptor and ceramicist), Picasso certainly represents one of the greatest artists of the century. The early periods of his output can be divided between the so-called Blue Period, from the color that predominates in it, with themes full of pathos (1901-04), and the subsequent Rose Period, with his first interest in classical forms and characterized by subjects drawn from the circus world (1905-06). In these early years Picasso worked out the themes (the problems of form, the breaking-up of compositional planes, the human story in its joys and its dramas) that he would go on to deepen throughout his very long career. 1907 is the crucial year for the birth of Cubism.<br><br>For Picasso, the new aesthetic means dismembering and faceting objects, opening them up to the surrounding space; the absorption of various colors into different shades of gray; the working-out of static images that live a life of their own, without any obligation of resemblance to the objects to which they refer. Picasso would devote the remaining decades of his life to deepening these basic elements of Synthetic Cubism and to tirelessly experimenting with new ones.<br><br>Among Picasso&#x27;s masterpieces are recalled Life (1903), Cleveland, Museum of Art (Blue Period); Acrobat and Young Harlequin (1905), Moscow, Pushkin Museum (Rose Period); Houses on the Hill (1909), New York, private collection (Proto-Cubist period); The Three Musicians (1921), New York, Museum of Modern Art (Synthetic Cubism); Harlequin (1915), New York, Museum of Modern Art (Synthetic Cubism); Guernica (1937), Madrid, Museo Nacional Centro de Arte Reina Sofía (Synthetic Cubism).</p><details><summary>original (IT)</summary><p class='th-it'>no o protocubista (1907-09), Picasso si concentra sul disegno compositivo, mentre Braque sviluppa la ca-\nrica cromatica e i valori di superficie, ma nessuno dei due giunge ancora a scomporre definitivamente la\nforma. Nel secondo periodo detto analitico, essi si volgono invece a una nuova rappresentazione pittori-\nca, e le forme appaiono come un insieme poliedrico di piani ribaltati e sovrapposti. Nel terzo periodo, det-\nto sintetico (1913-14), si aggiunge la partecipazione attiva dei pittori Gris e Leger. In questa fase la pittura\ntende a raffigurazioni il più possibile essenzializzate e viene abbandonato ogni residuo di verosimiglian-\nza rappresentativa e il Cubismo raggiunge la profondità di un&#x27;estetica coerente e rigorosa, che vuole rap-\npresentare le diverse valenze degli oggetti nello spazio.\n\nPablo Picasso (artista spagnolo, 1881-1973)\n\nCon la sua vastissima e poliedrica produzione (che comprende anche un&#x27;intensa attività di scultore e ce-\nramista), Picasso rappresenta certamente uno dei massimi artisti del secolo. | periodi iniziali della sua pro-\nduzione possono essere suddivisi tra il cosiddetto periodo blu, dal colore che vi predomina con temi pieni\ndi pathos (1901-04), e il successivo periodo rosa, con il primo interesse per le forme classiche e caratteriz-\nzato da soggetti di ambito circense (1905-06). In questi primi anni Picasso mette a punto le tematiche (i\nproblemi della forma, la scomposizione dei piani compositivi, la vicenda umana nelle sue gioie e nei suoi\ndrammi) che poi approfondirà via via nell&#x27;arco della sua lunghissima carriera. Il 1907 è l&#x27;anno cruciale per\nla nascita del cubismo.\n\nPer Picasso la nuova estetica significa smembrare e sfaccettare gli oggetti, aprendoli allo spazio circostan-\nte; l&#x27;assorbimento dei vari colori nelle diverse tinte del grigio; la messa a punto di immagini statiche che\nvivono di una vita propria, senza alcun obbligo di somiglianza con gli oggetti a cui si riferiscono. Picasso\ndedicherà i restanti decenni della sua esistenza ad approfondire questi elementi di base del cubismo sin-\ntetico e a sperimentarne instancabilmente di nuovi.\n\nTra i capolavori di Picasso vanno ricordati La vita (1903), Clevaland, Museum of Art (periodo blu); Acrobata\ne giovane equilibrista (1905), Mosca, Museo Puskin (periodo rosa); Case in collina (1909), New York, pro-\nprietà privata (periodo protocubista); / tre suonatori (1921), New York, Museum of Modern Art (cubismo\nsintetico); Arlecchino (1915), New York, Museum of Modern Art (cubismo sintetico); Guernica (1937), Ma-\ndrid, Museo Nazionale Centro de Arte Reina Sofia (cubismo sintetico).</p></details>", "back": "", "conf": "low", "page": 53, "section": "", "num": null, "_i": 86}, {"kind": "artwork", "src": "images/page53_img1.png", "front": "<img src='images/page53_img1.png' class='cardimg'><p class='q'>Which artwork is this? (artist / title / year)</p><details><summary>Answers</summary><p class='q'>Guernica (1937), detail, Madrid, Reina Sofía Museum, oil on canvas, 349 x 776 cm.</p></details>", "back": "", "conf": "med", "page": 53, "section": "", "num": null, "_i": 87}, {"kind": "artwork", "src": "images/page53_img2.png", "front": "<img src='images/page53_img2.png' class='cardimg'><p class='q'>Which artwork is this? (artist / title / year)</p><details><summary>Answers</summary><p class='q'>Houses on the Hill at Horta de Ebro (1909), New York, Museum of Modern Art (MoMA), oil on canvas, 81 x 65 cm.</p></details>", "back": "", "conf": "med", "page": 53, "section": "", "num": null, "_i": 88}, {"kind": "theory", "src": null, "front": "<div class='kindlabel'>THEORY</div><p class='th-en'>Georges Braque (French artist, 1882-1963)<br><br>A leading figure of contemporary art, Braque developed his abundant output under the sign of an ideal of clarity that he cultivated consistently throughout the various phases of his inspiration. To him is owed the introduction of important new pictorial techniques, such as the use of numbers and letters of the alphabet in paintings, and recourse to collage (also called papier-collé).<br><br>Among his paintings should be noted Landscape at L&#x27;Estaque (1908), Paris, Centre Georges Pompidou; The Portuguese (1911), Basel, Öffentliche Kunstsammlung; Still Life with Clarinet, New York, Museum of Modern Art; Guitar and Clarinet (1918), Philadelphia, Museum of Art.</p><details><summary>original (IT)</summary><p class='th-it'>Georges Braque (artista francese, 1882-1963)\n\nFigura di primo piano dell&#x27;arte contemporanea, Braque sviluppa la sua copiosa produzione nel segno di\nun ideale di chiarezza che egli coltiva sempre, coerentemente, pur attraverso le varie fasi della sua ispira-\nzione. A lui si deve l&#x27;introduzione di nuove tecniche pittoriche di grande rilievo, come l&#x27;utilizzo nei quadri\ndi numeri e di lettere dell&#x27;alfabeto, il ricorso al collage (detto anche paier-collé).\n\nTra i suoi quadri vanno segnalati il Paesaggio all&#x27;Estaque (1908), Parigi, Centre G. Pompidou; Il portoghese\n(1911), Basilea, Offentlicher Kunstsammlung; Natura morta con clarinetto, New York, Museum of Modern\nArt; Chitarra e clarinetto (1918), Philadelphia, Museum of Art.</p></details>", "back": "", "conf": "low", "page": 53, "section": "", "num": null, "_i": 89}, {"kind": "theory", "src": null, "front": "<div class='kindlabel'>THEORY</div><p class='th-en'>1.7.4 | Futurism<br><br>The Futurist movement was formally born in 1909 with the Futurist Manifesto, signed by the Italian writer Filippo Tommaso Marinetti. It already contains almost all the ideas that would also appear in the Manifesto of Futurist Painters of 1910, signed by the painters Boccioni, Carrà, Russolo, Severini and Balla.<br><br>Futurism was born as a belated approach of the nascent Italian bourgeois society to the myth of the industrial revolution, in opposition to classicism and against every academic institution, and it developed in Italy in the early years of Fascist power. It is characterized, besides a grandiloquent rhetoric theorized by the poet Gabriele D&#x27;Annunzio (called &quot;il Vate,&quot; the bard), by an interest in the simultaneous representation of everything belonging to the world of the machine, by a polemically anti-cultural attitude, and by strong patriotism. The intent of Futurism, including through imagery, was in any case to overturn every convention, to astonish, to cause scandal. After the First World War the Futurist group dispersed, but the problem of &quot;giving form&quot; to the movement resurfaces in the individual research of its protagonists. The favored themes of Futurism are the industrial city and the new machines, symbols of speed, power, movement, aggressiveness.</p><details><summary>original (IT)</summary><p class='th-it'>1.7.4| Il Futurismo\n\nLa corrente del Futurismo nasce formalmente nel 1909 con il Manifesto del Futurismo, firmato dallo scrittore\nitaliano Filippo Tommaso Marinetti. In esso sono già contenute quasi tutte le idee che appariranno anche\nnel Manifesto dei Pittori Futuristi del 1910, sottoscritto dai pittori Boccioni, Carrà, Russolo, Severini, Balla.\n\nIl Futurismo nasce come tardivo approccio della nascente società borghese italiana al mito della rivolu-\nzione industriale, in opposizione al classicismo e contro ogni istituzione accademica, e si sviluppa in Italia\nnei primi anni del potere fascista. È caratterizzato, oltre che da una retorica altisonante teorizzata dal po-\neta Gabriele D&#x27;Annunzio (detto “il vate”), dall&#x27;interesse per la rappresentazione simultanea di tutto ciò che\nappartiene al mondo della macchina, da un atteggiamento polemicamente anti-culturale e da un forte\npatriottismo. L&#x27;intento del Futurismo, anche attraverso l&#x27;immagine, è comunque quello di scardinare tut-\nte le convenzioni, stupire, dare scandalo. Dopo la prima guerra mondiale il gruppo futurista si disperde,\nma il problema di “dare forma” al movimento si ripropone nelle ricerche individuali dei suoi protagonisti.\n| temi privilegiati dal Futurismo sono la città industriale e le nuove macchine, simbolo di velocità, poten-\nza, Movimento, aggressività.\n\nI L_-.._ D_\n\ndici di ri di</p></details>", "back": "", "conf": "low", "page": 54, "section": "", "num": null, "_i": 90}, {"kind": "theory", "src": null, "front": "<div class='kindlabel'>THEORY</div><p class='th-en'>Umberto Boccioni (1882-1916)<br><br>The leading representative of Futurist painting, and also one of its most incisive theorists, Boccioni shapes his works around the concepts of &quot;dynamism&quot; and &quot;simultaneity,&quot; in whose light he achieves a synthesis of the plastic and chromatic elements. In his paintings and sculptures, which often take the industrial metropolis as their subject, the various planes intersect and produce an effect of exasperated dynamism, so much so that the boundaries of objects tend to dissolve into the surrounding environment.<br><br>Among Boccioni&#x27;s paintings are recalled: Workshops at Porta Romana (1908), Rome, Banca Commerciale Italiana Collection; The City Rises (c. 1910), New York, Museum of Modern Art; Simultaneous Visions (1911), Hanover, Niedersächsische Landesgalerie; Matter (1912), Venice, Peggy Guggenheim Collection; Horse + Rider + Houses (1914), Rome, Galleria d&#x27;Arte Moderna.<br><br>Carlo Carrà (1881-1966)<br><br>He took an interest in art from a young age, attending the Brera Academy and its picture gallery. In the first phase of his life he was drawn to Impressionist and Expressionist art. He later joined Boccioni and Marinetti in formulating the Futurist Manifesto, under the banner of speed and boldness. The most representative works of Carrà&#x27;s Futurist period are: The Milan Railway Station (1910-11), The Funeral of the Anarchist Galli (1910-11), Night Lights (1910-11), Woman on a Balcony (1912), Plastic Transcendences (1912). Later Carrà would develop a cultural position in a modern sense, moving closer to the Metaphysical movement in search of a more balanced relationship between reality and intellectual values, between &quot;stillness and movement,&quot; in the conviction that &quot;the immaterial seeks an adequate form, and form creates the higher harmony that returns to the immaterial.&quot; The most representative works of the Metaphysical period are: The Oval of the Apparitions, Metaphysical Still Life, The Daughter of the West, The Daughters of Lot and The Metaphysical Muse.</p><details><summary>original (IT)</summary><p class='th-it'>MWIITIIOITIO DULCLITOTII | 19006712 10)\n\nMaggiore rappresentante del Futurismo pittorico, di cui\nè anche uno dei più acuti teorizzatori, Boccioni impronta\nle sue opere ai concetti di “dinamismo” e “simultaneità”,\nalla cui luce compie la sintesi dell&#x27;elemento plastico e di\nquello cromatico. Nei suoi dipinti e sculture, che hanno\nspesso per oggetto la metropoli industriale, i vari piani si\nintersecano e sortiscono un effetto di esasperato dinami-\nsmo, tanto che i confini degli oggetti tendono a scioglier-\nsi nell&#x27;ambiente circostante.\n\nTra i dipinti di Boccioni si ricordano: Officine a Porta Ro-\nmana (1908), Roma, Collezione Banca Commerciale Ita-\nliana; La città che sale (1910 ca.), New York, Museum of\nModern Art; Visioni simultanee (1911), Hannover, Nieder-\nsachsische Landesgal; Materia (1912), Venezia, Collezio-\nne Peggy Guggenheim; Cavallo + cavaliere + caseggiato\n(1914), Roma, Galleria d&#x27;Arte Moderna.\n\nCarlo Carrà (1881-1966)\nSi interessa già molto giovane all&#x27;arte, frequentando l&#x27;Ac-</p></details>", "back": "", "conf": "low", "page": 54, "section": "", "num": null, "_i": 91}, {"kind": "artwork", "src": "images/page54_img1.png", "front": "<img src='images/page54_img1.png' class='cardimg'><p class='q'>Which artwork is this? (artist / title / year)</p><details><summary>Answers</summary><p class='q'>Boccioni: Matter (1912), Venice, Peggy Guggenheim Collection, oil on canvas, 35 x 23 cm.</p></details>", "back": "", "conf": "med", "page": 54, "section": "", "num": null, "_i": 92}, {"kind": "theory", "src": null, "front": "<div class='kindlabel'>THEORY</div><p class='th-en'>He took an interest in art from a young age, attending the Brera Academy and its picture gallery. In the first phase of his life he was drawn to Impressionist and Expressionist art. He later joined Boccioni and Marinetti in formulating the Futurist Manifesto, under the banner of speed and boldness. The most representative works of Carrà&#x27;s Futurist period are: The Milan Railway Station (1910-11), The Funeral of the Anarchist Galli (1910-11), Night Lights (1910-11), Woman on a Balcony (1912), Plastic Transcendences (1912). Later Carrà would develop a cultural position in a modern sense, moving closer to the Metaphysical movement in search of a more balanced relationship between reality and intellectual values, between &quot;stillness and movement,&quot; in the conviction that &quot;the immaterial seeks an adequate form, and form creates the higher harmony that returns to the immaterial.&quot; The most representative works of the Metaphysical period are: The Oval of the Apparitions, Metaphysical Still Life, The Daughter of the West, The Daughters of Lot and The Metaphysical Muse.</p><details><summary>original (IT)</summary><p class='th-it'>cademia di Brera e la sua pinacoteca. Nella prima fase</p></details>", "back": "", "conf": "low", "page": 54, "section": "", "num": null, "_i": 93}, {"kind": "theory", "src": null, "front": "<div class='kindlabel'>THEORY</div><p class='th-en'>He took an interest in art from a young age, attending the Brera Academy and its picture gallery. In the first phase of his life he was drawn to Impressionist and Expressionist art. He later joined Boccioni and Marinetti in formulating the Futurist Manifesto, under the banner of speed and boldness. The most representative works of Carrà&#x27;s Futurist period are: The Milan Railway Station (1910-11), The Funeral of the Anarchist Galli (1910-11), Night Lights (1910-11), Woman on a Balcony (1912), Plastic Transcendences (1912). Later Carrà would develop a cultural position in a modern sense, moving closer to the Metaphysical movement in search of a more balanced relationship between reality and intellectual values, between &quot;stillness and movement,&quot; in the conviction that &quot;the immaterial seeks an adequate form, and form creates the higher harmony that returns to the immaterial.&quot; The most representative works of the Metaphysical period are: The Oval of the Apparitions, Metaphysical Still Life, The Daughter of the West, The Daughters of Lot and The Metaphysical Muse.</p><details><summary>original (IT)</summary><p class='th-it'>della sua vita fu attratto dall&#x27;arte impressionista e da\nquella espressionista. In seguito si unì a Boccioni e Marti-\nnetti nella formulazione del Manifesto Futurista all&#x27;inse-\ngna della velocità e dell&#x27;audacia. Le opere più rappresen-\ntative del periodo futurista di Carrà sono: La stazione di\nMilano (1910-11), /funerali dell&#x27;anarchico Galli (1910-11),\nLuci notturne (1910-11), Donnaal balcone (1912), Trascen-\ndenze plastiche (1912). In seguito Carrà maturerà una po-\nsizione culturale in senso moderno, avvicinandosi alla\ncorrente Metafisica per la ricerca di un più giusto rappor-\nto fra realtà e valori intellet
