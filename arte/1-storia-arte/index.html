<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Storia dell&#x27;arte · Ch. 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500&family=Space+Grotesk:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#15181c; --card:#1f242a; --panel:#191d22; --panel-h:#242a30;
  --ink:#eef2f6; --body:#e6ecf2; --muted:#93a0ad; --muted2:#9aa7b3;
  --line:#2e353d; --accent:#4f9ad6; --accent-h:#74b3e4; --chip-on:#2a3138;
  --chip:rgba(255,255,255,.09); --chip-h:rgba(255,255,255,.14);
  --label:"Space Grotesk",ui-monospace,monospace;
}
body[data-theme=light]{
  --bg:#eee2cc; --card:#f6efdd; --panel:#e4d7bb; --panel-h:#d9cba9;
  --ink:#33291e; --body:#33291e; --muted:#7f7668; --muted2:#a89c85;
  --line:#ddd0b4; --accent:#7f7668; --accent-h:#9c8f76; --chip-on:#ddd0b4;
  --chip:rgba(0,0,0,.06); --chip-h:rgba(0,0,0,.1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{overflow-x:hidden}
html,body{margin:0;background:var(--bg)}
body{color:var(--ink);font-family:'Hanken Grotesk',sans-serif;
  min-height:100dvh;display:flex;flex-direction:column;align-items:center;
  padding:0 16px env(safe-area-inset-bottom,16px)}
a{color:var(--accent);text-decoration-color:rgba(79,154,214,.5)}
a:hover{color:var(--accent-h)}

/* header */
header{width:100%;max-width:760px;display:flex;justify-content:space-between;
  align-items:center;gap:12px;flex-wrap:wrap;padding:18px 2px 14px}
h1{font-family:var(--label);font-size:17px;font-weight:600;letter-spacing:.01em;margin:0}
h1 .sub{color:var(--muted);font-weight:400}
.themes{display:flex;gap:4px;background:var(--panel);border-radius:10px;padding:3px}
.themes button{font-family:var(--label);font-size:11px;letter-spacing:.09em;text-transform:uppercase;
  border:none;border-radius:8px;padding:7px 14px;cursor:pointer;white-space:nowrap;
  background:transparent;color:var(--muted)}
.themes button.on{background:var(--chip-on);color:var(--ink)}

/* tabs */
.controls{position:sticky;top:0;z-index:10;width:100%;max-width:760px;display:flex;
  align-items:stretch;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px;
  overflow-x:auto;background:var(--bg);padding-top:8px;
  scrollbar-width:none;-ms-overflow-style:none}
.controls::-webkit-scrollbar{display:none;width:0;height:0}
.controls button{font-family:var(--label);font-size:12px;letter-spacing:.11em;text-transform:uppercase;
  background:none;border:none;cursor:pointer;padding:10px 12px 12px;white-space:nowrap;
  display:flex;align-items:baseline;gap:6px;color:var(--muted);box-shadow:none}
.controls button .c{font-size:10px;color:var(--muted);opacity:.7}
.controls button.on{color:var(--ink);box-shadow:inset 0 -2px 0 0 var(--accent)}
.controls button.on .c{color:var(--accent)}
.controls .spacer{flex:1;min-width:8px;box-shadow:none;pointer-events:none}
.controls button.shuf{color:var(--muted)}
.controls button.shuf:hover{color:var(--accent)}

/* card */
.cardwrap{width:100%;max-width:760px;display:flex}
.card{flex:1;min-height:58dvh;background:var(--card);border-radius:16px;
  padding:26px 30px 26px;
  display:flex;flex-direction:column;user-select:none;touch-action:pan-y;cursor:default}
.cardbody{user-select:text;-webkit-user-select:text}
.card.empty{align-items:center;justify-content:center;background:var(--panel);
  color:var(--muted);font-family:var(--label);font-size:13px;letter-spacing:.1em;text-transform:uppercase}

.cardhead{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.cardhead .ord{font-family:var(--label);font-size:13px;font-weight:600;letter-spacing:.05em;
  color:var(--body);background:var(--chip);border-radius:8px;padding:5px 10px}
.cardhead .kind{font-family:var(--label);font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.cardhead .meta{font-family:var(--label);font-size:11px;letter-spacing:.07em;color:var(--muted)}

.cardbody{color:var(--body);font-family:'Hanken Grotesk',sans-serif;font-weight:300;font-size:18.5px;line-height:1.68}
.cardbody p{margin:0 0 1.2em;text-wrap:pretty}
.cardbody p:last-child{margin-bottom:0}
.cardbody p.bul{margin:2.5em 0 0;padding-left:1.4em;text-indent:-1.4em}
.cardbody p.th-en.bul{margin-top:0}
.cardbody .kindlabel{display:none}
.cardbody .sec{display:none}
.cardbody .q{margin:0 0 1.2em}
.cardbody .th-en{margin:0 0 1.2em}
.cardbody .th-it{color:var(--muted2);font-size:.82em;line-height:1.65;white-space:pre-wrap}
.cardbody details{margin-top:1.3em}
.cardbody summary{cursor:pointer;color:var(--accent-h);font-family:var(--label);font-size:12px;
  letter-spacing:.13em;text-transform:uppercase}
.cardbody img.cardimg{max-width:100%;border-radius:8px;background:#fff;display:block;
  margin:0 0 20px;cursor:zoom-in}

.cardfoot{margin-top:auto;padding-top:26px;display:flex;justify-content:center}
.pass-btn{font-family:var(--label);font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  cursor:pointer;border:none;border-radius:99px;padding:10px 22px;
  color:var(--body);background:var(--chip)}
.pass-btn:hover{background:var(--chip-h)}
.pass-btn.done{color:#a9d0b6;background:rgba(120,190,150,.18)}

/* nav */
.nav{position:sticky;bottom:0;z-index:10;width:100%;max-width:760px;display:flex;
  align-items:center;gap:10px;padding:14px 0 18px;background:var(--bg)}
.nav button{flex:1;font-family:var(--label);font-size:12px;letter-spacing:.13em;text-transform:uppercase;
  background:var(--panel);color:var(--ink);border:none;border-radius:12px;padding:13px 16px;
  min-height:46px;cursor:pointer}
.nav button:hover{background:var(--panel-h)}
.nav button:active{transform:scale(.98)}
.count{font-family:var(--label);color:var(--muted);font-size:13px;min-width:72px;text-align:center}

/* zoom */
#zoom{position:fixed;inset:0;background:rgba(8,10,12,.96);display:none;
  align-items:center;justify-content:center;z-index:50;cursor:zoom-out;padding:12px}
#zoom.show{display:flex}
#zoom img{max-width:100%;max-height:100%;object-fit:contain;background:#fff;border-radius:8px}
</style></head><body>
<header>
  <h1>Storia dell&#x27;arte <span class="sub">· Ch. 1</span></h1>
  <div class="themes">
    <button data-theme="cool" class="on" onclick="setTheme('cool',this)">Cool</button>
    <button data-theme="light" onclick="setTheme('light',this)">Light</button>
  </div>
</header>

<div class="controls">
  <button id="all" class="on" onclick="setFilter('all',this)">All <span class="c" data-count="all"></span></button>
  <button onclick="setFilter('question',this)">Questions <span class="c" data-count="question"></span></button>
  <button onclick="setFilter('theory',this)">Theory <span class="c" data-count="theory"></span></button>
  <button onclick="setFilter('artwork',this)">Artworks <span class="c" data-count="artwork"></span></button>
  <button onclick="setFilter('review',this)">Review <span class="c" data-count="review"></span></button>
  <button onclick="setFilter('passed',this)">Done <span class="c" data-count="passed"></span></button>
  <span class="spacer"></span>
  <button class="shuf" onclick="shuffle()">⤨ Shuffle</button>
</div>
<div class="cardwrap"><div class="card" id="card"></div></div>
<div class="nav">
  <button onclick="prev()">← Prev</button>
  <span class="count" id="count"></span>
  <button onclick="next()">Next →</button>
</div>
<div id="zoom" onclick="closeZoom()"><img id="zoomimg" alt=""></div>
<script>
const ALL = [{"kind": "theory", "src": null, "front": "<div class='kindlabel'>THEORY</div><p class='th-en'>1 Elements of art history<br><br>1.1 | Notes on Greek and Roman sculpture<br><br>The constitutive characteristics of Greek sculpture are considered to have already taken shape by the end of the 8th century BC. Three main phases are distinguished:<br><br>- Archaic: from 610 to 480 BC, with the development of the Kouros (nude male statue) and the Kore (clothed female statue) and the emergence of the Attic school from 560 BC;<br><br>- Classical: whose full maturity is attested by the two Riace Bronzes found in Calabria in 1972 and dating to the period 460-410 BC, by the Discobolus of Myron (active between 470 and 440 BC), datable to 460 BC, and by the works of Phidias (c. 490-430 BC), among them the Anadoumenos (c. 450 BC);<br><br>- Hellenistic: from 323 BC to 30 BC, in which sculpture appears aimed above all at celebrating military successes and arousing terror or pity, with a long phase of gigantomachy (Colossus of Rhodes, Mausoleum of Halicarnassus, Altar of Pergamon, etc.).</p><details><summary>original (IT)</summary><p class='th-it'>1 Elementi di storia dell&#x27;arte\n\n1.1 | Cenni sulla scultura greca e romana\n\n| caratteri costitutivi della scultura greca si considerano delineati già dalla fine dell&#x27;VIII sec. a.C. Si distin-\nguono tre fasi principali:\n\n* — Arcaica: dal 610 al 480 a.C. con l&#x27;elaborazione del Kouros (status maschile nuda) e della Kore (statua\nfemminile vestita) e l&#x27;emergere della scuola attica dal 560 a.C.;\n\n* Classica: la cui piena maturità è testimoniata dai due Bronzi di Riace rinvenuti in Calabria nel 1972 e\nrisalenti al periodo 460-410 a.C., dal Discobolo di Mirone (attivo tra il 470 e il 440 a.C.) databile al 460\na.C. e dalle opere di Fidia (490-430 a.C. ca.), tra cui l’Anadumeno (ca. 450 a.C.);\n\n»  Ellenistica: dal 323 a.C. al 30 a.C. in cui la scultura sembra volta soprattutto a celebrare i successi\nmilitare e a suscitare terrore o pietà, con una lunga fase di gigantomachia (Colosso di Rodi, Mausoleo\ndi Alicarnasso, Ara di Pergamo ecc.).</p></details>", "back": "", "conf": "low", "page": 31, "section": "", "num": null, "_i": 0}, {"kind": "artwork", "src": "images/page31_img1.png", "front": "<img src='images/page31_img1.png' class='cardimg'><p class='q'>Which artwork is this? (artist / title / year)</p><details><summary>Answers</summary><p class='q'>Riace Bronzes (5th century BC), National Museum of Magna Graecia, approx. 200 cm.</p></details>", "back": "", "conf": "med", "page": 31, "section": "", "num": null, "_i": 1}, {"kind": "artwork", "src": "images/page31_img2.png", "front": "<img src='images/page31_img2.png' class='cardimg'><p class='q'>Which artwork is this? (artist / title / year)</p><details><summary>Answers</summary><p class='q'>Mirone: Discobolus (c. 455 BC), Rome, National Roman Museum, 124 cm.</p></details>", "back": "", "conf": "med", "page": 31, "section": "", "num": null, "_i": 2}, {"kind": "artwork", "src": "images/page31_img3.png", "front": "<img src='images/page31_img3.png' class='cardimg'><p class='q'>Which artwork is this? (artist / title / year)</p><details><summary>Answers</summary><p class='q'>Laocoön and His Sons (1st century BC), Rome, Pio-Clementino Museum, height 242 cm.</p></details>", "back": "", "conf": "med", "page": 31, "section": "", "num": null, "_i": 3}, {"kind": "theory", "src": null, "front": "<div class='kindlabel'>THEORY</div><p class='th-en'>Roman sculpture, properly speaking, is only discussed from the 2nd century BC onward, when a production of iconic statues began that broke away from the massive Etruscan influence of the previous centuries. A historical and symbolic conception that, while assimilating Greek elements, can be called properly Roman emerges above all in the sculptural complexes of the Ara Pacis (9 BC), the Arch of Titus (90 AD) and Trajan&#x27;s Column (113 AD).<br><br>1.2 | The Thirteenth and Fourteenth Centuries: Gothic Art<br><br>The Gothic age developed from the mid-13th century to the end of the 14th century approximately, with final offshoots into the 15th. During these years there is a shift from the medieval conception of art to a new confidence in culture and in man: the classical-Byzantine abstraction is abandoned in favor of a more real and earthly representation of man and life. The events and figures depicted are set within real life.</p><details><summary>original (IT)</summary><p class='th-it'>Si parla invece propriamente di scultura romana solo a partire dal Il sec. a.C. quando cominciò una pro-\nduzione di statue iconiche che si smarcava dal massiccio apporto etrusco dei secoli precedenti. Una con-\ncezione storica e simbolica che pur assimilando elementi greci può dirsi propriamente romana emerge\nsoprattutto nei complessi scultorei dell&#x27;Ara Pacis (9 a.C.), dell&#x27;Arco di Tito (90) e nella Colonna Traiana (113).\n\n1.2 | Duecento e Trecento: l&#x27;arte gotica\n\nL&#x27;età gotica si sviluppa dalla metà del secolo XIII alla fine del secolo XIV circa, con ultime propaggini nel\nXV. In questi anni si assiste al passaggio dalla concezione medioevale dell&#x27;arte a una nuova fiducia nella\ncultura e nell&#x27;uomo: si abbandona l&#x27;astrattezza classico-bizantina per una rappresentazione dell&#x27;uomo e\ndella vita più reale e terrena. Gli eventi e i personaggi dipinti vengono calati nella vita reale.</p></details>", "back": "", "conf": "low", "page": 31, "section": "", "num": null, "_i": 4}, {"kind": "theory", "src": null, "front": "<div class='kindlabel'>THEORY</div><p class='th-en'>1.2.1 | Protagonists of Italian Gothic painting of the Thirteenth and Fourteenth Centuries<br><br>Cimabue (Cenni di Pepo, documented from 1272-1302)<br><br>Drawing on late Byzantine models, Cimabue was able to infuse his figures (very often dedicated to the theme of the crucifix) with greater expressive vitality and developed a more conscious use of space and form.<br><br>Among his works are the Crucifix (before 1271), Florence, Museo dell&#x27;Opera di Santa Croce; the Crucifixion (1277-79), Assisi, Upper Basilica of St. Francis; the Maestà (Madonna of Santa Trinita), of 1280, Florence, Uffizi Gallery.<br><br>Giotto (1267-1337)<br><br>Giotto brought about a true artistic revolution, which makes him the founder of a new pictorial language in Italy. He no longer stages symbolic actions within abstract spaces, but concrete actions that take place in real settings. The background of his representations becomes a space with articulated depth.<br><br>Among his main works are the frescoes of the Legend of St. Francis (1296-1300), Assisi, Upper Church of St. Francis, and the Frescoes of the Scrovegni Chapel (1304-06) in Padua.</p><details><summary>original (IT)</summary><p class='th-it'>1.2.1 || protagonisti della pittura gotica italiana\ndel Duecento e del Trecento\n\nCimabue (Cenni di Pepo, notizie documentate dal 1272-1302)\n\nMuovendo da modelli tardo-bizantini, Cimabue seppe infondere nelle sue figure (molto spesso consacra-\nte al tema del crocifisso) maggiore vitalità espressiva e maturò un uso più consapevole dello spazio e del-\nle forme.\n\nTra le sue opere vanno ricordate il Crocifisso (anteriore al 1271), Firenze, Museo dell&#x27;Opera di Santa Croce;\n\nla Crocifissione (1277-79), Assisi, Basilica Superiore di S. Francesco; la Maestà (Madonna di S. Trinità), del\n1280, Firenze, Museo degli Uffizi.\n\nGiotto (1267-1337)\n\nGiotto opera una vera e propria rivoluzione artistica, che fa di lui il fondatore di un nuovo linguaggio pit-\ntorico in Italia. Egli non mette più in scena azioni simboliche all&#x27;interno di spazi astratti, ma azioni concre-\nte che si svolgono in ambienti reali. Lo sfondo delle sue rappresentazioni diventa uno spazio articolato in\nprofondità.\n\nTra le sue opere principali vanno ricordati gli affreschi della Leggenda di san Francesco (1296-1300), Assisi,\nChiesa Superiore di S. Francesco e gli Affreschi della Cappella degli Scrovegni (1304-06) a Padova.</p></details>", "back": "", "conf": "low", "page": 32, "section": "", "num": null, "_i": 5}, {"kind": "artwork", "src": "images/page32_img1.png", "front": "<img src='images/page32_img1.png' class='cardimg'><p class='q'>Which artwork is this? (artist / title / year)</p><details><summary>Answers</summary><p class='q'>Cimabue: Crucifix (1287-88), Florence, Basilica of Santa Croce, oil on panel, 448 x 390 cm.</p></details>", "back": "", "conf": "med", "page": 32, "section": "", "num": null, "_i": 6}, {"kind": "artwork", "src": "images/page32_img2.png", "front": "<img src='images/page32_img2.png' class='cardimg'><p class='q'>Which artwork is this? (artist / title / year)</p><details><summary>Answers</summary><p class='q'>Giotto: The Miracle of the Spring (1295-1297/1299), from the series &quot;Stories of St. Francis,&quot; Assisi, Upper Basilica of San Francesco, fresco, 270 x 200 cm.</p></details>", "back": "", "conf": "med", "page": 32, "section": "", "num": null, "_i": 7}, {"kind": "theory", "src": null, "front": "<div class='kindlabel'>THEORY</div><p class='th-en'>1.2.2 | Other important artists of the 12th and 13th centuries<br><br>Duccio di Buoninsegna (c. 1255-1318)<br><br>The leading Sienese painter of his time, he renewed Byzantine art by softening its lines into a fluidity previously unknown and making the fullest use of the potential of oriental color.<br><br>Among his main works are the Rucellai Madonna, of 1285, today in the Uffizi Gallery in Florence; the double-sided altarpiece for the high altar of Siena Cathedral, of 1308-1311, today in the Museo dell&#x27;Opera del Duomo in Siena.<br><br>Among the other artists of the 12th and 13th centuries, five names of sculptors and architects stand out: Benedetto Antelami (c. 1150-1230), sculptor and architect active mainly in Parma (Baptistery); Nicola Pisano (c. 1215-1280), whose fame is tied to the pulpits of the Baptistery of Pisa (1260) and of Siena Cathedral (1268); Giovanni Pisano (c. 1248-1315), son and collaborator of Nicola, with whom he completed the Fontana Maggiore of Perugia (1278) and who made the pulpit of Pisa Cathedral (1310); Arnolfo di Cambio (c. 1245-1302), trained in the school of the Pisano family, who worked mainly in Florence as a sculptor and architect and of whom a notable Boniface VIII Giving Blessing survives, among other works; Wiligelmo (active in Modena from c. 1099 to 1110), author of the sculptures of Modena Cathedral (whose architect was Lanfranco).</p><details><summary>original (IT)</summary><p class='th-it'>1.2.2 | Altri artisti importanti del XII e XIII secolo\n\nDuccio di Buoninsegna (1255-1318 ca.)\n\nMaggiore pittore senese del tempo, rinnovò l&#x27;arte bizantina ammorbidendo le linee in una fluidità prima\nsconosciuta e sfruttando al massimo le potenzialità del colore orientale.\n\nTra le sue opere principali si citano la Madonna Rucellai, del 1285, oggi nel Museo degli Uffizi a Firenze; la\nPala d&#x27;altare a doppia faccia per l&#x27;altare maggiore del Duomo di Siena, del 1308-1311, oggi nel Museo\ndell&#x27;Opera di Siena.\n\nTra gli altri artisti del XII e XIII secolo, cinque sono i nomi di scultori e architetti che si impongono: Bene-\ndetto Antelami (1150-1230 ca.), scultore e architetto attivo prevalentemente a Parma (Battistero); Nicola\nPisano (1215-1280 ca.) la cui fama è legata ai pulpiti del Battistero di Pisa (1260) e di quello del Duomo\ndi Siena (1268), Giovanni Pisano (1248-1315 ca.), figlio e collaboratore di Nicola, con cui ultima la Fonte\nMaggiore di Perugia (1278) e che realizza il pulpito del Duomo di Pisa (1310), Arnolfo di Cambio (1245-\n1302 ca.), formatosi alla scuola dei Pisano, che opera prevalentemente a Firenze come scultore e architet-\nto e di cui resta tra l&#x27;altro un notevole Bonifazio VIII benedicente; Wiligelmo (attivo a Modena dal 1099 al\n1110 ca.), autore delle sculture del Duomo di Modena (il cui architetto fu il Lanfranco).</p></details>", "back": "", "conf": "low", "page": 32, "section": "", "num": null, "_i": 8}, {"kind": "question", "src": null, "front": "<p class='q'>What is the country of origin of Gothic art?<br><br>A) France<br>B) England<br>C) Germany<br>D) Netherlands<br>E) Italy<br><br>Gothic art originated in northern France. The correct answer is therefore A.</p><details><summary>Answers</summary><p>Answer: A</p></details><details><summary>original (IT)</summary><p class='th-it'>Qual è il Paese di origine dell’arte gotica?\nA) Francia\nB) Inghilterra\nC) Germania\nD) Paesi Bassi\nE) Italia\n\nnella Francia settentrionale. La risposta esatta è quindi la (9.</p></details>", "back": "", "conf": "low", "page": 33, "section": "", "num": "1", "_i": 9}, {"kind": "question", "src": null, "front": "<p class='q'>What does Gothic painting place at its center?<br><br>A) The line<br>B) Perspective<br>C) None of the above<br>D) Mass<br>E) Color</p><details><summary>Answers</summary><p class='q'>The correct answer is A: Gothic-style paintings feature perfectly defined, smudge-free lines that precisely outline the figures represented.</p></details><details><summary>original (IT)</summary><p class='th-it'>La pittura gotica pone al centro: EN la massa E) il colore\nA) la linea\nB) la prospettiva\nC) 8 nessuno dei precedenti\n\nLa risposta esatta è la (8. | dipinti in stile gotico presentano infatti linee perfettamente rimarcate, senza sbavature, che circoscrivono con accurata precisione le figure rappresentate.</p></details>", "back": "", "conf": "low", "page": 33, "section": "", "num": "2", "_i": 10}, {"kind": "theory", "src": null, "front": "<div class='kindlabel'>THEORY</div><p class='th-en'>1.3 | The Fifteenth and Sixteenth Centuries: The Renaissance<br><br>The concept of the Renaissance was borrowed from that of &quot;rebirth,&quot; used for the first time by the sixteenth-century art historian Giorgio Vasari. In the field of art it is conventional to distinguish between the Early (c. 1401-69), Middle (c. 1469-92) and Late (c. 1492-1517) Renaissance. With this movement a new way of observing reality is born, both from a philosophical point of view (man is the center of the world) and from a psychological-perceptual one: reality is to be interpreted according to objective principles. In the field of the figurative arts, the principal technical instrument of this search for objectivity is perspective, that is, the set of geometric-mathematical rules needed to translate, onto a two-dimensional surface, objects arranged in three-dimensional space.<br><br>1.3.1 | Fifteenth-century painting<br><br>The fundamental decade for the change in artistic taste is that between 1420 and 1430: in Italy the Renaissance conception positioned itself as a clear alternative to the Gothic style, and research turned, first with Masaccio and then with the artists who followed and studied him, toward an increasingly marked use of light effects.<br><br>Masaccio (Tommaso di ser Giovanni Cassai, 1401-28)<br><br>Masaccio was the first Renaissance artist able to grasp and interpret the deepest and at the same time most everyday reality of man, placing this naturalness no longer in idyllic landscapes, but within an urban setting. Space is organized in perspective; light, emanating from a single source, carves out the figures through a play of shadows. Sacred narratives are simplified around a few characters, each endowed with their own precise expressiveness.<br><br>Among his major works are the Crucifixion (1426), Naples, Museo di Capodimonte; the Frescoes for the Brancacci Chapel (1424-27), Florence, Church of Santa Maria del Carmine; and the Trinity (1426-28), Florence, Santa Maria Novella.<br><br>Piero della Francesca (c. 1420-1492)<br><br>He carries the study of light in painting to its extreme consequences, a light that permeates every objective datum. Every form is traced back to its deep geometric essence: Renaissance perspective found in Piero an undisputed master.<br><br>Among his principal works are: the Baptism of Christ (1440-45), London, National Gallery; the Flagellation of Christ (1455-60), Urbino, Galleria Nazionale delle Marche; the Resurrection of Christ (1463-65), Sansepolcro, Pinacoteca Comunale; the Diptych of the Dukes of Urbino (1465), Florence, Uffizi; the Sacred Conversation (1472-74), Milan, Pinacoteca di Brera.</p><details><summary>original (IT)</summary><p class='th-it'>1.3 | Quattrocento e Cinquecento: il Rinascimento\n\nIl concetto di Rinascimento fu mutuato da quello di “rinascita” usato per la prima volta dallo storico\ndell&#x27;arte cinquecentesco Giorgio Vasari. In campo artistico è in uso una distinzione convenzionale tra pri-\nmo (1401-69 ca.), medio (1469-92 ca.) e tardo (1492-1517 ca.) Rinascimento. Con questo movimento na-\nsce un nuovo modo di osservare la realtà, sia dal punto di vista filosofico (l&#x27;uomo è il centro del mondo),\nsia da quello psicologico-percettivo: la realtà va interpretata secondo principi oggettivi. Nel campo delle\narti figurative lo strumento tecnico principale di questa ricerca di oggettività è la prospettiva, cioè l&#x27;insie-\nme delle regole geometrico-matematiche necessarie per tradurre, su una superficie a due dimensioni,\noggetti che si dislocano nello spazio tridimensionale.\n\n1.3.1 | La pittura del Quattrocento\n\nIl decennio fondamentale per il cambiamento del gusto artistico è quello compreso tra il 1420 e il 1430:\nin Italia la concezione rinascimentale si pone in netta alternativa al goticismo e la ricerca si orienta, dap-\nprima con Masaccio e poi con gli artisti che lo seguono e lo studiano, verso un utilizzo sempre più mar-\ncato degli effetti di luce.\n\nMasaccio (Tommaso di ser Giovanni Cassai 1401-28)\n\nMasaccio è il primo artista rinascimentale che abbia saputo cogliere e interpretare la realtà più profonda\ne nello stesso tempo più quotidiana dell&#x27;uomo, inserendo questa naturalità non più in idilliaci paesaggi,\nma in un quadro cittadino. Lo spazio è organizzato in maniera prospettica; la luce, sprigionandosi da\nun&#x27;unica fonte, scava le figure con un gioco d&#x27;ombre. | racconti sacri sono semplificati intorno a pochi per-\nsonaggi, dotati di una loro precisa espressività.\n\nTra le sue opere maggiori sono annoverate la Crocefissione (1426), Napoli, Museo di Capodimonte, gli Af-\nfreschi per la Cappella Brancacci (1424-27), Firenze, Chiesa di S. Maria del Carmine. e la Trinità (1426-28),\nFirenze, Santa Maria Novella.\n\nPiero della Francesca (1420 ca.-1492)\n\nPorta alle estreme conseguenze la ricerca sulla luce in pittura, luce che permea ogni dato oggettivo. Ogni\nforma viene ricondotta alla sua essenza geometrica profonda: la prospettiva rinascimentale ha in Piero\nun maestro indiscusso.\n\nTra le sue opere principali vanno citate: il Battesimo di Cristo (1440-45), Londra, National Gallery; la Flagel-\nlazione di Cristo (1455-60), Urbino, Galleria Nazionale delle Marche; la Resurrezione di Cristo, (1463-65),\nSansepolcro, Pinacoteca Comunale; il Dittico dei Duchi d&#x27;Urbino (1465), Firenze, Uffizi; la Sacra Conversa-\nzione (1472-74), Milano, Pinacoteca di Brera.</p></details>", "back": "", "conf": "low", "page": 33, "section": "", "num": null, "_i": 11}, {"kind": "theory", "src": null, "front": "<div class='kindlabel'>THEORY</div><p class='th-en'>Sandro Botticelli (1445-1510)<br><br>Two souls coexist in Botticelli&#x27;s art: a profane, secular, pagan one, and a religious, liturgical, sacred one. This interweaving can be perceived in works such as Primavera (c. 1478); the Birth of Venus (c. 1482); the Calumny of Apelles (c. 1495), all displayed in the Uffizi Gallery in Florence.<br><br>Among Botticelli&#x27;s other works are: the Adoration of the Magi (c. 1475-1480), Florence, Uffizi; Venus and Mars (1475-1480), London, National Gallery; the Madonna of the Magnificat (c. 1485) and the Madonna of the Pomegranate (1487), Florence, Uffizi.<br><br>Andrea Mantegna (1431-1506)<br><br>Characteristic of his painting are the perspectival framing, the careful finishing of every detail so as to give it plastic relief, and a mythic vision of antiquity that translates into the depiction of heroic figures, inspiring firmness and nobility of spirit.<br><br>Among his major works: the Madonna Enthroned (Bridal Madonna) (1457-59); the San Zeno Altarpiece (1456), Verona, San Zeno; the Agony in the Garden (1455-60), London, National Gallery; Saint Sebastian (1480), Paris, Louvre; the Dead Christ (1480), Milan, Pinacoteca di Brera; the frescoes of the Camera degli Sposi (c. 1465-74), Mantua, Ducal Palace.</p><details><summary>original (IT)</summary><p class='th-it'>Sandro Botticelli (1445-1510)\n\nNell&#x27;arte di Botticelli coesistono due anime: una profana, laica, pagana e una religiosa, liturgica, sacra.\nQuesto intreccio è percepibile in opere come la Primavera (1478 ca.); la Nascita di Venere (1482 ca.); la Ca-\nlunnia di Apelle (1495 ca.), tutte esposte agli Uffizi di Firenze.\n\nTra le altre opere di Botticelli si ricordano: L&#x27;adorazione dei Magi (1475-1480 ca.), Firenze, Uffizi; Venere e\nMarte (1475-1480), Londra, National Gallery; La Madonna del Magnificat (1485 ca.) e La Madonna della Me-\nlograna (1487), Firenze, Uffizi.\n\nAndrea Mantegna (1431-1506)\n\nCaratteristiche della sua pittura sono l&#x27;inquadramento prospettico, la rifinitura accurata di ogni dettaglio\nin modo da conferirgli rilievo plastico, una visione mitica dell&#x27;antichità che si traduce nella raffigurazione\ndi personaggi eroici, ispiranti fermezza e nobiltà d&#x27;animo.\n\nTra le sue opere maggiori: la Madonna in Sposa, (1457-59), la Pala di S. Zeno (1456), Verona, S. Zeno; l&#x27;Ora-\nzione di Cristo nell&#x27;orto (1455-60), Londra, National Gallery; il San Sebastiano (1480), Parigi, Louvre; Il Cristo\nmorto (1480), Milano, Pinacoteca di Brera; gli affreschi della Camera degli sposi (1465-74 ca.), Mantova, Pa-\nlazzo Ducale.</p></details>", "back": "", "conf": "low", "page": 34, "section": "", "num": null, "_i": 12}, {"kind": "artwork", "src": "images/page34_img1.png", "front": "<img src='images/page34_img1.png' class='cardimg'><p class='q'>Which artwork is this? (artist / title / year)</p><details><summary>Answers</summary><p class='q'>Piero della Francesca: Diptych of the Dukes of Urbino - Portrait of Federico da Montefeltro (1465), Florence, Uffizi Gallery, oil on panel, 47 x 33 cm.</p></details>", "back": "", "conf": "med", "page": 34, "section": "", "num": null, "_i": 13}, {"kind": "artwork", "src": "images/page34_img2.png", "front": "<img src='images/page34_img2.png' class='cardimg'><p class='q'>Which artwork is this? (artist / title / year)</p><details><summary>Answers</summary><p class='q'>Sandro Botticelli: The Birth of Venus (1482), detail, Florence, Uffizi Gallery, tempera on canvas.</p></details>", "back": "", "conf": "med", "page": 34, "section": "", "num": null, "_i": 14}, {"kind": "artwork", "src": "images/page34_img3.png", "front": "<img src='images/page34_img3.png' class='cardimg'><p class='q'>Which artwork is this? (artist / title / year)</p><details><summary>Answers</summary><p class='q'>Andrea Mantegna: Saint Sebastian (c. 1480), Paris, Louvre Museum, tempera on canvas, 257 x 142 cm.</p></details>", "back": "", "conf": "med", "page": 34, "section": "", "num": null, "_i": 15}, {"kind": "theory", "src": null, "front": "<div class='kindlabel'>THEORY</div><p class='th-en'>1.3.2 | Sixteenth-century painting<br><br>In the sixteenth century, painting developed against a backdrop of great tensions between opposing conceptions of the world and of art, in an age marked by transformations and conflicts, as well as by religious conflict and the decisive role played by the Reformation. Sixteenth-century painting has its origin in the intertwining of the inventions and shared research of Leonardo, Raphael and Michelangelo. In the phases of the late Renaissance, Mannerism then develops, while a fundamental innovative role belongs to the Venetian School with Giorgione and Titian.<br><br>Leonardo da Vinci (1452-1519)<br><br>Leonardo is the most representative embodiment of that universal man (man of letters, artist, scientist) toward whom the Renaissance age strove as an ideal model. His pictorial works, which exercised an incalculable influence despite their small number, present the discovery of atmosphere, painted with a blue, veiled light that represents distance. Leonardo&#x27;s pictorial technique is called sfumato: the figures are wrapped in an extremely subtle play of light and shade that makes them a unity devoid of rigid internal divisions.<br><br>Among Leonardo&#x27;s masterpieces: the Adoration of the Magi (1481), Florence, Uffizi; the Annunciation (1472-75), Florence, Uffizi; the Virgin of the Rocks (1483-86), Paris, Louvre; the Madonna with Saint John the Baptist as a Child, the Child, and an Angel</p><details><summary>original (IT)</summary><p class='th-it'>1.3.2 | La pittura del Cinquecento\n\nNel Cinquecento, la pittura si sviluppa sullo sfondo di grandi tensioni tra opposte concezioni del mondo\ne dell&#x27;arte, in un&#x27;epoca segnata da trasformazioni e da contrasti, nonché dal conflitto religioso e dal ruolo\ndeterminante svolto dalla Riforma. La pittura del Cinquecento trova la sua origine nell&#x27;intrecciarsi delle\ninvenzioni e delle ricerche comuni di Leonardo, Raffaello e Michelangelo. Nelle fasi dell&#x27;ultimo Rinasci-\nmento si sviluppa poi il Manierismo, mentre un ruolo innovatore fondamentale spetta alla Scuola Vene-\nziana con Giorgione e Tiziano.\n\nLeonardo da Vinci (1452-1519)\n\nLeonardo è l&#x27;incarnazione più rappresentativa di quell&#x27;uomo universale (letterato, artista, scienziato), al\nquale tende come modello ideale l&#x27;epoca rinascimentale. Le sue opere pittoriche, che esercitarono un&#x27;in-\nfluenza incalcolabile nonostante la loro esiguità numerica, presentano la scoperta dell&#x27;atmosfera, dipinta\ncon una luce azzurra e velata, che rappresenta la lontananza. La tecnica pittorica leonardesca è detta sfu-\nmato: le figure sono avvolte in un sottilissimo gioco di chiaroscuri che fa di esse un&#x27;unità priva di rigide\ndemarcazioni interne.\n\nTra i capolavori leonardeschi: l&#x27;Adorazione dei Magi (1481), Firenze, Uffizi; l&#x27;Annunciazione (1472-75), Firenze,\nUffizi; la Vergine delle rocce (1483-86), Parigi, Louvre; la Madonna con san Giovannino, il Bambino e un angelo</p></details>", "back": "", "conf": "low", "page": 34, "section": "", "num": null, "_i": 16}, {"kind": "theory", "src": null, "front": "<div class='kindlabel'>THEORY</div><p class='th-en'>(1503-06), London, National Gallery; The Last Supper (1495-98), Milan, Refectory of Santa Maria delle Grazie; Saint Anne, the Madonna, the Child and the Lamb (c. 1510), Paris, Louvre; the Mona Lisa (1503-05), Paris, Louvre.</p><details><summary>original (IT)</summary><p class='th-it'>(1503-06), Londra, National Gallery; L&#x27;ultima cena (1495-98), Milano, Refettorio di Santa Maria delle Grazie;\nSant&#x27;Anna, la Madonna, il Bambino e l&#x27;agnello (1510 ca.), Parigi, Louvre; La Gioconda (1503-05), Parigi, Louvre.</p></details>", "back": "", "conf": "low", "page": 35, "section": "", "num": null, "_i": 17}, {"kind": "artwork", "src": "images/page35_img1.png", "front": "<img src='images/page35_img1.png' class='cardimg'><p class='q'>Which artwork is this? (artist / title / year)</p><details><summary>Answers</summary><p class='q'>Lady with an Ermine (1488, Portrait of Cecilia Gallerani), Krakow, Czartoryski Museum, oil on panel, 55 x 40 cm.</p></details>", "back": "", "conf": "med", "page": 35, "section": "", "num": null, "_i": 18}, {"kind": "artwork", "src": "images/page35_img2.png", "front": "<img src='images/page35_img2.png' class='cardimg'><p class='q'>Which artwork is this? (artist / title / year)</p><details><summary>Answers</summary><p class='q'>The Last Supper (1495-1498), detail, Milan, Refectory of Santa Maria delle Grazie, fresco; tempera and oil on two layers of plaster, 460 x 880 cm.</p></details>", "back": "", "conf": "med", "page": 35, "section": "", "num": null, "_i": 19}, {"kind": "theory", "src": null, "front": "<div class='kindlabel'>THEORY</div><p class='th-en'>Raphael Sanzio (1483-1520)<br><br>He conceives of space in an intense, conceptual, solemn and classical manner. In his Florentine period (1504-08) he achieves a prodigious synthesis of the most advanced Leonardesque and Michelangelesque tendencies. The frescoes for the Vatican Apartments constitute the cultural, aesthetic and artistic culmination of all the humanistic, philosophical and religious ideals of the Renaissance.<br><br>Among Raphael&#x27;s finest paintings are: the Marriage of the Virgin (1504), Milan, Pinacoteca di Brera; the Portrait of Agnolo Doni (1506), Florence, Pitti Palace; the School of Athens (1509-10), Vatican City, Stanza della Segnatura; the Parnassus (1510-11), the Madonna of the Goldfinch (1507), Florence, Uffizi; the Portrait of Baldassare Castiglione (1514-15), Paris, Louvre; the Portrait of Leo X with Two Cardinals; the Sistine Madonna (1513-14), Dresden; the Triumph of Galatea (1513), Rome, Villa Farnesina; the Transfiguration (1518-20), Vatican City, Vatican Pinacoteca; the Vision of Ezekiel (1518), Florence, Palazzo Pitti.</p><details><summary>original (IT)</summary><p class='th-it'>Raffaello Sanzio (1483-1520)\n\nConcepisce lo spazio in modo intenso, concettuale, solenne e classico. Nel periodo fiorentino (1504-08)\nopera una prodigiosa sintesi delle più avanzate tendenze leonardesche e michelangiolesche. Gli affreschi\nper gli Appartamenti Vaticani costituiscono il punto d&#x27;arrivo culturale, estetico e artistico di tutti gli ideali\numanistici, filosofici e religiosi del Rinascimento.\n\nTra le migliori tele di Raffaello vanno annoverate: lo Sposalizio della Vergine (1504), Milano, Pinacoteca di\nBrera; il Ritratto di Agnolo Doni (1506), Firenze, Pitti; la Scuola d&#x27;Atene (1509-10), Città del Vaticano, Stanza\ndella Segnatura; il Parnaso (1510-11), la Madonna del Cardellino (1507) Firenze, Uffizi; il Ritratto di Baldas-\nsarre Castiglione (1514-15), Parigi, Louvre; il Ritratto di Leone X con due cardinali; la Madonna Sistina (1513-\n14) Dresda; il Trionfo di Galatea (1513), Roma, Farnesina; la Trasfigurazione (1518-20), Città del Vaticano,\nPinacoteca Vaticana; la Visione di Ezechiele (1518), Firenze, Palazzo Pitti.</p></details>", "back": "", "conf": "low", "page": 35, "section": "", "num": null, "_i": 20}, {"kind": "artwork", "src": "images/page35_img3.png", "front": "<img src='images/page35_img3.png' class='cardimg'><p class='q'>Which artwork is this? (artist / title / year)</p><details><summary>Answers</summary><p class='q'>The School of Athens (1509), Vatican City, Stanza della Segnatura, fresco, approx. 700 x 500 cm.</p></details>", "back": "", "conf": "med", "page": 35, "section": "", "num": null, "_i": 21}, {"kind": "artwork", "src": "images/page35_img4.png", "front": "<img src='images/page35_img4.png' class='cardimg'><p class='q'>Which artwork is this? (artist / title / year)</p><details><summary>Answers</summary><p class='q'>Vision of Ezekiel (1518), Florence, Palatine Gallery, Palazzo Pitti, panel.</p></details>", "back": "", "conf": "med", "page": 35, "section": "", "num": null, "_i": 22}, {"kind": "theory", "src": null, "front": "<div class='kindlabel'>THEORY</div><p class='th-en'>Michelangelo Buonarroti (1475-1564)<br><br>It is in the frescoes for the vault of the Sistine Chapel that the essence of Michelangelo&#x27;s art can be grasped - architect and sublime sculptor, as well as a supreme painter. This is the most overwhelming artistic achievement of the century, a space-painting that transformed the chapel&#x27;s vault into a work of thought, into a celebration at once religious, cultural and philosophical, in which two centuries of painting and spirituality are synthesized. The tonal, unreal color suggests the visionary character of this cosmos of figures, but it also represents the rejection of a naturalistic interpretation of art and the supremacy, among the elements of painting, of drawing, of graphic and design intentionality.<br><br>Among Michelangelo&#x27;s masterpieces are the Holy Family (Doni Tondo) (1504-06), Florence, Uffizi; the Vault of the Sistine Chapel (1508-12), Vatican City; the Last Judgment (1536-41), Vatican City; the Conversion of Saul (1542-45), Vatican City, Pauline Chapel; the Crucifixion of Saint Peter (1546-50). The same creative tension, straining to overcome matter, animates his sculptures, among which are recalled the Bacchus (1496-97), Florence, Museo Nazionale del Bargello; the David (1501-04), Florence, Galleria dell&#x27;Accademia; the Slave &quot;Atlas&quot; (1530-34), Florence, Galleria dell&#x27;Accademia; the Rondanini Pietà (1552-64), Milan, Museo del Castello Sforzesco; the Tomb of Lorenzo de&#x27; Medici, Florence, New Sacristy of San Lorenzo.</p><details><summary>original (IT)</summary><p class='th-it'>Michelangelo Buonarroti (1475-1564)\n\nÈ negli affreschi per la volta della Cappella Sistina che si coglie l&#x27;essenza dell&#x27;arte di Michelangelo, archi-\ntetto e scultore sublime, oltre che pittore eccelso. Si tratta dell&#x27;esito artistico più sconvolgente del secolo,\nuno spazio-pittura che ha trasformato la volta della cappella in un&#x27;opera di pensiero, in una celebrazione\ninsieme religiosa, culturale e filosofica, in cui si sintetizzano due secoli di pittura e di spiritualità. Il colore\ntimbrico e irreale suggerisce il carattere visionario di questo cosmo di figure, ma rappresenta anche il ri-\nfiuto di un&#x27;interpretazione naturalistica dell&#x27;arte e la supremazia, tra gli elementi della pittura, del dise-\ngno, dell&#x27;intenzionalità grafica e progettuale.\n\nTra i capolavori michelangioleschi si ricordano la Sacra Famiglia (Tondo Doni) (1504-06), Firenze, Uffizi; la\nVolta della Cappella Sistina (1508-12), Città del Vaticano; il Giudizio Universale (1536-41) Città del Vaticano;\nla Conversione di Saulo (1542-45), Città del Vaticano, Cappella Paolina; la Crocifissione di San Pietro (1546-\n50). La stessa tensione creativa, anelante a vincere la materia, anima le sue sculture, tra le quali si ricorda\nil Bacco (1496-97), Firenze, Museo Nazionale del Bargello; il David (1501-04), Firenze, Galleria dell&#x27;Accade-\nmia; lo Schiavo “Atlante” (1530-34), Firenze, Galleria dell&#x27;Accademia; la Pietà Rondanini (1552-64), Milano,\nMuseo del Castello Sforzesco; la Tomba di Lorenzo de’ Medici, Firenze, Sagrestia Nuova di San Lorenzo.</p></details>", "back": "", "conf": "low", "page": 36, "section": "", "num": null, "_i": 23}, {"kind": "artwork", "src": "images/page36_img1.png", "front": "<img src='images/page36_img1.png' class='cardimg'><p class='q'>Which artwork is this? (artist / title / year)</p><details><summary>Answers</summary><p class='q'>The Deluge (1508-1509), Vatican City, Vatican Palaces, on the Sistine Chapel ceiling, fresco, 280 x 570 cm.</p></details>", "back": "", "conf": "med", "page": 36, "section": "", "num": null, "_i": 24}, {"kind": "artwork", "src": "images/page36_img2.png", "front": "<img src='images/page36_img2.png' class='cardimg'><p class='q'>Which artwork is this? (artist / title / year)</p><details><summary>Answers</summary><p class='q'>The Last Judgment (1536-1541), Vatican City, Vatican Palaces, Sistine Chapel, fresco, 1370 x 1220 cm.</p></details>", "back": "", "conf": "med", "page": 36, "section": "", "num": null, "_i": 25}, {"kind": "theory", "src": null, "front": "<div class='kindlabel'>THEORY</div><p class='th-en'>1.3.3 | Renaissance Sculpture<br><br>The two most representative sculptors of the Renaissance are the just-mentioned Michelangelo Buonarroti and the Florentine Donatello (1386-1466), of whom are recalled the bronze David (c. 1440), the marble Saint John the Evangelist (1415) and the equestrian statue of Gattamelata (1450).</p><details><summary>original (IT)</summary><p class='th-it'>1.3.3 | La Scultura del Rinascimento\n\n| due sculturi più rappresentativi del Rinascimento sono l&#x27;appena citato Michelangelo Buonarroti e il\nfiorentino Donatello (1386-1466), di cui vanno ricordati il David in bronzo (1440 ca.), il marmoreo San\nGiovanni Evangelista (1415) e la statua equestre del Gattamelata (1450).</p></details>", "back": "", "conf": "low", "page": 36, "section": "", "num": null, "_i": 26}, {"kind": "theory", "src": null, "front": "<div class='kindlabel'>THEORY</div><p class='th-en'>Florence, Museo Nazionale del Bargello, bronze sculpture, 158 cm including the base.</p><details><summary>original (IT)</summary><p class='th-it'>Firenze, Museo\nnazionale del Bargello,\nscultura in bronzo, 158 conla base).</p></details>", "back": "", "conf": "low", "page": 36, "section": "", "num": null, "_i": 27}, {"kind": "artwork", "src": "images/page36_img3.png", "front": "<img src='images/page36_img3.png' class='cardimg'><p class='q'>Which artwork is this? (artist / title / year)</p><details><summary>Answers</summary><p class='q'>Donatello: David (or Mercury, c. 1440).</p></details>", "back": "", "conf": "med", "page": 36, "section": "", "num": null, "_i": 28}, {"kind": "artwork", "src": "images/page36_img4.png", "front": "<img src='images/page36_img4.png' class='cardimg'><p class='q'>Which artwork is this? (artist / title / year)</p><details><summary>Answers</summary><p class='q'>Michelangelo Buonarroti: David (1501-1504), Florence, Accademia Gallery, marble sculpture, height 410 cm (517 cm).</p></details>", "back": "", "conf": "med", "page": 36, "section": "", "num": null, "_i": 29}, {"kind": "artwork", "src": "images/page36_img5.png", "front": "<img src='images/page36_img5.png' class='cardimg'><p class='q'>Which artwork is this? (artist / title / year)</p><details><summary>Answers</summary><p class='q'>Michelangelo Buonarroti: Pietà (1497-1499), Rome, St. Peter&#x27;s Basilica in the Vatican, marble sculpture, height 174 cm.</p></details>", "back": "", "conf": "med", "page": 36, "section": "", "num": null, "_i": 30}, {"kind": "theory", "src": null, "front": "<div class='kindlabel'>THEORY</div><p class='th-en'>1.3.4 | The Venetian School: Giorgione and Titian<br><br>The innovation of Venetian painting consists in bringing to the highest symbolic prominence the pursuit of atmospheric tone, with the aim of achieving a kind of fusion between the human world and the natural world, immersed in the same luminous harmony. Surface color prevails over chiaroscuro. The intent is to capture a moment of spatial reality, marked by light and natural atmosphere, seeking to idealize and universalize it.<br><br>Giorgione (Giorgio Zorzi, or da Castelfranco, 1477-1510)<br><br>Making use of color modulated through imperceptible gradations and skipping the preparatory stages of drawing and shading, Giorgione stages the vital relationship between man and nature, often against the backdrop of classical culture. In his paintings, whose subjects are often hermetic, a sense of suspension dominates. Among the artist&#x27;s works, few in number, stand out: the Double Portrait (1502), Rome, Museo di Palazzo Venezia; the Castelfranco Altarpiece (c. 1505), Castelfranco Veneto, Church of San Liberale; the Tempest (c. 1506), Venice, Gallerie dell&#x27;Accademia; The Three Philosophers (1508), Vienna, Kunsthistorisches Museum; the Sleeping Venus (1508-10), Dresden.<br><br>Titian (Tiziano Vecellio, 1490-1576)<br><br>He began with monumental works, using sunny, bright colors. In these paintings, which avoid all intimacy or transcendence, human and divine reality are rendered with the overwhelming force of a simultaneous visual emotion, gradually refined into feeling and emotion. In his mature years, also drawing on the subtleties and intricacy of Mannerist drawing, Titian darkens the atmospheres and corrupts the figures into a sublime &quot;unfinished&quot; quality.<br><br>Among his masterpieces are the Assumption (1516-18), Venice, Santa Maria dei Frari; the Sacred Conversation with the Doctors (Pesaro Altarpiece, 1519-26), Venice, Santa Maria dei Frari; Sacred and Profane Love (c. 1515), Rome, Galleria Borghese; Bacchus and Ariadne (1522-23), London, National Gallery; the Danaë (1545-46), Naples, Gallerie Nazionali di Capodimonte; the Martyrdom of Saint Lawrence (1548-59), Venice, Church of the Gesuiti; the Crowning with Thorns (1570), Munich.</p><details><summary>original (IT)</summary><p class='th-it'>1.3.4 | La Scuola Veneziana: Giorgione e Tiziano\n\nL&#x27;innovazione della pittura veneta consiste nel portare alla massima rilevanza simbolica la ricerca del tono\natmosferico, nell&#x27;intento di realizzare una sorta di fusione tra mondo umano e mondo naturale, immersi\nnella stessa armonia luminosa. Il colore di superficie prevale sul chiaroscuro. L&#x27;intento è di cogliere un mo-\nmento della realtà spaziale, segnato dalla luce e dall&#x27;atmosfera naturale, cercando di idealizzarlo e uni-\nversalizzarlo.\n\nGiorgione (Giorgio Zorzi o da Castelfranco, 1477-1510)\n\nRicorrendo a un colore modulato nelle sue impercettibili gradazioni e saltando le fasi preparatorie del dise-\ngno e dell&#x27;ombreggiatura, Giorgione mette in scena il rapporto vitale tra uomo e natura, spesso sullo sfon-\ndo della cultura classica. Nei suoi dipinti, dai soggetti spesso ermetici, domina un senso di sospensione.\nTra le opere dell&#x27;artista, esigue per numero, spiccano: il Doppio ritratto (1502), Roma, Museo di Palazzo Ve-\nnezia; la Pala di Castelfranco (1505 ca.), Castelfranco Veneto, Chiesa di San Liberale; la Tempesta (1506 ca.)\nVenezia, Gallerie dell&#x27;Accademia; / tre filosofi (1508) Vienna, Kunsthistorisches Museum; la Venere Dor-\nmiente (1508-10) Dresda.\n\nTiziano (Tiziano Vecellio, 1490-1576)\n\nEsordisce con opere monumentali, ricorrendo a colori solari, squillanti. In tali dipinti, che evitano ogni in-\ntimismo o trascendenza, la realtà umana e quella divina vengono rese con la forza dirompente di una si-\nmultanea emozione visiva, via via affinata in sentimento e commozione. Negli anni della maturità, sfrut-\ntando anche le sottigliezze e la tortuosità del disegno manierista, Tiziano incupisce le atmosfere e\ncorrompe le figure in un sublime “non finito”.\n\nTra i suoi capolavori si annoverano L&#x27;Assunta (1516-18), Venezia, Santa Maria dei Frari; la Sacra conversa-\nzione coi Dottori (Pala Pesaro, 1519-26), Venezia, Santa Maria dei Frari; L’Amor sacro e l&#x27;Amor profano (1515\nca.), Roma, Galleria Borghese; Bacco e Arianna (1522-23) Londra, National Gallery; le Danae, (1545-46), Na-\npoli, Gallerie Nazionali di Capodimonte; il Martirio di San Lorenzo (1548-59), Venezia, Chiesa dei Gesuiti;\nl&#x27;Incoronazione di spine (1570), Monaco.</p></details>", "back": "", "conf": "low", "page": 37, "section": "", "num": null, "_i": 31}, {"kind": "artwork", "src": "images/page37_img1.png", "front": "<img src='images/page37_img1.png' class='cardimg'><p class='q'>Which artwork is this? (artist / title / year)</p><details><summary>Answers</summary><p class='q'>Bacchus and Ariadne (1522-23), London, National Gallery, oil on panel, 175 x 190 cm.</p></details>", "back": "", "conf": "med", "page": 37, "section": "", "num": null, "_i": 32}, {"kind": "theory", "src": null, "front": "<div class='kindlabel'>THEORY</div><p class='th-en'>1.3.5 | Mannerism<br><br>Mannerism can be divided into two periods: the first (1520-40), characterized by strong expressiveness and formal innovations, and the second, after 1540, in which the repetition of earlier formulas and content prevails. Mannerism should be understood as an autonomous artistic period, situated between the Renaissance and the Baroque. It gives rise to a stylistically refined art, adapted to an almost exclusively aristocratic and courtly patronage. At its foundation lies an awareness of the &quot;artificiality&quot; of art, and thus of its formal and thematic autonomy from reality. It also coincides with the progressive decline of the perspectival and proportional conventions typical of the Renaissance vision. The artist claims a greater expressive freedom for himself.<br><br>Jacopo Tintoretto (Jacopo Robusti, 1518-94)<br><br>The principal architect of the establishment of Mannerism in the Venetian area, Tintoretto excelled at depicting masses of crowded, moving figures. His painting is made of extremely rapid brushstrokes and an often dazzling, incandescent light, always carefully rendered in its subtle chromatic nuances. The calm proportions and rigorous symmetry of the Renaissance masters are overturned, while the spatial arrangement of the figures within the paintings becomes complex. Nature itself appears transfigured, losing its realistic guise. Among his works are recalled: The Miracle of the Slave (1548), Venice, Gallerie dell&#x27;Accademia; Susanna and the Elders (c. 1557), Vienna, Kunsthistorisches Museum; The Finding of the Body of Saint Mark (1562-66), Milan, Pinacoteca di Brera; The Stealing of the Body of Saint Mark (1562-66), Venice, Gallerie dell&#x27;Accademia; The Last Supper (1592-94), Venice, San Giorgio Maggiore.<br><br>Other Mannerist artists worthy of mention are: Parmigianino (Francesco Mazzola, 1503-40), whose main works are: The Madonna with the Long Neck (c. 1535), Florence, Uffizi; the Self-Portrait (1524), Vienna, Kunsthistorisches Museum; Pontormo (Jacopo Carrucci, 1494-1556); Rosso Fiorentino (1495-1540); Domenico Beccafumi (1486-1551); and Bronzino (Agnolo di Cosimo, 1503-72).</p><details><summary>original (IT)</summary><p class='th-it'>Il Manierismo\n\nIl Manierismo può essere suddiviso in due periodi: il primo (1520-40), caratterizzato da una forte espres-\nsività e da novità formali e il secondo, successivo al 1540, in cui prevale la ripetizione di formule e di con-\ntenuti precedenti. Il Manierismo va concepito come un periodo artistico autonomo, compreso tra Rina-\nscimento e Barocco. Esso dà vita a un&#x27;arte stilisticamente raffinata, adattata a una committenza quasi\nesclusivamente aristocratica e di corte. AI suo fondamento vi è la consapevolezza dell&#x27;“artificiosità”\ndell&#x27;arte e dunque della sua autonomia formale e contenutistica rispetto alla realtà. Esso coincide inoltre\ncon il progressivo declinare delle convenzioni prospettiche e proporzionali, proprie della visione rinasci-\nmentale. L&#x27;artista fa propria una maggiore libertà espressiva.\n\nJacopo Tintoretto (Jacopo Robusti, 1518-94)\n\nPrincipale artefice dell&#x27;affermazione del Manierismo in area veneziana, Tintoretto eccelle nella raffigura-\nzione di masse di personaggi accalcati e in movimento. La sua pittura è fatta di tratti rapidissimi e di una\nluce spesso abbagliante, incandescente, sempre curata nei suoi sottili cromatismi. Le pacate proporzioni\ne la rigorosa simmetria dei maestri rinascimentali sono sovvertite, mentre complessa si fa l&#x27;articolazione\nspaziale delle figure all&#x27;interno dei quadri. La stessa natura risulta trasfigurata, perdendo la sua veste re-\nalistica. Tra le sue opere si ricordano: /l miracolo di San Marco che libera lo schiavo (1548), Venezia, Gallerie\ndell&#x27;Accademia; Susanna e i vecchioni (1557 ca.), Vienna, Kunsthistorisches Museum; /l ritrovamento del\ncorpo di San Marco (1562-66), Milano, Pinacoteca di Brera; /l trafugamento del corpo di San Marco (1562-\n66), Venezia, Gallerie dell&#x27;Accademia; l&#x27;Ultima Cena (1592-94), Venezia, San Giorgio Maggiore.\n\nAltri artisti manieristi meritevoli di menzione sono: Parmigianino (Francesco Mazzola, 1503-40), le cui\nopere principali sono: La Madonna dal collo lungo, (1535 ca.), Firenze, Uffizi; l&#x27;Autoritratto, (1524) Vienna,\nKunsthistorisches Museum; Pontormo (Jacopo Carrucci, 1494-1556); Rosso Fiorentino (1495-1540); Do-\nmenico Beccafumi (1486-1551) e Bronzino (Agnolo di Cosimo, 1503-72).</p></details>", "back": "", "conf": "low", "page": 38, "section": "", "num": null, "_i": 33}, {"kind": "artwork", "src": "images/page38_img1.png", "front": "<img src='images/page38_img1.png' class='cardimg'><p class='q'>Which artwork is this? (artist / title / year)</p><details><summary>Answers</summary><p class='q'>St. Mark Frees the Slave (1547-48), Venice, Accademia Gallery, oil on canvas, 416 x 544 cm.</p></details>", "back": "", "conf": "med", "page": 38, "section": "", "num": null, "_i": 34}, {"kind": "theory", "src": null, "front": "<div class='kindlabel'>THEORY</div><p class='th-en'>The greatest sculptor of the Mannerist period was Benvenuto Cellini (1500-71), of whom are recalled the Saliera in gold and enamel (1543) and the bronze Perseus made for the Piazza della Signoria in Florence and completed in 1554.<br><br>1.4 | The Seventeenth Century: The Baroque<br><br>The term Baroque was used for the first time by eighteenth-century art criticism (J. Winckelmann) to designate the work of architects such as Borromini, Bernini, Pietro da Cortona (who was also a painter) and of poets such as Giovan Battista Marino. Historically, Baroque production should be placed between the crisis of Mannerism (end of the sixteenth century) and the advent of Neoclassicism (c. 1750). The Baroque can be defined as the first civilization of the image, in the sense that for the first time the &quot;image&quot; acquires a predominant relevance over content.<br><br>On one hand, the Baroque appears as an art form close to modern sensibility, in that it exalts creativity and interaction among the various arts; on the other, it expresses an ideological dependence on Catholicism, in that it accentuates the pedagogical and persuasive character of its content. In order to propagate the truths of the faith, the Baroque artist aims to produce a strong emotional impact on the viewer, integrating vivid imagination with meticulous attention to certain details, against a backdrop of spectacular staging. Space is no longer perspectival, as in the Renaissance, but dynamic. Sculpture takes on great importance, its champion being Gian Lorenzo Bernini (1598-1680), to whom masterpieces such as the Ecstasy of Saint Teresa (1652) and the Head of Medusa (1648) are owed.<br><br>Caravaggio (Michelangelo Merisi, 1571-1610)<br><br>He is the most revolutionary Italian artist of the century. He has no equal in the boldness of his content and in his deliberate will to cause scandal through an extremely raw interpretation of the human condition. In his eyes only the present exists, the immediate experience of things and events, which he depicts without bowing to convention or to any preconceived ideal of &quot;beauty.&quot; Even his saints and madonnas (for which he was among the first to use common people as models) are nothing but tragic figures of the human condition. The technical means he employs is a very strong chiaroscuro: the figures are often immersed in dark, almost obscure settings, in which light, falling as if through slits onto faces and objects, creates sudden bursts of great suggestive power and emotional intensity.</p><details><summary>original (IT)</summary><p class='th-it'>Il maggiore scultore del periodo manierista fu Benvenuto Cellini (1500-71) di cui si ricordano la Saliera\nin oro e smalti (1543) e il Perseo in bronzo realizzato per la fiorentina Piazza della Signoria e ultimato nel\n1554.\n\n1.4 | Seicento: il Barocco\n\nIl termine Barocco venne usato per la prima volta dalla critica d&#x27;arte settecentesca (J. Winckelmann) per\nindicare l&#x27;opera di architetti come Borromini, Bernini, Pietro da Cortona (che fu anche pittore) e di poeti\ncome Giovan Battista Marino. Storicamente, la produzione barocca va collocata tra la crisi del Manierismo\n(fine del Cinquecento) e l&#x27;avvento del Neoclassicismo (1750 ca.). Il Barocco si può definire la prima civiltà\n\ndell&#x27;immagine, nel senso che per la prima volta l’immagine” acquista una rilevanza preponderante ri-\nspetto ai contenuti.\n\nDa una parte il Barocco appare come una forma d&#x27;arte vicina alla sensibilità moderna, che esalta cioè la\ncreatività e l&#x27;interazione tra le varie arti; dall&#x27;altra esprime una dipendenza ideologica dal cattolicesimo,\nin quanto accentua il carattere pedagogico e persuasivo dei suoi contenuti. Per propagandare le realtà\ndella fede, l&#x27;artista barocco mira a produrre un forte impatto emotivo sullo spettatore, integrando una fer-\nvida immaginazione con la cura meticolosa di alcuni dettagli, sullo sfondo di scenografie spettacolari. Lo\nspazio non è più prospettico, come nel Rinascimento, ma dinamico. Grande rilevanza assume la scultura,\nil cui campione è Gian Lorenzo Bernini (1598-1680), cui si devono capolavori come Lestasi di Santa Tere-\nsa (1652) e la Testa di Medusa (1648).</p></details>", "back": "", "conf": "low", "page": 39, "section": "", "num": null, "_i": 35}, {"kind": "artwork", "src": "images/page39_img1.png", "front": "<img src='images/page39_img1.png' class='cardimg'><p class='q'>Which artwork is this? (artist / title / year)</p><details><summary>Answers</summary><p class='q'>Cellini: Perseus (1554), Florence, Piazza della Signoria, bronze sculpture, height 320 cm (519 cm).</p></details>", "back": "", "conf": "med", "page": 39, "section": "", "num": null, "_i": 36}, {"kind": "artwork", "src": "images/page39_img2.png", "front": "<img src='images/page39_img2.png' class='cardimg'><p class='q'>Which artwork is this? (artist / title / year)</p><details><summary>Answers</summary><p class='q'>Bernini: The Ecstasy of Saint Teresa (1652), Rome, Church of Santa Maria della Vittoria, sculpture in marble and gilded bronze.</p></details>", "back": "", "conf": "med", "page": 39, "section": "", "num": null, "_i": 37}, {"kind": "theory", "src": null, "front": "<div class='kindlabel'>THEORY</div><p class='th-en'>Caravaggio (Michelangelo Merisi, 1571-1610)<br><br>He is the most revolutionary Italian artist of the century. He has no equal in the boldness of his content and in his deliberate will to cause scandal through an extremely raw interpretation of the human condition. In his eyes only the present exists, the immediate experience of things and events, which he depicts without bowing to convention or to any preconceived ideal of &quot;beauty.&quot; Even his saints and madonnas (for which he was among the first to use common people as models) are nothing but tragic figures of the human condition. The technical means he employs is a very strong chiaroscuro: the figures are often immersed in dark, almost obscure settings, in which light, falling as if through slits onto faces and objects, creates sudden bursts of great suggestive power and emotional intensity.</p><details><summary>original (IT)</summary><p class='th-it'>Caravaggio (Michelangelo Merisi, 1571-1610)\n\nÈ l&#x27;artista italiano più rivoluzionario del secolo. Non ha confronti per la spregiudicatezza dei suoi conte-\nnuti e per la consapevole volontà di dare scandalo mediante un’interpretazione estremamente cruda del-\nla condizione umana. Ai suoi occhi esiste solo il presente, l&#x27;esperienza immediata delle cose e degli eventi,\nche egli raffigura senza piegarsi alle convenzioni o a un ideale precostituito di “bello”. Persino i suoi santi\ne le sue madonne (per i quali egli fu tra i primi a utilizzare come modelli alcuni popolani) non sono che\nfigure tragiche della condizione umana. Il mezzo tecnico impiegato è un fortissimo chiaroscuro: le figure\nsono spesso immerse in ambienti cupi, quasi bui, nei quali la luce, piombando come da feritoie su volti e\noggetti, crea squarci improvvisi, di grande suggestione e intensità emotiva.</p></details>", "back": "", "conf": "low", "page": 39, "section": "", "num": null, "_i": 38}, {"kind": "theory", "src": null, "front": "<div class='kindlabel'>THEORY</div><p class='th-en'>Among his works must be recalled the Supper at Emmaus (1596-98), London, National Gallery; the Calling of Saint Matthew (c. 1599), Rome, Church of San Luigi dei Francesi; the Conversion of Saul (or Conversion of Saint Paul, c. 1600), Rome, Church of Santa Maria del Popolo; the Deposition (c. 1602), Rome, Vatican Pinacoteca; the Death of the Virgin (c. 1605), Paris, Louvre; the Beheading of Saint John the Baptist (1608), Valletta, Co-Cathedral of Saint John.</p><details><summary>original (IT)</summary><p class='th-it'>Tra le sue opere si devono ricordare la Cena in Emmaus (1596-98), Londra, National Gallery; la Vocazione\ndi San Matteo (1599 ca.), Roma, Chiesa di San Luigi dei Francesi; la Caduta di Saulo (0 Conversione di San\nPaolo, 1600 ca.), Roma, Chiesa di Santa Maria del Popolo; la Deposizione (1602 ca.), Roma, Pinacoteca Va-\nticana; la Morte della Madonna (1605 ca.), Parigi, Louvre; la Decollazione del Battista (1608), La Valletta, Cat-\ntedrale di San Giovanni.</p></details>", "back": "", "conf": "low", "page": 40, "section": "", "num": null, "_i": 39}, {"kind": "artwork", "src": "images/page40_img1.png", "front": "<img src='images/page40_img1.png' class='cardimg'><p class='q'>Which artwork is this? (artist / title / year)</p><details><summary>Answers</summary><p class='q'>Conversion of Saint Paul (1600-01), Rome, Santa Maria del Popolo, Cerasi Chapel, oil on canvas, 230 x 175 cm.</p></details>", "back": "", "conf": "med", "page": 40, "section": "", "num": null, "_i": 40}, {"kind": "theory", "src": null, "front": "<div class='kindlabel'>THEORY</div><p class='th-en'>Pietro da Cortona (Pietro Berrettini, 1596-1669)<br><br>His paintings show an extreme sensitivity, founded on color and on a complex, tumultuous representation that tends to overflow, through its ostentatious painting, beyond the boundaries of the assigned space. Notable in his output are the Triumph of Divine Providence (1633-39), Rome, Palazzo Barberini, and the Rape of the Sabine Women (1626), Rome, Pinacoteca Capitolina.<br><br>Nicolas Poussin (French artist, 1594-1665)<br><br>He knew how to absorb and blend various influences of his time, from Venetian color to the classical Renaissance ideal. With a sure hand at drawing, he brought to life paintings with mythological and landscape backgrounds, full of grace and simplicity.<br><br>Among his works are recalled the Rape of the Sabine Women (1637), New York, Metropolitan Museum; the Triumph of Flora (c. 1630), Paris, Louvre; Landscape with Orpheus and Eurydice (c. 1650), Paris, Louvre.<br><br>Peter Paul Rubens (Flemish artist, 1577-1640)<br><br>He spread the ideological content of the Catholic Counter-Reformation through his works; his painting is dominated by an extremely rich, bright and luminous color that gives the representation notable dynamism. Among his masterpieces are: Self-Portrait with His Wife (1609), Munich, Alte Pinakothek; Landscape with Philemon and Baucis (c. 1630), Vienna, Kunsthistorisches Museum; The Rape of the Daughters of Leucippus (c. 1618), Munich, Alte Pinakothek; Allegory of Sight (1619), Madrid, Museo del Prado; The Education of Marie de&#x27; Medici (1621-1625), Paris, Louvre; The Judgment of Paris (c. 1638), Madrid, Prado.</p><details><summary>original (IT)</summary><p class='th-it'>Pietro da Cortona (Pietro Berrettini, 1596-1669)\n\n| suoi quadri mostrano un&#x27;estrema sensibilità, fondata sul colore e su una rappresentazione complessa e\ntumultuosa che tende a debordare, in virtù della sua ostentata pittura, dai confini dello spazio assegnato.\nNella sua produzione si segnalano il Trionfo della Divina Provvidenza (1633-39), Roma, Palazzo Barberini e\nil Ratto delle Sabine (1626), Roma, Pinacoteca Capitolina.\n\nNicolas Poussin (artista francese, 1594-1665)\n\nSeppe far proprie e fondere varie suggestioni del proprio tempo, dal colore veneziano all&#x27;ideale classico\nrinascimentale. Con un disegno sicuro dà vita a quadri a sfondo mitologico e paesaggistico, pieni di gra-\nzia e semplicità.\n\nTra le sue opere si ricordano il Ratto delle Sabine (1637), New York, Metropolitan Museum; il Trionfo di Flora\n(1630 ca.), Parigi, Louvre; Paesaggio con Orfeo e Euridice (1650 ca.), Parigi, Louvre.\n\nPieter Paul Rubens (artista fiammingo, 1577-1640)\n\nDiffonde con le sue opere i contenuti ideologici della Controriforma cattolica; la sua pittura è dominata\nda un colore ricchissimo, squillante e luminoso che assicura alla rappresentazione una notevole dinami-\ncità. Tra i suoi capolavori spiccano: Autoritratto con la moglie (1609), Monaco, Alte Pinakothek; Paesaggio\ncon Filemone e Bauci (1630 ca.), Vienna, Kunsthistorisches Museum; // ratto delle figlie di Leucippo (1618\nca.), Monaco, Alte Pinakothek; Allegoria della vista (1619) Madrid, Museo del Prado; L&#x27;educazione di Maria\nde’ Medici (1621-1625), Parigi, Louvre; /l giudizio di Paride (1638 ca.), Madrid, Prado.</p></details>", "back": "", "conf": "low", "page": 40, "section": "", "num": null, "_i": 41}, {"kind": "artwork", "src": "images/page41_img1.png", "front": "<img src='images/page41_img1.png' class='cardimg'><p class='q'>Which artwork is this? (artist / title / year)</p><details><summary>Answers</summary><p class='q'>Allegory of Sight (c. 1619, in collaboration with Jan Bruegel), Madrid, Prado Museum, oil on wood, 65 x 109 cm.</p></details>", "back": "", "conf": "med", "page": 41, "section": "", "num": null, "_i": 42}, {"kind": "theory", "src": null, "front": "<div class='kindlabel'>THEORY</div><p class='th-en'>Rembrandt (Harmenszoon van Rijn, Dutch artist, 1606-1669)<br><br>Rembrandt, with his introverted sensibility, develops an interiorized interpretation of reality and an unceasing search for what lies hidden behind the world of phenomena. Making use of every possible expedient, he gives shape to a world overwhelming in its richness and depth.<br><br>Among his works stand out the Self-Portrait with Gorget (1629), The Hague, Mauritshuis; the Portrait of His Mother as a Prophetess (1630), Essen, Von Bohlen und Halbach Collection; The Anatomy Lesson of Dr. Tulp (1632), The Hague, Mauritshuis; The Night Watch (1642), Amsterdam, Rijksmuseum; Young Man Bathing in a Stream (1655), London, National Gallery; Self-Portrait Laughing (1665), Cologne, Wallraf-Richartz Museum.<br><br>Velázquez (Diego Rodríguez de Silva y, Spanish artist, 1599-1660)<br><br>Velázquez&#x27;s pictorial activity was devoted mainly to portraiture. His subjects belong almost entirely to the Spanish royal family and to noble court families. In portraying them, Velázquez manages to convey the truest aspect of a social class free of any concern.<br><br>Among his works are Las Lanzas (or The Surrender of Breda, 1634-35), Madrid, Prado; Philip IV Standing (1635), London, National Gallery; Venus at Her Mirror (1648-51), London, National Gallery; The Triumph of Bacchus, also called The Drunkards (1629), Madrid, Prado; Las Meninas (1656), Madrid, Prado; The Spinners (1657), Madrid, Prado.</p><details><summary>original (IT)</summary><p class='th-it'>Rembrandt (Harmenszoon von Rijn, artista olandese, 1606-1669)\n\nRembrandt con la sua sensibilità introversa, sviluppa un&#x27;interpretazione interiorizzata della realtà e una\nricerca inesausta di ciò che si nasconde dietro il mondo dei fenomeni. Servendosi di ogni espediente pos-\nsibile, dà forma a un mondo sconvolgente per ricchezza e profondità.\n\nTra le sue opere spiccano l&#x27;Autoritratto con gorgiera (1629), l&#x27;Aja, Mauritshuis; il Ritratto della madre in veste\ndi profetessa (1630), Essen, Collezione Von Bohlen und Halbachi; La lezione di anatomia del dottor Tulp\n(1632), l&#x27;Aja, Mauritshuis; La ronda di notte (1642), Amsterdam, Rijksmuseum; Giovane che si bagna in un\nruscello (1655), Londra, National Gallery; Autoritratto ridente (1665), Colonia, Wallraf-Richartz Museum.\n\nVelàsquez (Diego Rodriguez de Silva y, artista spagnolo, 1599-1660)\n\nL&#x27;attività pittorica di Velasquez è volta prevalentemente alla ritrattistica. | suoi soggetti appartengono\nquasi tutti alla casa regnante spagnola e alle nobili famiglie di corte. Ritraendoli, Velàsquez riesce a tra-\nsmettere l&#x27;aspetto più vero di una classe sociale priva di qualsiasi preoccupazione.\n\nTra le sue opere si annoverano Las Lanzas (o La resa di Breda, 1634-35), Madrid, Prado; Filippo IV in piedi\n\n(1635), Londra, National Gallery; Venere allo specchio (1648-51), Londra, National Gallery; /beonio il Trionfo\ndi Bacco (1629), Madrid, Prado; Las Meninas (1656), Madrid, Prado; Le filatrici (1657), Madrid, Prado.</p></details>", "back": "", "conf": "low", "page": 41, "section": "", "num": null, "_i": 43}, {"kind": "artwork", "src": "images/page41_img2.png", "front": "<img src='images/page41_img2.png' class='cardimg'><p class='q'>Which artwork is this? (artist / title / year)</p><details><summary>Answers</summary><p class='q'>Rembrandt: The Anatomy Lesson of Dr. Tulp (1632), The Hague, Mauritshuis, oil on canvas, 169 x 216 cm.</p></details>", "back": "", "conf": "med", "page": 41, "section": "", "num": null, "_i": 44}, {"kind": "artwork", "src": "images/page41_img3.png", "front": "<img src='images/page41_img3.png' class='cardimg'><p class='q'>Which artwork is this? (artist / title / year)</p><details><summary>Answers</summary><p class='q'>Velasquez: The Triumph of Bacchus (1628-1629), Madrid, Prado Museum, oil on canvas, 165 x 227 cm.</p></details>", "back": "", "conf": "med", "page": 41, "section": "", "num": null, "_i": 45}, {"kind": "question", "src": null, "front": "<p class='q'>Which of the following traits is NOT attributable to Mannerism?<br><br>A) Formal elegance<br>B) Virtuoso execution<br>C) Cult of perspective<br>D) Complexity of subjects<br>E) Classicism of subjects<br><br>The trait expressed in option E is an essential feature of Renaissance art, against which Mannerist aesthetics reacted. E is therefore the correct answer.</p><details><summary>Answers</summary><p>Answer: E</p></details><details><summary>original (IT)</summary><p class='th-it'>Quale dei seguenti caratteri non è attribuibile al Manierismo?\nA) Eleganza formale\nB) Virtuosismo esecutivo\nC) ulto della prospettiva\nD) omplessità dei soggetti\nE) { diassicità dei soggetti\nF) La caratteristica espressa dall&#x27;alternativa (\nG) è un carattere essenziale dell’arte del Rinascimento, contro\n\nla quale si indirizza l&#x27;estetica manieristica. La (® è quindi la risposta corretta.</p></details>", "back": "", "conf": "low", "page": 42, "section": "", "num": "1", "_i": 46}, {"kind": "question", "src": null, "front": "<p class='q'>In which of the following works was the Renaissance first theorized as a fundamental aesthetic category in its own right?<br><br>A) Leon Battista Alberti&#x27;s De Pictura<br>B) Leonardo&#x27;s Studies on Architecture<br>C) Michelangelo&#x27;s Rhymes (Rime)<br>D) Pietro Aretino&#x27;s Stories (Le Storie)<br>E) Vasari&#x27;s Lives (Le Vite)</p><details><summary>Answers</summary><p class='q'>The correct answer is E. In his work, Vasari states that, starting with fifteenth-century Florence, a &quot;rebirth&quot; occurred in the arts, marked by the imitation of nature and the rediscovery of classical models.</p></details><details><summary>original (IT)</summary><p class='th-it'>In quale delle seguenti opere il Rinascimento viene per la prima volta teorizzato come una fondamentale categoria estetica a sé stante? Le Vite del Vasari\nA) Il De Pictura di Leon Batttista Alberti\nB) Gli Studi di architettura di Leonardo\nC) Le Rime di Michelangelo\nD) {3 Le Storie di Pietro Aretino\n\nLa risposta esatta è la (. Nella sua opera il Vasari afferma infatti che, a partire dal Quattrocento fiorentino, si sarebbe verificata una “rinascita” nelle arti, nel segno dell&#x27;imitazione della natura e della riscoperta dei modelli classici.</p></details>", "back": "", "conf": "low", "page": 42, "section": "", "num": "2", "_i": 47}, {"kind": "question", "src": null, "front": "<p class='q'>For the Baroque artist, what kind of relationship can be said to exist between the viewer and the artwork?<br><br>A) Intellectual<br>B) Emotional<br>C) Abstract<br>D) Descriptive<br>E) Intuitive</p><details><summary>Answers</summary><p class='q'>The correct answer is B: Baroque art aimed at a direct emotional engagement with the viewer, a tendency that persisted into the eighteenth century.</p></details><details><summary>original (IT)</summary><p class='th-it'>Il rapporto tra lo spettore e l&#x27;opera, per l&#x27;artista barocco, può dirsi di tipo:\nA) intellettuale\nB) emozionale\nC) astratto\nD) descrittivo\nE) 8 intuitivo\nF) sposta possibile è quindi la {3}\nG) 1,5 | Settecento</p></details>", "back": "", "conf": "low", "page": 42, "section": "", "num": "3", "_i": 48}, {"kind": "theory", "src": null, "front": "<div class='kindlabel'>THEORY</div><p class='th-en'>1.5.1 | Rococo<br><br>Contrary to what some critics maintain, Rococo is not a stylistic degeneration of the Baroque, but an art with autonomous characteristics, situated historically alongside the Baroque and before the Neoclassical period (1675-1764). The fundamental aspect of Rococo lies in the new conception of architectural space, especially interiors, in which there is an extreme enhancement of furnishings, particularly furniture and the so-called minor arts, such as porcelain, tapestry-making, and decorative objects in general. Rococo brings the pastel painting technique to its highest expressive possibilities. The sketch takes on particular importance as an artistic genre in its own right.<br><br>The themes most exploited in painting are mythological and Arcadian, while in all artistic fields the most recurrent forms are the undulating shell shapes and S-shapes. Rococo is also a lifestyle marked by a hedonism tinged with skepticism. In the first half of the century, Rococo painting reaches considerable heights with artists such as Watteau, Fragonard and Hogarth, who push the sentimental and anecdotal content of representation to the point of exasperation.</p><details><summary>original (IT)</summary><p class='th-it'>1.5.1 |Il Rococò\n\nContrariamente a quanto sostengono alcuni critici, il Rococò non è una degenerazione stilistica del Ba-\nrocco, ma un&#x27;arte con caratteristiche autonome, situabile storicamente accanto al Barocco e prima del\nperiodo Neoclassico (1675-1764). L&#x27;aspetto fondamentale del Rococò risiede nella nuova concezione del-\nlo spazio architettonico, specie degli interni, nei quali si nota un&#x27;estrema valorizzazione dell&#x27;arredo, in\nparticolare dei mobili e delle arti cosiddette minori, come la porcellana, la lavorazione degli arazzi, l&#x27;og-\ngettistica in generale. Il Rococò porta alle massime possibilità espressive la tecnica della pittura a pastello.\nParticolare importanza assume lo schizzo, come genere artistico a sé stante.\n\n| temi maggiormente sfruttati in pittura sono di genere mitologico e arcadico, mentre in tutti i campi ar-\ntistici le forme più ricorrenti sono quelle a conchiglia ondulata e quelle a esse. Il Rococò è anche uno stile\ndi vita improntato a un edonismo venato di scetticismo. Nella prima metà del secolo la pittura rococò rag-\ngiunge punte considerevoli con artisti come Watteau, Fragonard e Hogarth, che accentuano fino\nall&#x27;esasperazione i contenuti sentimentali e aneddotici della rappresentazione.</p></details>", "back": "", "conf": "low", "page": 42, "section": "", "num": null, "_i": 49}, {"kind": "theory", "src": null, "front": "<div class='kindlabel'>THEORY</div><p class='th-en'>Jean-Antoine Watteau (French artist, 1684-1721)<br><br>In his paintings a warm, knowing light gives life to an analytical realism, attentive to minute details. Scenes of gallant parties, set in dreamy, light atmospheres, nonetheless sometimes let an existential unease and depth show through, which will make Watteau a painter dear to the Romantics.<br><br>Among his works are the Conversation in a Park (1716-19), Dresden; the Embarkation for Cythera (1717-18), Berlin, Charlottenburg Palace.<br><br>Jean-Honoré Fragonard (French artist, 1732-1806)<br><br>A leading figure of late Rococo, he show
