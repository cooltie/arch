tuali, fra «staticità e movimen-\nto», nella convinzione che «l&#x27;immateriale cerca adeguata\nforma, e la forma crea la superiore armonia che ritorna\nall&#x27;immateriale». Le opere più rappresentative del perio-\ndo metafisico sono: L&#x27;ovale delle apparizioni, Natura mor-\nta metafisica, La figlia dell&#x27;ovest, Le figlie di Loth e La musa\nmetafisica</p></details>", "back": "", "conf": "low", "page": 54, "section": "", "num": null, "_i": 94}, {"kind": "artwork", "src": "images/page54_img2.png", "front": "<img src='images/page54_img2.png' class='cardimg'><p class='q'>Which artwork is this? (artist / title / year)</p><details><summary>Answers</summary><p class='q'>Carrà: The Metaphysical Muse (1917), Milan, Pinacoteca di Brera, oil on canvas, 89 x 65 cm.</p></details>", "back": "", "conf": "med", "page": 54, "section": "", "num": null, "_i": 95}, {"kind": "theory", "src": null, "front": "<div class='kindlabel'>THEORY</div><p class='th-en'>1.7.5 | Metaphysical Art<br><br>It aims to represent what lies beyond the phenomenal world and to grasp a second, interior, deep, invisible reality. In painting, the Metaphysical school, which arose in Ferrara in 1917 through the will of Giorgio de Chirico and Carlo Carrà (1881-1966), expresses a desire for a return to order, for a recovery of figuration against the destruction of form carried out by Cubism and Futurism.<br><br>Giorgio de Chirico (Italian artist, 1888-1978)<br><br>An artist of profound culture, not only pictorial, hostile to the contemporary avant-gardes, which he nonetheless partly influenced, de Chirico paints objects that appear enigmatic, outside of time and laden with mystery. Recurrent are architectural structures (which exist in and of themselves without marking out space or alluding to their inhabitants) and mannequins. From 1918, de Chirico collaborated with M. Broglio&#x27;s journal Valori Plastici, which called for a return to the origins of Italian painting.<br><br>Among his paintings are recalled: Portrait of G. Apollinaire (1914), Paris, private collection; Hector and Andromache (1917), Milan, Mattioli Collection; Metaphysical Interior with Small Building (c. 1916), Milan, private collection.<br><br>Other exponents of the Metaphysical movement were Alberto Savinio, Ardengo Soffici and Giorgio Morandi (1890-1964), famous for his still lifes.</p><details><summary>original (IT)</summary><p class='th-it'>1.7.5 | La Metafisica\n\nSi propone di rappresentare ciò che si trova al di là del mondo fenomenico e di cogliere una seconda re-\naltà interiore, profonda, invisibile. Nella pittura la scuola metafisica, sorta a Ferrara nel 1917 per volontà\ndi Giorgio de Chirico e Carlo Carrà (1881-1966), esprime un desiderio di ritorno all&#x27;ordine, di recupero del-\nla figuratività contro la distruzione della forma operata dal Cubismo e dal Futurismo.\n\nGiorgio De Chirico (artista italiano, 1888-1978)\n\nArtista di profonda cultura non solo pittorica, ostile alle avanguardie coeve, che pure in parte influenzò,\nDe Chirico dipinge oggetti che risultano enigmatici, fuori del tempo e carichi di mistero. Ricorrenti sono\nle strutture architettoniche (che vivono di per se stesse senza scandire lo spazio o alludere ai suoi abitatori)\ne i manichini. Dal 1918, De Chirico collaborò alla rivista Valori plastici di M. Broglio, che predicava un ritor-\nno alle origini della pittura italiana.\n\nTra i suoi quadri vanno ricordati: Ritratto di G. Apollinaire (1914), Parigi, collezione privata; Ettore e Andro-\nmaca (1917), Milano, Collezione Mattioli; Interno metafisico con piccolo fabbricato (1916 ca.), Milano, Col-\nlezione privata.\n\nAltri esponenti del movimento metafisico furono Alberto Savinio, Ardengo Soffici e Giorgio Morandi\n(1890-1964, del quale sono famose le nature morte).</p></details>", "back": "", "conf": "low", "page": 55, "section": "", "num": null, "_i": 96}, {"kind": "artwork", "src": "images/page55_img1.png", "front": "<img src='images/page55_img1.png' class='cardimg'><p class='q'>Which artwork is this? (artist / title / year)</p><details><summary>Answers</summary><p class='q'>The Enigma of a Day (1914), New York, Museum of Modern Art (MoMA), oil on canvas, 185 x 139 cm.</p></details>", "back": "", "conf": "med", "page": 55, "section": "", "num": null, "_i": 97}, {"kind": "theory", "src": null, "front": "<div class='kindlabel'>THEORY</div><p class='th-en'>1.7.6 | Dadaism<br><br>A movement that cannot be confined to a single art form, it was born in Zurich in 1915-16 from the meeting of a group of artistic and intellectual figures, among them H. Ball, H. Hennings, M. Janco, Tristan Tzara, J. Evola, H. Richter, and H. Arp.<br><br>An aggressive and irreverent avant-garde movement, Dadaism rejects every ethical and artistic value of tradition, drawing on the principles of chance and irony in its concrete creative process, and on the use of found materials (such as bicycles, bottle racks, etc.).</p><details><summary>original (IT)</summary><p class='th-it'>1.7.6|Il Dadaismo\n\nMovimento non circoscrivibile a una singola forma d&#x27;arte, nasce a Zurigo nel 1915-16 dall&#x27;incontro di un\ngruppo di personalità artistiche e intellettuali, tra cui H. Ball, H. Hennings, G. Janco, Tristan Tzara, J. Evola,\nH. Richter, H. Harp.\n\nMovimento d&#x27;avanguardia aggressivo e dissacrante, il Dadaismo rigetta ogni valore etico e artistico della\ntradizione, ispirandosi nel concreto processo creativo ai principi della casualità, dell&#x27;ironia e all&#x27;utilizzo di\nmateriali trovati (come biciclette, scolabottiglie ecc.).</p></details>", "back": "", "conf": "low", "page": 55, "section": "", "num": null, "_i": 98}, {"kind": "theory", "src": null, "front": "<div class='kindlabel'>THEORY</div><p class='th-en'>Having developed in various centers (Zurich, Barcelona, Berlin), each with its own artistic character, Dadaism achieved its most original results in New York, between 1915 and 1920, through the work of Marcel Duchamp and Man Ray.<br><br>Man Ray (American artist, 1890-1976)<br><br>With his ready-mades (already-made objects), Man Ray aims to provoke, by juxtaposing two or more pieces, a sensation of disturbance, bewilderment and ironic provocation, making use of titles that heighten the enigmatic character of his works.<br><br>He is also an original inventor of creative processes, such as rayograph painting, watercolor on sandpaper, the airbrush, and was also one of the first artistic photographers.<br><br>Among his works are recalled: Man Ray (1914), London, R. Penrose collection; À l&#x27;Heure de l&#x27;Observatoire - Les Amoureux (1932-34), Longpont-sur-Orge, private collection; Rayograph (1925), Turin, private collection.<br><br>Marcel Duchamp (French artist, 1887-1968)<br><br>For Duchamp, the work of art is reduced to a private act, not classifiable according to any objective hierarchy of aesthetic values. The result of this conception is the creation of ingenious, entirely useless mechanisms; the exhibiting as works of art of common objects (with clear ironic intent); the making of absurd constructions; the production of Surrealist short films; and the printing of experimental photographs. In this way art becomes a mental fact, the result of a conceptualization, and it is precisely along this path that a great many artists in the second half of our century would move.<br><br>Among Duchamp&#x27;s works are: Nude Descending a Staircase No. 2 (1912), Philadelphia, Museum of Art; L.H.O.O.Q., a ready-made (made in Paris by painting a small mustache on a reproduction of the Mona Lisa), New York, M. Sisler collection; Fountain (1917); The Bride Stripped Bare by Her Bachelors, Even (also known as: The Large Glass, 1915-23), Philadelphia, Museum of Art; Paris Air (1919-64), Milan, Galleria Schwarz; Bicycle Wheel (1913), Neuilly; Bottle Rack (1914-64).</p><details><summary>original (IT)</summary><p class='th-it'>Sviluppatosi in vari centri di diffusione (Zurigo, Barcellona, Berlino), aventi ciascuno una propria fisiono-\nmia artistica, il Dadaismo raggiunse i suoi risultati più originali a New York, tra il 1915 e il 1920, per opera\ndi Marcel Duchamp e Man Ray.\n\nMan Ray (artista statunitense, 1890-1976)\n\nCon i suoi ready-made (oggetti già fatti), Man Ray mira a provocare, accostando tra loro due o più pezzi,\nuna sensazione di perturbamento, di sconcerto e di ironica provocazione, servendosi di titoli che accen-\ntuano il carattere enigmatico delle sue opere.\n\nEgli è inoltre originale inventore di procedimenti creativi, come la pittura a strappo, l&#x27;acquarello su carta\nvetrata, l&#x27;aerografo, nonché uno dei primi fotografi artistici.\n\nTra le sue opere vanno ricordate: Man ray (1914), Londra, collezione R. Penrose; À l&#x27;heure de l&#x27;observatoire,\nLes amoreux (1932-34), Longpont-sur-Orge, collezione privata; Rayogramma (1925), Torino, collezione\nprivata.\n\nMarchel Duchamp (artista francese, 1887-1968)\n\nPer Duchamp, l&#x27;opera d&#x27;arte si riduce a un atto privato, non catalogabile secondo una gerarchia oggettiva\ndi valori estetici. Il risultato di tale concezione è la messa a punto di ingegnosi meccanismi del tutto inutili\nl&#x27;esposizione come opere d&#x27;arte di oggetti comuni (con chiaro intento ironico), l&#x27;elaborazione di costru.\nzioni assurde, la cura di cortometraggi surrealisti e la stampa di fotografie sperimentali. In tal modo l&#x27;arte\ndiviene un fatto mentale, il risultato di una concettualizzazione e proprio su questa strada si muoverannc\nmoltissimi artisti nella seconda metà del nostro secolo.\n\nTra le opere di Duchamp si segnalano: Nudo che discende le scale n. 2 (1912), Philadelphia, Museum of Art\nL. H. 0. O. Q, ready-made (eseguito a Parigi dipingendo dei baffetti a una riproduzione della Gioconda)\nNew York, Collezione M. Sisler; Fountain (1917); La sposa messa a nudo dai suoi scapoli (o anche: il Grande\nvetro, 1915-23), Philadelphia, Museum of Art; Aria di Parigi (1919-64), Milano, Galleria Schwarz; Ruota d\nbicicletta (1913), Neully; Scolabottiglie (1914-64).</p></details>", "back": "", "conf": "low", "page": 56, "section": "", "num": null, "_i": 99}, {"kind": "artwork", "src": "images/page56_img1.png", "front": "<img src='images/page56_img1.png' class='cardimg'><p class='q'>Which artwork is this? (artist / title / year)</p><details><summary>Answers</summary><p class='q'>Nude Descending a Staircase, No. 2 (1912), Philadelphia, Philadelphia Museum of Art, oil on canvas, 146 x 89 cm.</p></details>", "back": "", "conf": "med", "page": 56, "section": "", "num": null, "_i": 100}, {"kind": "theory", "src": null, "front": "<div class='kindlabel'>THEORY</div><p class='th-en'>1.7.7 | Surrealism<br><br>It was officially born in Paris in 1924, with the first Surrealist Manifesto written by the poet André Breton. The Surrealists paid particular attention to the fantastic, dreamlike, mad and unconscious dimension of man (also drawing on Freud&#x27;s psychoanalysis): the aim was to give direct voice to this obscure dimension, without intellectual mediation, making use where possible of new techniques (such as frottage, a chance drawing obtained by rubbing; smoke painting; photomontages and typographic compositions). The movement&#x27;s objective is a total upheaval of human interiority; so that, unlike other avant-gardes such as Dadaism, its program is not limited to a simple polemical and destructive phase. The best-known exponents of the movement were Joan Miró, Salvador Dalí, Max Ernst and René Magritte.<br><br>Joan Miró (Spanish artist, 1893-1983)<br><br>Having freed himself early on from figurative art, Miró is a master of a lyrical abstraction that he develops in a highly personal key, light to the point of the fantastical, treating the themes of the unconscious and of memory typical of Surrealism. In his paintings a limited series of graphic signs and fantastic figurations are varied endlessly, with elementary, unmixed colors.<br><br>Among Miró&#x27;s works are recalled: The Farm (1921-22), New York, E. Hemingway Collection; Harlequin&#x27;s Carnival (1924-25), Buffalo, The Albright-Knox Gallery; Person in Front of Nature (1935), Philadelphia, Museum of Art; Constellations (1940), New York, George Acheson Collection.<br><br>1.7.8 | De Stijl and Neoplasticism<br><br>In 1917 a magazine titled De Stijl began to appear in Leiden, Holland. Its promoter was Theo van Doesburg (1883-1931). It championed a poetics that, in opposition to the triumph of individualism in art, aimed to achieve an objective painting, of mathematical balance and rigor, capable of renouncing any naturalistic reference. The greatest exponent of these ideas in the figurative field is Piet Mondrian.<br><br>Piet Mondrian (Dutch artist, 1872-1944)<br><br>Starting from Cubist experiences, he developed endless expressive variations on an almost constant content, based on objective laws concerning composition, rhythm and color in painting. Every remaining trace of figuration is thus abolished in an entirely abstract art. Among Mondrian&#x27;s works are: The Silver Tree (1911), The Hague, Gemeentemuseum; Composition (1913), Eindhoven, Van Abbe Museum; Painting I (1913), Basel, private collection; Composition with Blue and Yellow (1932), Philadelphia, Museum of Art; Composition with Yellow, Blue and Red (1937-42), London, Tate Collection; Broadway Boogie Woogie (1942-1943), New York, Museum of Modern Art.</p><details><summary>original (IT)</summary><p class='th-it'>1.7.7 | Il Surrealismo\n\n\\asce ufficialmente a Parigi nel 1924, con il primo Manifesto Surrealista scritto dal poeta André Breton. |\nurrealisti prestano particolare attenzione alla dimensione fantastica, onirica, folle e inconscia dell&#x27;uomo\nanche sulla base della psicoanalisi di Freud): si tratta di dare voce diretta a tale dimensione oscura, senza\nmediazioni intellettuali, servendosi al caso di tecniche nuove (come il frottage, disegno casuale ottenuto\nner mezzo di sfregamento; la pittura a fumo; i fotomontaggi e le composizioni tipografiche). Obiettivo del\nmovimento è un rivolgimento totale dell&#x27;interiorità umana; cosicché a differenza di altre avanguardie co-\nNe il dadaismo, il suo programma non si limita a una semplice fase polemica e distruttiva. Gli esponenti\niù noti del movimento sono stati Juan Mirò, Salvador Dalì, Max Ernst e René Magritte.\n\nloan Mirò (artista spagnolo, 1893-1983)\n\nvincolatosi ben presto dall&#x27;arte figurativa, Mirò è maestro di un astrattismo lirico che elabora in chiave\nnolto personale, leggera sino ai limiti del fiabesco, le tematiche dell&#x27;inconscio e del ricordo tipiche del\nurrealismo. Nei suoi quadri una serie limitata di segni grafici e di figurazioni fantastiche vengono variati\nl&#x27;infinito, con colori elementari, non mescolati.\n\nra le opere di Mirò vanno ricordate: La fattoria (1921-22), New York, Collezione E. Hemingway; I carneva-\ne di Arlecchino (1924-25), Buffalo, The Albright-Knox Gallery; Personaggio di fronte alla natura (1935), Phi-\nadelphia, Museum of Art; Constellations (1940), New York, Collezione George Acheson.\n\n1.7.8 | Der Stijl e il Neoplasticismo\n\nlel 1917 esce in Olanda, a Leida, una rivista intitolata Der Stij/. Suo promotore è Theo Van Doesburg\n1883-1931). Essa si fa promotrice di una poetica che, in opposizione al trionfo dell&#x27;individualismo in arte,\nnira a realizzare una pittura oggettiva, dall&#x27;equilibrio e dal rigore matematici, che sappia rinunciare a\njualsiasi riferimento naturalistico. Massimo esponente di tali idee in campo figurativo è Piet Mondrian.\n\niet Mondrian (artista olandese, 1872-1944)\n\n’artito da esperienze cubiste, sviluppa infinite variazioni espressive di un contenuto pressoché costante,\nulla base di leggi oggettive concernenti la composizione, il ritmo e il colore della pittura. Ogni residuo\nli figuratività è così abolito in un&#x27;arte del tutto astratta. Tra le opere di Mondrian si segnalano: L&#x27;albero ar-\nJentato (1911) L&#x27;Aia, Gemeente Museum; Composizione (1913), Eindhoven, Van Abbe Museum; Quadro |\n1913), Basilea, Collezione privata; Composizione con azzurro e giallo (1932), Philadelphia, Museum of Art;\n‘omposizione con giallo, blu e rosso (1937-42) Londra, Tate Collection; Broadway boogie-woogie (1942-\n943), New York, Museum of Modern Art.</p></details>", "back": "", "conf": "low", "page": 57, "section": "", "num": null, "_i": 101}, {"kind": "artwork", "src": "images/page57_img1.png", "front": "<img src='images/page57_img1.png' class='cardimg'><p class='q'>Which artwork is this? (artist / title / year)</p><details><summary>Answers</summary><p class='q'>Mondrian: Composition with Yellow, Blue and Red (1937-1942), London, Tate Collection, oil on canvas, 72 x 69 cm.</p></details>", "back": "", "conf": "med", "page": 57, "section": "", "num": null, "_i": 102}, {"kind": "artwork", "src": "images/page57_img2.png", "front": "<img src='images/page57_img2.png' class='cardimg'><p class='q'>Which artwork is this? (artist / title / year)</p><details><summary>Answers</summary><p class='q'>Constellation, Awakening at Dawn (1941), Fort Worth, Texas, Kimbell Foundation, oil on paper, 46 x 38 cm.</p></details>", "back": "", "conf": "med", "page": 57, "section": "", "num": null, "_i": 103}, {"kind": "theory", "src": null, "front": "<div class='kindlabel'>THEORY</div><p class='th-en'>1.7.9 | Pop Art<br><br>Pop (short for &quot;Popular&quot;) Art developed in America in the 1950s. It sought to present utterly banal objects, without thereby aiming at an explicit shock effect, ideological denunciation, or utopian projection. The poetics of Pop Art consists in absolutely emphasizing the ordinary appearance of things. It is precisely this obsessive insistence, however, that ultimately produces the aesthetic jolt of surprise and the artistic quality of the work. The best-known exponents of the movement are Andy Warhol and Roy Lichtenstein (1923-97).<br><br>Andy Warhol (American artist, 1930-87)<br><br>Warhol&#x27;s favorite subjects are the advertising signs of mass products (such as Coca-Cola, Campbell&#x27;s soup cans), music and film stars (such as Elvis Presley, Marilyn Monroe, James Dean), and film stills of accidents and scenes of violence. He displays these figures in long series of identical images, repetitive to the point of obsession, often animating them with bright colors: the meaning that emerges from this is the anguish of modern life. Among the works that made Warhol famous are: Marilyn (1962), Leo Castelli Collection, New York; Four Campbell&#x27;s Soup Cans (1965); Green Coca-Cola Bottles (1962), New York, Whitney Museum; Ladies and Gentlemen (1975).</p><details><summary>original (IT)</summary><p class='th-it'>1.7.9|La Pop Art\n\nLa Pop (abbreviazione per “Popular”) Art si sviluppa in America negli anni Cinquanta. Essa vuole presen-\ntare oggetti del tutto banali, senza con ciò mirare a un esplicito effetto di shock, di denuncia ideologica\no di proiezione utopistica. La poetica della Pop Art consiste nel sottolineare in maniera assoluta l&#x27;aspetto\nnormale delle cose. Proprio tale insistenza ossessiva finisce però per determinare lo scatto estetico della\nsorpresa e l&#x27;artisticità dell&#x27;opera. Gli esponenti più famosi del movimento sono Andy Warhol e Roy\n\nLichtenstein (1923-97).\n\nAndy Warhol (artista statunitense, 1930-87)\n\nGli oggetti prediletti da Warhol sono le insegne pubblicitarie di prodotti di massa (come la Coca Cola, le\nscatole delle minestre Campell&#x27;s), i divi della musica e del cinema (come Elvis Presley, Marylin Monroe, Ja-\nmes Dean), fotogrammi di incidenti e di scene di violenza. Egli espone tale figure in lunghe serie di im-\nmagini identiche, ripetitive sino all&#x27;ossessione, animandole spesso con colori squillanti: il senso che se ne\nricava è quello dell&#x27;angoscia della vita moderna. Tra le opere che hanno reso famoso Warhol si ricordano:\nMarylin (1962), Collezione Leo Castelli, New York; Quattro barattoli di zuppa Campbell (1965); Coca cola\nverde (1962), New York, Whitney Museum; Ladies and Gentlemen (1975).</p></details>", "back": "", "conf": "low", "page": 58, "section": "", "num": null, "_i": 104}, {"kind": "artwork", "src": "images/page58_img1.png", "front": "<img src='images/page58_img1.png' class='cardimg'><p class='q'>Which artwork is this? (artist / title / year)</p><details><summary>Answers</summary><p class='q'>Warhol: 200 Campbell&#x27;s Soup Cans (1962), private collection, synthetic polymer paint on canvas, 183 x 254 cm.</p></details>", "back": "", "conf": "med", "page": 58, "section": "", "num": null, "_i": 105}, {"kind": "artwork", "src": "images/page58_img2.png", "front": "<img src='images/page58_img2.png' class='cardimg'><p class='q'>Which artwork is this? (artist / title / year)</p><details><summary>Answers</summary><p class='q'>Lichtenstein: Forget It! Forget Me! (1962), Waltham, Rose Art Museum, oil and Magna on canvas, 203 x 172 cm.</p></details>", "back": "", "conf": "med", "page": 58, "section": "", "num": null, "_i": 106}, {"kind": "theory", "src": null, "front": "<div class='kindlabel'>THEORY</div><p class='th-en'>Conceptual Art<br><br>This tendency considers artistic production as an abstract, theoretical project, formulated solely in thought, entirely detached from concrete realization and in open opposition to traditional artistic production. It asserts the primary value of mental planning over the completed work. It rejects concrete realization because, in our society, every painting and every sculpture risks becoming a commodity sold at a high price, regarded on the market as a safe-haven asset that does not lose value and is subject to the typical mechanisms of consumer society. Art is thus understood as idea, as knowledge and expression through thought, not as a concrete work. The conceptual approach of Conceptual Art has influenced, albeit with very diverse outcomes, a large part of subsequent artistic research.<br><br>Thus were born:<br><br>- Arte Povera, as a total rejection of &quot;fine materials,&quot; of composition structured according to precise rules, a clear attitude of rebellion against art understood in the traditional sense. What is presented is no longer works, but information, projects, operations on reality - in short, open proposals, ways of being in the world, rather than definitive results;<br><br>- Body Art: the work consists of the human body exhibited in flesh and blood, and the artist&#x27;s intervention is on the body itself, sometimes through violent actions; such performances are broadcast live via closed-circuit television. The artist skillfully makes use of their own body through public actions, in which every movement takes on particular significance;<br><br>- Land Art: it proposes interventions not on nature, as had already happened in the past, but in nature, not for ornamental purposes, but in order to become aware of the natural order of the elements, which modern man has completely disrupted. Technological society has altered the relationship between man and nature, and it is the artist, more than anyone else, who lives out its profound unease, who senses its boundless danger.<br><br>Arte Povera, Body Art and Land Art undoubtedly stand as a provocation against the mechanism by which great collectors hoard works of art, often more out of snobbery than out of genuine desire and understanding, purchasing works that they consider above all a sound form of investment.<br><br>1.7.11 | Postmodernism<br><br>Postmodernism arose in the late 1970s and is a broad current of thought that affects many forms of art (it concerns architecture and industrial design in particular, but also extends to painting, sculpture, literature and poetry). The movement stands in opposition to experimentation pushed to excess, which characterizes some avant-gardes: Postmodern artists feel the need to return to the &quot;normality&quot; of techniques, of the expressive means of visual language with its fundamental elements. Postmodernism therefore rejects the rigor and purity of forms that characterized the architecture of the great modern masters (Le Corbusier, Gropius), proposing instead a decided return to decoration and to the search for freer forms.<br><br>1.7.12 | Transavantgarde<br><br>Starting from the late 1970s, a new tendency called Transavantgarde spread through Europe and the United States. This tendency arose as a reaction to the Conceptual movement and applies particularly to painting, but falls within the broader cultural movement of Postmodernism. Transavantgarde artists generally construct figurative images, but do not set out to describe reality. Their works are also characterized by broad areas of monochrome color, by stains and drips of color, and by figures that are inverted or &quot;floating&quot; in the space of the painting. In Transavantgarde, therefore, traditional materials and tools (brushes, canvases, paints) are reused, without however rejecting the expressive techniques of more recent experiences. Transavantgarde artists rediscover the pleasure of expressing themselves freely, without concerning themselves with the problem of conveying meanings beyond the painting itself. The most significant Italian artists who belong to the Transavantgarde are: Chia, Cucchi, Clemente, De Maria, Paladino.</p><details><summary>original (IT)</summary><p class='th-it'>L&#x27;Arte Concettuale\n\nQuesta tendenza considera la produzione artistica come progetto astratto, teorico, solo formulato dal\npensiero, completamente svincolato dalla realizzazione concreta e in aperta opposizione alla produzione\nartistica tradizionale. Afferma il valore primario della progettazione mentale, rispetto all&#x27;opera realizzata.\nRifiuta la realizzazione concreta perché ogni dipinto, ogni scultura rischiano, nella nostra società, di di-\nventare una merce venduta a caro prezzo, considerata sul mercato un bene-rifugio che non si svaluta e\nsuccube dei meccanismi tipici della società dei consumi. L&#x27;arte è quindi intesa come idea, come cono-\nscenza ed espressione attraverso il pensiero non come opera concreta. L&#x27;impostazione di pensiero del\nConcettuale ha influenzato, anche se con esiti molto diversificati, larga parte della ricerca artistica se-\nguente.\n\nSono nate così:\n\n* l&#x27;Arte povera, come totale rifiuto del “bel materiale”, della composizione struttura secondo precise\nregole, chiaro atteggiamento di ribellione verso l’arte intesa in senso tradizionale. Non si presentano\npiù opere, ma informazioni, progetti, operazioni sulla realtà, insomma proposte aperte, modi di\nessere nel mondo, piuttosto che risultati definitivi;\n\n* la Bodyart:l&#x27;opera è costituita dal corpo umano esposto in carne ed ossa e l&#x27;intervento dell&#x27;artista è\nsul corpo stesso, anche con azioni violente; tali esibizioni vengono riprese in diretta da una televi-\nsione a circuito chiuso. L&#x27;artista si avvale abilmente del proprio corpo con azioni pubbliche, dove\nqualunque movimento assume particolare significato;\n\n* laLandart: propone interventi non sulla natura, come già avvenuto in passato, ma nella natura, non\ncon scopi ornamentali, ma per prendere coscienza dell&#x27;ordine naturale degli elementi, che l&#x27;uomo\nmoderno ha completamente sconvolto. La società tecnologica ha alterato il rapporto uomo-natura\ned è l&#x27;artista, più di ogni altro, che ne vive il profondo disagio, che ne avverte lo sconfinato pericolo.\n\nL&#x27;Arte povera, la Body art, la Land art, si pongono indubbiamente come provocazione al meccanismo di\naccaparramento da parte dei grandi collezionisti di opere d&#x27;arte che spesso, più per snobismo che per re-\nale desiderio e conoscenza, acquistano opere, che considerano soprattutto come valida forma di investi-\nmento.\n\n1.7.11|Il Postmoderno\n\nIl Postmoderno nasce alla fine degli anni Settanta ed è una vasta corrente di pensiero che investe molte\nespressioni d&#x27;arte (riguarda in modo particolare l&#x27;architettura e il disegno industriale, ma si rivolge alla\npittura, alla scultura, alla letteratura e alla poesia). Il Movimento si oppone alla sperimentazione spinta\nall&#x27;eccesso, che caratterizza alcune avanguardie: gli artisti postmoderni sentono il bisogno di tornare alla\n“normalità” delle tecniche, dei mezzi espressivi del linguaggio visuale con i suoi elementi fondamentali.\nIl Postmoderno pertanto rifiuta il rigore e la purezza di forme che caratterizzavano l&#x27;architettura dei gran-\ndi maestri moderni (Le Corbusier, Gropius), riproponendo un deciso ritorno alla decorazione e alla ricerca\ndi forme più libere.\n\n1.7.12|La Transavanguardia\n\nA partire dalla fine degli anni Settanta, si diffonde in Europa e negli Stati Uniti una nuova tendenza, defi-\nnita Transavanguardia. Tale tendenza nasce come reazione al movimento Concettuale e si riferisce inmo-\ndo particolare alla pittura, ma rientra nel più vasto movimento culturale del Postmoderno. Gli artisti della\nTransavanguardia costruiscono generalmente immagini figurative, ma non si propongono di descrivere\nla realtà. Le loro opere sono caratterizzate anche da vaste zone di colore monocromo, da macchie e da\nsgocciolamenti di colore e da figure capovolte o “galleggianti” nello spazio del dipinto. Nella Transavan-\nguardia quindi, vengono riutilizzati i materiali e gli strumenti tradizionali (pennelli, tele, colori), pur senza\nrifiutare le tecniche espressive delle esperienze più recenti. Gli artisti della Transavanguardia riscoprono\nil piacere di esprimersi liberamente, senza porsi il problema di trasmettere significati al di fuori della pit-\ntura stessa. Gli artisti italiani più significati che aderiscono alla Transavanguardia sono: Chia, Cucchi, Cle-\nmente, De Maria, Paladino.</p></details>", "back": "", "conf": "low", "page": 59, "section": "", "num": null, "_i": 107}, {"kind": "artwork", "src": "images/page60_img1.png", "front": "<img src='images/page60_img1.png' class='cardimg'><p class='q'>Which artwork is this? (artist / title / year)</p><details><summary>Answers</summary><p class='q'>Sandro Chia: He Who Is Born to Be Hanged Will Never Be Drowned (1986-1987), private collection, oil and paper on canvas, 18 x 20 cm.</p></details>", "back": "", "conf": "med", "page": 60, "section": "", "num": null, "_i": 108}, {"kind": "question", "src": null, "front": "<p class='q'>Which of the following twentieth-century movements placed the decomposition of compositional planes at the center of its attention?<br><br>A) Fauvism<br>B) Impressionism<br>C) Action painting<br>D) Cubism<br>E) Divisionism</p><details><summary>Answers</summary><p class='q'>The correct answer is D: Cubism is the result of a multiplicity of viewpoints applied to a single object.</p></details><details><summary>original (IT)</summary><p class='th-it'>Quale dei seguenti movimenti novecenteschi pose al centro della propria attenzione la scomposizione dei piani compositivi? € Cubismo {) Divisionismo\nA) Fauves\nB) Impressionismo\nC) {8 Action painting\n\nsultato di una pluralità di punti di vista applicati a un unico oggetto: la risposta esatta è la ©.</p></details>", "back": "", "conf": "low", "page": 60, "section": "", "num": "2", "_i": 109}, {"kind": "question", "src": "images/page61_img1.png", "front": "<img src='images/page61_img1.png' class='cardimg'><p class='q'>Vienna (the original question text could not be recovered from OCR; only this single word survived).</p><details><summary>original (IT)</summary><p class='th-it'>Vienna</p></details>", "back": "", "conf": "low", "page": 61, "section": "", "num": "8", "_i": 110}, {"kind": "question", "src": null, "front": "<p class='q'>Which of the following cults saw a particular development in Gothic art?<br><br>A) That of St. Francis<br>B) That of St. Jerome<br>C) That of Mary<br>D) That of St. Peter<br>E) That of St. Sebastian</p><details><summary>Answers</summary><p class='q'>The correct answer is C: the Virgin was regarded as the sole repository of knowledge and an indispensable intermediary between man and God.</p></details><details><summary>original (IT)</summary><p class='th-it'>Quale dei seguenti culti conobbe uno sviluppo particolare nell&#x27;arte gotica?\nA) Quello di S. Francesco\nB) Quello di S. Girolamo\nC) Quello di Maria\nD) Quello di S. Pietro\nE) {A Quello di S. Sebastiano\n\nto unica depositaria del sapere e indispensabile intermediaria tra l&#x27;uomo e Dio. La risposta esatta è la (3.</p></details>", "back": "", "conf": "low", "page": 61, "section": "", "num": "2", "_i": 111}, {"kind": "question", "src": null, "front": "<p class='q'>Who created the sculpture shown in the photograph, depicting the Blessed Ludovica Albertoni, preserved in Rome?<br><br>A) Antonio Canova<br>B) Antonio Raggi<br>C) Benvenuto Cellini<br>D) Francesco Borromini<br>E) Gian Lorenzo Bernini</p><details><summary>Answers</summary><p>Answer: E</p></details><details><summary>original (IT)</summary><p class='th-it'>La scultura in fotografia, che riproduce la beata Ludovica Albertoni, custodita a Roma, è di: € Gian Lorenzo Bernini\nA) ntonio Canova\nB) ntonio Raggi\nC) envenuto Cellini\nD) { Francesco Borromini</p></details>", "back": "", "conf": "low", "page": 61, "section": "", "num": "3", "_i": 112}, {"kind": "question", "src": null, "front": "<p class='q'>Identify the correct chronological sequence of the depicted works:<br><br>A) Venus; Dawn; Laocoon; Medusa; Hebe<br>B) Laocoon; Dawn; Hebe; Venus; Medusa<br>C) Venus; Laocoon; Dawn; Medusa; Hebe<br>D) Venus; Medusa; Laocoon; Dawn; Hebe<br>E) Laocoon; Venus; Medusa; Hebe; Dawn</p><details><summary>Answers</summary><p class='q'>The correct sequence is the one given in answer C. The Venus de Milo, one of the most famous sculptures, opens the sequence, while Hebe, a Neoclassical work, is the last in chronological order.</p></details><details><summary>original (IT)</summary><p class='th-it'>Riconoscere la giusta sequenza cronologica delle opere riprodotte:\nA) Venere; Alba; Laocoonte; Medusa; Ebe\nB) Laocoonte; Alba; Ebe; Venere; Medusa\nC) Venere; Laocoonte; Alba; Medusa; Ebe\nD) Venere; Medusa; Laocoonte; Alba; Ebe\nE) Laocoonte; Venere; Medusa; Ebe; Alba\nF) La giusta sequenza è quella riportata nella risposta (\nG) La Venere di Milo, una delle più famose sculture\nH) neoclassico ed è l&#x27;ultima in ordine temporale</p></details>", "back": "", "conf": "low", "page": 62, "section": "", "num": "4", "_i": 113}, {"kind": "question", "src": null, "front": "<p class='q'>What does Neoclassical painting place at the center of its attention?<br><br>A) Color<br>B) Drawing (design)<br>C) Chiaroscuro<br>D) Perspective<br>E) Light</p><details><summary>Answers</summary><p class='q'>The correct answer is B: drawing -- and therefore painting itself -- is at the center of Neoclassical art. Chiaroscuro, by contrast, is characteristic of the Baroque, which stands in opposition to Neoclassicism. A taste for perspective is more typical of the Renaissance, while color is the distinctive trait of Impressionist painting.</p></details><details><summary>original (IT)</summary><p class='th-it'>La pittura neoclassica pone al centro della sua attenzione:\nA) il colore\nB) il disegno\nC) il chiaroscuro\nD) la prospettiva\nE) la luce\n\nLa risposta esatta è la ©; infatti, il disegno, e quindi la pittura, sono al centro dell&#x27;arte neoclassica. Il chia- roscuro è invece caratteristico del Barocco, che è in antitesi con il Neoclassicismo. Il gusto della prospet- tiva è più tipico del Rinascimento, mentre il colore è il carattere distintivo della pittura impressionista.</p></details>", "back": "", "conf": "low", "page": 62, "section": "", "num": "5", "_i": 114}, {"kind": "question", "src": null, "front": "<p class='q'>Which of the following characteristics is NOT attributable to Caravaggio?<br><br>A) Development of chiaroscuro<br>B) Use of popular models<br>C) Religiosity<br>D) Cult of line<br>E) <summary>original (IT)</summary><p class='th-it'>Il dipinto Canto d&#x27;amore qui sotto prodotto è è un&#x27;opera di:\nA) René Magritte\nB) Marc Chagall\nC) Giorgio de Chirico\nD) Carlo Carrà\nE) {3 Salvador Dali\nF) Gli oggetti fuori scala, accostati in che raffigurate in prospetti\nG) va, la ripresa di elementi della clas lelvedere) sono tratti carat\nH) teristici della pittura di Giorgio De ento metafisico: la risposta\nI) corretta è la (</p></details>", "back": "", "conf": "low", "page": 66, "section": "", "num": "14", "_i": 124}, {"kind": "question", "src": null, "front": "<p class='q'>Which of the following artists painted, in 1967 -- also acting as producer -- this famous cover for the debut album by the rock band The Velvet Underground?<br><br>A) Robert Rauschenberg<br>B) Roy Lichtenstein<br>C) Christo<br>D) Andy Warhol<br>E) Keith Haring</p><details><summary>Answers</summary><p>Answer: D</p></details><details><summary>original (IT)</summary><p class='th-it'>Quale dei seguenti artisti dipinse nel 1967, anche in veste di produttore, questa famosa copertina per il disco d&#x27;esordio del gruppo rock The Velvet Underground?\nA) Robert Rauschemberg\nB) Roy Lichtenstein\nC) hristo\nD) ndy Warhol\nE) Keith Haring</p></details>", "back": "", "conf": "low", "page": 66, "section": "", "num": "15", "_i": 125}];

const KIND={
  question:{label:'Question',color:'#98a2d4'},
  passage:{label:'Passage',color:'#de8a76'},
  theory:{label:'Theory',color:'#e9be3b'},
  artwork:{label:'Artwork',color:'#e9be3b'}
};
const TKEY='theme_'+location.pathname.replace(/\W/g,'_');
let theme=localStorage.getItem(TKEY)||'cool';

const SK='done_'+location.pathname.replace(/\W/g,'_');
let passed=new Set(JSON.parse(localStorage.getItem(SK)||'[]'));
function savePassed(){localStorage.setItem(SK,JSON.stringify([...passed]));}
function togglePassed(i,e){
  e.stopPropagation();
  if(passed.has(i))passed.delete(i);else passed.add(i);
  savePassed();
  if(filter==='all'||filter==='passed'){
    pool=poolFor(filter);
    if(!pool.length)idx=0;else if(idx>=pool.length)idx=pool.length-1;
  }
  render();
}

let pool=ALL.slice(),idx=0,filter='all';
const card=document.getElementById('card');

function poolFor(f){
  return ALL.filter(c=>
    f==='all'?!passed.has(c._i):
    f==='passed'?passed.has(c._i):
    f==='review'?c.conf==='low':
    c.kind===f);
}
function counts(){
  return {
    all:ALL.filter(c=>!passed.has(c._i)).length,
    question:ALL.filter(c=>c.kind==='question').length,
    passage:ALL.filter(c=>c.kind==='passage').length,
    theory:ALL.filter(c=>c.kind==='theory').length,
    artwork:ALL.filter(c=>c.kind==='artwork').length,
    review:ALL.filter(c=>c.conf==='low').length,
    passed:passed.size
  };
}
function refreshCounts(){
  const n=counts();
  document.querySelectorAll('[data-count]').forEach(s=>{
    s.textContent=n[s.getAttribute('data-count')]||0;});
}
function view(){pool=poolFor(filter);if(idx>=pool.length)idx=0;render();}
function render(){
  refreshCounts();
  const c=pool[idx];
  if(!c){card.className='card empty';card.innerHTML='No cards here';
    document.getElementById('count').textContent='0 / 0';return;}
  const k=KIND[c.kind]||{label:c.kind,color:'#93a0ad'};
  const ord=String(c._i+1).padStart(2,'0');
  const meta=(c.section||'')+' · p'+c.page+(c.num?(' · Q'+c.num):'');
  const isDone=passed.has(c._i);
  const passBtn=`<button class="pass-btn${isDone?' done':''}" onclick="togglePassed(${c._i},event)">${isDone?'\u2713 done':'mark done'}</button>`;
  card.className='card';
  card.innerHTML=
    `<div class="cardhead">`+
      `<span class="ord">\u2116 ${ord}</span>`+
      `<span class="kind" style="color:${k.color}">${k.label}</span>`+
      `<span class="meta">${meta}</span>`+
    `</div>`+
    `<div class="cardbody">${c.front}</div>`+
    `<div class="cardfoot">${passBtn}</div>`;
  document.getElementById('count').textContent=(idx+1)+' / '+pool.length;
  window.scrollTo(0,0);
  const ci=card.querySelector('.cardimg');
  if(ci)ci.addEventListener('click',e=>{e.stopPropagation();openZoom(ci.src);});
}
function next(){if(!pool.length)return;idx=(idx+1)%pool.length;render();}
function prev(){if(!pool.length)return;idx=(idx-1+pool.length)%pool.length;render();}
function shuffle(){for(let i=ALL.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[ALL[i],ALL[j]]=[ALL[j],ALL[i]];}idx=0;view();}
function setFilter(f,btn){filter=f;idx=0;
  document.querySelectorAll('.controls button').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');view();}
function setTheme(t,btn){document.body.dataset.theme=t;localStorage.setItem(TKEY,t);
  document.querySelectorAll('.themes button').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');}
function openZoom(src){const z=document.getElementById('zoom');document.getElementById('zoomimg').src=src;z.classList.add('show');}
function closeZoom(){document.getElementById('zoom').classList.remove('show');}

let sx=0,sy=0;
card.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;},{passive:true});
card.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
  if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.5){e.preventDefault();dx<0?next():prev();}},{passive:false});
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')next();if(e.key==='ArrowLeft')prev();
  if(e.key==='Escape')closeZoom();});

document.body.dataset.theme=theme;
document.querySelectorAll('.themes button').forEach(b=>b.classList.toggle('on',b.getAttribute('data-theme')===theme));
view();
</script></body></html>
